# acpp-runtime — the SYCL runtime, carved out of _acpp-stage.
# PACKAGE-ONLY manifest; the sole [workspace] is the repo root.
#
# Published by the WHOLE-WORKSPACE `pixi publish`, which is also the render
# instrument: `--path` is a batch of one and refuses any package with a source
# RUN dependency, which this package now has (the LLVM tools the JIT execs).
[package]
name = "acpp-runtime"
version = "0.dev0"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# THE PASSTHROUGH. The manifest tables do not ADD dependencies — the backend
# regards only what the recipe declares. What this supplies is the workspace
# PATH MAPPING the recipe cannot know, which lets the recipe name
# `_acpp-stage ==<version>` under requirements.host as if it came from a
# channel.
[package.build-dependencies]
_acpp-stage = { workspace = true }
# The LLVM packages this runtime depends on rather than ships: the JIT executes
# opt/llc/lld by name, and the plugins link libLLVM. Mapped here because every
# source-package dependency is mapped in this table and only here; the recipe
# stays the sole authority for what each one IS.
acpp-llvm-tools = { workspace = true }
acpp-lld = { workspace = true }
acpp-libllvm21 = { workspace = true }

[package.build.config]
# The carve script lives in ../_shared, outside this package directory, so it
# is not covered by the default input globs derived from the recipe and the
# package dir. Without this, editing the shared carve logic would not
# invalidate this package's build.
extra-input-globs = ["../_shared/carve.nu"]
