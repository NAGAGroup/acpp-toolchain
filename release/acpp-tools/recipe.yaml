# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-tools (release lane) — clang dev tools slice.
# Same-major conda-forge dev tools are inherently uninstallable next to the
# acpp suite (they hard-depend on libclang-cpp${{ llvm_maj_min }}, which
# acpp-runtime forbids) — this package IS the replacement, built against
# the same LLVM. Build mechanics: see release/acpp-runtime/recipe.yaml.

context:
  llvm_version: "20.1.8"
  llvm_major: "20"
  llvm_maj_min: "20.1"
  acpp_version: "25.10.0"
  version: ${{ acpp_version ~ "_llvm" ~ llvm_version }}
  acpp_ref: "v25.10.0"
  acpp_commit: "9f842c701a599107cc6d117d3539f971036363a1"
  spirv_commit: "f0ae76f12c62ede090e57ece8c986f4c3c971a71" # llvm_release_200
  oclh_commit: "265df85aec478d14a5c5880d7bb92d7dd52714ef"
  oclhpp_commit: "67d100e70612341707725b6648ccca4c10b0dc31"

package:
  name: acpp-tools
  version: ${{ version }}

source:
  - path: ../../shared
    target_directory: shared

build:
  number: 0
  script:
    interpreter: nu
    content: nu shared/build.nu toolchain
    env:
      ACPP_LANE: release
      ACPP_LLVM_VERSION: ${{ llvm_version }}
      ACPP_ACPP_REF: ${{ acpp_ref }}
      ACPP_ACPP_COMMIT: ${{ acpp_commit }}
      ACPP_SPIRV_COMMIT: ${{ spirv_commit }}
      ACPP_OCLH_COMMIT: ${{ oclh_commit }}
      ACPP_OCLHPP_COMMIT: ${{ oclhpp_commit }}
      ACPP_BUILD_CACHE: ${{ env.get("ACPP_BUILD_CACHE", default="") }}
  files:
    include:
      - bin/amdgpu-arch
      - bin/clang-apply-replacements
      - bin/clang-change-namespace
      - bin/clang-check
      - bin/clang-doc
      - bin/clang-extdef-mapping
      - bin/clang-format
      - bin/clang-include-cleaner
      - bin/clang-include-fixer
      - bin/clang-installapi
      - bin/clang-linker-wrapper
      - bin/clang-move
      - bin/clang-nvlink-wrapper
      - bin/clang-offload-bundler
      - bin/clang-offload-packager
      - bin/clang-query
      - bin/clang-refactor
      - bin/clang-reorder-fields
      - bin/clang-repl
      - bin/clang-scan-deps
      - bin/clang-sycl-linker
      - bin/clang-tidy
      - bin/clangd
      - bin/diagtool
      - bin/find-all-symbols
      - bin/git-clang-format
      - bin/hmaptool
      - bin/modularize
      - bin/nvptx-arch
      - bin/offload-arch
      - bin/pp-trace
      - bin/run-clang-tidy
      - bin/scan-build
      - bin/scan-build-py
      - bin/scan-view
      - bin/llvm-bolt
      - bin/llvm-bolt-heatmap
      - bin/perf2bolt
      - bin/merge-fdata
      - share/clang/**
      - share/scan-build/**
      - share/scan-view/**
      - share/opt-viewer/**
      - lib/libear/**
      - lib/libscanbuild/**
      - libexec/**

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nushell
    - git
    - cmake >=3.24
    - ninja
    - ccache
    - python >=3.9
    - swig # lldb python bindings
  host:
    - zlib
    - zstd
    - libxml2-devel
    - python
    - cuda-cudart-dev >=12,<13
    - cuda-driver-dev >=12,<13
    - cuda-nvvm >=12,<13
    - cuda-nvcc-tools >=12,<13 # nvcc anchors FindCUDAToolkit (never invoked)
    - cuda-crt-dev_linux-64 >=12,<13 # crt/host_defines.h etc. for cudart headers
    - level-zero-devel
    - ocl-icd
    - opencl-headers
    - numactl
  run:
    - acpp-runtime ==${{ version }}
    - python >=3.9
  ignore_run_exports:
    by_name:
      # CUDA build-env pieces are NOT runtime deps (GPU opt-in via metapackages)
      - cuda-cudart
      - cuda-nvvm
      - cuda-cccl
      - level-zero
      - ocl-icd
  run_constraints:
    # conda-forge owners of the same bin names — any version clobbers.
    # (clang-tidy/clangd are NOT standalone conda-forge package names.)
    - clang-tools <0.0a0
    - clang-format <0.0a0
    - clang-format-${{ llvm_major }} <0.0a0
    - clang-scan-deps <0.0a0
    - acpp-tools-nightly <0.0a0

tests:
  - package_contents:
      bin:
        - clang-format
        - clang-tidy
        - clangd
        - run-clang-tidy
        - scan-build
        - llvm-bolt

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/LLVM-LICENSE.txt
    - licenses/AdaptiveCpp-LICENSE.txt
  summary: Clang developer tools (format/tidy/clangd/BOLT) matching the acpp toolchain LLVM
  repository: https://github.com/NAGAGroup/acpp-toolchain
