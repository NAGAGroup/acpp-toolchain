              - bin/llvm-symbolizer
              - bin/llvm-cxxfilt
              - include/AdaptiveCpp/**
              - lib/clang/**
              - lib/cmake/AdaptiveCpp/**
          - if: linux
            then:
              - bin/acpp*
              - bin/clang
              - bin/clang++
              - bin/clang-cl
              - bin/clang-cpp
              - bin/clang-${{ llvm_major }}
              - bin/ld64.lld
              - bin/lld-link
              - bin/wasm-ld
              - bin/llvm-ar
              - bin/llvm-nm
              - bin/llvm-ranlib
              - bin/llvm-strip
              - bin/llvm-objcopy
              - bin/llvm-objdump
              - bin/llvm-readelf
              - bin/llvm-readobj
              - bin/llvm-size
              - bin/llvm-strings
              - bin/llvm-symbolizer
              - bin/llvm-cxxfilt
              - bin/llvm-addr2line
              - bin/llvm-dwarfdump
              - bin/llvm-dlltool
              - bin/llvm-lib
              - bin/llvm-rc
              - bin/llvm-mt
              - bin/llvm-windres
              - bin/llvm-cov
              - bin/llvm-profdata
              - bin/llvm-profgen
