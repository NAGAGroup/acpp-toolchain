# acpp-runtime-ocl — backend METAPACKAGE. It ships no toolchain files, so it does not
# depend on _acpp-stage at all: nothing to carve, and no multi-GB stage
# install in its build. PACKAGE-ONLY manifest; the sole [workspace] is the
# repo root.
#
# Published by the WHOLE-WORKSPACE `pixi publish`, which is also the render
# instrument — the `--path` form is a batch of one and refuses a package with a
# source run dependency, which this one has.
[package]
name = "acpp-runtime-ocl"
version = "0.dev0"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# acpp-runtime is a workspace sibling; the recipe names it under
# requirements.host so its exact-build run_export reaches this package.
#
# acpp-llvm-spirv is a sibling too, named under requirements.run: this backend
# JITs through SPIR-V and execs the translator as a subprocess. A sibling the
# recipe names and the manifest does not map is resolved against CHANNELS ONLY
# — the defect that killed run 34096769046 in `acpp`, found here by
# tools/check-sibling-mapping.nu, which asserts the property across the
# workspace on every platform.
[package.build-dependencies]
acpp-runtime = { workspace = true }
acpp-llvm-spirv = { workspace = true }
