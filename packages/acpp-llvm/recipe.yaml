# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-llvm — the metapackage. Lifted from the reference monolith's `llvm`
# output (llvmdev-feedstock). Upstream's own comment: "This is a meta package so
# that people can use the latest libllvm and also for run_exports."
#
# SHIPS NOTHING, and says so with `files: []` exactly as upstream does. It runs
# no carve script, so it does NOT take the stage as a host dependency — a
# metapackage that installed a multi-gigabyte toolchain to copy nothing out of
# it would be pure cost. That is the one place in this family where the
# "every slicer takes the stage" law does not apply, because this is not a
# slicer.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-llvm
  version: ${{ llvm_version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  files: []

requirements:
  build: []
  host:
    - if: not win
      then: acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - libxml2-devel
    - zlib
    - zstd
  run:
    # UPSTREAM: pin_subpackage("libllvm" ~ major_ver, exact=True)
    - if: not win
      then: acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run_constraints:
    # Upstream names the conda-forge packages here; ours name ours, because
    # NOTHING ships under a conda-forge name — a transitive requirement for a
    # name our channel provides is EXCLUDED under strict channel priority,
    # which is a hard solve failure rather than a fall-through.
    - acpp-llvmdev     ==${{ llvm_version }}
    - acpp-llvm-tools  ==${{ llvm_version }}
    - acpp-clang       ==${{ llvm_version }}
    - acpp-clang-tools ==${{ llvm_version }}
  run_exports:
    # UPSTREAM: pin_subpackage("libllvm" ~ major_ver, upper_bound="x.x")
    - if: not win
      then: acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]

tests:
  - package_contents:
      strict: true
      files: []

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: licenses/llvm-LICENSE.TXT
  summary: Development headers and libraries for LLVM (metapackage)
