# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-libclang-cpp21.1 — the VERSIONED libclang-cpp shared library. Lifted from
# the reference monolith's `libclang-cpp${{ maj_min }}` output
# (clangdev-feedstock). Upstream appends the soversion to the package name so
# that different LLVM series stay co-installable.
#
# SLICING FORM: GLOB LIST, upstream's own. It names one file by its full
# versioned name, so it cannot reach another project's output in our union
# stage. Cross-checked against conda-forge's libclang-cpp21.1-21.1.8 artifact:
# linux-64 ships exactly `lib/libclang-cpp.so.21.1`, osx-arm64 exactly
# `lib/libclang-cpp.21.1.dylib`, and win-64 has no artifact at all — which is
# the same fact as the `skip: win` below, arrived at independently.
#
# `sover` IS `llvm_maj_min` HERE. Upstream computes `sover = maj_min ~ extra`,
# where `extra` is a suffix for rc and dev builds ("-rc1", "git"). We build
# tagged releases only, so `extra` is always empty and the two names collapse;
# carrying an always-empty variable would suggest a choice that does not exist.

context:
  # Lifted content packages carry the FULL PATCH version. Activation packages
  # carry MAJOR.MINOR, and ours (acpp, acpp-runtime, the backend metapackages)
  # stay date-versioned, because they are AdaptiveCpp and not LLVM.
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-libclang-cpp${{ llvm_maj_min }}
  version: ${{ llvm_version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  # THE TAG LEADS EVERY BUILD STRING IN THIS WORKSPACE, and `variant` follows it
  # on every clangdev-derived package, as upstream has it. The same-build
  # coupling between our own packages is a bracket MatchSpec
  # `build="<tag>_*"`, which only matches when the tag is first.
  string: ${{ llvm_build_tag }}_${{ variant }}_h${{ hash }}_${{ build_num }}
  skip: win
  variant:
    down_prioritize_variant: ${{ 0 if variant == "default" else 1 }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: >-
        ${{ "lib/libclang-cpp.so." ~ llvm_maj_min if linux
        else "lib/libclang-cpp." ~ llvm_maj_min ~ ".dylib" }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    # THE STAGE. Never a run dep of anything, so it reaches no shipped metadata;
    # the fixed 0.0.0 is what lets it upload once and be skipped.
    - _acpp-stage ==0.0.0
    # Upstream: `llvm ==${{ version }}`. A plain version match on what was a
    # channel package upstream and is ours now, so only the NAME is rewritten —
    # it was never a pin_subpackage and does not become the bracket form.
    - acpp-llvm ==${{ llvm_version }}
  run:
    # "we need to do this manually because clang_bootstrap has no run-export"
    - if: osx
      then: acpp-libcxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run_exports:
    # UPSTREAM: pin_subpackage("libclang-cpp" ~ maj_min, upper_bound="x.x").
    # TIGHTENED to the exact same-build form: there is no cross-recipe
    # pin_subpackage under this backend, and exact pins between our own packages
    # are what make it impossible for an all-21 tree to float one member onto a
    # different build.
    - acpp-libclang-cpp${{ llvm_maj_min }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]

tests:
  - package_contents:
      files:
        # presence of the versioned library
        exists:
          - if: linux
            then: lib/libclang-cpp.so.${{ llvm_maj_min }}
          - if: osx
            then: lib/libclang-cpp.${{ llvm_maj_min }}.dylib
        # absence of the unversioned library, which is acpp-libclang-cpp's
        not_exists:
          - if: linux
            then: lib/libclang-cpp.so
          - if: osx
            then: lib/libclang-cpp.dylib

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  # A slicer has no source tree, so the licence is the vendored copy the stage
  # asserts byte-for-byte against the extracted sources.
  license_file: licenses/llvm-LICENSE.TXT
  summary: The clang C++ library, versioned
