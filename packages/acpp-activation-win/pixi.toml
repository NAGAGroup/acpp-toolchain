# acpp-activation-win — the Windows compiler-activation packages
# (acpp-clang_win-64, acpp-clangxx_win-64, acpp-clang-cl_win-64), built from
# our fork of conda-forge's clang-win-activation-feedstock.
#
# PACKAGE-ONLY manifest; the sole [workspace] is the repo root. The manifest
# sits outside the submodule and points into it — `pixi publish` skips any
# subdirectory carrying its own workspace, and feedstocks ship pixi.toml files.
#
# WHY THREE OUTPUTS AND NOT FOUR: there is no clangxx-cl. Upstream says why in
# the recipe — "no distinction between C/C++ because clangxx-cl exists
# nowhere". clang-cl.bat sets BOTH CC and CXX to clang-cl.exe.
#
# The clang-cl output and the clang output must not activate together:
# upstream gives clang-cl_<plat> an impossible run_constraint
# (`clang_<plat> <0.0a0`, commented "avoid conflicting activations"), and our
# renamed pair needs exactly the same treatment or they fight in a prefix.
#
# Windows activation is a genuinely DIFFERENT contract from unix, not a
# parameterisation of it: direct `set VAR=value`, no backup/restore helper,
# no CMAKE_ARGS and no MESON_ARGS, CC=clang.exe rather than a triplet-prefixed
# name. Ordering is engineered through FILENAMES (`vs<YEAR>_y-clang_<plat>.bat`
# sorts after the VS activation; `_z-clangxx` after clang, because clangxx's
# script consumes %CPPFLAGS_USED% that clang's sets). Our scripts must be
# NAMED for their ordering, not merely written in an order.
#
# STATUS (round 1, step 2): fork vendored and pinned; the recipe is still
# upstream's and still publishes upstream names, so this stays out of the
# publish set until the rename lands. See ../../vendor/PROVENANCE.md.
[package]
name = "acpp-activation-win"
version = "0.1.0"
publish = false

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build.config]
recipe = "../../vendor/clang-win-activation-feedstock/recipe/recipe.yaml"
