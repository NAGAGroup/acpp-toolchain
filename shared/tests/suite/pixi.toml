# acpp-suite: AdaptiveCpp's OWN test suite (tests/) run against the
# toolchain THROUGH A REAL SOLVE — so run_exports / run_constraints and the
# channel's repodata get exercised too, not just the files inside packages.
#
# The suite is BUILT as one pixi source package (pkg-generic/, the generic SSCP
# flow; `nu suite.nu package`), which compiles tests/ against the published
# toolchain, and RUN in per-backend environments (run-omp, run-ocl, run-cuda)
# into which `nu suite.nu install` adds the built .conda files (the `suite`
# feature starts empty and is filled by `pixi add --feature suite <file>`).
#
# In CI the suite solves against the PUBLISHED channel: pin-published.nu
# rewrites this manifest (and the package manifest) to one platform,
# drops the local-channel entry and pins every naga-acpp* dependency to the
# exact version + build number. Locally it still works against the indexed
# local channel, a relative path: ../../../local-channel is
# <repo>/local-channel, produced by `pixi run -e dev build`.
[workspace]
name = "acpp-suite"
channels = ["../../../local-channel", "https://prefix.dev/jackm97/naga-labs-staging"]
# ONE line: CI rewrites it per job to a single platform, as it does today.
platforms = ["linux-64", "linux-aarch64", "win-64", "win-arm64", "osx-arm64"]

# ── environments ──────────────────────────────────────────────────────────
# default  just nushell: runs suite.nu (package / install / run / info).
# build    nushell + the compile toolchain, for `suite.nu boost` and
#          sanitizer-smoke (the suite itself is built by `pixi publish`).
# run-*    where the tests EXECUTE: one environment per backend set, so a
#          test box only installs the runtimes it can use. The built test
#          packages are added to the `suite` feature at CI time.
[environments]
default = ["tools"]
build = ["tools", "build"]
run-omp = ["tools", "suite", "run-omp"]
run-ocl = ["tools", "suite", "run-omp", "run-ocl"]
run-cuda = ["tools", "suite", "run-omp", "run-cuda"]
run-rocm = ["tools", "suite", "run-omp", "run-rocm"]

[feature.tools.dependencies]
nushell = "*"

# Filled at CI time by `pixi add --feature suite <abs path to .conda>`.
[feature.suite.dependencies]

# ── run-omp: what EXECUTING the tests on the CPU (OpenMP) needs ──────────
[feature.run-omp.dependencies]
naga-acpp = "*"
nushell = "*"

[feature.run-omp.target.linux-64.dependencies]
naga-acpp-compiler-rt = "*"
libboost = "*"
tbb = "*"

[feature.run-omp.target.linux-aarch64.dependencies]
naga-acpp-compiler-rt = "*"
libboost = "*"
tbb = "*"

[feature.run-omp.target.win-64.dependencies]
naga-acpp-compiler-rt = "*"
libboost = "*"

# win-arm64: no libboost (conda-forge has no Boost there; the test packages
# bring the Boost.Test DLL they were built with).

[feature.run-omp.target.osx-arm64.dependencies]
libboost = "*"

# ── run-ocl: OpenCL devices (linux-64 only: the only lane CI tests OpenCL on) ──
[feature.run-ocl.target.linux-64.dependencies]
naga-acpp-runtime-ocl = "*"
# Intel CPU OpenCL runtime: the OpenCL test driver on x86-64 (proprietary Intel EULA; test env only)
intel-opencl-rt = "*"

# ── run-cuda: CUDA devices ───────────────────────────────────────────────
[feature.run-cuda.target.linux-64.dependencies]
naga-acpp-runtime-cuda = "*"

[feature.run-cuda.target.linux-aarch64.dependencies]
naga-acpp-runtime-cuda = "*"

[feature.run-cuda.target.win-64.dependencies]
naga-acpp-runtime-cuda = "*"

# ── run-rocm: HIP plugin load check (no AMD device needed; see suite.nu hip-load-check) ──
[feature.run-rocm.target.linux-64.dependencies]
naga-acpp-runtime-rocm = "*"

[feature.run-rocm.target.win-64.dependencies]
naga-acpp-runtime-rocm = "*"

# ── build: what COMPILING the tests needs ───────────────────────────────
[feature.build.dependencies]
cmake = "*"
ninja = "*"

# naga-acpp-llvm-dev is DELIBERATELY absent everywhere: tests/compiler/'s
# lit-based check-cbs/check-sscp/... targets are the only thing in this
# tree that touches LLVM_DIR/FileCheck, and this suite never builds or runs
# those `check-*` custom targets (only sycl_tests/rt_tests/pstl_tests/
# pcuda_tests) — see the hand-off report for the full trace. suite.nu still
# passes -DLLVM_DIR when it happens to be on the prefix, at no cost.
[feature.build.target.linux-64.dependencies]
naga-acpp-clangxx_linux-64 = "*"
naga-acpp-compiler-rt = "*"
libboost-devel = "*"
tbb-devel = "*"

[feature.build.target.linux-aarch64.dependencies]
naga-acpp-clangxx_linux-aarch64 = "*"
naga-acpp-compiler-rt = "*"
libboost-devel = "*"
tbb-devel = "*"

[feature.build.target.win-64.dependencies]
naga-acpp-clangxx_win-64 = "*"
naga-acpp-compiler-rt = "*"
libboost-devel = "*"

[feature.build.target.win-arm64.dependencies]
naga-acpp-clangxx_win-arm64 = "*"
# No libboost-devel: conda-forge ships no Boost for win-arm64 at all.
# `nu suite.nu boost` builds Boost.Test from source instead (see suite.nu).

[feature.build.target.osx-arm64.dependencies]
naga-acpp-clangxx_osx-arm64 = "*"
libboost-devel = "*"

# ── tasks (same relative depth as gpu-smoke) ────────────────────────────
[tasks.acpp-info]
cmd = "acpp-info -l"
description = "List backends/devices the runtime can see"

[tasks.sanitizer-smoke]
cmd = "nu ../sanitizer-smoke.nu"
description = "Prove the shipped compiler-rt runtimes link, run clean, and actually fire"
