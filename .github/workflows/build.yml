      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      # Only naga-acpp-runtime-ocl exists here besides naga-acpp itself; the
      # per-platform [feature.run.target.win-arm64...] section in pixi.toml
      # already scopes deps correctly, so only the platform line needs
      # rewriting — no package deletions.
      - name: Pin the suite manifest to win-arm64
        working-directory: shared/tests/suite
        run: |
          (Get-Content pixi.toml) -replace '^platforms = .*', 'platforms = ["win-arm64"]' | Set-Content pixi.toml
      # This box both compiles AND runs (no separate GPU box exists for
      # win-arm64), so the default env (run+build, vs2026 activation) is used.
      - name: Install suite environment
        working-directory: shared/tests/suite
        timeout-minutes: 30
        run: pixi install
      # No ICD exists on this runner; whether the OpenCL plugin loads at all
      # is informational only, read from this listing.
      - name: Visible backends
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        run: pixi run acpp-info
      # conda-forge ships no Boost for win-arm64 at all: build Boost.Test
      # from source once, into SUITE_BOOST_PREFIX.
      - name: Build Boost.Test from source
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu boost
      - name: "build: omp"
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build omp "omp"
      - name: "sycl_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp sycl_tests
      - name: "rt_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp rt_tests
      - name: "build: generic (+pcuda = CUDA-style API on any backend)"
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build generic "generic" --pcuda
      - name: "sycl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp sycl_tests
      - name: "pcuda_tests (CUDA-style API, not the CUDA backend): generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp pcuda_tests

  publish-win-arm64:
    needs: [prepare, build-win-arm64, gate-win-arm64]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-win-arm64
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "Gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to naga-labs-staging
        run: pixi run -e dev publish-channel
