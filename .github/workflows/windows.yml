# Windows (win-64) bring-up lane — dispatch-only while the port is in progress,
# so an in-flight Windows failure never reddens the working linux pipeline.
#
# Produces 6 outputs (no acpp-lldb: lldb is not in the win LLVM_ENABLE_PROJECTS
# set; no activation packages yet: those need the clang-win-activation port).
# Folded into release.yml once it is green.
name: windows

on:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: Win-x64-64
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-${{ github.sha }}
          restore-keys: ccache-win-

      - name: Restore rattler cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\rattler\cache
          key: rattler-win-${{ github.sha }}
          restore-keys: rattler-win-

      # GitHub's Windows runners ship a very long PATH; conda's vs activation
      # then calls vcvars64.bat, which appends more and blows cmd.exe's 8191
      # character limit ("The input line is too long."). conda's own docs say to
      # strip PATH, so keep only what the build needs and let activation
      # rebuild the rest.
      #
      # build-lane.nu selects shared/variants/win-64.yaml from the OS.
      - name: Build release lane (win-64) -> indexed local channel
        run: |
          $env:PATH = @(
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:USERPROFILE\.pixi\bin",
            "$env:ProgramFiles\Git\cmd"
          ) -join ";"
          Write-Host "PATH length: $($env:PATH.Length)"
          pixi run -e dev build-release

      - name: Inventory the produced packages
        shell: bash
        run: |
          find local-channel -name '*.conda' -printf '%f  %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-win-64
          path: local-channel/
          retention-days: 14
