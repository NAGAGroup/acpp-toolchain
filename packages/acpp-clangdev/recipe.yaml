# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-clangdev — clang's development surface: the public headers, the CMake
# package and the static libraries. Lifted from the reference monolith's
# `clangdev` output (clangdev-feedstock).
#
# SLICING FORM: GLOB LIST, upstream's own, and it needs NO artifact-derived
# rescoping. Every one of the four families is scoped by a clang-owned NAME or
# DIRECTORY rather than by a shared one — `include/clang`, `include/clang-c`,
# `include/clang-tidy`, `lib/cmake/clang`, `lib/libclang*.a`,
# `lib/libfindAllSymbols.a` — so none of them can reach another project's output
# in our union stage the way `bin/*` or `libexec/*` would. Confirmed against
# conda-forge's clangdev-21.1.8 artifacts all the same: 1412 / 1414 / 1412
# paths, and the only path outside the header and cmake trees that is not
# `lib(clang…).a` is `lib/libfindAllSymbols.a` — exactly the sixth glob.
#
# The only translation is `*` to `**`: upstream's globs are conda-style and
# recurse, nushell's do not.
#
# THE STATIC LIBRARIES ARE WHY THIS PACKAGE CARRIES A COMPILER IN `build:` —
# upstream's own comment, kept below. `${{ stdlib('c') }}` and
# `${{ compiler('cxx') }}` are there for their STRONG run_exports, which is what
# puts libgcc / libstdcxx into the run deps of a package made only of archives.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-clangdev
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_h${{ hash }}_${{ build_num }}
  variant:
    down_prioritize_variant: ${{ 0 if variant == "default" else 1 }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      # On win the archives lose their `lib` prefix and take a `.lib`
      # extension, which is why the last two entries are spelled per platform
      # rather than shared.
      ACPP_CARVE: >-
        ${{ library_prefix }}include/clang/**;
        ${{ library_prefix }}include/clang-c/**;
        ${{ library_prefix }}include/clang-tidy/**;
        ${{ library_prefix }}lib/cmake/clang/**;
        ${{ "lib/libclang*.a;lib/libfindAllSymbols.a" if unix
        else "Library/lib/clang*.lib;Library/lib/findAllSymbols.lib" }}

requirements:
  build:
    # "these deps are added because of the static libraries"
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    # "Use the same requirements as the top-level requirements
    #  these deps are added because of the static libraries"
    - acpp-llvm ==${{ llvm_version }}
    - libxml2-devel
    - zlib
    - zstd
  run:
    # "without pin_subpackage because we want clangdev to be independent of
    # cfg/nocfg" — so this is deliberately NOT the exact bracket form. Upstream
    # writes `clang ==${{ version }} ${{ variant }}_*_${{ build_number }}`;
    # ours leads with the LLVM tag and keeps the same open middle, which is what
    # lets either the cfg or the nocfg build satisfy it.
    - acpp-clang[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_${{ variant }}_*_${{ build_num }}"]
    - acpp-clangxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_${{ variant }}_*_${{ build_num }}"]
    # UPSTREAM: pin_subpackage("clang-tools", exact=True)
    - acpp-clang-tools[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # UPSTREAM: pin_subpackage("libclang", exact=True)
    - acpp-libclang[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # UPSTREAM: pin_subpackage("libclang-cpp", exact=True)
    - acpp-libclang-cpp[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - acpp-llvmdev ==${{ llvm_version }}
    # "we need to do this manually because clang_bootstrap has no run-export"
    - if: osx
      then: libcxx >=${{ llvm_version }}

tests:
  - package_contents:
      include:
        - clang/Config/config.h
        - clang/Lex/Lexer.h
      files:
        exists:
          # static libraries
          - if: unix
            then:
              - lib/libclangAST.a
              - lib/libclangBasic.a
              - lib/libfindAllSymbols.a
            else:
              - Library/lib/clangAST.lib
              - Library/lib/clangBasic.lib
              - Library/lib/findAllSymbols.lib
          - ${{ library_prefix }}lib/cmake/clang/ClangConfig.cmake
        not_exists:
          # llvm's own development surface is acpp-llvmdev's
          - ${{ library_prefix }}include/llvm/Config/llvm-config.h
          - ${{ library_prefix }}lib/cmake/llvm/LLVMConfig.cmake

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: Development headers and libraries for Clang
