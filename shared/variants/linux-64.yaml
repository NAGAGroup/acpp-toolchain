# Linux build variants — this repo's pinning feedstock (phase-3 ruling [B]).
#
# The recipes carry essentially NO versioned dependencies. Every pin that is a
# CHOICE rather than a hard functional floor lives here, so bumping a
# dependency is one edit in one file per platform instead of a hunt through a
# 1200-line recipe, and so the two lanes cannot drift apart by accident.
#
# HOW IT WORKS: rattler-build applies a variant entry to any BARE requirement
# whose package name matches the key — `zstd` in a recipe becomes `zstd 1.5.*`.
# Verified, not assumed: a rendered build shows the spec annotated `(V)`.
# A requirement that carries its own version is NOT touched, which is why the
# recipes had to be de-versioned for this to take effect at all.
#
# WHAT DOES NOT BELONG HERE: functional floors, i.e. "the software genuinely
# does not work below this". `cmake >=3.24` stays in the recipe because it
# states a requirement of the build, not a choice about which cmake to ship
# against. The distinction is pin-vs-floor, not versioned-vs-bare.

# ---- compilers + stdlib ----------------------------------------------------
c_compiler: [gcc]
cxx_compiler: [gxx]
c_compiler_version: ["14"]
cxx_compiler_version: ["14"]
c_stdlib: [sysroot]
c_stdlib_version: ["2.28"]

# ---- CUDA ------------------------------------------------------------------
# MAJOR ONLY, and deliberately the only CUDA pin in the tree. Everything else
# CUDA-shaped hangs off this one key: cuda-cudart-dev and friends each depend
# on `cuda-version >=12.9,<12.10.0a0`, so pinning the major aligns the whole
# set without naming any of them.
#
# This is also what replaced every hand-written `__cuda >=12,<13`. Measured:
# cuda-version 12.9 constrains `__cuda >=12` — a FLOOR, with no ceiling. The
# old manual line put a ceiling on a driver virtual package, which is simply
# wrong: a newer driver runs older CUDA fine, and the ceiling would have
# refused to install on any host that upgraded to a 13.x driver.
cuda-version: ["12"]

# ---- ABI-sensitive libraries ----------------------------------------------
# Pinned at soname granularity, conda-forge pinning-feedstock style.
zlib: ["1.3"]
zstd: ["1.5"]
libxml2-devel: ["2.15"]
numactl: ["2.0"]

# ---- backends --------------------------------------------------------------
# Level Zero is pinned; the OpenCL packages deliberately are not. opencl-headers
# is header-only and date-versioned (no ABI surface to pin), and ocl-icd is a
# loader whose whole purpose is a stable ABI across versions.
level-zero-devel: ["1.29"]

# ---- python ----------------------------------------------------------------
# ONE python for the whole build. Previously the staging build asked for
# `python >=3.9` in build and a bare `python` in host, which are two
# independent solves that may pick different interpreters — and lldb's python
# bindings are compiled against whichever one host resolved, so a mismatch
# ships a module that cannot import.
python: ["3.14"]

# ---- staging cache key -----------------------------------------------------
# NOT a dependency pin. rattler-build's staging cache key hashes resolved
# requirements, the variant keys used in them, and the platforms — but NOT the
# sources, patches or build script, so editing a patch silently reused a stale
# toolchain. This hash covers those real inputs; shared/gen-staging-hash.nu
# regenerates it and CI fails when it is stale.
staging_inputs: ["3db9cae3beaf36cd"]
