# acpp-clangxx_linux-64: CXX-side compiler activation for the acpp
# toolchain (conda-forge {compiler}_{platform} convention — resolved by
# compiler()/pixi build-variants via cxx_compiler = ["acpp-clangxx"]).
[package]
name = "acpp-clangxx-activation"
version = "25.10.0_llvm20.1.8"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
