  # ── Backend metapackages (precise runtime deps, design §5) ────────────────
  # One-package install path: `acpp-runtime-cuda` PULLS IN the lane runtime,
  # so a CUDA user installs exactly one thing (and still gets the omp backend,
  # which ships in the runtime). Lane-bound + exactly pinned so the pair can
  # never drift; the nightly lane carries `-nightly` twins.
  - package:
      name: acpp-runtime-cuda
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      # x86 platforms only: the aarch64 and mac lanes are OMP-only.
      skip:
        - target_platform == "linux-aarch64"
        - osx
      # The CUDA bitcode wiring (activation-time libdevice symlink/copy into
      # acpp's redist path) lives HERE, not in acpp-runtime: base packages
      # ship no activation, and this is the package whose install guarantees
      # libdevice exists. On win the copy is the load-bearing mechanism —
      # binary prefix replacement does not rewrite the baked path there.
      script:
        interpreter: nu
        file: ../shared/install-runtime-activation.nu
    requirements:
      build:
        - nushell
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        # Constrained through cuda-version, components bare (conda-forge's
        # documented downstream pattern): every cuda-* package pins itself to
        # cuda-version, so the range needs stating exactly once. The ceiling
        # is required — libcudart's SONAME is major-versioned and dlopen
        # resolves filenames, so a CUDA-13 runtime silently removes the GPU.
        - cuda-version >=${{ cuda_compiler_version_min }},<${{ cuda_compiler_version_max }}
        - cuda-cudart
        # libdevice.10.bc only. NOT the cuda-nvvm metapackage: that also
        # drags cuda-nvvm-impl's libnvvm.so, which acpp never loads. cicc
        # rides along; libdevice has no package of its own.
        - cuda-nvvm-tools
      run_constraints:
        # __cuda: DELETED. This is the package that legitimately needs a driver
        # floor, and it gets one WITHOUT us writing it: cuda-cudart depends on
        # cuda-version, which constrains "__cuda >=12" — a floor with no
        # ceiling, unlike the "<13" we used to assert against a driver.
        - acpp-runtime-cuda-nightly <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - if: linux
                then:
                  - etc/conda/activate.d/acpp-runtime-activate.sh
                else:
                  - etc/conda/activate.d/acpp-runtime-activate.bat
                  - etc/conda/activate.d/acpp-runtime-activate.ps1
                  - etc/conda/activate.d/acpp-runtime-activate.sh
    about:
      summary: acpp SYCL runtime with CUDA backend dependencies (generic SSCP JIT)
      license: BSD-3-Clause

  # acpp-runtime-intel is GONE FROM THE MANIFEST (split 2026-09-05): Level
  # Zero and OpenCL are separate backends with separate dependencies —
  # conflating them forced every OpenCL user to install Intel's L0 loader.
  # The published acpp-runtime-intel artifacts stay on the channel; the
  # channel is durable and nothing is deleted from it.
  - package:
      name: acpp-runtime-level-zero
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      # x86 platforms only: the aarch64 and mac lanes are OMP-only.
      skip:
        - target_platform == "linux-aarch64"
        - osx
    requirements:
      # Real host dep so the floor below tracks the staging solve; see the
      # CUDA metapackage. level-zero comes in via level-zero-devel, which is
      # what the runtime was actually built against. The GPU driver itself is
      # the system's — no channel ships it.
      host:
        - level-zero-devel
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        - ${{ pin_compatible('level-zero') }}
      run_constraints:
        - acpp-runtime-level-zero-nightly <0.0a0
    about:
      summary: acpp SYCL runtime with Level Zero backend dependencies (Intel GPUs)
      license: BSD-3-Clause

  - package:
      name: acpp-runtime-ocl
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      # x86 platforms only: the aarch64 and mac lanes are OMP-only.
      skip:
        - target_platform == "linux-aarch64"
        - osx
    requirements:
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        # The OpenCL ICD loader ships under a different name per platform:
        # ocl-icd is linux-only, Windows uses the Khronos loader (which reads
        # the registry — no vendor-dir wiring needed there). Left unpinned on
        # purpose — an ICD loader's entire contract is a stable ABI across
        # versions, so a floor derived from our build machine would be noise
        # rather than information. ICDs come from the environment
        # (intel-compute-runtime, pocl, …) or from the host system via
        # ocl-icd-system — whose post-link script pixi disables by default;
        # see the README for the opt-in and why the default is what it is.
        # NB the SPIR-V ingestion caveat: NVIDIA's OpenCL cannot consume
        # acpp's SPIR-V; this backend lights up on Intel, Mesa rusticl, and
        # pocl.
        - if: linux
          then:
            - ocl-icd
            - ocl-icd-system
          else:
            - khronos-opencl-icd-loader
      run_constraints:
        - acpp-runtime-ocl-nightly <0.0a0
    about:
      summary: acpp SYCL runtime with OpenCL backend dependencies (ICD loader)
      license: BSD-3-Clause

  # ROCm is the deliberate exception to "metapackages over conda-forge":
  # conda-forge's ROCm is generations behind the LLVM this toolchain needs
  # (the generic JIT requires acpp's LLVM <= ROCm's LLVM), so the runtime
  # subset is deployed from TheRock's stable core tarball by the staging
  # build and CARVED here — real files, not dependencies. Named for rocm,
  # not hip.
  - package:
      name: acpp-runtime-rocm
      version: ${{ version }}
    # No source here: staging-inheriting outputs get the ENTIRE staging work
    # dir restored (shared/ and its licenses included); fetching ../shared
    # ourselves collides with that restore ("File already exists").
    inherit: llvm-acpp-stage
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      skip:
        - target_platform != "linux-64"
      files:
        include:
          # The subset acpp's own hip deployment manifest names, deployed by
          # the staging build from the TheRock tarball. Family-independent:
          # no .kpack, no math libraries.
          - lib/libhiprtc*
          - lib/libamdhip64*
          - lib/libhsa*
          - lib/libamd_comgr*
          - lib/libroc*
          - lib/hipSYCL/ext/bitcode/amdgcn/**
    requirements:
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
      run_constraints:
        - acpp-runtime-rocm-nightly <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - lib/libamdhip64.so*
              - lib/libhsa-runtime64.so*
              - lib/libamd_comgr.so*
              - lib/hipSYCL/ext/bitcode/amdgcn/ockl.bc
    about:
      summary: acpp SYCL runtime with ROCm backend runtime (TheRock stable core subset)
      # Per-component sweep, read from the tarball's own share/doc texts:
      # HIP runtime + hiprtc + rocprofiler-register are MIT, hsa-runtime64
      # (ROCR) is NCSA, amd_comgr and the amdgcn device libraries are
      # Apache-2.0 WITH LLVM-exception. Texts vendored beside the other
      # licenses; drift-checked against the extracted tarball at every
      # staging build.
      license: MIT AND NCSA AND Apache-2.0 WITH LLVM-exception
      license_file:
        - shared/licenses/rocm/hip-LICENSE.md
        - shared/licenses/rocm/rocr-LICENSE.md
        - shared/licenses/rocm/amd_comgr-LICENSE.txt
        - shared/licenses/rocm/rocprofiler-register-LICENSE.md

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: Apache-2.0 WITH LLVM-exception
  # Vendored copies (package outputs no longer carry the source trees);
  # build-stage.nu hard-fails if these ever differ from the extracted trees.
  license_file:
    - shared/licenses/llvm-LICENSE.TXT
    - shared/licenses/AdaptiveCpp-LICENSE
  summary: AdaptiveCpp SYCL toolchain (LLVM ${{ llvm_major }} linked-in, generic SSCP)
  repository: https://github.com/NAGAGroup/acpp-toolchain
