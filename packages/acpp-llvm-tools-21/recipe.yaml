# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-llvm-tools-21 — the LLVM tools carrying a version suffix. Lifted from the
# reference monolith's `llvm-tools-${{ major_ver }}` output (llvmdev-feedstock).
#
# SLICING FORM: upstream's $PKG_NAME-branching install script, arm 3 — each
# tool copied with a `-<major>` suffix.
#
# SCOPE derived from conda-forge's PUBLISHED llvm-tools-21-21.1.8 artifact, not
# from upstream's `bin/*` glob, because our union stage removes the per-project
# scoping that glob relied on. Against `_acpp-stage` the bare glob mints
# `bin/clangd-21`, `bin/lld-21`, `bin/lldb-21` and `bin/acpp-21` — names LLVM
# never had — and `bin/clang-format-21` and `bin/clang-scan-deps-21`, which are
# acpp-clang-format-21 and acpp-clang-scan-deps. Re-read the contract with:
#   pixi run -e dev nu tools/upstream-paths.nu llvm-tools-21 21.1.8 <platform>
# 80 tools on linux-64, 79 on osx-arm64. There is NO win-64 artifact, which is
# the same fact as this package's `skip: win`. `llvm-config` is not in the set
# — it belongs to llvmdev — so a positive list never adds it and upstream's
# compensating `rm` is gone rather than reproduced.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-llvm-tools-${{ llvm_major }}
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  # "On Windows there are no symlinks and copying will create a new package
  # that is 300MB+"
  skip: win
  script:
    interpreter: nu
    file: ../_shared/install_llvm.nu
    env:
      ACPP_LLVM_MAJOR: ${{ llvm_major }}
      ACPP_LLVM_MAJ_MIN: ${{ llvm_maj_min }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    - acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - zlib
    - zstd
    # UPSTREAM (conda-build meta.yaml): `libcxx {{ cxx_compiler_version }}` — a
    # BARE version, read as the range `21.*`. `==21` matches nothing.
    - if: osx
      then: libcxx >=${{ cxx_compiler_version }},<${{ (cxx_compiler_version | int) + 1 }}.0a0
  run:
    # UPSTREAM: pin_subpackage("libllvm" ~ major_ver, exact=True)
    - acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # "we need to do this manually because clang_bootstrap has no run-export"
    - if: osx
      then: libcxx >=${{ cxx_compiler_version }}

tests:
  - package_contents:
      files:
        exists:
          - bin/llc-${{ llvm_major }}
        not_exists:
          - bin/llvm-config-${{ llvm_major }}

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: LLVM tools, version-suffixed
