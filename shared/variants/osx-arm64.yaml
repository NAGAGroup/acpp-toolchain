# osx-arm64 build variants — see linux-64.yaml for the doctrine. OMP and Metal
# (no other GPU backend keys), the full tool set including lldb and
# compiler-rt. The compiler is conda-forge's apple clang activation; its
# version need not match the LLVM being built (the linux lanes build LLVM with
# gcc 14 for the same reason).

# ---- compilers + deployment target -----------------------------------------
c_compiler: [clang]
cxx_compiler: [clangxx]
c_compiler_version: ["23"]
cxx_compiler_version: ["23"]
c_stdlib: [macosx_deployment_target]
c_stdlib_version: ["26.0"]

# ---- ABI-sensitive libraries ----------------------------------------------
zlib: ["1.3"]
zstd: ["1.5"]

# ---- python ----------------------------------------------------------------
python: ["3.14"]

# ---- staging cache key -----------------------------------------------------
# See the linux-64 file. Regenerated by shared/gen-staging-hash.nu.
staging_inputs: ["fe868052d57551c8"]
