# THE workspace manifest — the ONLY [workspace] in this repository.
#
# acpp-toolchain, rebuilt: an entire LLVM/clang toolchain with AdaptiveCpp
# LINKED INTO clang, plus the activation packages that make it behave like a
# conda compiler. Not a wrapper around a compiler someone else built.
#
# ROUND 1 SCOPE: nightly lane only, linux-64 + win-64 + osx-arm64, LLVM 21,
# AdaptiveCpp pinned to one develop commit, published to naga-labs-staging.
# No release lane, no naga-* dev package, no linux-aarch64, no retention.
#
# WHY THE REBUILD: the previous tree (still on `main`, untouched) is one
# 1899-line release/recipe.yaml written from scratch against a
# reverse-engineered idea of conda-forge's compiler contract. It expressed
# platform variation by OMISSION — mac/arm shipped 2 of ~14 outputs — instead
# of by `skip:`, and it carries none of the conda-integration patches
# conda-forge has maintained for years (clangdev alone carries nine). This
# tree replaces it with a pixi workspace of source packages built from FORKED
# conda-forge feedstocks, so an upstream fix becomes a diff instead of a
# rediscovery.
#
# MONOREPO DOCTRINE: this workspace owns every environment, task, and the
# variant matrix; member manifests are PACKAGE-ONLY. That is not style —
# `pixi publish` silently SKIPS any subdirectory containing its own
# [workspace], and several conda-forge feedstocks ship a pixi.toml. A member
# that grows a [workspace] section disappears from the publish set without an
# error.
[workspace]
name = "acpp-toolchain"

# CHANNELS — measured, not inherited from the old manifest.
#
# The old workspace declared ONLY https://prefix.dev/jackm97/naga-labs and
# noted that the channel is layered over conda-forge. That is true of
# naga-labs (`pixi search cmake` against it resolves cmake 4.4.3 with a
# prefix.dev/conda-forge URL) but it is NOT true of the round-1 target
# channel: the same search against naga-labs-staging fails with "No packages
# found matching 'cmake'". So conda-forge is declared explicitly here.
# Staging comes first: our names win, and everything else falls through.
channels = [
  "https://prefix.dev/jackm97/naga-labs-staging",
  "conda-forge",
]

# Round 1 platforms. linux-aarch64 is deliberately out.
platforms = ["linux-64", "win-64", "osx-arm64"]

preview = ["pixi-build"]

# Fail fast on pixi older than the features this workspace uses (publish
# --dry-run set validation, build-variants-files, workspace dependency pool).
requires-pixi = ">=0.78"

# Toolchain/stdlib/backend pinning lives in ONE reviewable file (the
# conda-forge pinning-feedstock shape), replacing the four per-platform files
# under shared/variants/. It is also the only route to zip_keys in pixi:
# inline [workspace.build-variants] cannot zip.
build-variants-files = ["./variants.yaml"]

# ---- Dependency pool -------------------------------------------------------
# Single source of truth for every sibling path. Members opt in per entry with
# { workspace = true }; relative paths are re-anchored for each consumer.
#
# The wrapper manifests live HERE, outside the submodules under vendor/, and
# point into them with package.build.config.recipe. Two reasons, both
# structural: a submodule that carries its own workspace would be skipped by
# `pixi publish`, and a wrapper outside the fork keeps our packaging metadata
# out of the diff we take against conda-forge.
[workspace.dependencies]
_acpp-stage = { path = "packages/_acpp-stage" }
acpp-runtime = { path = "packages/acpp-runtime" }
acpp = { path = "packages/acpp" }
acpp-compiler-rt = { path = "packages/acpp-compiler-rt" }
acpp-runtime-cuda = { path = "packages/acpp-runtime-cuda" }
acpp-runtime-level-zero = { path = "packages/acpp-runtime-level-zero" }
acpp-runtime-ocl = { path = "packages/acpp-runtime-ocl" }
acpp-runtime-rocm = { path = "packages/acpp-runtime-rocm" }
acpp-lldb = { path = "packages/acpp-lldb" }
acpp-activation-linux = { path = "packages/acpp-activation-linux" }
acpp-activation-win = { path = "packages/acpp-activation-win" }
acpp-activation-osx = { path = "packages/acpp-activation-osx" }

# ---- lifted from the reference monolith (task 2) ----
# compiler-rt family. The two `-impl` names are DIRECTORY names, not package
# names: those recipes emit `acpp-compiler-rt{21,}_<target_platform>`, and a
# pixi package manifest needs a fixed [package] name.
acpp-libcompiler-rt = { path = "packages/acpp-libcompiler-rt" }
acpp-compiler-rt21-impl = { path = "packages/acpp-compiler-rt21-impl" }
acpp-compiler-rt21 = { path = "packages/acpp-compiler-rt21" }
acpp-compiler-rt-impl = { path = "packages/acpp-compiler-rt-impl" }

# clangdev family.
"acpp-libclang-cpp21.1" = { path = "packages/acpp-libclang-cpp21.1" }
acpp-libclang-cpp = { path = "packages/acpp-libclang-cpp" }
acpp-libclang13 = { path = "packages/acpp-libclang13" }
acpp-libclang = { path = "packages/acpp-libclang" }
acpp-clang-format-21 = { path = "packages/acpp-clang-format-21" }
acpp-clang-format = { path = "packages/acpp-clang-format" }
# `acpp-clang-impl` and `acpp-clangxx-impl` are DIRECTORY names, like the two
# compiler-rt ones above: those recipes emit `acpp-clang{,xx}_impl_<platform>`.
acpp-clang-21 = { path = "packages/acpp-clang-21" }
acpp-clang-impl = { path = "packages/acpp-clang-impl" }
acpp-clang = { path = "packages/acpp-clang" }
acpp-clang-no-conda-cfg = { path = "packages/acpp-clang-no-conda-cfg" }
acpp-clangxx-impl = { path = "packages/acpp-clangxx-impl" }
acpp-clangxx = { path = "packages/acpp-clangxx" }
acpp-clang-scan-deps = { path = "packages/acpp-clang-scan-deps" }
acpp-clang-tools = { path = "packages/acpp-clang-tools" }
acpp-clangdev = { path = "packages/acpp-clangdev" }

acpp-libllvm21 = { path = "packages/acpp-libllvm21" }
acpp-llvm = { path = "packages/acpp-llvm" }
acpp-llvm-tools-21 = { path = "packages/acpp-llvm-tools-21" }
acpp-llvm-tools = { path = "packages/acpp-llvm-tools" }
acpp-libllvm-c21 = { path = "packages/acpp-libllvm-c21" }
acpp-llvmdev = { path = "packages/acpp-llvmdev" }

# openmp family — one package, and a source dependency of acpp-clang.
acpp-llvm-openmp = { path = "packages/acpp-llvm-openmp" }

# lld and lldb. Neither upstream feedstock slices — both are single-package
# recipes — so both are SCRIPT-form slicers, like llvm-openmp above.
# `acpp-lldb` reuses the pre-methodology directory, whose contents this replaces.
acpp-lld = { path = "packages/acpp-lld" }

# BOLT. No conda-forge counterpart exists — it is the one package in this set
# with no upstream output to lift — but our stage builds it on linux and `main`
# ships it, so it keeps a name of its own rather than disappearing with the
# retired acpp-tools. Reasoning in its recipe.
acpp-bolt = { path = "packages/acpp-bolt" }

# llvm-spirv family — the SECOND STAGE and its four slicers. The four outputs
# must come out of ONE build (a symlink whose target another of them ships, and
# a rename+link between the two binaries), and under this backend "share one
# build" means stage + slicers. The stage installs into <layout_root>/_spirv-stage,
# a DISTINCT directory from _stage; see its manifest.
_acpp-llvm-spirv-stage = { path = "packages/_acpp-llvm-spirv-stage" }
acpp-libllvmspirv21 = { path = "packages/acpp-libllvmspirv21" }
acpp-libllvmspirv = { path = "packages/acpp-libllvmspirv" }
acpp-llvm-spirv-21 = { path = "packages/acpp-llvm-spirv-21" }
acpp-llvm-spirv = { path = "packages/acpp-llvm-spirv" }

# libcxx family — OSX ONLY, and THREE packages, not four. Upstream's fourth,
# `libcxxabi`, is skipped on everything but linux ("we do not ship libcxxabi on
# OSX - this breaks exception passing"), and conda-forge publishes no
# libcxxabi for osx-arm64 at all. On macOS libc++ IS the native platform C++
# library and we build it; linux uses libstdcxx and win the MSVC runtime.
acpp-libcxx = { path = "packages/acpp-libcxx" }
acpp-libcxx-headers = { path = "packages/acpp-libcxx-headers" }
acpp-libcxx-devel = { path = "packages/acpp-libcxx-devel" }

# ---- Build backends --------------------------------------------------------
# Backends are specified as "*" in every member manifest, NOT pinned to a
# version (Jack's explicit ruling): a pinned backend rots, and breakage on a
# backend update is CI's job to catch. This is a deliberate divergence from
# template-cpp-project, which pins ==0.4.5.

# ---- Environments ----------------------------------------------------------
# Deliberately lean in round 1. The old lane tasks (build-lane, gen-nightly,
# audit, prune, keepers) are NOT carried over: they drive release/recipe.yaml
# and nightly/recipe.yaml, which this branch replaces. They remain on `main`
# and in this branch's history until the new core recipe lands and the CI
# workflow is written.
[environments.dev]
no-default-feature = true
# rattler-index carries a real bound rather than the bare "*" the old manifest
# used: whether bare "*" counts under the fleet no-version-wildcards rule is a
# question still open with Jack, and a real bound sidesteps it.
# libarchive supplies bsdtar, which reads a .conda (a zip) and the
# pkg-*.tar.zst inside it in one pipeline — that is how the disjointness check
# reads a built artifact's info/files without unpacking anything to disk.
dependencies = { nushell = ">=0.114,<0.115", rattler-build = ">=0.75,<0.76", rattler-index = ">=0.31,<0.32", git = ">=2.55,<2.56", libarchive = ">=3.8,<3.9" }

# One publish builds every opted-in package across the variant matrix, in
# dependency order, into an INDEXED local channel (a bare --target-dir only
# copies files and is not solvable).
[tasks.publish-local]
cmd = "pixi publish --to {{ channel }}"
args = [{ arg = "channel", default = "./local-channel" }]
description = "Build + publish every opted-in package into an indexed local channel"

[tasks.publish-dry-run]
cmd = "pixi publish --dry-run --to {{ channel }}"
args = [{ arg = "channel", default = "./local-channel" }]
description = "Print the publish set and its build order without building or uploading"
