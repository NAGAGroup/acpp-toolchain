# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-clang-no-conda-cfg — the SELECTOR for the nocfg build of acpp-clang.
# Lifted from the reference monolith's `clang-no-conda-cfg` output
# (clangdev-feedstock).
#
# It exists only at the false row of the `with_cfg` axis (`skip: with_cfg`), and
# its whole content is one run dependency that names the nocfg build string.
# Installing it is how a consumer asks for a clang without the conda
# configuration files, since both builds carry the single name `acpp-clang`.
#
# SHIPS NOTHING, and says so with `files: []` exactly as upstream does. It runs
# no slice script, so it does NOT take the stage as a host dependency — the same
# exception acpp-compiler-rt and acpp-compiler-rt_<platform> take, for the same
# reason: it is not a slicer.
#
# Upstream does not `inherit:` the clangdev staging output here, citing
# rattler-build issue 2753 (an empty file list read as "capture everything").
# That comment has no counterpart in our design — every package in this
# workspace is already a standalone recipe — so it is not transcribed.

context:
  llvm_version: "21.1.8"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-clang-no-conda-cfg
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_h${{ hash }}_${{ build_num }}
  skip: with_cfg
  files: []
  variant:
    down_prioritize_variant: ${{ 0 if variant == "default" else 1 }}

requirements:
  build: []
  run:
    # UPSTREAM: `clang ==${{ version }} ${{ variant }}_nocfg_*_${{ build_number }}`.
    # Our build strings LEAD with the LLVM tag, so the same selection is the tag
    # followed by variant, `nocfg`, and the build number at the end.
    - acpp-clang[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_${{ variant }}_nocfg_*_${{ build_num }}"]

tests:
  # pure metapackage -- should be empty!
  - package_contents:
      strict: true
      files: []

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: Selects the clang build without conda configuration files
