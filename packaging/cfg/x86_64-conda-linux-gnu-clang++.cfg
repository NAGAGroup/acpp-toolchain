# Clang configuration for the conda target triple, C++ driver.
# See x86_64-conda-linux-gnu-clang.cfg for what <CFGDIR> does and why the file
# name is what makes clang find it.
-isystem <CFGDIR>/../include
$-Wl,-L,<CFGDIR>/../lib
$-Wl,-rpath,<CFGDIR>/../lib
$-Wl,-rpath-link,<CFGDIR>/../lib
--sysroot=<CFGDIR>/../x86_64-conda-linux-gnu/sysroot
