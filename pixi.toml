# THE workspace manifest — the ONLY [workspace] in this repository.
#
# acpp-toolchain, rebuilt: an entire LLVM/clang toolchain with AdaptiveCpp
# LINKED INTO clang, plus the activation packages that make it behave like a
# conda compiler. Not a wrapper around a compiler someone else built.
#
# ROUND 1 SCOPE: nightly lane only, linux-64 + win-64 + osx-arm64, LLVM 21,
# AdaptiveCpp pinned to one develop commit, published to naga-labs-staging.
# No release lane, no naga-* dev package, no linux-aarch64, no retention.
#
# WHY THE REBUILD: the previous tree (still on `main`, untouched) is one
# 1899-line release/recipe.yaml written from scratch against a
# reverse-engineered idea of conda-forge's compiler contract. It expressed
# platform variation by OMISSION — mac/arm shipped 2 of ~14 outputs — instead
# of by `skip:`, and it carries none of the conda-integration patches
# conda-forge has maintained for years (clangdev alone carries nine). This
# tree replaces it with a pixi workspace of source packages built from FORKED
# conda-forge feedstocks, so an upstream fix becomes a diff instead of a
# rediscovery.
#
# MONOREPO DOCTRINE: this workspace owns every environment, task, and the
# variant matrix; member manifests are PACKAGE-ONLY. That is not style —
# `pixi publish` silently SKIPS any subdirectory containing its own
# [workspace], and several conda-forge feedstocks ship a pixi.toml. A member
# that grows a [workspace] section disappears from the publish set without an
# error.
[workspace]
name = "acpp-toolchain"

# CHANNELS — measured, not inherited from the old manifest.
#
# The old workspace declared ONLY https://prefix.dev/jackm97/naga-labs and
# noted that the channel is layered over conda-forge. That is true of
# naga-labs (`pixi search cmake` against it resolves cmake 4.4.3 with a
# prefix.dev/conda-forge URL) but it is NOT true of the round-1 target
# channel: the same search against naga-labs-staging fails with "No packages
# found matching 'cmake'". So conda-forge is declared explicitly here.
# Staging comes first: our names win, and everything else falls through.
#
# ⚠ `./local-channel` IS DELIBERATELY NOT IN THIS LIST, and the reason is
# measured rather than stylistic. Adding it as a third entry:
#
#   1. breaks EVERY environment solve until the directory exists with a
#      repodata.json per subdir — including the `packaging` environment whose
#      own task creates it. `pixi run -e packaging nu
#      tools/init-local-channel.nu` cannot run when the channel is missing,
#      which makes the gate circular;
#   2. writes an ABSOLUTE, machine-specific URL into the committed lock
#      (`file:///home/jack/projects/acpp-toolchain/local-channel/`), which is
#      wrong on any other checkout — a CI runner's path is not this one.
#
# And nothing needs it: under the whole-workspace publish, no build resolves a
# sibling from a channel mid-build — that ordering constraint died with the
# `--path` loop. `pixi publish --to ./local-channel` WRITES there without the
# directory being a declared channel, and `tools/init-local-channel.nu` makes
# it solvable for anyone who wants to INSTALL from it afterwards, which is the
# only case that needs an index.
channels = [
  "https://prefix.dev/jackm97/naga-labs-staging",
  "conda-forge",
]

# Round 1 platforms. linux-aarch64 is deliberately out.
platforms = ["linux-64", "win-64", "osx-arm64"]

preview = ["pixi-build"]

# Fail fast on pixi older than the features this workspace uses (publish
# --dry-run set validation, build-variants-files, workspace dependency pool).
requires-pixi = ">=0.78"

# Toolchain/stdlib/backend pinning lives in ONE reviewable file (the
# conda-forge pinning-feedstock shape), replacing the four per-platform files
# under shared/variants/. It is also the only route to zip_keys in pixi:
# inline [workspace.build-variants] cannot zip.
build-variants-files = ["./variants.yaml"]

# ---- Dependency pool -------------------------------------------------------
# Single source of truth for every sibling path. Members opt in per entry with
# { workspace = true }; relative paths are re-anchored for each consumer.
#
# The wrapper manifests live HERE, outside the submodules under vendor/, and
# point into them with package.build.config.recipe. Two reasons, both
# structural: a submodule that carries its own workspace would be skipped by
# `pixi publish`, and a wrapper outside the fork keeps our packaging metadata
# out of the diff we take against conda-forge.
[workspace.dependencies]
_acpp-stage = { path = "packages/_acpp-stage" }
acpp-runtime = { path = "packages/acpp-runtime" }
acpp = { path = "packages/acpp" }
acpp-compiler-rt = { path = "packages/acpp-compiler-rt" }
acpp-runtime-cuda = { path = "packages/acpp-runtime-cuda" }
acpp-runtime-level-zero = { path = "packages/acpp-runtime-level-zero" }
acpp-runtime-ocl = { path = "packages/acpp-runtime-ocl" }
acpp-runtime-rocm = { path = "packages/acpp-runtime-rocm" }
acpp-lldb = { path = "packages/acpp-lldb" }
acpp-activation-linux = { path = "packages/acpp-activation-linux" }
acpp-activation-win = { path = "packages/acpp-activation-win" }
acpp-activation-osx = { path = "packages/acpp-activation-osx" }

# ---- lifted from the reference monolith (task 2) ----
# compiler-rt family. The `_<platform>` names below are the PACKAGE names, one
# manifest each, all pointing at their family's single recipe — pixi matches a
# source package by manifest name, so a templated recipe needs one manifest per
# platform. The directory names keep the `-impl` stem.
acpp-libcompiler-rt = { path = "packages/acpp-libcompiler-rt" }
# The `_<platform>`-templated families: ONE manifest per platform, because pixi
# matches a source package by its manifest name (see any of these manifests for
# the measurement). They share one recipe per family.
"acpp-compiler-rt21_linux-64" = { path = "packages/acpp-compiler-rt21-impl-linux-64" }
"acpp-compiler-rt21_win-64" = { path = "packages/acpp-compiler-rt21-impl-win-64" }
"acpp-compiler-rt21_osx-arm64" = { path = "packages/acpp-compiler-rt21-impl-osx-arm64" }
acpp-compiler-rt21 = { path = "packages/acpp-compiler-rt21" }
"acpp-compiler-rt_linux-64" = { path = "packages/acpp-compiler-rt-impl-linux-64" }
"acpp-compiler-rt_win-64" = { path = "packages/acpp-compiler-rt-impl-win-64" }
"acpp-compiler-rt_osx-arm64" = { path = "packages/acpp-compiler-rt-impl-osx-arm64" }

# clangdev family.
"acpp-libclang-cpp21.1" = { path = "packages/acpp-libclang-cpp21.1" }
acpp-libclang-cpp = { path = "packages/acpp-libclang-cpp" }
acpp-libclang13 = { path = "packages/acpp-libclang13" }
acpp-libclang = { path = "packages/acpp-libclang" }
acpp-clang-format-21 = { path = "packages/acpp-clang-format-21" }
acpp-clang-format = { path = "packages/acpp-clang-format" }
# Same shape as the compiler-rt pair above: one manifest per platform, one
# shared recipe per family, directories keeping the `-impl` stem.
acpp-clang-21 = { path = "packages/acpp-clang-21" }
"acpp-clang_impl_linux-64" = { path = "packages/acpp-clang-impl-linux-64" }
"acpp-clang_impl_osx-arm64" = { path = "packages/acpp-clang-impl-osx-arm64" }
acpp-clang = { path = "packages/acpp-clang" }
acpp-clang-no-conda-cfg = { path = "packages/acpp-clang-no-conda-cfg" }
"acpp-clangxx_impl_linux-64" = { path = "packages/acpp-clangxx-impl-linux-64" }
"acpp-clangxx_impl_osx-arm64" = { path = "packages/acpp-clangxx-impl-osx-arm64" }
acpp-clangxx = { path = "packages/acpp-clangxx" }
acpp-clang-scan-deps = { path = "packages/acpp-clang-scan-deps" }
acpp-clang-tools = { path = "packages/acpp-clang-tools" }
acpp-clangdev = { path = "packages/acpp-clangdev" }

acpp-libllvm21 = { path = "packages/acpp-libllvm21" }
acpp-llvm = { path = "packages/acpp-llvm" }
acpp-llvm-tools-21 = { path = "packages/acpp-llvm-tools-21" }
acpp-llvm-tools = { path = "packages/acpp-llvm-tools" }
acpp-libllvm-c21 = { path = "packages/acpp-libllvm-c21" }
acpp-llvmdev = { path = "packages/acpp-llvmdev" }

# openmp family — one package, and a source dependency of acpp-clang.
acpp-llvm-openmp = { path = "packages/acpp-llvm-openmp" }

# lld and lldb. Neither upstream feedstock slices — both are single-package
# recipes — so both are SCRIPT-form slicers, like llvm-openmp above.
# `acpp-lldb` reuses the pre-methodology directory, whose contents this replaces.
acpp-lld = { path = "packages/acpp-lld" }

# BOLT. No conda-forge counterpart exists — it is the one package in this set
# with no upstream output to lift — but our stage builds it on linux and `main`
# ships it, so it keeps a name of its own rather than disappearing with the
# retired acpp-tools. Reasoning in its recipe.
acpp-bolt = { path = "packages/acpp-bolt" }

# llvm-spirv family — the SECOND STAGE and its four slicers. The four outputs
# must come out of ONE build (a symlink whose target another of them ships, and
# a rename+link between the two binaries), and under this backend "share one
# build" means stage + slicers. The stage installs into <layout_root>/_spirv-stage,
# a DISTINCT directory from _stage; see its manifest.
_acpp-llvm-spirv-stage = { path = "packages/_acpp-llvm-spirv-stage" }
acpp-libllvmspirv21 = { path = "packages/acpp-libllvmspirv21" }
acpp-libllvmspirv = { path = "packages/acpp-libllvmspirv" }
acpp-llvm-spirv-21 = { path = "packages/acpp-llvm-spirv-21" }
acpp-llvm-spirv = { path = "packages/acpp-llvm-spirv" }

# libcxx family — OSX ONLY, and THREE packages, not four. Upstream's fourth,
# `libcxxabi`, is skipped on everything but linux ("we do not ship libcxxabi on
# OSX - this breaks exception passing"), and conda-forge publishes no
# libcxxabi for osx-arm64 at all. On macOS libc++ IS the native platform C++
# library and we build it; linux uses libstdcxx and win the MSVC runtime.
acpp-libcxx = { path = "packages/acpp-libcxx" }
acpp-libcxx-headers = { path = "packages/acpp-libcxx-headers" }
acpp-libcxx-devel = { path = "packages/acpp-libcxx-devel" }

# ---- the root meta package ----
# Everything this workspace ships, as one name — Jack''s ruling. It is what
# makes a single `pixi publish` with no --path build and publish the whole set,
# and what a user installs instead of forty names. Ships nothing, exports
# nothing; two packages we ship are deliberately absent from it and its recipe
# says which and why.
acpp-toolkit = { path = "packages/acpp-toolkit" }

# ---- Build backends --------------------------------------------------------
# Backends are specified as "*" in every member manifest, NOT pinned to a
# version (Jack's explicit ruling): a pinned backend rots, and breakage on a
# backend update is CI's job to catch. This is a deliberate divergence from
# template-cpp-project, which pins ==0.4.5.

# ---- Environments ----------------------------------------------------------
# Deliberately lean in round 1. The old lane tasks (build-lane, gen-nightly,
# audit, prune, keepers) are NOT carried over: they drive release/recipe.yaml
# and nightly/recipe.yaml, which this branch replaces. They remain on `main`
# and in this branch's history until the new core recipe lands and the CI
# workflow is written.
[environments.dev]
no-default-feature = true
# rattler-index carries a real bound rather than the bare "*" the old manifest
# used: whether bare "*" counts under the fleet no-version-wildcards rule is a
# question still open with Jack, and a real bound sidesteps it.
# libarchive supplies bsdtar, which reads a .conda (a zip) and the
# pkg-*.tar.zst inside it in one pipeline — that is how the disjointness check
# reads a built artifact's info/files without unpacking anything to disk.
dependencies = { nushell = ">=0.114,<0.115", rattler-build = ">=0.75,<0.76", rattler-index = ">=0.31,<0.32", git = ">=2.55,<2.56", libarchive = ">=3.8,<3.9" }

# One publish builds every opted-in package across the variant matrix, in
# dependency order, into an INDEXED local channel (a bare --target-dir only
# copies files and is not solvable).
[tasks.publish-local]
cmd = "pixi publish --to {{ channel }}"
args = [{ arg = "channel", default = "./local-channel" }]
description = "Build + publish every opted-in package into an indexed local channel"

[tasks.publish-dry-run]
cmd = "pixi publish --dry-run --to {{ channel }}"
args = [{ arg = "channel", default = "./local-channel" }]
description = "Print the publish set and its build order without building or uploading"

# ---- the packaging environment ---------------------------------------------
# NO DEFAULT FEATURE, and that is not tidiness: the default environment
# installs this workspace's own packages, so a packaging task run in it would
# trigger a full LLVM build to answer a question about metadata. These gates
# must be cheap enough to run on every change, which means they must not be
# able to start a build at all.
#
# They need nushell to run, libarchive for bsdtar (the disjointness check reads
# a .conda without unpacking it), and rattler-index for the local channel.
[feature.packaging.dependencies]
nushell = ">=0.114,<0.115"
libarchive = ">=3.8,<3.9"
rattler-index = ">=0.31,<0.32"
# ripgrep is the llvm-spirv RPATH observation's tool: it reads a BINARY and
# extracts the $ORIGIN entries, which nushell's own text handling will not do.
# Declared rather than inherited — it happens to be on this laptop's PATH and
# on GitHub's hosted images, and neither says anything about the ORG runners
# this workflow actually uses. That assumption is the same class as the one
# that reddened run 34096393708.
ripgrep = ">=14,<15"

# bash and grep are ONLY for tools/tests/exercise-workflow-guards.sh, which
# replays staging.yml''s own bash guards. Scoped to linux because that is where
# they exist as conda packages and where the test is run; scoping them here
# rather than above keeps the environment solvable on win and osx, where a
# bare `bash` has no candidate at all.
[feature.packaging.target.linux-64.dependencies]
bash = ">=5.2,<5.3"
grep = ">=3.11,<3.13"

[environments.packaging]
features = ["packaging"]
no-default-feature = true

# Create ./local-channel's empty indexes. A channel directory with no
# repodata.json is not a channel, and it is git-ignored, so this is the
# reproducible way to have one.
[feature.packaging.tasks.init-local-channel]
cmd = "nu tools/init-local-channel.nu --platform {{ platform }}"
args = [{ arg = "platform", default = "linux-64" }]
description = "Create ./local-channel/{noarch,<platform>}/repodata.json so the channel is solvable"

# THE SUPERSET GATE: every upstream output in the ratified subset has an acpp
# counterpart in what we ship. Reads the COMMITTED target list, never the
# monolith, and asserts the count it examined — "no gaps" over an empty list is
# not a result.
[feature.packaging.tasks.check-superset]
cmd = "nu tools/check-superset.nu --platform {{ platform }}"
args = [{ arg = "platform", default = "linux-64" }]
description = "Assert we ship the acpp analogue of every upstream output in the ratified subset"

# Regenerating the target list is a DELIBERATE act with a reviewable diff, so
# it is its own task and needs the reference monolith checked out beside us.
[feature.packaging.tasks.regen-superset-targets]
cmd = "nu tools/check-superset.nu --regenerate"
description = "Rebuild packaging/upstream-subset.json from the reference monolith's outputs.json"

# One NAME must have one VERSION. Not one build — acpp-clang and acpp-clangxx
# are each built twice, once per with_cfg row.
[feature.packaging.tasks.check-name-collisions]
cmd = "nu tools/check-name-collisions.nu --platform {{ platform }}"
args = [{ arg = "platform", default = "linux-64" }]
description = "Assert no package name is produced at more than one version"

# THE ONLY GATE HERE THAT READS BUILT ARTIFACTS, so it runs after a real build
# rather than on a dry run. --expect is mandatory and must be at least 2: a
# pairwise-disjointness claim over one artifact is vacuously true.
# THE GATES' OWN TEST. Every guard above is run twice — once over input it must
# accept, once over input it must REJECT — against synthetic .conda artifacts
# built for the purpose, so the gates run their real extraction paths. A guard
# that has never fired is untested code, and this is what keeps that from being
# true. It found a live nushell defect in publish-accounting.nu that a
# parse-check could not see.
[feature.packaging.tasks.test-gates]
cmd = "nu tools/tests/exercise-gates.nu"
description = "Exercise every packaging gate on good AND bad input"

[feature.packaging.tasks.test-workflow-guards]
cmd = "bash tools/tests/exercise-workflow-guards.sh"
description = "Exercise staging.yml's bash guards (the version gate, the platform matrix)"

# THE CLASS CHECK THE DRY RUN CANNOT DO. `pixi publish --dry-run` renders and
# enumerates but does NOT solve host environments, so a recipe naming a sibling
# its manifest does not map renders green and dies on the first solve in CI.
[feature.packaging.tasks.check-sibling-mapping]
cmd = "nu tools/check-sibling-mapping.nu"
description = "Assert every workspace sibling a recipe names is mapped in its manifest"

# The per-platform packages of every templated-name family are GENERATED from
# one authored recipe each; --check makes a hand edit to a generated copy a red
# build instead of a silent divergence.
[feature.packaging.tasks.gen-platform-packages]
cmd = "nu tools/gen-platform-packages.nu"
description = "Regenerate the per-platform recipes of the templated-name families"

[feature.packaging.tasks.check-platform-packages]
cmd = "nu tools/gen-platform-packages.nu --check"
description = "Assert every generated per-platform recipe matches its authored source"

# The in-tree clang config guard, exercised against a REAL clang: the `..`
# build-path shape that produced a false positive must pass, a config file
# clang does not read must fire, and the flags must reach cc1.
[feature.packaging.tasks.test-clang-cfg-guard]
cmd = "nu tools/tests/exercise-clang-cfg-guard.nu"
description = "Exercise the in-tree clang config-file guard, both branches"

# Every `path:` source must exist relative to its own recipe. A `path:` source
# and a `license_file` resolve by DIFFERENT rules — recipe dir vs rendered
# source dir — and applying one rule to the other is what failed run
# 34109157780 at fetch time.
# The stage''s post-install fixups must be a NO-OP on a second pass: a
# cache-restored run re-executes the whole script against an already-fixed
# prefix. Runs them twice against a synthetic tree and diffs.
[feature.packaging.tasks.test-stage-fixups]
cmd = "nu tools/tests/exercise-stage-fixups.nu"
description = "Assert every stage fixup is idempotent"

# Resolve every carve against a REAL stage listing from a run artifact: globs
# that match nothing, and paths two packages both claim. Skipped without a
# listing — that is not a pass.
[feature.packaging.tasks.check-carves-against-stage]
cmd = "nu tools/check-carves-against-stage.nu"
description = "Resolve every carve against a real stage listing and name collisions"

[feature.packaging.tasks.check-source-paths]
cmd = "nu tools/check-source-paths.nu"
description = "Assert every path: source resolves from its own recipe directory"

[feature.packaging.tasks.check-disjointness]
cmd = "nu tools/check-package-disjointness.nu --artifacts {{ artifacts }} --expect {{ expect }}"
args = [
  { arg = "artifacts", default = "./dist" },
  { arg = "expect", default = "30" },
]
description = "Assert no two built acpp-* packages of one platform ship the same file"
