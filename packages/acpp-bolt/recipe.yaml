# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-bolt — BOLT, LLVM's post-link binary optimizer: llvm-bolt,
# llvm-bolt-heatmap, perf2bolt and merge-fdata.
#
# THE ONE PACKAGE IN THIS SET WITH NO UPSTREAM COUNTERPART. conda-forge
# packages no BOLT anywhere — measured against llvm-tools, llvmdev and
# clang-tools at 21.1.8, which carry no bolt binary between them — so there is
# no feedstock output to lift and no artifact to scope against.
#
# IT IS SHIPPED ANYWAY, AND IT IS A NAMED PACKAGE. Two decisions, both mine:
#
#   * SHIPPED, because our stage builds it and `main` ships it today. The
#     standing ruling on BOLT and polly is that packaging convenience never
#     decides product shape: a binary we ship is not dropped because
#     conda-forge has no feedstock for it. Dropping it while retiring
#     acpp-tools would have been exactly that.
#   * A PACKAGE OF ITS OWN, rather than folded into `acpp`. BOLT is a distinct
#     upstream sub-project with its own binaries and no part in the SYCL flow —
#     nothing in AdaptiveCpp invokes it. `acpp` is the load-bearing consumer
#     name and is now cross-platform AdaptiveCpp content; folding four ELF-only
#     programs into it would make that package's content platform-asymmetric
#     for no reason and put an optimizer nobody in this toolchain calls into
#     every consumer's environment. One upstream sub-project, one package is
#     also the shape of every other member of the lifted set, and a separate
#     name can be dropped later without touching `acpp`.
#
# SLICING FORM: SCRIPT, like lld, lldb and openmp — the other packages whose
# upstream form is "whatever the build installs" rather than a glob list.
# ../_shared/install_bolt.nu says where its scope comes from and why the list
# is split required/optional.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}

package:
  name: acpp-bolt
  version: ${{ llvm_version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  # ELF ONLY. BOLT has no darwin and no PE/COFF port, and build-stage.nu puts
  # it in LLVM_ENABLE_PROJECTS on the linux leg alone — so this is a property
  # of the stage, expressed as a skip rather than as an omission.
  skip: not linux
  script:
    interpreter: nu
    file: ../_shared/install_bolt.nu
    env:
      PKG_NAME: acpp-bolt

requirements:
  build:
    - nushell
  host:
    - _acpp-stage ==0.0.0
  run:
    # The tools link the LLVM dylib the stage builds on linux, exactly as every
    # other LLVM program in this set does.
    - acpp-libllvm21[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]

tests:
  - package_contents:
      # NOT `strict: true`, which would make this list a complete inventory —
      # and the optional half of the slice is precisely the part whose presence
      # is unknown until a real build. The four required paths are asserted;
      # anything extra the script places is bolt's by construction.
      files:
        exists:
          - bin/llvm-bolt
          - bin/llvm-bolt-heatmap
          - bin/perf2bolt
          - bin/merge-fdata

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/llvm-LICENSE.TXT
  summary: BOLT, the LLVM post-link binary optimizer, built with the acpp toolchain
