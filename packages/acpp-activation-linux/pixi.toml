# acpp-activation-linux — the linux compiler-activation packages
# (acpp-clang_linux-64 / acpp-clangxx_linux-64), built from our fork of
# conda-forge's ctng-compiler-activation-feedstock.
#
# PACKAGE-ONLY manifest. The single workspace at the repo root owns the
# environments, the tasks and the variant matrix.
#
# WHY THE MANIFEST LIVES HERE AND NOT IN THE SUBMODULE: `pixi publish` skips
# any subdirectory that contains its own [workspace], and conda-forge
# feedstocks do ship pixi.toml files. package.build.config.recipe takes a
# PATH, so the wrapper sits outside the fork and points into it — which also
# keeps our packaging metadata out of the diff we take against upstream.
#
# WHY THIS FEEDSTOCK FOR LINUX: the clang_linux-* / clangxx_linux-* family is
# produced by ctng-compiler-activation, NOT by clang-compiler-activation
# (which owns osx) and not by clangdev (which owns the NATIVE clang_impl_*).
# The linux clang activation is literally `cp activate-gcc.sh
# activate-clang.sh` plus a sed, which is why it lives in the gcc lineage.
#
# TWO OUTPUTS FROM ONE RECIPE, which is why this manifest's name matches
# neither of them. The C++ activation script only sets the CXX half and relies
# on the C one having run first, so the pair is pinned to each other with
# pin_subpackage(exact=True) — a function that names another output of the SAME
# recipe and therefore exists only while they share one.
[package]
name = "acpp-activation-linux"
version = "0.dev0"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# THE PASSTHROUGH. The manifest tables add no dependencies — the backend
# regards only what the recipe declares — but they supply the workspace path
# mapping the recipe cannot know, which lets it name `acpp ==<version>` under
# requirements.host as if it came from a channel. acpp is the compiler these
# packages activate, and its weak run_export is what turns that host dependency
# into an exact-build run dependency.
[package.build-dependencies]
acpp = { workspace = true }

[package.build.config]
recipe = "../../vendor/ctng-compiler-activation-feedstock/recipe/recipe.yaml"
