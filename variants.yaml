# variants.yaml — THE pinning file for this workspace, referenced from
# [workspace] build-variants-files in the root pixi.toml.
#
# It replaces shared/variants/{linux-64,win-64,osx-arm64,linux-aarch64}.yaml:
# four files that had to be kept in step by hand and drifted (the osx one was
# a "first cut" with different compiler versions and no backend keys at all).
# One file with platform SELECTORS is the conda-forge pinning-feedstock shape,
# and in pixi it is the only route to zip_keys — inline
# [workspace.build-variants] has no zipping.
#
# HOW VARIANT PINNING WORKS (verified in the old lanes, not assumed):
# rattler-build applies an entry to any BARE requirement whose package name
# matches the key — `zstd` in a recipe becomes `zstd 1.5.*`. A requirement
# that carries its own version is NOT touched. Keys that match no requirement
# are plain variables the recipe can read, and every key a build actually USES
# enters that build's variant hash.
#
# WHAT BELONGS HERE: pins that are a CHOICE. Functional floors ("the build
# genuinely does not work below this", e.g. cmake >=3.24) stay in the recipe.
# The distinction is pin-vs-floor, not versioned-vs-bare.
#
# Values are BARE and EXACT ("1.5" prefix-matches the series) — dependency
# SPECS carry real bounds; variant VALUES never do.

# ---- round-1 constants -----------------------------------------------------
# LLVM 21: the top of AdaptiveCpp's supported range (its CMake guards
# LLVM_VERSION_MAJOR > 21) and conda-forge's default macOS compiler major.
llvm_major:
  - "21"
llvm_version:
  - "21.1.8"

# AdaptiveCpp is pinned to a CONSTANT develop commit for the whole of round 1.
# The reason is NOT feature freezing: dynamically detecting develop HEAD
# invalidates ccache on every upstream commit. Pinned once, left alone.
# 6df52d7 = AdaptiveCpp/AdaptiveCpp develop, 2026-09-04, "Missing free in
# empty_kernel_submission SYCL test (#2220)".
acpp_rev:
  - "6df52d7ea8540e6683ab733c6458c9d5a1c2195c"

# ---- compilers + stdlib ----------------------------------------------------
# Explicit on every platform. A stale default that happens to work is
# indistinguishable from a deliberate choice until the day it stops working —
# which is exactly why win pins the VS year rather than inheriting vs2022.
c_compiler:
  - if: linux
    then: gcc
  - if: win
    then: vs2026
  - if: osx
    then: clang
cxx_compiler:
  - if: linux
    then: gxx
  - if: win
    then: vs2026
  - if: osx
    then: clangxx

# Compiler versions exist on the two platforms that have a version axis; win's
# year IS its version and is carried by the c_compiler value itself.
#
# osx moves to 21 (was 23 in the ad-hoc mac lane, chosen as "newest"):
# conda-forge's own default for osx is clang 21, and AdaptiveCpp guards
# LLVM_VERSION_MAJOR > 21 — so 21 is simultaneously the ecosystem default and
# inside acpp's supported range. It also drops the libcxx run-export floor
# from >=23 to >=21 automatically. NEVER hand-pin libcxx: the floor is a
# lower bound published by the compiler activation, and the C++ runtime is a
# separate axis from the LLVM we SHIP.
c_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "21"
cxx_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "21"

c_stdlib:
  - if: linux
    then: sysroot
  - if: win
    then: vs
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.28"
  # conda-forge scopes c_stdlib_version to unix. We set it on win deliberately
  # so the VS year is pinned in ONE place; vs2026_win-64 already constrains
  # vs_win-64 ==2026.1, this only makes it explicit.
  - if: win
    then: "2026"
  - if: osx
    then: "11.0"

# THE macOS SDK — deliberately NOT a variant key here, because setting one
# selects nothing. Traced through every layer 2026-09-05:
#
#   * MACOSX_SDK_VERSION appears in NO recipe and NO script of any of the three
#     activation feedstocks we fork — only in ctng's own cbc (14.5), which
#     nothing in that feedstock reads.
#   * osx-sysroot-feedstock, which OWNS the SDK, carries it as
#     `MACOSX_SDK_VERSION: 11.0` under the literal comment
#     "# dummy value for SDK to be downloaded", and references it in exactly
#     one place: an `echo` in a test.
#   * The key's real consumer is conda-smithy, which downloads that SDK into
#     $OSX_SDK_DIR (/opt/conda-sdks since conda-smithy 3.54.0) before the build
#     starts. We do not run conda-smithy.
#   * What actually chooses the SDK is sdkroot_env_osx-arm64's activation
#     script, in this order: an already-set SDKROOT wins; else
#     CONDA_BUILD_SYSROOT; else, on Darwin, `SDKROOT="$(xcrun --show-sdk-path)"`
#     — the runner's SDK.
#
# So a number here would perturb the variant hash and change nothing else, and
# the mac build would still inherit the runner's macOS 26 SDK — the root cause
# of the whole ad-hoc mac patch sequence. The fix belongs in the WORKFLOW, not
# in this file: fetch a pinned SDK and export SDKROOT before the build, which
# is the branch sdkroot_env takes first. Tracked as a step-6 item.
#
# The DEPLOYMENT TARGET is a different axis and is pinned above, as
# c_stdlib_version 11.0 — that one is real, and macosx_deployment_target_*
# turns it into a `__osx >=11.0` run_export.

# Keys move in lockstep. Each group is inert on a platform where its keys are
# undefined (win defines neither compiler-version key), which is how one file
# serves three platforms.
zip_keys:
  - [c_compiler, cxx_compiler]
  - [c_compiler_version, cxx_compiler_version]
  - [c_stdlib, c_stdlib_version]

# ---- activation packages: keys lifted from the forked feedstocks -----------
# pixi does NOT read a vendored feedstock's own recipe/conda_build_config.yaml
# (measured 2026-09-05: the ctng render died on an undefined
# cross_target_platform). Only this file reaches a build, so every key a
# vendored recipe consumes must arrive here — or stop being a variant key.
#
# THE SPLIT, and why most of upstream's keys are absent: a key belongs here if
# its value is a CHOICE. A key whose value is FIXED by building one platform
# NATIVELY is a constant, and is declared in the ported recipe's own `context:`
# block instead. Jinja resolves a name from `context:` and from the variant
# table identically, so a constant costs nothing at the usage sites — and it
# stops upstream's eight-target cross matrix from existing at all.
#   * Declared as recipe constants, not lifted: cross_target_platform, triplet,
#     CHOST, macos_machine, meson_cpu_family, uname_kernel_release,
#     uname_machine.
#   * Dropped with the outputs that used them: gcc_version, binutils_version,
#     libgfortran_soname. We ship the clang activation pair only — no
#     gcc/g++/gfortran activation and no gcc_bootstrap.
#   * Collapsed onto keys already defined above: cross_stdlib and
#     cross_stdlib_version ARE c_stdlib and c_stdlib_version for a native
#     build. That is also what enforces the ratified "2.28, never upstream's
#     2.17" — structurally, rather than as two numbers someone has to keep
#     equal by hand.
#   * clang_version (ctng), CLANG_VERSION (win) and the osx `version` key all
#     name the clang being activated, which for us is the toolchain we ship:
#     llvm_version / llvm_major above.
#
# WHAT THE FOUR PORTS ACTUALLY CONSUME, measured from
# `rattler-build --render-only` rather than read off the recipes:
#   ctng (linux-64)      c_stdlib, c_stdlib_version, llvm_version
#   win  (win-64)        VCVER, VSYEAR, RUNTIME_VERSION, CL_VERSION,
#                        llvm_major, llvm_version
#   osx  (osx-arm64)     c_stdlib, c_stdlib_version, llvm_major, llvm_version
#   llvm-spirv (all)     c_stdlib, c_stdlib_version, cxx_compiler,
#                        cxx_compiler_version, llvm_major, llvm_version, zlib
# Every one of those is already defined above, so the ports added nothing —
# upstream's remaining keys all became recipe constants or died with the
# outputs that used them. The vs2026 block below is the ONLY platform-scoped
# variant left, which is why it is also the only place needing the
# `${{ KEY if win else "<dummy>" }}` form: a recipe's `context:` is evaluated
# before its `skip:`, so a key with no value on the rendering platform kills
# the render even when every output there is skipped.

# THE VISUAL STUDIO AXIS — nine keys zipped upstream, collapsed to the win-64
# row of vs2026. LOOKED UP in conda-forge/vc-feedstock's
# conda_build_config.yaml, not derived: upstream clang-win-activation's own cbc
# knows only VS2022 (VCVER 14.3) and VS2019 (14.2), while c_compiler above pins
# vs2026. vc-feedstock spells these lowercase and clang-win-activation consumes
# them UPPERCASE — verified against the recipe — so they are lifted under the
# names our recipe reads. Row two of that zip is the same vs2026 for win-arm64,
# a platform we do not build, so taking the win-64 row IS the collapse; and a
# single-valued key needs no zip_keys entry.
VCVER:
  - if: win
    then: "14.5"
VSYEAR:
  - if: win
    then: "2026"
RUNTIME_VERSION:
  - if: win
    then: "14.51.36247"
CL_VERSION:
  - if: win
    then: "19.51.36247"
# FINAL_CFLAGS, FINAL_CXXFLAGS and FINAL_CL_FLAGS are deliberately ABSENT.
# They are the flag set every consumer of this toolchain compiles with, so they
# look like a choice — but upstream needs a variant only because its two rows
# are win-64 and win-arm64, which differ by -march/-mtune. With one natively
# built Windows platform the value is fixed, so they are constants in the win
# recipe's own context: block, next to the CPPFLAGS_USED strings in the
# activation templates they are spliced into.

# ---- CUDA ------------------------------------------------------------------
# conda-forge's pinning keys (cuda_compiler_version and _min are theirs; _max
# is ours). The core recipe hard-pins the BUILD with
# `cuda-version ==${{ cuda_compiler_version }}` and states the CUDA runtime
# metapackage's run range as `>=${{ _min }},<${{ _max }}` — one declaration to
# move the whole CUDA line.
#
# The CEILING is load-bearing: libcudart's SONAME is major-versioned
# (libcudart.so.12 vs .so.13, measured from the packages), the backend records
# it in DT_NEEDED, and dlopen resolves filenames, not versions — a CUDA-13
# runtime silently removes the GPU. The DRIVER needs no ceiling: cuda-version
# constrains `__cuda >=12`, a floor, and newer drivers run older CUDA.
#
# QUOTED on purpose: unquoted 12.10 is the YAML float 12.1.
cuda_compiler_version:
  - if: not osx
    then: "12.9"
cuda_compiler_version_min:
  - if: not osx
    then: "12.9"
cuda_compiler_version_max:
  - if: not osx
    then: "13"

# ---- ABI-sensitive libraries ----------------------------------------------
# Pinned at soname granularity, conda-forge pinning-feedstock style. These
# must not contradict conda-forge's global pins (libxml2 2.15, zstd 1.5,
# zlib 1) — checked against the pinning feedstock, they do not.
zlib:
  - "1.3"
zstd:
  - "1.5"
libxml2-devel:
  - if: linux
    then: "2.15"
numactl:
  - if: linux
    then: "2.0"
# AdaptiveCpp's Windows build links Boost. Upstream builds it from source with
# the clang-win toolset; conda-forge ships it prebuilt, so we pin the release.
libboost-devel:
  - if: win
    then: "1.91"

# ---- backends --------------------------------------------------------------
# level-zero and opencl-headers both ship for win-64, so the Intel backends
# are not linux-only. The OpenCL packages are deliberately NOT pinned:
# opencl-headers is header-only and date-versioned (no ABI surface), and
# ocl-icd is a loader whose whole purpose is a stable ABI across versions.
level-zero-devel:
  - if: not osx
    then: "1.29"
khronos-opencl-icd-loader:
  - if: win
    then: "2024.10"

# ---- python ----------------------------------------------------------------
# ONE python for the whole build. The old recipe asked for `python >=3.9` in
# build and a bare `python` in host — two independent solves that may pick
# different interpreters, and lldb's python bindings are compiled against
# whichever one host resolved, so a mismatch ships a module that cannot import.
python:
  - "3.14"

# ---- clangdev's own variant axes (lifted from clangdev-feedstock's cbc) -----
# These three are consumed by nearly every clangdev-derived output, so they are
# not optional decoration: a key that is undefined where a recipe reads it is a
# TEMPLATE ERROR, not a skip.
#
# `with_cfg` is a REAL TWO-ROW AXIS and the only one in this file. Upstream
# ships two builds of the single name `clang`: the cfg build carries the conda
# config files that make clang prefix-aware (--sysroot, -I$PREFIX/include,
# -L$PREFIX/lib), the nocfg build is a vanilla clang for tooling and analysis.
# `clang-no-conda-cfg` is a 24 kB selector metapackage that exists ONLY at the
# false row (`skip: with_cfg`) and pins the nocfg build. Dropping the axis would
# silently delete a published package name.
with_cfg:
  - true
  - false

# "keep for use with root when it catches up" — clangdev's own cbc comment.
# One row; it is the leading component of every clangdev build string.
variant:
  - default

# "Starting from LLVM 14, the ABI of libclang doesn't necessarily match the
# major version anymore" — clangdev's cbc. This is the SOVERSION, not our LLVM
# major, and it is what names acpp-libclang13.
libclang_soversion:
  - "13"
