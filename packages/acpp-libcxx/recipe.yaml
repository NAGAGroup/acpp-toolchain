# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-libcxx — the LLVM C++ standard library. Lifted from the reference
# monolith's `libcxx` output (libcxx-feedstock).
#
# OSX ONLY, and that is Jack's ruling rather than an omission: on macOS libc++
# IS the native platform C++ library, and we build it. linux uses libstdcxx and
# win uses the MSVC runtime, so on those platforms this family does not exist.
# Upstream's own skip is `win or ppc64le or aarch64`; ours is the complement of
# the one platform we ship it on.
#
# SLICING FORM: GLOB LIST, upstream's own. Every glob is scoped by the
# `libc++` NAME rather than by a shared directory, so none of them can reach
# another project's output in our union stage — the same property that let
# acpp-clangdev keep upstream's globs unchanged.
#
# Cross-checked against conda-forge's libcxx-21.1.8 osx-arm64 artifact, which
# ships exactly five paths: lib/libc++.dylib, lib/libc++.1.dylib,
# lib/libc++.1.0.dylib, lib/libc++.a and lib/libc++experimental.a. NOTE THE
# SOVERSION IS libc++'s OWN, `1`, and has nothing to do with the LLVM version —
# which is why nothing below derives a library name from llvm_major.
#
# THE STATIC ARCHIVES ARE DELIBERATE, upstream's comment: "static libs for
# cross-compilation, due to lack of host-exports".

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-libcxx
  version: ${{ llvm_version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  # Upstream's build string carries a `debug_` prefix off its `hardening`
  # variant, and its run_exports carry `libcxx * debug*` so a hardened build
  # cannot be installed without an extra label. We build one row, release, so
  # the axis and both of the things that hang off it are gone rather than
  # collapsed to an always-empty string.
  skip: not osx
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: >-
        lib/libc++.dylib;
        lib/libc++.*.dylib;
        lib/libc++.a;
        lib/libc++experimental.*

requirements:
  build:
    # ⚠ NO `compiler('cxx')` HERE, AND THIS PACKAGE IS THE REASON THE RULE
    # DIFFERS FROM UPSTREAM'S. Upstream COMPILES libc++ and therefore needs the
    # C++ compiler; it then declares `ignore_run_exports: [compiler('cxx')]`
    # because that compiler's strong export is the very library this package
    # IS. We carve libc++ out of a stage that was built elsewhere, so the
    # compiler is a lift with nothing to compile.
    #
    # AND ignore_run_exports IS NOT ENOUGH ON ITS OWN: it filters RUN
    # dependencies, while a build dep's STRONG run_export also enters the HOST
    # environment. On osx that put conda-forge's libcxx 23.1.0 into this
    # package's host prefix, where its files ALREADY OCCUPY the five paths the
    # carve writes — so the carve copied 5 files over pre-existing ones and
    # rattler, which packages only what is NEW relative to the host snapshot,
    # produced an EMPTY package whose own content test then failed (osx run
    # 34148191467). The second consequence was worse and would have shipped: our
    # libc++ would have carried a run dep on conda-forge's, two libc++ in one
    # prefix.
    #
    # `stdlib('c')` and `compiler('c')` STAY — upstream keeps the C compiler's
    # exports deliberately ("we want to ignore libstdcxx, but not libgcc; the
    # latter also comes in through compiler('c')"), and those are the linux
    # runtime floors this package's shipped binaries genuinely need.
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    # Upstream takes libcxxabi in host and run on LINUX. WE SHIP NO libcxxabi
    # AT ALL: upstream skips that output on everything but linux, and its own
    # test asserts that lib/libc++abi.dylib is ABSENT on osx — shipping it
    # "breaks exception passing", in upstream's words. Our stage builds
    # libcxxabi as an LLVM runtime because libc++ needs it at build time; it is
    # not packaged.
  # NO ignore_run_exports BLOCK. Upstream's exists to suppress
  # `compiler('cxx')`'s exports — and we do not have that compiler in `build:`
  # at all (see the note there), so there is nothing left to ignore. Keeping the
  # block would name a package this recipe does not use, which reads as
  # protection while providing none.

tests:
  - package_contents:
      files:
        exists:
          # presence of shared & static libraries
          - lib/libc++.dylib
          - lib/libc++.a
          - lib/libc++experimental.a
        not_exists:
          # the headers are acpp-libcxx-headers'
          - include/c++/v1/iterator
          # libcxxabi is not shipped on osx, deliberately — see above
          - lib/libc++abi.dylib

about:
  homepage: https://libcxx.llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: licenses/llvm-LICENSE.TXT
  summary: LLVM C++ standard library
