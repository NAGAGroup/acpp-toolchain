              # DLL import libs acpp-rt/acpp-common live with the runtime)
              - Library/lib/AdaptiveCpp.lib
              - Library/lib/acpp-frontend.lib
              - Library/lib/acpp-clang-cbs.lib
        exclude:
          # The clang resource dir is claimed above as lib/clang/**, but its
          # lib/ and share/ subtrees are the compiler-rt runtimes and belong to
          # acpp-compiler-rt. Two outputs claiming one path is a clobber, and
          # the partition audit fails the build on it — so the split is stated
          # here rather than discovered in CI.
          - if: linux
            then:
              - lib/clang/${{ llvm_major }}/lib/**
              - lib/clang/${{ llvm_major }}/share/**
            else:
              - Library/lib/clang/${{ llvm_major }}/lib/**
              - Library/lib/clang/${{ llvm_major }}/share/**
    requirements:
      run:
        # Mutex omitted deliberately — it arrives as a run_export of the
        # staging host dep. See the note on the staging output.
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        - python >=3.9
        - if: linux
          then:
            - libgcc-devel_linux-64 >=13
            - libstdcxx-devel_linux-64 >=13
      run_exports:
        # THE headline export (phase-3 ruling [A]). Anything compiled with this
        # toolchain gets, with zero manifest text on the consumer's side:
        #   acpp-runtime >=25.10.0,<25.11.0a0   (the runtime it links against)
        #   acpp-llvm    >=20,<21.0a0           (the lane it was built for)
        # The second line is what stops a consumer binary built against the
        # llvm20 toolchain from being installed next to the llvm21 runtime.
        strong:
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
          # Spelled out, not pin_compatible(): the mutex exists only in the
          # staging solution and pin_compatible cannot resolve it from an
          # inheriting output. Both bounds still come from context vars.
          - acpp-llvm >=${{ llvm_major }},<${{ llvm_major_next }}.0a0
      run_constraints:
        # SAME-MAJOR WINDOWS, not blanket exclusions (phase-3 ruling [B]).
        # These names are unversioned on conda-forge, so a bare "<0.0a0" said
        # "this package may never be installed alongside us at ANY version" —
        # which needlessly forbids, say, clang 19 or clang 21 tooling that
        # cannot collide with our LLVM 20 files. The window forbids only the
        # major we actually ship. compiler-rt below was already the model.
        - clang <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - clangxx <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - llvm <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - llvm-tools <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - lld <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - llvmdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - clangdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        # Already major-scoped by name; blanket forbid IS the same-major window.
        - clang-${{ llvm_major }} <0.0a0
        - compiler-rt <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        # Cross-lane exclusion. NOT made redundant by the mutex: the mutex only
        # bites while the two lanes sit on different LLVM majors, and release
        # catches up to nightly's major on every LLVM bump. Stays verbatim.
        - acpp-nightly <0.0a0
      ignore_run_exports:
        # By SOURCE PACKAGE, not by exported name (phase-3 ruling [B]).
        #
        # A name list must be extended every time an upstream feedstock adds an
        # export, and it fails SILENTLY when it is not — which is how the
        # Windows OpenCL loader leaked into packages that never link it.
        # Naming the source package ignores whatever that package exports,
        # this release and the next.
        #
        # Written unconditionally, covering both platforms' package names:
        # ignoring exports from a package that is not in this platform's host
        # env is a verified no-op, so a per-platform conditional would add
        # fragility for nothing.
        #
        # All of these are build-time-only for us. The backends are dlopened at
        # runtime, and their real dependencies are declared by the
        # acpp-runtime-{cuda,level-zero,ocl} metapackages — which is what lets someone
        # install the CPU runtime without dragging in CUDA.
        from_package:
          - cuda-version
          - cuda-cudart-dev
          - cuda-nvvm-tools
          - cuda-nvcc-tools
          - cuda-driver-dev
          - cuda-crt-dev_linux-64
          - cuda-nvcc-impl
          - level-zero-devel
          - opencl-headers
          - ocl-icd
          - khronos-opencl-icd-loader
          - python
    tests:
      - package_contents:
          bin:
            # bin: expansion includes the bare name on win, so the
            # extensionless acpp python driver matches on both platforms
            - clang
            - acpp
            - acpp-info
            - llvm-ar
          files:
            exists:
              - if: linux
                then:
                  - include/AdaptiveCpp/sycl/sycl.hpp
                  - lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
                  - lib/clang/${{ llvm_major }}/include/omp.h
              - if: osx
                then:
                  # component mode is (APPLE OR WIN32): mac nests the SYCL
                  # headers one level deeper, exactly like win minus Library/
                  - include/AdaptiveCpp/AdaptiveCpp/sycl/sycl.hpp
                  - include/AdaptiveCpp/hipSYCL/sycl/sycl.hpp
                  - lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
                  - lib/clang/${{ llvm_major }}/include/omp.h
              - if: win
                then:
                  # win nests the SYCL headers one level deeper than linux
                  # (AdaptiveCpp/{AdaptiveCpp,hipSYCL}/sycl/sycl.hpp)
                  - Library/include/AdaptiveCpp/AdaptiveCpp/sycl/sycl.hpp
                  - Library/include/AdaptiveCpp/hipSYCL/sycl/sycl.hpp
                  - Library/lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
                  - Library/lib/clang/${{ llvm_major }}/include/omp.h
            not_exists:
              - if: linux
                then:
                  - bin/clang-tidy
                  - bin/lldb
                  - bin/llvm-config
                else:
                  - Library/bin/clang-tidy.exe
                  - Library/bin/lldb.exe
                  - Library/bin/llvm-config.exe

  # ── compiler-rt: the sanitizer/profile runtimes ─────────────────────────
  # NEW in phase 3. These components were built OFF, which quietly made the
  # toolchain a NON-drop-in replacement: `clang -fsanitize=address` would fail
  # to link against a runtime that was never built. Since standing in for a
  # conda-forge clang is the toolchain's whole promise, they now ship.
  #
  # SEPARATE OUTPUT rather than folded into acpp, matching conda-forge, which
  # ships compiler-rt as its own package: the runtimes are large and only
  # wanted by people who actually instrument builds.
  #
  # Run-dep target settled from conda-forge's own artifact rather than argued
  # (the ruling said to look it up): conda-forge's compiler-rt 20.1.8 depends
  # on `clang 20.1.8.*` — the COMPILER, not the runtime — so this hangs off
  # acpp. Deltas from their layout, for the record: they split into
  # compiler-rt + compiler-rt_linux-64 (a front package plus the platform
  # payload) because of their cross-compilation matrix, which we do not have,
  # so we ship one output; and they pin the exact clang version where we use
  # the lane range plus the mutex.
  - package:
      name: acpp-compiler-rt
      version: ${{ version }}
    # No source here: staging-inheriting outputs get the ENTIRE staging work
    # dir restored (shared/ and its licenses included); fetching ../shared
    # ourselves collides with that restore ("File already exists").
    inherit: llvm-acpp-stage
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      # macOS first cut ships compiler + runtime only; the sanitizer story is
      # its own pass (compiler-rt is not built there).
      skip:
        - osx
      files:
        include:
          # The clang resource directory splits cleanly: include/ holds the
          # compiler's own headers and belongs to acpp; lib/ and share/ hold
          # the compiler-rt archives, shared objects and sanitizer ignorelists
          # and belong here. acpp excludes exactly these two, so the partition
          # stays a partition (the zero-clobber audit enforces it).
          - if: linux
            then:
              - lib/clang/${{ llvm_major }}/lib/**
              - lib/clang/${{ llvm_major }}/share/**
            else:
              - Library/lib/clang/${{ llvm_major }}/lib/**
              - Library/lib/clang/${{ llvm_major }}/share/**
    requirements:
      run:
        - ${{ pin_subpackage('acpp', upper_bound='x.x') }}

      run_constraints:
        # conda-forge's compiler-rt of OUR major installs into the same
        # lib/clang/<major>/lib path, so it is a genuine file collision, not
        # just a version disagreement. A different major is fine.
        - compiler-rt <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        # BOTH platform payload packages. conda-forge splits compiler-rt into a
        # front package plus a per-platform one, and it publishes the Windows
        # half too (compiler-rt_win-64 20.1.8 exists — checked, not assumed),
        # so constraining only the linux name would have left the Windows
        # collision wide open on the one platform this output is newest on.
        - compiler-rt_linux-64 <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - compiler-rt_win-64 <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - acpp-compiler-rt-nightly <0.0a0
      ignore_run_exports:
        # By source package; see the note on acpp-runtime.
        from_package:
          - cuda-version
          - cuda-cudart-dev
          - cuda-nvvm-tools
          - cuda-nvcc-tools
          - cuda-driver-dev
          - cuda-crt-dev_linux-64
          - cuda-nvcc-impl
          - level-zero-devel
          - opencl-headers
          - ocl-icd
          - khronos-opencl-icd-loader
          - python
    tests:
      - package_contents:
          files:
            exists:
              - if: linux
                then:
                  # The archives every -fsanitize=address / -fprofile link
                  # needs. GLOBBED deliberately: the directory under lib/ is
                  # named after the build triple, which is a build-config
                  # detail, not a contract — spelling it exactly would make
                  # this test a tripwire for the wrong thing.
                  #
                  # Safe to glob because `exists:` FAILS on a glob that matches
                  # nothing ("No match for files glob") — verified, not
                  # assumed. That is precisely the property needed here: if the
                  # partition ever stops matching, this package ships hollow,
                  # and the build must stop rather than certify it.
                  - lib/clang/${{ llvm_major }}/lib/*/libclang_rt.asan*
                  - lib/clang/${{ llvm_major }}/lib/*/libclang_rt.profile*
                else:
                  - Library/lib/clang/${{ llvm_major }}/lib/*/clang_rt.asan*
            not_exists:
              # The resource HEADERS belong to acpp, not here.
              - if: linux
                then:
                  - lib/clang/${{ llvm_major }}/include/omp.h
                  - bin/clang
                else:
                  - Library/lib/clang/${{ llvm_major }}/include/omp.h
                  - Library/bin/clang.exe

