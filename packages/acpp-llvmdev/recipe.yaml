# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-llvmdev — "Contains everything". Lifted from the reference monolith's
# `llvmdev` output (llvmdev-feedstock).
#
# SLICING FORM: upstream's $PKG_NAME-branching install script, arm 5.
#
# Upstream says "install everything else" and lets its host deps (libllvm<major>,
# llvm-tools) subtract themselves, because a conda package is the file DIFF of
# its build. THAT SUBTRACTION IS ONLY SAFE IN A SINGLE-PROJECT PREFIX. Upstream
# configures ../llvm with no LLVM_ENABLE_PROJECTS, so its remainder is llvm and
# nothing else; `_acpp-stage` is one cmake install of llvm + clang +
# clang-tools-extra + lld + lldb + openmp + compiler-rt + AdaptiveCpp, so the
# remainder there also contains clangdev's headers and static libs, lld, lldb,
# compiler-rt and acpp — none of which this output's host deps cover.
#
# So the scope is derived from conda-forge's PUBLISHED llvmdev-21.1.8 artifact,
# not from upstream's "everything else", because our union stage removes the
# per-project scoping that phrase relied on. Re-read the contract with:
#   pixi run -e dev nu tools/upstream-paths.nu llvmdev 21.1.8 <platform>
# It is a small regular set (2470 / 2479 / 2483 paths on linux-64 / osx-arm64 /
# win-64): llvm-config, the llvm and llvm-c header trees, llvm's cmake package,
# the LLVM* static libs, the unversioned developer aliases for the shared libs,
# and libexec/llvm — plus share/opt-viewer on osx and win. The host deps are
# kept below regardless: they are still the correct dependency statement.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-llvmdev
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: ../_shared/install_llvm.nu
    env:
      ACPP_LLVM_MAJOR: ${{ llvm_major }}
      ACPP_LLVM_MAJ_MIN: ${{ llvm_maj_min }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    # These two are the SUBTRACTION. Upstream's own host deps, preserved.
    # UPSTREAM: pin_subpackage(..., exact=True) on each
    - acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - if: win
      then: acpp-libllvm-c${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - acpp-llvm-tools[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - zlib
    - zstd
    # UPSTREAM (conda-build meta.yaml): `libcxx {{ cxx_compiler_version }}` — a
    # BARE version, read as the range `21.*`. `==21` matches nothing.
    - if: osx
      then: libcxx >=${{ cxx_compiler_version }},<${{ (cxx_compiler_version | int) + 1 }}.0a0
  run:
    - acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - if: win
      then: acpp-libllvm-c${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - acpp-llvm-tools[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # "we need to do this manually because clang_bootstrap has no run-export"
    - if: osx
      then: libcxx >=${{ cxx_compiler_version }}
  run_constraints:
    - acpp-llvm        ==${{ llvm_version }}
    - acpp-llvm-tools  ==${{ llvm_version }}
    - acpp-clang       ==${{ llvm_version }}
    - acpp-clang-tools ==${{ llvm_version }}

tests:
  - package_contents:
      files:
        exists:
          - if: not win
            then:
              - include/llvm/Pass.h
              - lib/libLLVMCore.a
              - libexec/llvm/not
              - bin/llvm-config
          - if: win
            then:
              - ${{ library_prefix }}include/llvm/Pass.h
              - ${{ library_prefix }}libexec/llvm/not.exe

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: Development headers and libraries for LLVM
