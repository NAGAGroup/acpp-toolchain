# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-libcxx-devel — the metapackage a consumer names to compile against
# libc++: it pairs the library with its headers at matching versions. Lifted
# from the reference monolith's `libcxx-devel` output (libcxx-feedstock).
#
# OSX ONLY — see ../acpp-libcxx/recipe.yaml.
#
# SHIPS NOTHING. Upstream expresses that with a glob naming a path that does not
# exist — `include2/c++`, under its own comment "Add non-existent path as this
# is a meta package" — and conda-forge's published libcxx-devel-21.1.8 artifact
# indeed carries ZERO paths. We say it with `files: []` instead, as the other
# metapackages in this workspace do: a deliberately dangling glob is exactly
# what carve.nu treats as a defect, and borrowing the idiom would disarm that
# check everywhere else.
#
# It runs no slice script, so it does NOT take the stage as a host dependency —
# the same exception acpp-compiler-rt and acpp-clang-no-conda-cfg take.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-libcxx-devel
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  skip: not osx
  files: []

requirements:
  build: []
  host:
    # UPSTREAM: pin_subpackage("libcxx", exact=True) and
    # pin_subpackage("libcxx-headers", exact=True)
    - acpp-libcxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - acpp-libcxx-headers[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run:
    # UPSTREAM: pin_subpackage("libcxx", upper_bound=None) and
    # pin_subpackage("libcxx-headers", upper_bound="x.x.x"). Both become the
    # same-build bracket form, which is a TIGHTENING: our libc++ and its headers
    # come out of one stage build and there is no reason to let them float
    # apart.
    - acpp-libcxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - acpp-libcxx-headers[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # Upstream adds `tzdata` on LINUX only, with the note "re-enable this for
    # osx once chrono implementation is in shared library". osx is our only
    # platform here, so the linux branch has nothing to carry.
  run_constraints:
    # Upstream constrains `__osx <12` at `sys_abi == "pre-12"`. NOT LIFTED, and
    # this agrees with _acpp-stage: that variant row exists to ship a SECOND
    # libcxx for macOS older than 12, and the stage deliberately omits the patch
    # that row applies (0001-Fix-ABI-compatibility-with-system). One build, on
    # upstream's post-12 row, so the constraint has no row to belong to.
    []

tests:
  # pure metapackage -- should be empty!
  - package_contents:
      strict: true
      files: []

about:
  homepage: https://libcxx.llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: LLVM C++ standard library — development metapackage (library + headers)
