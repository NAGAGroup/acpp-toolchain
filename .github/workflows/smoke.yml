# Cirun provisioning smoke test: verifies the Azure runner path end-to-end
# (VM spin-up, runner registration, pixi bootstrap, recipe render) without
# paying for a full toolchain build.
name: smoke
on:
  workflow_dispatch:

jobs:
  provision-smoke:
    runs-on: "cirun-linux-builder--${{ github.run_id }}"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runner facts
        run: |
          echo "== cpu ==" && nproc && lscpu | head -20
          echo "== mem ==" && free -h
          echo "== disk ==" && df -h /
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - name: Render both lane recipes
        run: |
          pixi run render-release > /dev/null && echo "release renders OK"
          pixi run render-nightly > /dev/null && echo "nightly renders OK"
