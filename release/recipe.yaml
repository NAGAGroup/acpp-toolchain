              - etc/conda/deactivate.d/deactivate-acpp-clangxx_linux-64.sh
              - bin/x86_64-conda-linux-gnu-clang++
      - script:
          - |
            # The test env already sources our activate.d script, so assert a
            # true ROUND TRIP (value returns to whatever it was) rather than
            # assuming a pristine env where deactivate leaves it unset.
            export CONDA_PREFIX="${PREFIX}"
            before="${CXX:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate-acpp-clangxx_linux-64.sh"
            test -n "${CXX}" || (echo "CXX not set" && exit 1)
            echo "${CXX}" | grep -q "x86_64-conda-linux-gnu" || (echo "CXX not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate-acpp-clangxx_linux-64.sh"
            after="${CXX:-__UNSET__}"
