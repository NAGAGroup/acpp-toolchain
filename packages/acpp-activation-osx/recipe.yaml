schema_version: 1

# acpp-activation-osx — the osx-arm64 compiler activation pair,
# acpp-clang_osx-arm64 and acpp-clangxx_osx-arm64.
#
# LIFTED IN-TREE from our fork of conda-forge/clang-compiler-activation-feedstock
# and CONVERTED from conda-build meta.yaml to a rattler recipe.yaml
# (pixi-build-rattler-build consumes the latter). The fork point, our own head
# and what the lift kept are recorded in vendor/PROVENANCE.md; the submodule is
# retired, because this methodology has no submodules.
# Upstream builds a cross matrix over osx-64 and
# osx-arm64, from linux as well as natively, and ships four outputs plus a
# bootstrap bundle; we ship the clang pair for one natively-built platform,
# pointed at the clang WE ship (acpp).
#
# WHAT CHANGED, and why:
#   * Outputs: only clang and clangxx remain. clang_impl_ / clangxx_impl_ are
#     skipped natively upstream because clangdev creates the triplet-prefixed
#     driver symlinks — and we now SHIP a clangdev family, so
#     acpp-clang{,xx}_impl_osx-arm64 exist and own
#     bin/arm64-apple-darwin20.0.0-clang{,-cpp,++}. This recipe declares them as
#     run dependencies and creates nothing: the activation exports
#     CC=arm64-apple-darwin20.0.0-clang, so the name must exist, but two
#     packages shipping it would clobber at install time. clang_bootstrap_ is a
#     repackaging of the compiler for bootstrapping, which acpp already is.
#   * The cross axis is gone. cross_target_platform is a HARD LITERAL below,
#     not ${{ target_platform }}: a literal makes the linux and win jobs skip
#     this recipe, whereas target_platform would make them render it under
#     their own names. macos_machine, meson_cpu_family, uname_kernel_release
#     and uname_machine were zipped with it upstream and follow it into
#     `context:` as constants — which is also why NOTHING here reads an
#     osx-scoped variant key, and no `if osx else` dummy is needed.
#   * The clang version is llvm_version: the clang being activated is the clang
#     this toolchain ships. Upstream's separate `version` variant key is gone,
#     which also frees the name for the package version.
#   * The `clang` / `libcxx` / `compiler-rt` requirements collapse into `acpp`,
#     taken as a HOST dependency so its exact-build run_export computes the run
#     spec.
#   * build.sh is SOURCED by each install script rather than run as a
#     top-level build step: rattler-build has no build step shared across
#     outputs. It renders into ${SRC_DIR}/rendered and ends with a gate that
#     fails the build on any @TOKEN@ left unsubstituted, which is how
#     upstream's unrendered @OBJC_FOR_BUILD@ was found.

context:
  # ── the platform, as constants ────────────────────────────────────────────
  # A LITERAL, never ${{ target_platform }}. See the note above.
  cross_target_platform: osx-arm64
  # Upstream's `macos_machine`, and the value the activation uses for CHOST.
  macos_machine: arm64-apple-darwin20.0.0
  meson_cpu_family: aarch64
  uname_kernel_release: 20.0.0
  uname_machine: arm64

  # ── the toolchain being activated ─────────────────────────────────────────
  # Self-referencing, so variants.yaml stays the single source of truth and the
  # key enters this build's variant hash.
  llvm_version: ${{ llvm_version }}
  llvm_major: ${{ llvm_major }}
  llvm_major_next: ${{ (llvm_major | int) + 1 }}
  # Upstream keeps libcxx's major uncoupled from the compiler's "in case this
  # happens again"; it has not, and one number is easier to move than two.
  libcxx_major: ${{ llvm_major }}
  # THE ACTIVATION VERSION IS MAJOR.MINOR, not the full patch and not a date —
  # measured in conda-forge's own tree, where clang_<plat> carries 21.1 while
  # the content packages carry 21.1.8. An activation package is a contract about
  # which compiler SERIES it configures; a patch bump does not change it.
  version: ${{ (llvm_version | split(".") | first) ~ "." ~ (llvm_version | split("."))[1] }}
  # AdaptiveCpp's own version, which is a DATE — a different axis from the LLVM
  # one above. `acpp` is ours and date-versioned, so the host dependency below
  # cannot be written in terms of `version`.
  # ⚠ CI MUST SET ACPP_NIGHTLY_DATE. The default is a LOCAL-RENDER placeholder,
  # not a shippable version: 0.dev0 sorts below every real date, so a set built
  # without it would publish as a prerelease nobody resolves. E2E-4 fails the
  # workflow if an unset date reaches a publish; this default exists so a dry
  # run on a laptop does not need the variable.
  acpp_version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  # Read from the env ONCE, into context: `build_number` is undefined inside
  # requirements, and the outputs below need the same value build.number uses.
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}

  # The minor above c_stdlib_version, so the deployment-target dependency below
  # can be bounded to exactly the macOS we chose.
  # GUARDED, because a recipe's `context:` is evaluated BEFORE its `skip:`.
  # Every output here is skipped off this platform, but the expression below
  # still runs on a Windows job walking the workspace — and variants.yaml
  # deliberately defines NO win `c_stdlib_version` (there is no C standard
  # library package to version on Windows). A conditional evaluates only the
  # branch it takes, so the dummy keeps the render alive while the real value
  # is still required where it matters. Same idiom as the win recipe's
  # `${{ VCVER if win else "0.0" }}`.
  c_stdlib_version_here: ${{ c_stdlib_version if not win else "0.0" }}
  c_stdlib_version_next: ${{ (c_stdlib_version_here | split(".") | first) ~ "." ~ ((c_stdlib_version_here | split(".") | last | int) + 1) }}

  # Output names, spelled once so the recipe, the installed script filenames
  # and the tests cannot disagree.
  pkg_clang: acpp-clang_${{ cross_target_platform }}
  pkg_clangxx: acpp-clangxx_${{ cross_target_platform }}

recipe:
  name: acpp-activation-osx
  version: ${{ version }}

source:
  # The activation templates, build.sh and the install scripts — this directory.
  - path: .

build:
  number: ${{ build_num }}

outputs:
  - package:
      name: ${{ pkg_clang }}
      version: ${{ version }}
    build:
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
      skip:
        - target_platform != "osx-arm64"
      script:
        file: install-clang.sh
        env:
          # These are recipe constants, so they do not reach the build
          # environment on their own.
          cross_target_platform: ${{ cross_target_platform }}
          CHOST: ${{ macos_machine }}
          LLVM_MAJOR: ${{ llvm_major }}
          UNAME_MACHINE: ${{ uname_machine }}
          UNAME_KERNEL_RELEASE: ${{ uname_kernel_release }}
          MESON_CPU_FAMILY: ${{ meson_cpu_family }}
          PKG_NAME: ${{ pkg_clang }}
    requirements:
      build:
        - sed
      host:
        # The compiler being activated. HOST, not run: acpp's weak run_export
        # states its own exact build (version, LLVM tag, build number), so the
        # run dependency on it is COMPUTED rather than transcribed, and acpp's
        # strong export adds the matching acpp-runtime.
        - acpp ==${{ acpp_version }}
      run:
        # UPSTREAM: `clang_impl_${{ cross_target_platform }} ${{ version }}.*`
        #
        # THE DRIVER THE ACTIVATION NAMES. activate-clang.sh exports
        # CC=${CHOST}-clang and CPP=${CHOST}-clang-cpp;
        # bin/${{ macos_machine }}-clang{,-cpp} is
        # acpp-clang_impl_osx-arm64's entire content. Without this dependency
        # the package ships an activation whose CC names a binary nothing
        # provides, and the failure surfaces inside someone else's build.
        #
        # NOT the exact-build form the rest of the workspace uses: upstream's
        # own note on this pair is "cannot use exact pins on osx due to
        # separation of compiler activation" (clangdev issue 437) — the impl
        # package is built by a different recipe on a different schedule, so
        # this pins version + LLVM tag and stops there.
        - acpp-clang_impl_${{ cross_target_platform }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
        # PINNED TO THE FLOOR, not floored. macosx_deployment_target_osx-arm64
        # is versioned BY the deployment target it sets (11.0 … 26.0) and each
        # build exports __osx >=<its own version>, so a `>=` spec would resolve
        # to the newest and quietly raise the minimum macOS of everything built
        # with this toolchain.
        - ${{ c_stdlib }}_${{ cross_target_platform }} >=${{ c_stdlib_version_here }},<${{ c_stdlib_version_next }}.0a0
        # The activation sets CMAKE_AR, CMAKE_RANLIB, CMAKE_LINKER,
        # CMAKE_STRIP, CMAKE_INSTALL_NAME_TOOL and CMAKE_LIBTOOL to
        # ${CHOST}-<tool>. Those are cctools programs, not clang ones.
        - cctools_${{ cross_target_platform }}
        # -DCMAKE_OSX_SYSROOT=${SDKROOT} is only written when SDKROOT is set,
        # and this is the package that sets it.
        - sdkroot_env_${{ cross_target_platform }}
      run_exports:
        strong:
          # THE RUNTIME EXPORT, RESTATED HERE ON PURPOSE. Anything compiled with
          # this toolchain links AdaptiveCpp's runtime, and upstream's own
          # comment on the equivalent libcxx line says why it cannot be
          # inherited: transitive run_exports do not work, so an export reaches
          # DIRECT dependents only and the toolchain package must carry it
          # itself even though `acpp` (a host dependency above) exports it too.
          # A FLOOR, not a pin, exactly as upstream writes libcxx: this spec
          # lands in third-party packages, and pinning their runtime to one
          # build of ours would make them unsolvable against every later build.
          - acpp-runtime >=${{ acpp_version }}
          # The floor anything built with this toolchain must claim, driven by
          # the same variant key as the deployment-target dependency above.
          # Restated rather than inherited: that package exports it too, but as
          # a RUN dependency here, and run_exports propagate from HOST only.
          - __osx >=${{ c_stdlib_version_here }}
        # NO WEAK EXPORTS, deliberately. A weak run_export fires for HOST
        # dependents, and nothing host-depends on an activation package — it is
        # build-time tooling. Upstream's activation outputs declare strong
        # exports only, for the same reason.
      run_constraints:
        # DELIBERATELY BLANKET, not a same-major window. An activation package
        # owns CC/CXX/AR/... in the environment's activate.d, and two packages
        # claiming that role fight regardless of which LLVM they point at.
        - clang_${{ cross_target_platform }} <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/activate_${{ pkg_clang }}.sh
              - etc/conda/deactivate.d/deactivate_${{ pkg_clang }}.sh
            not_exists:
              # acpp-clang_impl_osx-arm64 owns these. Asserted ABSENT rather
              # than left unmentioned: two packages shipping one path is an
              # install-time clobber that no render can see, and this is the
              # cheap check that the fold stays reverted.
              - bin/${{ macos_machine }}-clang
              - bin/${{ macos_machine }}-clang-cpp
      - script:
          - ${CC} --version
          - ${CPP} --version
          - ${CC_FOR_BUILD} --version
          # SDKROOT is what lets clang find the macOS headers, and its value
          # comes from the sdkroot_env package depended on above.
          - test -n "${SDKROOT}" || (echo "SDKROOT is not set" && exit 1)
          - test -d "${SDKROOT}" || exit 1
      - script:
          - |
            # The test environment has already sourced our activate.d script,
            # so assert a true ROUND TRIP — the value returns to whatever it
            # was — rather than assuming a pristine environment in which
            # deactivation leaves it unset.
            export CONDA_PREFIX="${PREFIX}"
            before="${CC:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate_${{ pkg_clang }}.sh"
            test -n "${CC}" || (echo "CC not set" && exit 1)
            echo "${CC}" | grep -q "${{ macos_machine }}" || (echo "CC not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate_${{ pkg_clang }}.sh"
            after="${CC:-__UNSET__}"
            test "${before}" = "${after}" || (echo "CC not restored: ${before} != ${after}" && exit 1)
            echo "activation round-trip OK"
    about:
      summary: Clang compiler activation for the acpp toolchain (C, osx-arm64)
      license: BSD-3-Clause
      license_file: LICENSE.txt
      homepage: https://github.com/NAGAGroup/clang-compiler-activation-feedstock

  - package:
      name: ${{ pkg_clangxx }}
      version: ${{ version }}
    build:
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
      skip:
        - target_platform != "osx-arm64"
      script:
        file: install-clangxx.sh
        env:
          cross_target_platform: ${{ cross_target_platform }}
          CHOST: ${{ macos_machine }}
          LLVM_MAJOR: ${{ llvm_major }}
          UNAME_MACHINE: ${{ uname_machine }}
          UNAME_KERNEL_RELEASE: ${{ uname_kernel_release }}
          MESON_CPU_FAMILY: ${{ meson_cpu_family }}
          PKG_NAME: ${{ pkg_clangxx }}
    requirements:
      build:
        - sed
      host:
        - acpp ==${{ acpp_version }}
      run:
        # The C++ activation script sets only the CXX half; it relies on the C
        # script having run first for CPPFLAGS, CMAKE_ARGS and the sysroot.
        # Both live in the same recipe, so this is a real exact pin.
        - ${{ pin_subpackage(pkg_clang, exact=True) }}
        # UPSTREAM: `clangxx_impl_${{ cross_target_platform }} ${{ version }}.*`
        #
        # activate-clang++.sh exports CXX=${CHOST}-clang++ and points ACPP_CLANG
        # and ACPP_CPU_CXX at the same path; bin/${{ macos_machine }}-clang++ is
        # acpp-clangxx_impl_osx-arm64's entire content. See the C output for why
        # this package no longer creates it, and for why the pin is not the
        # exact-build form.
        - acpp-clangxx_impl_${{ cross_target_platform }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
        # -stdlib=libc++ is in CXXFLAGS, so the headers must be present.
        #
        # OURS, NOT CONDA-FORGE'S: we build libc++ on osx, so naming the
        # conda-forge package would put a SECOND C++ runtime in the prefix
        # beside the one this toolchain links — and under strict channel
        # priority the dep would resolve to theirs while ours sat unused.
        # Upstream's minor pin becomes the exact same-build form because our
        # libc++ and this toolchain come out of ONE stage build.
        - acpp-libcxx-devel[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
      run_exports:
        strong:
          # Repeated here, not inherited from the C package above — see its
          # comment; transitive run_exports do not work.
          - acpp-runtime >=${{ acpp_version }}
          - __osx >=${{ c_stdlib_version_here }}
          # Upstream's note: transitive run_exports do not propagate, so the
          # libc++ floor has to be stated here rather than inherited from the
          # dev dependency above. OURS, for the reason given there.
          - acpp-libcxx >=${{ libcxx_major }}
      run_constraints:
        - clangxx_${{ cross_target_platform }} <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/activate_${{ pkg_clangxx }}.sh
              - etc/conda/deactivate.d/deactivate_${{ pkg_clangxx }}.sh
            not_exists:
              # acpp-clangxx_impl_osx-arm64 owns this one — see the C output.
              - bin/${{ macos_machine }}-clang++
      - script:
          - ${CXX} --version
          - ${CXX_FOR_BUILD} --version
          # The ACPP delta: the SYCL environment this activation adds on top of
          # the upstream contract. ACPP_TARGETS respects a pre-set value.
          - 'test -n "${ACPP_TARGETS}" || (echo "ACPP_TARGETS not set" && exit 1)'
          - 'test -x "${ACPP_CPU_CXX}" || (echo "ACPP_CPU_CXX not executable" && exit 1)'
      - script:
          - |
            export CONDA_PREFIX="${PREFIX}"
            before="${CXX:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate_${{ pkg_clangxx }}.sh"
            test -n "${CXX}" || (echo "CXX not set" && exit 1)
            echo "${CXX}" | grep -q "${{ macos_machine }}" || (echo "CXX not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate_${{ pkg_clangxx }}.sh"
            after="${CXX:-__UNSET__}"
            test "${before}" = "${after}" || (echo "CXX not restored: ${before} != ${after}" && exit 1)
            echo "activation round-trip OK"
    about:
      summary: Clang compiler activation for the acpp toolchain (C++ and SYCL, osx-arm64)
      license: BSD-3-Clause
      license_file: LICENSE.txt
      homepage: https://github.com/NAGAGroup/clang-compiler-activation-feedstock

about:
  homepage: https://github.com/NAGAGroup/clang-compiler-activation-feedstock
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Compiler activation scripts for the acpp clang toolchain on osx-arm64

extra:
  feedstock-name: clang-compiler-activation
  recipe-maintainers:
    - isuruf
    - katietz
    - h-vetinari
