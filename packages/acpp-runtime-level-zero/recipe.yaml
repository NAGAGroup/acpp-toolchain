# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-runtime-level-zero — the Level Zero backend's dependency set (Intel
# GPUs). Ships no toolchain files.
#
# Level Zero and OpenCL are SEPARATE backends with separate dependencies. They
# were once a single acpp-runtime-intel package, which forced every OpenCL user
# to install Intel's L0 loader.

context:
  llvm_version: "21.1.8"
  # ⚠ CI MUST SET ACPP_NIGHTLY_DATE. The default is a LOCAL-RENDER placeholder,
  # not a shippable version: 0.dev0 sorts below every real date, so a set built
  # without it would publish as a prerelease nobody resolves. E2E-4 fails the
  # workflow if an unset date reaches a publish; this default exists so a dry
  # run on a laptop does not need the variable.
  version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  # Read from the env ONCE, into context: `build_number` is undefined inside
  # `requirements:`, so any spec that must agree with build.number has to read
  # this variable instead. One read, one value, everywhere in the recipe.
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}

package:
  name: acpp-runtime-level-zero
  version: ${{ version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  # x86 platforms only: the mac lane is OMP-only. level-zero ships for win-64
  # as well as linux-64, so this backend is not linux-only.
  skip:
    - osx

requirements:
  # A REAL host dependency, so the run floor below tracks what the runtime was
  # actually built against. level-zero arrives via level-zero-devel. The GPU
  # driver itself is the system's — no channel ships it.
  host:
    - acpp-runtime ==${{ version }}
    - level-zero-devel
  run:
    # NOT written here: acpp-runtime is a HOST dep (below), and its weak
    # run_export supplies the exact version+LLVM-tag spec automatically.
    - ${{ pin_compatible('level-zero') }}
    # The SPIR-V translator, which the spirv JIT plugin invokes as a
    # subprocess. It rides the backend metapackages rather than acpp-runtime
    # because only the SPIR-V-consuming backends need it — a CUDA-only install
    # JITs to PTX and never execs it.
    # VERSIONED ON LLVM, NOT ON THE DATE. The translator is lifted content
    # belonging to an LLVM release, not to AdaptiveCpp, so it carries
    # llvm_version while this metapackage carries the nightly date.
    - acpp-llvm-spirv ==${{ llvm_version }}

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: BSD-3-Clause
  license_file:
    - licenses/AdaptiveCpp-LICENSE
  summary: acpp SYCL runtime with Level Zero backend dependencies (Intel GPUs)
