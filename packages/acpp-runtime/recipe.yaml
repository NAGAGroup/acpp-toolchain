# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-runtime — the SYCL runtime: the shared libraries, the JIT backend
# plugins and SSCP bitcode, the runtime JSON configs, and the LLVM tools the
# SSCP JIT actually executes at run time.
#
# THIS IS THE PATTERN every carving subpackage follows:
#   * single output, no `staging:`, no `experimental`
#   * acpp-stage declared in pixi.toml [package.build-dependencies] and named
#     here under requirements.host by `name ==version` — the workspace
#     passthrough, which is the sanctioned way a source sibling reaches a
#     recipe (the manifest tables add no dependencies; they supply the path
#     mapping the recipe cannot know)
#   * ../_shared/carve.nu copies THIS package's portion from <root>/_stage to
#     the top level; those copies are the package's file diff
#   * run dependencies are declared HERE, by the package that needs them
#
# NO `files:` BLOCK, DELIBERATELY. The carve list below is the only list: the
# copies it makes are the only new files, so capture-everything-new is exactly
# the carve. A separate `files:` glob would be a second source of truth whose
# two drift modes are both silent — a package with a hole, or a package with
# nothing in it.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  # Read from the env ONCE, into context, because `build_number` — like
  # `hash` — is undefined inside requirements: both are derived during the
  # build-string computation, which happens after requirements are resolved.
  # The run_export below needs the same value build.number uses, so both read
  # this one variable.
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
  # Computed ONCE, so paths are written once rather than branched. `else` is a
  # two-platform construct: on a third platform it silently hands out another
  # platform's answer.
  library_prefix: ${{ "Library/" if win else "" }}

  # ── THE CARVE ────────────────────────────────────────────────────────────
  # Final package paths, semicolon-separated. Each platform names its own set
  # explicitly; there is no fall-through branch.
  #
  # linux/osx: the SSCP JIT external tools (ptx JIT execs opt+llc; the CPU JIT
  # execs opt+llc+lld — verified in llvm-to-backend/{ptx,host}/*.cpp), the
  # versioned shared libraries, the JIT backend plugins + SSCP bitcode +
  # pinned llvm-spirv under lib/hipSYCL, the runtime JSON configs, and on
  # linux the OMP debugger extension.
  carve_linux: >-
    bin/opt;bin/llc;bin/lld;bin/ld.lld;lib/*.so*;lib/hipSYCL/**;etc/AdaptiveCpp/**;share/gdb/**
  carve_osx: >-
    bin/opt;bin/llc;bin/lld;bin/ld64.lld;lib/*.dylib*;lib/hipSYCL/**;etc/AdaptiveCpp/**
  # win: no LLVM dylib (tools link static), so the shipped DLLs are the
  # C-API/LTO/Remarks surface, libclang and acpp's own runtime; import .lib
  # files travel with their DLL. The host JIT drives the native COFF linker,
  # so lld-link and the lld driver live here, while the cross flavours
  # (ld.lld/ld64.lld/wasm-ld) belong to acpp. DLLs are RUNTIME artifacts on
  # win, so the hipSYCL plugins appear under both bin and lib.
  carve_win: >-
    Library/bin/opt.exe;Library/bin/llc.exe;Library/bin/lld.exe;Library/bin/lld-link.exe;Library/bin/LLVM-C.dll;Library/bin/LTO.dll;Library/bin/Remarks.dll;Library/bin/libclang.dll;Library/bin/acpp-rt.dll;Library/bin/acpp-common.dll;Library/lib/LLVM-C.lib;Library/lib/LTO.lib;Library/lib/Remarks.lib;Library/lib/libclang.lib;Library/lib/acpp-rt.lib;Library/lib/acpp-common.lib;Library/bin/hipSYCL/**;Library/lib/hipSYCL/**
  # Every platform names itself. The final branch is deliberately EMPTY, not
  # carve_osx: an unknown platform must fail loudly (carve.nu errors on an
  # empty list) rather than silently receive the macOS carve.
  carve: ${{ carve_linux if linux else (carve_win if win else (carve_osx if osx else "")) }}

package:
  name: acpp-runtime
  version: ${{ version }}

source:
  # Only the activation assets — NOT the toolchain sources. The stage carries
  # those, and it arrives as a host dependency rather than as a source tree,
  # which is what keeps a carving build cheap.
  - path: ../_shared/activation
    target_directory: activation
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: ${{ carve }}
      PKG_NAME: acpp-runtime

requirements:
  build:
    - nushell
  host:
    # The stage, by exact version. Declared as a source sibling in pixi.toml;
    # named here as if it came from a channel. This is the passthrough that
    # works — and note the stage is a HOST dep, which is precisely why
    # `pixi publish --path` can publish this package while the stage itself
    # stays unpublished.
    - acpp-stage ==${{ version }}
  run:
    # Declared HERE, by the package that needs them. The stage exports
    # nothing, so nothing arrives by accident — the structural end of the
    # run_exports leak that once put cuda-cudart, level-zero, ocl-icd and
    # python_abi onto a ROCm metapackage.
    - if: linux
      then:
        - libxml2
        - numactl
    - zlib
    - zstd
  # THE REPLACEMENT FOR pin_subpackage(exact=True).
  #
  # Under one multi-output recipe, pin_subpackage guaranteed that a backend
  # package depended on exactly the acpp-runtime built beside it. Across
  # separate recipes that function does not exist — it names another OUTPUT of
  # the same recipe — and a bare `==version` is NOT equivalent: two builds of
  # the same version with different variants (a different LLVM, a different
  # build number) both satisfy it, which is a silently mismatched install in a
  # user's environment rather than a build failure in ours.
  #
  # A package can, however, state its own identity. This weak run_export pins
  # name, version AND build string, and it is applied to every package that
  # takes acpp-runtime as a HOST dependency — so each backend package receives
  # the exact build it was assembled against, computed rather than transcribed.
  # The build string here is the same expression as build.string above; if one
  # changes the other must, which is why they sit next to each other.
  run_exports:
    weak:
      # Three-field match spec — `name version build` — pinning VERSION, the
      # LLVM tag AND the build number. The three things a set of packages
      # built together share: version and build number both come from the same
      # env vars (ACPP_NIGHTLY_DATE, ACPP_BUILD_NUMBER) and the tag from the
      # same context. Only the h<hash> segment is left free, and it must be:
      # the variant hash is per-recipe, so a consumer cannot compute the
      # producer''s.
      #
      # The syntax is not interchangeable. `name ==ver=build` with a wildcard
      # is rejected ("the build string can only contain alphanumeric
      # characters and underscores"), `name ==ver *[build=...]` gives "found
      # multiple values for: build", and ${{ hash }} is undefined inside
      # requirements because the hash is computed FROM the resolved
      # requirements.
      #
      # Verified in both directions against real artifacts, not renders: a
      # consumer resolves the exact build
      # (pa 1.2.3 llvm21_1_8_hb0f4dca_0), and against a channel offering only
      # a different-LLVM build the solve FAILS with "pa ==1.2.3 llvm21_1_8_*_0,
      # for which no candidates were found".
      - acpp-runtime ==${{ version }} ${{ llvm_build_tag }}_*_${{ build_num }}

tests:
  # NOT `strict: true`. Measured: strict means every file in the package must
  # match a listed glob, so a short assertion list fails a package shipping
  # hundreds of files ("Strict mode: 2 unmatched files found" on a 3-file
  # probe). Without strict the list still fails loudly on a path that is
  # missing, which is the assertion wanted here.
  - package_contents:
      files:
        exists:
          - ${{ library_prefix }}bin/opt${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/llc${{ ".exe" if win else "" }}
          - if: linux
            then:
              - lib/libacpp-rt.so
              - etc/AdaptiveCpp/acpp-core.json
          - if: osx
            then:
              - lib/libacpp-rt.dylib
              - etc/AdaptiveCpp/acpp-core.json
          - if: win
            then:
              - Library/bin/acpp-rt.dll

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: BSD-2-Clause AND Apache-2.0 WITH LLVM-exception
  # Vendored texts: a carving package has no source tree to point at, and
  # license_file resolves against SRC_DIR/RECIPE_DIR, never the prefix. The
  # stage asserts these copies are byte-identical to the extracted sources at
  # every build, so they cannot drift unnoticed.
  license_file:
    - licenses/AdaptiveCpp-LICENSE
    - licenses/llvm-LICENSE.TXT
  summary: AdaptiveCpp SYCL runtime and SSCP JIT backends
