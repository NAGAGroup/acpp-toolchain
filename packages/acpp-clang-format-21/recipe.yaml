# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-clang-format-21 — the version-suffixed clang-format. Lifted from the
# reference monolith's `clang-format-${{ major_version }}` output
# (clangdev-feedstock).
#
# SLICING FORM: GLOB LIST, upstream's own — one named binary. Cross-checked
# against conda-forge's clang-format-21-21.1.8 artifact: `bin/clang-format-21`
# on linux-64 and osx-arm64, and NO win-64 artifact exists — the same fact as
# the `skip: win` below, arrived at independently.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-clang-format-${{ llvm_major }}
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_h${{ hash }}_${{ build_num }}
  skip: win
  variant:
    down_prioritize_variant: ${{ 0 if variant == "default" else 1 }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: bin/clang-format-${{ llvm_major }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    # UPSTREAM: pin_subpackage("libclang-cpp" ~ maj_min, upper_bound="x.x")
    - acpp-libclang-cpp${{ llvm_maj_min }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # "Use the same requirements as the top-level requirements, but only the
    # ones required for run_exports"
    - acpp-llvm ==${{ llvm_version }}
  run:
    # UPSTREAM: pin_subpackage("libclang-cpp" ~ maj_min, upper_bound="x.x")
    - acpp-libclang-cpp${{ llvm_maj_min }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # "we need to do this manually because clang_bootstrap has no run-export"
    - if: osx
      then: libcxx >=${{ llvm_version }}

tests:
  - package_contents:
      files:
        exists:
          - bin/clang-format-${{ llvm_major }}
        not_exists:
          # the unversioned binary is acpp-clang-format's, c-index-test is
          # acpp-clang-tools'
          - bin/clang-format
          - bin/c-index-test

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: clang-format, version-suffixed
