# acpp-suite-generic: AdaptiveCpp's OWN test suite (tests/, copied in by
# `suite.nu package`) built as a pixi-build-cmake package with
# ACPP_TARGETS=generic (SSCP), the way a downstream project compiles against
# the toolchain (compiler stems, run_exports, the exact naga-acpp-llvm lane
# pin). It installs acpp-suite-generic-{sycl_tests,rt_tests,pcuda_tests} into
# bin/, plus pstl_tests on Linux.
#
# In CI ../pin-published.nu rewrites this manifest: one platform, and every
# @ACPP_VERSION@ becomes the version just published.
[workspace]
name = "acpp-suite-generic"
channels = ["https://prefix.dev/jackm97/naga-labs-staging"]
# ONE line: CI rewrites it
platforms = ["linux-64"]
preview = ["pixi-build"]

# Compiler stems resolve to <stem>_<platform> activation packages; their
# run-exports bring the toolchain. The backend supplies cmake/ninja.
[workspace.build-variants]
c_compiler = ["naga-acpp-clang"]
cxx_compiler = ["naga-acpp-clangxx"]
c_compiler_version = ["@ACPP_VERSION@"]
cxx_compiler_version = ["@ACPP_VERSION@"]

[package]
name = "acpp-suite-generic"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-cmake"
version = "*"
channels = ["https://prefix.dev/pixi-build-backends"]

[package.build.config]
extra-args = ["-DACPP_SUITE_TARGETS=generic", "-DWITH_PCUDA_TESTS=ON"]
# tests/ is copied in by `suite.nu package`; editing it must invalidate pixi's build cache.
extra-input-globs = ["tests/**/*"]

# pstl_tests need --acpp-stdpar and TBB, which are Linux-only here. Target
# tables REPLACE the base list, so the base args are repeated.
[package.build.target.linux-64.config]
extra-args = ["-DACPP_SUITE_TARGETS=generic", "-DWITH_PCUDA_TESTS=ON", "-DWITH_PSTL_TESTS=ON"]

[package.build.target.linux-aarch64.config]
extra-args = ["-DACPP_SUITE_TARGETS=generic", "-DWITH_PCUDA_TESTS=ON", "-DWITH_PSTL_TESTS=ON"]

[package.host-dependencies]
# find_package(AdaptiveCpp) needs the toolchain's cmake config in the host env.
naga-acpp = "==@ACPP_VERSION@"
# The lane mutex, EXACT: the lane is an ABI name (23.0git sorts below 23, so
# no range matches it). It also arrives through the toolchain's run_exports;
# stating it here makes the solve fail loudly if the lane ever moves.
naga-acpp-llvm = "==23.0git"

# No Boost for win-arm64 on conda-forge: CMakeLists.txt builds Boost.Test from
# source there.
[package.target.linux-64.host-dependencies]
libboost-devel = "*"
tbb-devel = "*"

[package.target.linux-aarch64.host-dependencies]
libboost-devel = "*"
tbb-devel = "*"

[package.target.win-64.host-dependencies]
libboost-devel = "*"

[package.target.osx-arm64.host-dependencies]
libboost-devel = "*"

[package.target.linux-64.run-dependencies]
libboost = "*"
tbb = "*"

[package.target.linux-aarch64.run-dependencies]
libboost = "*"
tbb = "*"

[package.target.win-64.run-dependencies]
libboost = "*"

[package.target.osx-arm64.run-dependencies]
libboost = "*"
