# osx-arm64 TRIAL: build the release lane on the mac runner, publish OFF.
# First cut is OMP-only, compiler + runtime outputs only (no lldb/bolt/
# compiler-rt, no Metal yet). The runner has 5 cores — expect hours cold;
# ccache carries later runs.
name: mac-trial
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override"
        default: "0"

concurrency:
  group: mac-trial
  cancel-in-progress: true

jobs:
  build-osx-arm64:
    runs-on: macOS-26-xlarge
    timeout-minutes: 600
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mac-release-${{ github.run_id }}
          restore-keys: ccache-mac-release-
      - name: staging cache
        uses: actions/cache@v4
        with:
          path: output-staging
          key: staging-mac-release-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-${{ github.run_id }}
          restore-keys: staging-mac-release-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-
      - name: Build release lane (no publish)
        run: pixi run -e dev build-release
