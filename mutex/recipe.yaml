# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# naga-acpp-llvm — the LLVM-major mutex for the naga-acpp toolchain.
#
# The same naga-acpp version can be built against more than one LLVM major
# (e.g. trying a new LLVM without bumping AdaptiveCpp). Every toolchain package
# depends on the mutex major it was built against, so an environment holds
# exactly one LLVM major's worth of naga-acpp. Versions are bare majors
# (`21`), so `naga-acpp-llvm ==21` is the consumer pin. The naga- prefix keeps
# it from colliding with the old `acpp-llvm` on the public naga-labs channel.
#
# NOT naga-acpp-llvm-dev, which ships LLVM/Clang development files.

package:
  name: naga-acpp-llvm
  version: ${{ llvm_major }}

# license_file resolves against the recipe and work dirs only, so the license
# text is fetched into the work dir. Nothing reaches the prefix.
source:
  - path: ../shared/licenses/AdaptiveCpp-LICENSE

build:
  number: 0
  # Contentless and platform-free: one artifact serves every platform.
  noarch: generic
  variant:
    # llvm_major is consumed in `version:`, not a requirement, so it must be
    # declared for rattler-build to build one output per listed major.
    use_keys:
      - llvm_major

requirements:
  run_exports:
    # WEAK (python_abi idiom): fires for packages that take the mutex as a
    # HOST dependency. On a bare-major version the defaults yield
    # `naga-acpp-llvm >=21,<22.0a0`.
    weak:
      - ${{ pin_subpackage('naga-acpp-llvm') }}

tests:
  - package_contents:
      files:
        not_exists:
          - lib/**
          - bin/**

about:
  homepage: https://github.com/NAGAGroup/AdaptiveCpp
  license: BSD-2-Clause
  license_file: AdaptiveCpp-LICENSE
  summary: Mutex selecting the LLVM major of the naga-acpp toolchain
