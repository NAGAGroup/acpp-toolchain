              - Library/share/scan-build/**
              - Library/share/scan-view/**
              - Library/share/opt-viewer/**
              - Library/lib/libear/**
              - Library/lib/libscanbuild/**
              - Library/libexec/**
    requirements:
      host:
        # Lane mutex — see the note on acpp-runtime's host block.
        - acpp-llvm ==${{ llvm_major }}
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        - ${{ pin_compatible('acpp-llvm') }}
        - python >=3.9
      run_constraints:
        # Same-major windows. This is the block the CPP Project Expert's
        # item-7 question was about: the clang-format exclusion now bites ONLY
        # a matching-major clang-format, so a project can keep its own
        # different-major clang-format/clangd dev tooling in the same env.
        - clang-tools <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - clang-format <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - clang-scan-deps <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        # Already major-scoped by name; blanket forbid IS the same-major window.
        - clang-format-${{ llvm_major }} <0.0a0
        - acpp-tools-nightly <0.0a0
      ignore_run_exports:
        # By SOURCE PACKAGE, not by exported name (phase-3 ruling [B]).
        #
        # A name list must be extended every time an upstream feedstock adds an
        # export, and it fails SILENTLY when it is not — which is how the
        # Windows OpenCL loader leaked into packages that never link it.
        # Naming the source package ignores whatever that package exports,
        # this release and the next.
        #
        # Written unconditionally, covering both platforms' package names:
        # ignoring exports from a package that is not in this platform's host
        # env is a verified no-op, so a per-platform conditional would add
        # fragility for nothing.
        #
        # All of these are build-time-only for us. The backends are dlopened at
        # runtime, and their real dependencies are declared by the
        # acpp-runtime-{cuda,intel} metapackages — which is what lets someone
        # install the CPU runtime without dragging in CUDA.
        from_package:
          - cuda-version
          - cuda-cudart-dev
          - cuda-nvvm
          - cuda-nvcc-tools
          - cuda-driver-dev
          - cuda-crt-dev_linux-64
          - cuda-nvcc-impl
          - level-zero-devel
          - opencl-headers
          - ocl-icd
          - khronos-opencl-icd-loader
          - python
    tests:
      - package_contents:
          bin:
            - clang-format
            - clang-tidy
            - clangd
            - run-clang-tidy
            - scan-build
            # bolt is ELF-only; it does not build on win
            - if: linux
              then:
                - llvm-bolt
  - package:
      name: acpp-lldb
      version: ${{ version }}
    # No source here: staging-inheriting outputs get the ENTIRE staging work
    # dir restored (shared/ and its licenses included); fetching ../shared
    # ourselves collides with that restore ("File already exists").
    inherit: llvm-acpp-stage
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      # lldb is not built on Windows (not in the win LLVM_ENABLE_PROJECTS set)
      skip:
        - win
      files:
        include:
          - bin/lldb*
          - lib/liblldb*
          # python bindings (lldb module)
          - lib/python*/**
    requirements:
      host:
        # Lane mutex — see the note on acpp-runtime's host block.
        - acpp-llvm ==${{ llvm_major }}
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        - ${{ pin_compatible('acpp-llvm') }}
        # POINT REPAIR: this package ships lib/python*/** — the lldb python
        # bindings — so it needs an interpreter to be of any use, and it was
        # not asking for one. python's own run_export supplies python_abi,
        # which pins the interpreter's ABI *if* python is present but does not
        # require python to be there at all, so the bindings could land in an
        # environment with nothing able to import them.
        - python
      run_constraints:
        # Same-major window: a different-major lldb cannot collide with ours.
        - lldb <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - acpp-lldb-nightly <0.0a0
      ignore_run_exports:
        # By source package; see the note on acpp-runtime. NB python is NOT
        # ignored here — unlike the other outputs, this one genuinely depends
        # on the interpreter, so python_abi pinning it to the interpreter it
        # was built against is exactly what we want.
        from_package:
          - cuda-version
          - cuda-cudart-dev
          - cuda-nvvm
          - cuda-nvcc-tools
          - cuda-driver-dev
          - cuda-crt-dev_linux-64
          - cuda-nvcc-impl
          - level-zero-devel
          - opencl-headers
          - ocl-icd
          - khronos-opencl-icd-loader
    tests:
      - package_contents:
          bin:
            - lldb
            - lldb-server

  # ── Compiler activation packages (canonical family split, design §D2) ──
  - package:
      name: acpp-clang_linux-64
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      skip:
        - target_platform != "linux-64"
      script:
        content: bash shared/activation/render-install.sh clang
    requirements:
      build:
        - sed
        - shellcheck
      run:
        - ${{ pin_subpackage('acpp', upper_bound='x.x') }}
        - sysroot_linux-64 >=2.28
        # POINT REPAIR: the activation script sets AR, RANLIB, NM, STRIP, LD
        # and friends to ${CHOST}-<tool>, which are binutils programs, not
        # clang ones — conda-forge's own ctng compiler activation packages
        # depend on binutils for exactly this reason. Without it the exported
        # environment names tools that need not exist in the prefix, and the
        # failure surfaces as a confusing link error inside someone else's
        # build rather than as a missing dependency here.
        - binutils_linux-64
      run_exports:
        strong:
          - __glibc >=2.28
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
      run_constraints:
        - clang_linux-64 <0.0a0
        - acpp-clang-nightly_linux-64 <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/activate-acpp-clang_linux-64.sh
              - etc/conda/deactivate.d/deactivate-acpp-clang_linux-64.sh
      - script:
          - |
            # The test env already sources our activate.d script, so assert a
            # true ROUND TRIP (value returns to whatever it was) rather than
            # assuming a pristine env where deactivate leaves it unset.
            export CONDA_PREFIX="${PREFIX}"
            before="${CC:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate-acpp-clang_linux-64.sh"
            test -n "${CC}" || (echo "CC not set" && exit 1)
            echo "${CC}" | grep -q "x86_64-conda-linux-gnu" || (echo "CC not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate-acpp-clang_linux-64.sh"
            after="${CC:-__UNSET__}"
            test "${before}" = "${after}" || (echo "CC not restored: ${before} != ${after}" && exit 1)
            echo "activation round-trip OK"

  - package:
      name: acpp-clangxx_linux-64
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      skip:
        - target_platform != "linux-64"
      script:
        content: bash shared/activation/render-install.sh clangxx
    requirements:
      build:
        - sed
        - shellcheck
      run:
        - ${{ pin_subpackage('acpp-clang_linux-64', upper_bound='x.x') }}
      run_exports:
        strong:
          - __glibc >=2.28
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
      run_constraints:
        - clangxx_linux-64 <0.0a0
        - acpp-clangxx-nightly_linux-64 <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/activate-acpp-clangxx_linux-64.sh
              - etc/conda/deactivate.d/deactivate-acpp-clangxx_linux-64.sh
      - script:
          - |
            # The test env already sources our activate.d script, so assert a
            # true ROUND TRIP (value returns to whatever it was) rather than
            # assuming a pristine env where deactivate leaves it unset.
            export CONDA_PREFIX="${PREFIX}"
            before="${CXX:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate-acpp-clangxx_linux-64.sh"
            test -n "${CXX}" || (echo "CXX not set" && exit 1)
            echo "${CXX}" | grep -q "x86_64-conda-linux-gnu" || (echo "CXX not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate-acpp-clangxx_linux-64.sh"
            after="${CXX:-__UNSET__}"
            test "${before}" = "${after}" || (echo "CXX not restored: ${before} != ${after}" && exit 1)
            echo "activation round-trip OK"

  # ── Windows compiler activation (design v3 §D2) ───────────────────────────
  # Ported from conda-forge clang-win-activation (a different lineage from the
  # linux ctng one: .bat/.ps1/.sh triples, ordering encoded in the FILENAME).
  - package:
      name: acpp-clang_win-64
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      skip:
        - target_platform != "win-64"
      script:
        interpreter: nu
        content: nu shared/activation/render-install-win.nu clang ${{ llvm_major }}
    requirements:
      build:
        - nushell
      run:
        - ${{ pin_subpackage('acpp', upper_bound='x.x') }}
      run_exports:
        strong:
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
      run_constraints:
        - clang_win-64 <0.0a0
        - clang-cl_win-64 <0.0a0
        - acpp-clang-nightly_win-64 <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/vs2022_y-acpp-clang_win-64.bat
              - etc/conda/activate.d/vs2022_y-acpp-clang_win-64.ps1

  - package:
      name: acpp-clangxx_win-64
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      skip:
        - target_platform != "win-64"
      script:
        interpreter: nu
        content: nu shared/activation/render-install-win.nu clangxx ${{ llvm_major }}
    requirements:
      build:
        - nushell
      run:
        # clangxx activation reuses CPPFLAGS_USED that the clang script sets,
        # which is why the filenames force _z- to sort after _y-.
        - ${{ pin_subpackage('acpp-clang_win-64', upper_bound='x.x') }}
      run_exports:
        strong:
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
      run_constraints:
        - clangxx_win-64 <0.0a0
        - acpp-clangxx-nightly_win-64 <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/vs2022_z-acpp-clangxx_win-64.bat
              - etc/conda/activate.d/vs2022_z-acpp-clangxx_win-64.ps1

  # clang-cl driver: the MSVC-CLI-compatible front end most existing Windows
  # build systems expect. Upstream ships clang-cl_win-64 as an ALTERNATIVE to
  # clang_win-64 (they intentionally conflict), so ours conflicts with our own
  # clang/clangxx activation pair for the same reason: both would install a
  # vs2022_y-* script and fight over CC/CXX.
  - package:
      name: acpp-clang-cl_win-64
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      skip:
        - target_platform != "win-64"
      script:
        interpreter: nu
        content: nu shared/activation/render-install-win.nu clang-cl ${{ llvm_major }}
    requirements:
      build:
        - nushell
      run:
        - ${{ pin_subpackage('acpp', upper_bound='x.x') }}
      run_exports:
        strong:
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
      run_constraints:
        - clang-cl_win-64 <0.0a0
        - clang_win-64 <0.0a0
        - acpp-clang_win-64 <0.0a0
        - acpp-clangxx_win-64 <0.0a0
        - acpp-clang-cl-nightly_win-64 <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/vs2022_y-acpp-clang-cl_win-64.bat
              - etc/conda/activate.d/vs2022_y-acpp-clang-cl_win-64.ps1

  # ── Backend metapackages (precise runtime deps, design §5) ────────────────
  # One-package install path: `acpp-runtime-cuda` PULLS IN the lane runtime,
  # so a CUDA user installs exactly one thing (and still gets the omp backend,
  # which ships in the runtime). Lane-bound + exactly pinned so the pair can
  # never drift; the nightly lane carries `-nightly` twins.
  - package:
      name: acpp-runtime-cuda
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
    requirements:
      # REAL host deps (phase-3 ruling [B]): this metapackage's whole job is to
      # state which CUDA the runtime beside it was built against, so its floors
      # must track the staging solve rather than being maintained by hand. They
      # are host deps purely so pin_compatible below has something to resolve
      # against — nothing is compiled here.
      host:
        - cuda-version
        - cuda-cudart
        - cuda-nvvm
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        - ${{ pin_compatible('cuda-cudart') }}
        - ${{ pin_compatible('cuda-nvvm') }}
      run_constraints:
        # __cuda: DELETED. This is the package that legitimately needs a driver
        # floor, and it gets one WITHOUT us writing it: cuda-cudart depends on
        # cuda-version, which constrains "__cuda >=12" — a floor with no
        # ceiling, unlike the "<13" we used to assert against a driver.
        - acpp-runtime-cuda-nightly <0.0a0
    about:
      summary: acpp SYCL runtime with CUDA backend dependencies (generic SSCP JIT)
      license: BSD-3-Clause

  - package:
      name: acpp-runtime-intel
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
    requirements:
      # Real host deps so the floors below track the staging solve; see the
      # CUDA metapackage. level-zero comes in via level-zero-devel, which is
      # what the runtime was actually built against.
      host:
        - level-zero-devel
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        - ${{ pin_compatible('level-zero') }}
        # The OpenCL ICD loader ships under a different name per platform:
        # ocl-icd is linux-only, Windows uses the Khronos loader. Left
        # unpinned on purpose — an ICD loader's entire contract is a stable
        # ABI across versions, so a floor derived from our build machine would
        # be noise rather than information.
        - if: linux
          then: ocl-icd
          else: khronos-opencl-icd-loader
      run_constraints:
        - acpp-runtime-intel-nightly <0.0a0
    about:
      summary: acpp SYCL runtime with Intel GPU (Level Zero / OpenCL) backend dependencies
      license: BSD-3-Clause

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: Apache-2.0 WITH LLVM-exception
  # Vendored copies (package outputs no longer carry the source trees);
  # build-stage.nu hard-fails if these ever differ from the extracted trees.
  license_file:
    - shared/licenses/llvm-LICENSE.TXT
    - shared/licenses/AdaptiveCpp-LICENSE
  summary: AdaptiveCpp SYCL toolchain (LLVM ${{ llvm_major }} linked-in, generic SSCP)
  repository: https://github.com/NAGAGroup/acpp-toolchain
