# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-clang — the UNVERSIONED clang drivers, and the conda configuration files
# that make them prefix-aware. Lifted from the reference monolith's `clang`
# output (clangdev-feedstock).
#
# TWO BUILDS OF ONE NAME, off the `with_cfg` axis in ../../variants.yaml. The
# cfg build carries the `<TARGET_NO_VER>-*.cfg` files that add --sysroot,
# `-isystem <CFGDIR>/../include` and the rpath flags; the nocfg build is a
# vanilla clang for tooling and analysis, selected through the
# acpp-clang-no-conda-cfg metapackage. The distinction is in the build string,
# which is why `cfg`/`nocfg` sits inside it.
#
# SLICING FORM: GLOB LIST, upstream's own — named drivers and named cfg files,
# all of them scoped by name, so none can reach another project's output in our
# union stage. Cross-checked against conda-forge's clang-21.1.8 artifacts:
# linux-64 `bin/{clang,clang-cl,clang-cpp}` plus the clang, clang-cpp and flang
# cfg files; osx-arm64 the same plus `bin/cc` and `bin/cpp`; win-64 the three
# `.exe` and nothing else.
#
# UPSTREAM'S GLOB NAMES A `<TARGET_NO_VER>-clang-cl.cfg` THAT ITS OWN BUILD
# NEVER CREATES — clangdev/build.sh writes cfg files for clang, clang++,
# clang-cpp and flang only, and the published artifact has no clang-cl.cfg. It
# is dropped here rather than transcribed, because carve.nu fails on a glob that
# matches nothing and this one would fail every cfg build.
#
# NOT SHIPPED, DELIBERATELY: the linux `bin/cc`, `bin/cpp` and `bin/c++`
# symlinks. The stage creates them on every unix platform, as upstream's
# build.sh does, but upstream ships them on osx only "to avoid conflicts with
# gcc" and we follow that. They stay in the stage, unclaimed.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}
  # TARGET_NO_VER is a recipe constant; it differs from TARGET only on osx,
  # where dropping the darwin version is what lets `-arch x86_64 -arch arm64`
  # work (conda-forge.github.io issue 2695).
  target_no_ver: ${{ "x86_64-conda-linux-gnu" if linux else "arm64-apple-darwin" if osx else "x86_64-pc-windows-msvc" }}

package:
  name: acpp-clang
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_${{ "cfg" if with_cfg else "nocfg" }}_h${{ hash }}_${{ build_num }}
  variant:
    # increasing numbers correspond to decreasing priority
    # 0:     with_cfg, variant == "default"
    # 1: not with_cfg, variant == "default"
    # 2:     with_cfg, variant != "default"
    # 3: not with_cfg, variant != "default"
    down_prioritize_variant: ${{ ((not with_cfg) | int) + 2 * ((variant != "default") | int) }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: >-
        ${{ library_prefix }}bin/clang${{ ".exe" if win else "" }};
        ${{ library_prefix }}bin/clang-cl${{ ".exe" if win else "" }};
        ${{ library_prefix }}bin/clang-cpp${{ ".exe" if win else "" }}
        ${{ ";bin/" ~ target_no_ver ~ "-clang.cfg;bin/" ~ target_no_ver ~ "-clang-cpp.cfg;bin/" ~ target_no_ver ~ "-flang.cfg" if unix and with_cfg else "" }}
        ${{ ";bin/cc;bin/cpp" if osx and with_cfg else "" }}

requirements:
  build:
    # "for run-export on win. This is just a symlink on unix"
    - if: win
      then:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    - if: win
      then:
        - zlib
        - zstd
  run:
    # "cannot use exact pins on osx due to separation of compiler activation;
    # see #437"
    # UPSTREAM osx: `clang-${{ major_version }} ==${{ version }} ${{ variant }}_*`
    # UPSTREAM else: pin_subpackage("clang-" ~ major_version, exact=True)
    - if: osx
      then: acpp-clang-${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_${{ variant }}_*"]
      else: acpp-clang-${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - acpp-llvm-openmp >=${{ llvm_version }}
    # UPSTREAM: pin_subpackage("clang_impl_" ~ target_platform, exact=True)
    - if: unix
      then: acpp-clang_impl_${{ target_platform }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - if: linux
      then:
        - binutils
        - libgcc-devel_${{ target_platform }}
        - sysroot_${{ target_platform }}
    - if: osx
      then:
        - cctools
        - ld64
        # UPSTREAM: `ld64_${{ target_platform }} * llvm21_1_*` — bracket form so
        # the version field is not a bare wildcard.
        - ld64_${{ target_platform }}[build="llvm${{ llvm_maj_min | replace(".", "_") }}_*"]
        - acpp-llvm-tools ==${{ llvm_version }}
  ignore_run_exports:
    from_package:
      # "the build fails if it doesn't find the following, but it's not used"
      - libxml2-devel
      - if: unix
        then:
          - zlib
          - zstd

tests:
  - package_contents:
      files:
        exists:
          - ${{ library_prefix }}bin/clang${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/clang-cl${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/clang-cpp${{ ".exe" if win else "" }}
          - if: unix and with_cfg
            then: bin/${{ target_no_ver }}-clang.cfg
        not_exists:
          # the versioned drivers are acpp-clang-21's, clang++ is acpp-clangxx's
          - ${{ library_prefix }}bin/clang-${{ llvm_major }}${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/clang++${{ ".exe" if win else "" }}
          # the cfg file upstream's glob names but its build never writes
          - if: unix
            then: bin/${{ target_no_ver }}-clang-cl.cfg

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: Development headers and libraries for the clang compiler
