# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# _acpp-llvm-spirv-stage — the ONE SPIRV-LLVM-Translator build, standing in for
# the reference monolith's `llvm-spirv-stage` staging output
# (llvm-spirv-feedstock). Its four package outputs become the four slicers
# beside this directory.
#
# NOTHING HERE IS USER-FACING. See pixi.toml for why it is published at all and
# what the exit condition is.
#
# THE SOURCE IS ADAPTIVECPP'S FORK, NOT KHRONOS' RELEASE TARBALL. acpp's SPIRV
# backend maps the generic address space to 0, which stock llvm-spirv does not
# accept, so acpp maintains a fork and its own CMake fetches
# `origin/${LLVMSPIRV_BRANCH}`, defaulting the branch to
# `llvm_release_<major>0`. The branch name below is DERIVED from llvm_major so
# the two cannot be read as independent choices; the revision is that branch's
# head, and MOVING llvm_major MEANS MOVING IT.
#
# THE VERSION IS OUR LLVM'S. Upstream's llvm-spirv version is a Khronos release
# (22.1.2 for LLVM 22) whose major names libllvmspirv<major>. Our source is a
# BRANCH HEAD with no tag, so there is no translator release to lift and
# inventing one would be a lie. 21.1.8 is the LLVM this translator belongs to —
# which is also what makes `acpp-llvm-spirv-21` and `acpp-libllvmspirv21`
# correct by construction, and lets the soversion derive from llvm_maj_min
# instead of becoming a fourth number somebody has to keep in step.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  # The library's soversion. Measured, not assumed: conda-forge's
  # libllvmspirv21-21.1.4 artifact ships `lib/libLLVMSPIRVLib.so.21.1` on
  # linux-64 and `lib/libLLVMSPIRVLib.21.1.dylib` on osx-arm64.
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  spirv_branch: llvm_release_${{ llvm_major }}0
  spirv_rev: 3d3f0dece590232aab1851f1bea860c2a381ec34
  spirv_sha256: 075b9f62fdf7fb52a24ef88fc7986f227b1fb4b149d0601c878efad2a8e5f703

package:
  name: _acpp-llvm-spirv-stage
  version: 0.0.0

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses
  - url: https://github.com/AdaptiveCpp/SPIRV-LLVM-Translator/archive/${{ spirv_rev }}.tar.gz
    sha256: ${{ spirv_sha256 }}
    patches:
      # The translator's external build never includes GNUInstallDirs, and
      # LLVMConfig.cmake does not define CMAKE_INSTALL_* on Windows.
      # https://github.com/llvm/llvm-project/issues/83802
      - if: win
        then: patches/0001-Work-around-a-bug-in-the-llvm-config.patch

  # The vendored licence text the four shipped packages carry as their
  # license_file. It comes in here so the build can assert, against the
  # extracted source, that it is still byte-identical — this build is the only
  # place that can see both sides. Same guard _acpp-stage runs.
  #
  # ⚠ THE `..` IS CORRECT HERE AND MUST STAY. A `path:` SOURCE resolves against
  # the RECIPE directory, where `..` works; `license_file` resolves against the
  # rendered SOURCE directory, where it never does. Two rules that look alike.
  # The licence sweep applied the second to this line and run 34109157780 died
  # at FETCH time with "failed to canonicalize path".
  # tools/check-source-paths.nu now asserts every path source exists.
  - path: ../_shared/licenses/SPIRV-LLVM-Translator-LICENSE.TXT
    target_directory: vendored-licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: build-spirv-stage.nu
    env:
      ACPP_LLVM_MAJOR: ${{ llvm_major }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
    - nushell
  host:
    # OUR LLVM. Upstream's `llvmdev` + `llvm` host pair is the whole toolchain
    # for us, and it arrives inside <layout_root>/_stage.
    - _acpp-stage ==0.0.0
    # LOAD-BEARING: without LLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR the
    # translator's CMake runs FetchContent over git at configure time.
    - spirv-headers
    - zlib
    # Upstream also takes spirv-tools on non-win. It is used by the lit suite,
    # which LLVM_SPIRV_INCLUDE_TESTS=OFF disables, so it is not lifted.
  run: []

about:
  homepage: https://github.com/AdaptiveCpp/SPIRV-LLVM-Translator
  license: NCSA
  # This one HAS a source tree, so it points at the real file rather than the
  # vendored copy; the copy is what the four slicers use, and the guard in
  # build-spirv-stage.nu is what keeps the two identical.
  license_file: LICENSE.TXT
  summary: Internal build stage for the SPIR-V translator — not for installation
