# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-llvm-dev (release lane) — LLVM-API developer slice.
# Build mechanics: see release/acpp-runtime/recipe.yaml + shared/build.nu.

context:
  llvm_version: "20.1.8"
  llvm_major: "20"
  llvm_maj_min: "20.1"
  acpp_version: "25.10.0"
  version: ${{ acpp_version ~ "_llvm" ~ llvm_version }}
  acpp_ref: "v25.10.0"
  acpp_commit: "9f842c701a599107cc6d117d3539f971036363a1"
  spirv_commit: "f0ae76f12c62ede090e57ece8c986f4c3c971a71" # llvm_release_200
  oclh_commit: "265df85aec478d14a5c5880d7bb92d7dd52714ef"
  oclhpp_commit: "67d100e70612341707725b6648ccca4c10b0dc31"

package:
  name: acpp-llvm-dev
  version: ${{ version }}

source:
  - path: ../../shared
    target_directory: shared

build:
  number: 0
  script:
    interpreter: nu
    content: nu shared/build.nu toolchain
    env:
      ACPP_LANE: release
      ACPP_LLVM_VERSION: ${{ llvm_version }}
      ACPP_ACPP_REF: ${{ acpp_ref }}
      ACPP_ACPP_COMMIT: ${{ acpp_commit }}
      ACPP_SPIRV_COMMIT: ${{ spirv_commit }}
      ACPP_OCLH_COMMIT: ${{ oclh_commit }}
      ACPP_OCLHPP_COMMIT: ${{ oclhpp_commit }}
      ACPP_BUILD_CACHE: ${{ env.get("ACPP_BUILD_CACHE", default="") }}
  files:
    include:
      - bin/**
      - include/**
      - lib/**/*.a
      - lib/cmake/**
      - share/man/**
    exclude:
      # claimed by acpp
      - bin/acpp*
      - bin/clang
      - bin/clang++
      - bin/clang-cl
      - bin/clang-cpp
      - bin/clang-${{ llvm_major }}
      - bin/lld
      - bin/ld.lld
      - bin/ld64.lld
      - bin/lld-link
      - bin/wasm-ld
      - bin/llvm-ar
      - bin/llvm-nm
      - bin/llvm-ranlib
      - bin/llvm-strip
      - bin/llvm-objcopy
      - bin/llvm-objdump
      - bin/llvm-readelf
      - bin/llvm-readobj
      - bin/llvm-size
      - bin/llvm-strings
      - bin/llvm-symbolizer
      - bin/llvm-cxxfilt
      - bin/llvm-addr2line
      - bin/llvm-dwarfdump
      - bin/llvm-dlltool
      - bin/llvm-lib
      - bin/llvm-rc
      - bin/llvm-mt
      - bin/llvm-windres
      - bin/llvm-cov
      - bin/llvm-profdata
      - bin/llvm-profgen
      - include/AdaptiveCpp/**
      - lib/cmake/AdaptiveCpp/**
      # claimed by acpp-tools
      - bin/amdgpu-arch
      - bin/clang-apply-replacements
      - bin/clang-change-namespace
      - bin/clang-check
      - bin/clang-doc
      - bin/clang-extdef-mapping
      - bin/clang-format
      - bin/clang-include-cleaner
      - bin/clang-include-fixer
      - bin/clang-installapi
      - bin/clang-linker-wrapper
      - bin/clang-move
      - bin/clang-nvlink-wrapper
      - bin/clang-offload-bundler
      - bin/clang-offload-packager
      - bin/clang-query
      - bin/clang-refactor
      - bin/clang-reorder-fields
      - bin/clang-repl
      - bin/clang-scan-deps
      - bin/clang-sycl-linker
      - bin/clang-tidy
      - bin/clangd
      - bin/diagtool
      - bin/find-all-symbols
      - bin/git-clang-format
      - bin/hmaptool
      - bin/modularize
      - bin/nvptx-arch
      - bin/offload-arch
      - bin/pp-trace
      - bin/run-clang-tidy
      - bin/scan-build
      - bin/scan-build-py
      - bin/scan-view
      - bin/llvm-bolt
      - bin/llvm-bolt-heatmap
      - bin/perf2bolt
      - bin/merge-fdata
      # claimed by acpp-lldb
      - bin/lldb*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nushell
    - git
    - cmake >=3.24
    - ninja
    - ccache
    - python >=3.9
    - swig # lldb python bindings
  host:
    - zlib
    - zstd
    - libxml2
    - python
    - cuda-cudart-dev >=12,<13
    - cuda-driver-dev >=12,<13
    - cuda-nvvm >=12,<13
    - level-zero-devel
    - ocl-icd
    - opencl-headers
    - numactl
  run:
    - acpp-runtime ==${{ version }}
  ignore_run_exports:
    by_name:
      - level-zero
      - ocl-icd
      - python
  run_constraints:
    # headers/static-libs/cmake-config clobber at any version
    - llvmdev <0.0a0
    - clangdev <0.0a0
    - llvm-tools <0.0a0
    - acpp-llvm-dev-nightly <0.0a0

tests:
  - package_contents:
      bin:
        - llvm-config
        - llc
        - opt
      files:
        exists:
          - lib/cmake/llvm/LLVMConfig.cmake
          - lib/cmake/clang/ClangConfig.cmake
        not_exists:
          - bin/clang
          - bin/acpp
          - bin/clangd
          - bin/lldb

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/LLVM-LICENSE.txt
    - licenses/AdaptiveCpp-LICENSE.txt
  summary: LLVM/Clang API headers, static libs and CMake configs from the acpp toolchain
  repository: https://github.com/NAGAGroup/acpp-toolchain
