# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-libllvmspirv21 — the VERSIONED SPIRV-LLVM-Translator shared library.
# Lifted from the reference monolith's `libllvmspirv${{ spirv_major }}` output
# (llvm-spirv-feedstock).
#
# SLICING FORM: SCRIPT + one named path, upstream's own — that feedstock shares
# one install script across all four outputs and slices with per-output globs.
# See ../_shared/install_llvm_spirv.nu.
#
# ⚠ SCOPE from conda-forge's libllvmspirv21-21.1.4 artifact, the newest
# 21-series build: exactly `lib/libLLVMSPIRVLib.so.21.1` on linux-64 and
# `lib/libLLVMSPIRVLib.21.1.dylib` on osx-arm64. That artifact is also where the
# SOVERSION comes from — 21.1, our llvm_maj_min, rather than a fourth number.
#
# `skip: win` IS A CONSEQUENCE OF THE BUILD, not a policy: upstream's bld.bat
# passes no BUILD_SHARED_LIBS and CMake defaults it OFF, so the win build has no
# versioned shared library to package at all. There is no win artifact for this
# name. build-spirv-stage.nu reproduces that split deliberately.
#
# THE VERSION IS OUR LLVM'S, not a translator release — see
# ../_acpp-llvm-spirv-stage/recipe.yaml for why there is none to lift.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-libllvmspirv${{ llvm_major }}
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  skip: win
  script:
    interpreter: nu
    file: ../_shared/install_llvm_spirv.nu
    env:
      ACPP_LLVM_MAJOR: ${{ llvm_major }}
      ACPP_LLVM_MAJ_MIN: ${{ llvm_maj_min }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-llvm-spirv-stage ==0.0.0
    # THE LIBRARY THIS ONE SHIPS LINKS libLLVM. Taken as a HOST dep so its weak
    # run_export computes the exact-build run dependency, rather than it being
    # hand-written here. Upstream reaches the same run dep through its `llvm`
    # and `llvmdev` host entries.
    - acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run_constraints:
    # Upstream: `llvmdev ${{ spirv_llvm_version }}.*` and
    # `llvm-spirv ${{ spirv_version }}.* *_${{ build_number }}`. Both name ours
    # now, because nothing ships under a conda-forge name; the wildcards become
    # the ranges they denote, and the second becomes the same-build bracket form
    # since our tool and our library come out of ONE stage build.
    - acpp-llvmdev ==${{ llvm_version }}
    - acpp-llvm-spirv[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  ignore_run_exports:
    from_package:
      # Upstream also ignores spirv-tools, which we never take (it feeds the lit
      # suite, and LLVM_SPIRV_INCLUDE_TESTS is OFF).
      - zlib

tests:
  - package_contents:
      strict: true
      files:
        - if: linux
          then: lib/libLLVMSPIRVLib.so.${{ llvm_maj_min }}
        - if: osx
          then: lib/libLLVMSPIRVLib.${{ llvm_maj_min }}.dylib

about:
  homepage: https://github.com/AdaptiveCpp/SPIRV-LLVM-Translator
  license: NCSA
  # A slicer has no source tree, so the licence is the vendored copy
  # _acpp-llvm-spirv-stage asserts byte-for-byte against the extracted source.
  license_file: ../_shared/licenses/SPIRV-LLVM-Translator-LICENSE.TXT
  summary: |
    The SPIR-V translator library, versioned. Built from AdaptiveCpp's fork at
    the revision AdaptiveCpp's own build fetches for LLVM 21; the version is the
    LLVM this translator belongs to, not a translator release.
