# compiler()/pixi build-variants via cxx_compiler = ["acpp-clangxx"]).
[package]
name = "acpp-clangxx-activation-nightly"
version = "0.dev0_llvm21.1.8"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
