# Release lane, BOTH platforms. Cheap gates on free runners, the LLVM builds
# on the 64-core larger runners, a real-solve GPU gate on the T4 runner plus
# solver audits per platform, then ONE ATOMIC OIDC publish: a release version
# either ships for every platform or none (Jack's ruling, 2026-08-08).
#
# Each build job produces an INDEXED local conda channel shipped between jobs
# as an artifact, so every downstream job consumes the packages exactly the
# way a user would.
#
# Windows GPU gate: PLACEHOLDER — a Win-x64-GPU runner exists; wiring the win
# smoke into CI is pending the runner-choices discussion. Until then Windows
# GPU validation is manual on real hardware.
name: release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override (bump when trialing workflow changes so publish gets fresh filenames)"
        default: "0"
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: nightly recipe is in sync with release
        run: pixi run -e dev check-nightly
      # Without this the staging cache silently reuses a build made from
      # different patches/sources (rattler-build does not hash them).
      - name: staging_inputs hash is current
        run: pixi run -e dev check-staging-hash
      - name: recipes render
        run: |
          pixi run -e dev render-release > /dev/null
          pixi run -e dev render-nightly > /dev/null
      # Rendering does NOT resolve environments, so it cannot see a
      # pin_compatible that will fail at build time. This catches that class in
      # the cheap job instead of on both platform runners.
      - name: pins are resolvable
        run: pixi run -e dev check-pins

  build-linux:
    needs: checks
    runs-on: Linux-x64-64
    timeout-minutes: 240
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev

      # restore/save are SPLIT (the composite actions/cache only saves when
      # the job succeeds) so failed runs still warm the next one — during
      # debug loops that is exactly when the cache matters most. Keys use
      # run_id so every run saves a fresh entry; restore falls back by prefix.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ github.run_id }}
          restore-keys: ccache-release-

      # Holds the staging cache (a full LLVM build) plus the package cache.
      - name: Restore rattler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rattler/cache
          key: rattler-release-${{ github.run_id }}
          restore-keys: rattler-release-

      # The staging cache (full LLVM+acpp build) lives under the rattler
      # OUTPUT dir (<output>/build_cache), NOT the global rattler cache —
      # cache it explicitly or every run rebuilds staging from scratch.
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: output/build_cache
          key: staging-release-${{ hashFiles('shared/variants/linux-64.yaml') }}-${{ github.run_id }}
          restore-keys: staging-release-${{ hashFiles('shared/variants/linux-64.yaml') }}-

      - name: Build release lane -> indexed local channel
        run: pixi run -e dev build-release

      # Keep only the newest staging entry, else the cached archive grows
      # without bound across runs.
      - name: Prune stale staging caches
        if: always()
        run: |
          cd output/build_cache 2>/dev/null || exit 0
          ls -1dt staging_* 2>/dev/null | tail -n +2 | xargs -r rm -rf
          du -sh . || true

      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/build_cache
          key: staging-release-${{ hashFiles('shared/variants/linux-64.yaml') }}-${{ github.run_id }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ github.run_id }}

      - name: Save rattler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rattler/cache
          key: rattler-release-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-release
          path: local-channel/
          retention-days: 14

  build-win:
    needs: checks
    runs-on: Win-x64-64
    timeout-minutes: 300
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_MAXSIZE: 20G
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4

      # Everything I/O-heavy goes on the fastest storage the instance has.
      # Probed on Win-x64-64 (small-file writes): D: temp disk 4.7k files/s,
      # ReFS VHDX ~2.9k, raw C: ~0.8k. GitHub is REMOVING the D: temp disk
      # from Windows runners (actions/runner-images#12647, "Hosted Compute
      # Agent" provisioner since 2025-07) and the fleet is mixed mid-
      # migration, so: D: when present, else a ReFS VHDX on C: (~3.6x raw
      # C:), else the workspace drive. (Defender is already disabled on the
      # image; not a factor.)
      # Must run before setup-pixi: pixi honors RATTLER_CACHE_DIR and errors
      # out if the directory cannot be created.
      - name: Select build storage
        run: |
          $root = $null
          if (Test-Path "D:\") {
            $root = "D:"
          } else {
            try {
              $vhd = "C:\build-drive.vhdx"
              New-VHD -Path $vhd -SizeBytes 120GB -Dynamic | Out-Null
              $disk = Mount-VHD -Path $vhd -PassThru | Initialize-Disk -PassThru
              $part = New-Partition -DiskNumber $disk.Number -UseMaximumSize -AssignDriveLetter
              Format-Volume -DriveLetter $part.DriveLetter -FileSystem ReFS -Confirm:$false | Out-Null
              $root = "$($part.DriveLetter):"
              Write-Host "No D: on this instance (fleet is mid D:-removal); mounted ReFS VHDX at $root"
            } catch {
              Write-Host "VHDX fallback failed ($_); using workspace drive"
              $root = $env:GITHUB_WORKSPACE
            }
          }
          Write-Host "Fast storage root: $root"
          New-Item -ItemType Directory -Force -Path "$root\rattler-cache", "$root\rb-output", "$root\ccache" | Out-Null
          @(
            "CCACHE_DIR=$root\ccache"
            "CCACHE_BASEDIR=$root\rb-output"
            "RATTLER_CACHE_DIR=$root\rattler-cache"
            "ACPP_OUTPUT_DIR=$root\rb-output"
          ) | Add-Content -Path $env:GITHUB_ENV

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-release-${{ github.run_id }}
          restore-keys: ccache-win-release-

      - name: Restore rattler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RATTLER_CACHE_DIR }}
          key: rattler-win-release-${{ github.run_id }}
          restore-keys: rattler-win-release-

      # Staging cache lives under the OUTPUT dir, not RATTLER_CACHE_DIR —
      # see the linux job note.
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ACPP_OUTPUT_DIR }}\build_cache
          key: staging-win-release-${{ hashFiles('shared/variants/win-64.yaml') }}-${{ github.run_id }}
          restore-keys: staging-win-release-${{ hashFiles('shared/variants/win-64.yaml') }}-

      # GitHub's Windows runners ship a very long PATH; conda's vs activation
      # then calls vcvars64.bat, which appends more and blows cmd.exe's 8191
      # character limit ("The input line is too long."). conda's own docs say
      # to strip PATH, so keep only what the build needs and let activation
      # rebuild the rest.
      - name: Build release lane (win-64) -> indexed local channel
        run: |
          $env:PATH = @(
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:USERPROFILE\.pixi\bin",
            "$env:ProgramFiles\Git\cmd"
          ) -join ";"
          Write-Host "PATH length: $($env:PATH.Length)"
          pixi run -e dev build-release

      - name: Inventory the produced packages
        shell: bash
        run: |
          find local-channel -name '*.conda' -printf '%f  %s bytes\n' | sort

      # Build-once/run-on-GPU: compile the SYCL smoke HERE (this box has
      # VS2026) against the just-built channel; the GPU gate box has no VS
      # and only runs the device-agnostic SSCP binary.
      # pixi solves EVERY platform in the manifest; pin to this leg's own
      # platform BEFORE the first solve or the local channel (win-64-only
      # here) fails the linux-64 solve — this bit run 31354340049 after the
      # legacy linux artifacts were deleted from the published channel (the
      # foreign-platform solve had been silently satisfied by stale
      # published artifacts until then). Mirrors the gpu-gate jobs' pin.
      - name: Pin smoke manifest to this platform
        working-directory: shared/tests/gpu-smoke
        run: |
          (Get-Content pixi.toml) -replace '^platforms = .*', 'platforms = ["win-64"]' | Set-Content pixi.toml
      - name: Compile GPU smoke binary
        working-directory: shared/tests/gpu-smoke
        env:
          ACPP_SMOKE_VCVARS: C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat
        run: |
          pixi run build-smoke
          Copy-Item smoke.exe ..\..\..\local-channel\smoke.exe

      - name: Prune stale staging caches
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:ACPP_OUTPUT_DIR "build_cache"
          if ($dir -and (Test-Path $dir)) {
            Get-ChildItem $dir -Filter "staging_*" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 1 | Remove-Item -Recurse -Force
          }

      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ACPP_OUTPUT_DIR }}\build_cache
          key: staging-win-release-${{ hashFiles('shared/variants/win-64.yaml') }}-${{ github.run_id }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-release-${{ github.run_id }}

      - name: Save rattler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RATTLER_CACHE_DIR }}
          key: rattler-win-release-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-win-64
          path: local-channel/
          retention-days: 14

  gpu-gate:
    needs: build-linux
    runs-on: Linux-x64-GPU
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-release
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: GPU present
        run: nvidia-smi
      # pixi solves EVERY platform in the manifest; pin to this gate's own
      # platform so a linux gate never tries to solve win-64 (and vice versa)
      - name: Pin smoke manifest to this platform
        working-directory: shared/tests/gpu-smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then P=win-64; else P=linux-64; fi
          sed -i "s/^platforms = .*/platforms = [\"$P\"]/" pixi.toml
      - name: Backends visible to the runtime
        working-directory: shared/tests/gpu-smoke
        run: pixi run acpp-info
      - name: SYCL smoke on CPU backend
        working-directory: shared/tests/gpu-smoke
        run: pixi run smoke-cpu
      - name: SYCL smoke on CUDA backend (PTX JIT on real hardware)
        working-directory: shared/tests/gpu-smoke
        run: pixi run smoke-cuda
      # acpp-compiler-rt is new in phase 3. Shipping sanitizer runtimes without
      # proving they link is worse than not shipping them, so this both builds
      # sanitized binaries and makes ASan actually trip.
      - name: Sanitizer smoke (acpp-compiler-rt)
        working-directory: shared/tests/gpu-smoke
        run: pixi run sanitizer-smoke

  solver-audit:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-release
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: run_exports / run_constraints audits
        run: pixi run -e dev audit

  solver-audit-win:
    needs: build-win
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-win-64
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: run_exports / run_constraints audits (win-64 solve)
        run: pixi run -e dev audit-win

  win-gpu-gate:
    needs: build-win
    runs-on: Win-x64-GPU
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-win-64
          path: local-channel
      # The Win-x64-GPU image (Data Science Server 2022) ships a 2021-era
      # driver (471.11 / CUDA 11.4); cuda-12 runtimes need >=525, so update
      # the datacenter driver in place (TCC-mode T4: silent, reboot-free).
      # If NVIDIA moves the URL this step fails loudly — bump the pin.
      - name: Update NVIDIA datacenter driver
        run: |
          nvidia-smi
          $ver = "553.62"
          $url = "https://us.download.nvidia.com/tesla/$ver/$ver-data-center-tesla-desktop-winserver-2022-dch-international.exe"
          Write-Host "Fetching $url"
          curl.exe -sL -o driver.exe $url
          Start-Process -FilePath .\driver.exe -ArgumentList "-s","-noreboot" -Wait
          nvidia-smi
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: Stage prebuilt smoke binary
        run: Copy-Item local-channel\smoke.exe shared\tests\gpu-smoke\smoke.exe
      # pixi solves EVERY platform in the manifest; pin to this gate's own
      # platform so a linux gate never tries to solve win-64 (and vice versa)
      - name: Pin smoke manifest to this platform
        working-directory: shared/tests/gpu-smoke
        run: |
          (Get-Content pixi.toml) -replace '^platforms = .*', 'platforms = ["win-64"]' | Set-Content pixi.toml
      - name: Backends visible to the runtime
        working-directory: shared/tests/gpu-smoke
        run: pixi run acpp-info
      # Guard the layout the win runtime actually depends on: acpp locates
      # its bitcode relative to acpp-common.dll (Library/bin), and the
      # activation script must land libdevice there. Both have silently
      # regressed before, surfacing only as an opaque JIT error, so assert
      # them with a clear message instead.
      - name: Verify runtime layout
        working-directory: shared/tests/gpu-smoke
        run: |
          $p = ".pixi\envs\default"
          $required = @(
            "$p\Library\bin\acpp-common.dll",
            "$p\Library\lib\hipSYCL\bitcode\libkernel-sscp-host-full.bc",
            "$p\Library\bin\hipSYCL\ext\bitcode\ptx\libdevice.10.bc"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "Missing required runtime files:"
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "runtime layout OK"
      - name: SYCL smoke on CPU backend
        working-directory: shared/tests/gpu-smoke
        run: pixi run smoke-cpu
      - name: SYCL smoke on CUDA backend (PTX JIT on real hardware)
        working-directory: shared/tests/gpu-smoke
        run: pixi run smoke-cuda

  # ATOMIC publish: requires every platform's build AND gates. A release
  # version exists on the channel for all platforms or for none.
  publish:
    needs: [build-linux, build-win, gpu-gate, solver-audit, solver-audit-win, win-gpu-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-release
          path: channel-linux
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-win-64
          path: channel-win
      - name: Merge platform channels
        run: |
          mkdir -p local-channel
          find channel-linux channel-win -name '*.conda' -exec cp {} local-channel/ \;
          ls -la local-channel/
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "C-11 gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      # Publishing a name means owning it: every declared output must be
      # present, and every artifact must freshly solve against the channel as
      # consumers see it.
      - name: "Closure gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to prefix.dev
        run: pixi run -e dev publish-channel
