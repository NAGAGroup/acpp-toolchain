# acpp-bolt — BOLT, the LLVM post-link binary optimizer, sliced out of
# _acpp-stage. PACKAGE-ONLY manifest; the sole [workspace] is the repo root.
#
# It replaces the BOLT half of the retired acpp-tools, whose other content is
# now acpp-clang-tools. Why a package of its own rather than a fold into
# `acpp`, and where its scope comes from when conda-forge ships no BOLT at all,
# are both answered in recipe.yaml — this manifest only maps paths.
[package]
name = "acpp-bolt"
version = "21.1.8"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build-dependencies]
_acpp-stage = { workspace = true }
acpp-libllvm21 = { workspace = true }

[package.build.config]
# The slice script lives in ../_shared so the family cannot drift apart; the
# default input globs cover only this directory and the recipe.
extra-input-globs = ["../_shared/*.nu", "../_shared/licenses/**"]
