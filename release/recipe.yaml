# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Release lane — ONE multi-output recipe (design v3 §D1): the staging output
# runs the LLVM+AdaptiveCpp build once; package outputs carve its prefix via
# files: globs (audited zero-clobber partition). Build with --experimental.

context:
  llvm_version: "20.1.8"
  llvm_major: "20"
  llvm_major_next: "21"
  llvm_maj_min: "20.1"
  acpp_version: "25.10.0"
  # PURE upstream version (phase-3 ruling [A]). The LLVM lane used to live here
  # as "25.10.0_llvm20.1.8"; it now lives in the build string, because a
  # trailing lane component makes ordinary semver ranges unwritable — no spec
  # can say "any 25.10.x, but only the llvm20 build". Consumers now write a
  # plain range and select the lane on the dependency axis through the
  # acpp-llvm mutex, which is the same answer the ecosystem reached for
  # python_abi and cuda-version.
  #
  # Cutover note: a trailing string component sorts BELOW the bare version, so
  # 25.10.0_llvm20.1.8 < 25.10.0 and the new artifacts win every sane spec
  # against the legacy ones already on the channel. No epoch needed.
  version: ${{ acpp_version }}
  # Build-string component naming the lane. Human-chosen and semantic on
  # purpose — this is the legitimate use of a build string, as distinct from
  # the variant-HASH pins the channel doctrine rejects (hashes rot across
  # rebuilds; "llvm20_1_8" does not).
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}

recipe:
  name: acpp-toolchain
  version: ${{ version }}

# NB: no top-level source. The big source trees belong to the STAGING output
# only; package outputs get just ../shared (50 files). rattler-build copies
# every output's sources into a fresh work dir per output — handing all nine
# outputs the ~150k-file LLVM tree cost ~21 minutes per Windows run.
# License texts ship from shared/licenses/ (vendored, drift-checked against
# the extracted trees by build-stage.nu at every staging build).

outputs:
  # ── Staging: ONE LLVM+AdaptiveCpp build shared by all outputs ──────────
  - staging:
      name: llvm-acpp-stage
    build:
      script:
        interpreter: nu
        file: ../shared/build-stage.nu
        env:
          # rattler-build builds with a sanitized env, so anything ccache needs
          # must be forwarded explicitly. Empty => ccache defaults.
          CCACHE_DIR: ${{ env.get("CCACHE_DIR", default="") }}
          CCACHE_MAXSIZE: ${{ env.get("CCACHE_MAXSIZE", default="") }}
          CCACHE_BASEDIR: ${{ env.get("CCACHE_BASEDIR", default="") }}
          CCACHE_NOHASHDIR: ${{ env.get("CCACHE_NOHASHDIR", default="") }}
          ACPP_BUILD_DIR: ${{ env.get("ACPP_BUILD_DIR", default="") }}
    source:
      - url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ llvm_version }}/llvm-project-${{ llvm_version }}.src.tar.xz
        sha256: 6898f963c8e938981e6c4a302e83ec5beb4630147c7311183cf61069af16333d
        target_directory: llvm-project
      - url: https://github.com/AdaptiveCpp/AdaptiveCpp/archive/9f842c701a599107cc6d117d3539f971036363a1.tar.gz
        sha256: 816cfdfce0fade314533fc5497f16bfa8419b9d96e47fb39e9e134c3d2cb6d1b
        target_directory: AdaptiveCpp
        patches:
          - ../shared/patches/0001-llvmspirv-allow-local-source-dir.patch
          # [release-only] SPIRV sub-build gets no CMAKE_BUILD_TYPE from the
          # [release-only] pin; develop forwards it upstream since 2026-08-08
          - ../shared/patches/0005-spirv-forward-build-type.patch # [release-only]
          # Level Zero backend includes a glibc-internal header; breaks on win
          - ../shared/patches/0002-ze-use-cstdint-not-glibc-internal-header.patch
          # Level Zero backend links with GNU-style -lze_loader; lld-link drops it
          - ../shared/patches/0003-ze-find-loader-library-portably.patch
          # [release-only] ze/ocl backends lack a RUNTIME install rule, so their
          # [release-only] DLLs never reach the prefix on win (fixed on develop)
          - ../shared/patches/0004-ze-ocl-install-runtime-artifacts.patch # [release-only]
          # [release-only] win runtime cannot locate ANY of its own data dirs:
          # [release-only] the common-library name never reaches config.hpp.in
          - ../shared/patches/0006-win-propagate-common-library-name.patch # [release-only]
      - url: https://github.com/AdaptiveCpp/SPIRV-LLVM-Translator/archive/f0ae76f12c62ede090e57ece8c986f4c3c971a71.tar.gz
        sha256: da7f91cc0d1f22fe6bb3806fd964366296109c20b462f524f60418ae0bc5a16a
        target_directory: SPIRV-LLVM-Translator
      - url: https://github.com/KhronosGroup/OpenCL-Headers/archive/265df85aec478d14a5c5880d7bb92d7dd52714ef.tar.gz
        sha256: 07002bdb6107dfc8ab1736c3894ff7f1501029751960c0b2dd6157e43c0b9290
        target_directory: OpenCL-Headers
      - url: https://github.com/KhronosGroup/OpenCL-CLHPP/archive/67d100e70612341707725b6648ccca4c10b0dc31.tar.gz
        sha256: a6112af8ba2cc8a5248bcc7399624258cb9609b31ccd4a65222bf61893c2c618
        target_directory: OpenCL-CLHPP
      - path: ../shared
        target_directory: shared
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        # The staging cache key hashes ONLY resolved requirements, the variant
        # keys referenced IN THOSE REQUIREMENTS, and the platforms — never the
        # sources, patches or build script (verified: adding a patch left the
        # key byte-identical, so a stale toolchain was rebuilt silently).
        # staging_inputs is a hash of those real inputs
        # (shared/gen-staging-hash.nu, enforced by check-staging-hash in CI);
        # mentioning it here is what pulls it into the key. Renders to plain
        # "nushell" — staging builds reject build.variant.use_keys, so this
        # is the only available hook.
        - ${{ "nushell" ~ ("" if staging_inputs else "") }}
        # A FUNCTIONAL FLOOR, not a pin: the build genuinely does not
        # configure below this. Floors state a requirement of the software and
        # stay in the recipe; choices about which version to ship against live
        # in the variant config.
        - cmake >=3.24
        - ninja
        - ccache
        # De-versioned so the single `python` variant key applies. This used to
        # read ">=3.9" while host asked for a bare `python`: two independent
        # solves that could pick different interpreters, with lldb's bindings
        # compiled against the host one.
        - python
        # swig is only needed for lldb's python bindings (linux-only build)
        - if: linux
          then: swig
        # AdaptiveCpp uses GCC/Clang builtin atomics (__atomic_load_n,
        # __ATOMIC_ACQUIRE, ...) which MSVC does not implement, so acpp
        # itself must be compiled by a clang-family driver. We take the
        # plain `clang` package (deps: vc >=14.3,<15 only) rather than the
        # clang_win-64 ACTIVATION package, which is built solely against
        # vs2022/vs2019 and would drag the VS year backwards.
        # MUST be a build dep, NOT host: rattler-build's staging delta
        # excludes any path a host dep already provides, and conda-forge's
        # clang collides with the very files we install (clang.exe,
        # clang-cl.exe, clang-cpp.exe, lib/clang/**) — as a host dep it
        # silently ejected them from every package (run 31241929077).
        - if: win
          then: clang
      host:
        # DE-VERSIONED (phase-3 ruling [B]). Every version that used to be
        # written here now lives in shared/variants/<platform>.yaml, which is
        # this repo's pinning feedstock. Bare names are not "unpinned": a
        # variant key matching the package name supplies the version, and the
        # render annotates the resolved spec with (V) to prove it applied.
        - zlib
        - zstd
        # The single CUDA pin. cuda-version is what every other cuda-* package
        # constrains itself against, so naming it once here — with the major
        # coming from the variant config — aligns cudart, nvvm and the nvcc
        # tools without a version literal on any of them.
        - cuda-version
        - cuda-cudart-dev
        - cuda-nvvm
        - cuda-nvcc-tools
        # Both platforms get Level Zero + OpenCL: level-zero{,-devel} and
        # opencl-headers all ship for win-64, so the Intel backends are not
        # linux-only. (Upstream's Windows CI disables OpenCL, but the docs
        # never say it cannot work — we build it and let CI adjudicate.)
        - level-zero-devel
        - opencl-headers
        - if: linux
          then:
            - ocl-icd
          else:
            - khronos-opencl-icd-loader
        # Linux-only: lldb needs python+swig; libxml2/numactl and the cudart
        # CRT headers are linux packages.
        - if: linux
          then:
            - libxml2-devel
            - python
            - cuda-driver-dev
            - cuda-crt-dev_linux-64
            - numactl
        # AdaptiveCpp's Windows build links Boost (upstream builds it from
        # source with the clang-win toolset; conda-forge ships it prebuilt).
        # NB the clang compiler itself is a BUILD dep (see build: above).
        - if: win
          then:
            # nvcc.exe is what the legacy FindCUDA module anchors detection on.
            # Use -impl, NOT the cuda-nvcc metapackage: that one carries a
            # hardcoded `vs2019_win-64` dependency and would drag the 2019
            # toolset into the host env.
            - cuda-nvcc-impl
            - libboost-devel

  - package:
      name: acpp-runtime
      version: ${{ version }}
    # No source here: staging-inheriting outputs get the ENTIRE staging work
    # dir restored (shared/ and its licenses included); fetching ../shared
    # ourselves collides with that restore ("File already exists").
    source:
      # A FRESH copy of shared/, under its own target dir. The staging restore
      # brings the work dir back with the shared/ that existed when the cache
      # was built, so reading activation scripts from there serves stale files
      # (and re-fetching onto the same path collides with the restore).
      - path: ../shared
        target_directory: shared-fresh
    inherit: llvm-acpp-stage
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      # Installed HERE rather than in the staging build: the staging cache is
      # keyed on resolved requirements + variant vars and does NOT hash
      # shared/, so staging-installed copies of these scripts go stale
      # silently when we edit them. Output scripts always re-run.
      script:
        interpreter: nu
        file: ../shared/install-runtime-activation.nu
      files:
        include:
          - if: linux
            then:
              # SSCP JIT external tools: ptx JIT execs opt+llc; CPU JIT execs
              # opt+llc+lld (verified in llvm-to-backend/{ptx,host}/*.cpp)
              - bin/opt
              - bin/llc
              - bin/lld
              - bin/ld.lld
              # LLVM/Clang/acpp shared libraries (versioned sonames only)
              - lib/*.so*
              # JIT backend plugins, SSCP bitcode, pinned llvm-spirv
              - lib/hipSYCL/**
              # runtime JSON configs
              - etc/AdaptiveCpp/**
              # OMP debugger extension
              - share/gdb/**
            else:
              # SSCP JIT tools: ptx JIT execs opt+llc; the host JIT drives the
              # native COFF linker, so lld-link (and the lld driver) live here
              # (the cross-flavors ld.lld/ld64.lld/wasm-ld belong to acpp)
              - Library/bin/opt.exe
              - Library/bin/llc.exe
              - Library/bin/lld.exe
              - Library/bin/lld-link.exe
              # No LLVM dylib on Windows (tools link static): the shipped
              # DLLs are the C-API/LTO/Remarks surface, libclang, and acpp's
              # own runtime. Import .lib files travel with their DLL.
              - Library/bin/LLVM-C.dll
              - Library/bin/LTO.dll
              - Library/bin/Remarks.dll
              - Library/bin/libclang.dll
              - Library/bin/acpp-rt.dll
              - Library/bin/acpp-common.dll
              - Library/lib/LLVM-C.lib
              - Library/lib/LTO.lib
              - Library/lib/Remarks.lib
              - Library/lib/libclang.lib
              - Library/lib/acpp-rt.lib
              - Library/lib/acpp-common.lib
              # JIT backend plugin DLLs + llvm-to-backend tools (DLLs are
              # RUNTIME artifacts on win, so they land under bin)
              - Library/bin/hipSYCL/**
              # SSCP bitcode, backend import libs, pinned llvm-spirv
              - Library/lib/hipSYCL/**
              # runtime JSON configs
              - Library/etc/AdaptiveCpp/**
          # backend bitcode wiring on activation (opt-in, fail-soft;
          # .sh on linux, .bat/.ps1/.sh triple on win)
          - etc/conda/activate.d/acpp-runtime-activate.*
        exclude:
          - if: linux
            then:
              # libomp comes from conda-forge llvm-openmp (design §5)
              - lib/libomp*
              - lib/libarcher*
              - lib/libompd*
              # lldb's library belongs to acpp-lldb
              - lib/liblldb*
            else:
              # libomp comes from conda-forge llvm-openmp here too
              - Library/bin/libomp.dll
              - Library/lib/libomp.lib
    requirements:
      build:
        - nushell
      host:
        # THE LANE MUTEX. Contentless by construction, which is what makes it
        # safe as a host dep of a staging-inheriting output: rattler-build
        # excludes from the carve any path a host dep already provides, and an
        # empty package provides none. (A real host dep here silently ejected
        # clang.exe & friends from every win package in run 31241929077.)
        #
        # It MUST name this lane's own major. A bare `acpp-llvm` resolves to
        # the HIGHEST published major, which would have pinned the release
        # lane to the nightly lane's mutex range — measured, not theorised.
        - acpp-llvm ==${{ llvm_major }}
      run:
        # Renders "acpp-llvm >=20,<21.0a0" — the whole major and nothing else.
        # Spelled through the pin function so it cannot drift from the host
        # spec above.
        - ${{ pin_compatible('acpp-llvm') }}
        - llvm-openmp >=${{ llvm_major }}
        - if: linux
          then:
            - numactl
            - libstdcxx >=13
      run_exports:
        # EXPORT FLIP (phase-3 ruling [A]): a semver RANGE, not an exact pin.
        # upper_bound 'x.x' renders ">=25.10.0,<25.11.0a0". Exact pins are
        # nightly-only — a date-versioned lane carries no range semantics, so
        # gen-nightly rewrites this line back to exact=True for that lane.
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        # Re-exported EXPLICITLY. run_exports acquired from a host dependency
        # do NOT transit to our own consumers, so without this line a package
        # built against acpp-runtime would inherit the runtime range while
        # saying nothing about which LLVM lane it needs — exactly the mismatch
        # the mutex exists to prevent.
        - ${{ pin_compatible('acpp-llvm') }}
      run_constraints:
        # These two are already major-scoped BY NAME (libllvm20, not libllvm),
        # so a blanket "must not exist" is the same-major window: it forbids
        # the conda-forge build of OUR major, which would collide with the
        # LLVM shared libraries we ship, while leaving every other major free.
        # The unversioned-name cases below are the ones that needed widening.
        - libllvm${{ llvm_major }} <0.0a0
        - libclang-cpp${{ llvm_maj_min }} <0.0a0
        # DERIVED, not hand-written (phase-3 ruling [B]). The CUDA backend is
        # dlopened, so cudart must stay OPTIONAL — a constraint, not a
        # dependency, which is why the run_export is still ignored below. What
        # changed is that the range now comes from the actual host solve
        # instead of a guessed ">=12,<13": pin_compatible yields
        # ">=12.9.79,<13.0a0", the same range cuda-cudart-dev itself exports.
        # Ignoring an export and then hand-writing a LOOSER constraint in its
        # place was the pattern this replaces.
        - ${{ pin_compatible('cuda-cudart') }}
        - ${{ pin_compatible('cuda-nvvm') }}
        # __cuda: DELETED, deliberately, and not replaced here.
        #
        # It was written as "__cuda >=12,<13" — a CEILING on a driver virtual
        # package, which is backwards: a 13.x driver runs CUDA 12 binaries
        # fine, and the ceiling would refuse to install on any host that
        # upgraded. The floor is also not ours to state: cuda-cudart depends on
        # cuda-version, and cuda-version 12.9 constrains "__cuda >=12" —
        # floor-only, verified against the installed package. So a consumer
        # that actually pulls CUDA gets the correct floor through the chain,
        # and a consumer of the bare CPU runtime is not asked for a GPU driver
        # it does not need.
        - acpp-runtime-nightly <0.0a0
      ignore_run_exports:
        # By SOURCE PACKAGE, not by exported name (phase-3 ruling [B]).
        #
        # A name list must be extended every time an upstream feedstock adds an
        # export, and it fails SILENTLY when it is not — which is how the
        # Windows OpenCL loader leaked into packages that never link it.
        # Naming the source package ignores whatever that package exports,
        # this release and the next.
        #
        # Written unconditionally, covering both platforms' package names:
        # ignoring exports from a package that is not in this platform's host
        # env is a verified no-op, so a per-platform conditional would add
        # fragility for nothing.
        #
        # All of these are build-time-only for us. The backends are dlopened at
        # runtime, and their real dependencies are declared by the
        # acpp-runtime-{cuda,intel} metapackages — which is what lets someone
        # install the CPU runtime without dragging in CUDA.
        from_package:
          - cuda-version
          - cuda-cudart-dev
          - cuda-nvvm
          - cuda-nvcc-tools
          - cuda-driver-dev
          - cuda-crt-dev_linux-64
          - cuda-nvcc-impl
          - level-zero-devel
          - opencl-headers
          - ocl-icd
          - khronos-opencl-icd-loader
          - python
    tests:
      - package_contents:
          lib:
            # win has no LLVM/clang dylibs (tools link static); the acpp
            # runtime pair exists on both platforms
            - if: linux
              then:
                - LLVM
                - clang
                - clang-cpp
            - acpp-rt
            - acpp-common
          bin:
            - opt
            - llc
            - lld
          files:
            exists:
              - if: linux
                then:
                  - lib/hipSYCL/librt-backend-omp.so
                  - lib/hipSYCL/librt-backend-cuda.so
                  - lib/hipSYCL/librt-backend-ze.so
                  - lib/hipSYCL/librt-backend-ocl.so
                  - lib/hipSYCL/llvm-to-backend/libllvm-to-backend.so
                  - lib/hipSYCL/llvm-to-backend/libllvm-to-ptx.so
                  - lib/hipSYCL/llvm-to-backend/libllvm-to-spirv.so
                  - lib/hipSYCL/llvm-to-backend/libllvm-to-host.so
                  - lib/hipSYCL/ext/llvm-spirv/bin/llvm-spirv
                  - etc/AdaptiveCpp/acpp-core.json
                  - etc/conda/activate.d/acpp-runtime-activate.sh
                else:
                  # backend plugins are RUNTIME artifacts -> bin on win;
                  # llvm-to-backend is linked statically into per-target
                  # tools (no llvm-to-*.dll exists)
                  - Library/bin/hipSYCL/rt-backend-omp.dll
                  - Library/bin/hipSYCL/rt-backend-cuda.dll
                  - Library/bin/hipSYCL/rt-backend-ze.dll
                  - Library/bin/hipSYCL/rt-backend-ocl.dll
                  - Library/bin/hipSYCL/llvm-to-backend/llvm-to-ptx-tool.exe
                  - Library/bin/hipSYCL/llvm-to-backend/llvm-to-spirv-tool.exe
                  - Library/bin/hipSYCL/llvm-to-backend/llvm-to-host-tool.exe
                  - Library/lib/hipSYCL/ext/llvm-spirv/bin/llvm-spirv.exe
                  - Library/etc/AdaptiveCpp/acpp-core.json
                  - etc/conda/activate.d/acpp-runtime-activate.bat
                  - etc/conda/activate.d/acpp-runtime-activate.ps1
                  - etc/conda/activate.d/acpp-runtime-activate.sh
            not_exists:
              - if: linux
                then:
                  - lib/hipSYCL/librt-backend-hip.so # AMD off (design §4)
                  - lib/libomp.so
                  - lib/liblldb.so
                else:
                  - Library/bin/hipSYCL/rt-backend-hip.dll # AMD off (design §4)
                  - Library/bin/libomp.dll
  - package:
      name: acpp
      version: ${{ version }}
    # No source here: staging-inheriting outputs get the ENTIRE staging work
    # dir restored (shared/ and its licenses included); fetching ../shared
    # ourselves collides with that restore ("File already exists").
    inherit: llvm-acpp-stage
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      files:
        include:
          - if: linux
            then:
              - bin/acpp*
              - bin/clang
              - bin/clang++
              - bin/clang-cl
              - bin/clang-cpp
              - bin/clang-${{ llvm_major }}
              - bin/ld64.lld
              - bin/lld-link
              - bin/wasm-ld
              - bin/llvm-ar
              - bin/llvm-nm
              - bin/llvm-ranlib
              - bin/llvm-strip
              - bin/llvm-objcopy
              - bin/llvm-objdump
              - bin/llvm-readelf
              - bin/llvm-readobj
              - bin/llvm-size
              - bin/llvm-strings
              - bin/llvm-symbolizer
              - bin/llvm-cxxfilt
              - bin/llvm-addr2line
              - bin/llvm-dwarfdump
              - bin/llvm-dlltool
              - bin/llvm-lib
              - bin/llvm-rc
              - bin/llvm-mt
              - bin/llvm-windres
              - bin/llvm-cov
              - bin/llvm-profdata
              - bin/llvm-profgen
              - bin/x86_64-conda-linux-gnu-clang
              - bin/x86_64-conda-linux-gnu-clang++
              - bin/x86_64-conda-linux-gnu-clang-cpp
              - include/AdaptiveCpp/**
              - lib/clang/**
              - lib/cmake/AdaptiveCpp/**
            else:
              # clang.exe is the real binary on win (no clang-NN.exe); the
              # others are install-time alias copies. NB: a bare acpp* glob
              # would also swallow runtime's acpp-rt.dll/acpp-common.dll
              - Library/bin/acpp
              - Library/bin/acpp*.exe
              - Library/bin/clang.exe
              - Library/bin/clang++.exe
              - Library/bin/clang-cl.exe
              - Library/bin/clang-cpp.exe
              # cross-flavor linkers (native COFF lld-link is runtime's)
              - Library/bin/ld.lld.exe
              - Library/bin/ld64.lld.exe
              - Library/bin/wasm-ld.exe
              - Library/bin/llvm-ar.exe
              - Library/bin/llvm-nm.exe
              - Library/bin/llvm-ranlib.exe
              - Library/bin/llvm-strip.exe
              - Library/bin/llvm-objcopy.exe
              - Library/bin/llvm-objdump.exe
              - Library/bin/llvm-readelf.exe
              - Library/bin/llvm-readobj.exe
              - Library/bin/llvm-size.exe
              - Library/bin/llvm-strings.exe
              - Library/bin/llvm-symbolizer.exe
              - Library/bin/llvm-cxxfilt.exe
              - Library/bin/llvm-addr2line.exe
              - Library/bin/llvm-dwarfdump.exe
              - Library/bin/llvm-dlltool.exe
              - Library/bin/llvm-lib.exe
              - Library/bin/llvm-rc.exe
              - Library/bin/llvm-mt.exe
              - Library/bin/llvm-windres.exe
              - Library/bin/llvm-cov.exe
              - Library/bin/llvm-profdata.exe
              - Library/bin/llvm-profgen.exe
              - Library/include/AdaptiveCpp/**
              - Library/lib/clang/**
              - Library/lib/cmake/AdaptiveCpp/**
              # compile/link-time acpp components (static libs; the runtime
              # DLL import libs acpp-rt/acpp-common live with the runtime)
              - Library/lib/AdaptiveCpp.lib
              - Library/lib/acpp-frontend.lib
              - Library/lib/acpp-clang-cbs.lib
        exclude:
          # The clang resource dir is claimed above as lib/clang/**, but its
          # lib/ and share/ subtrees are the compiler-rt runtimes and belong to
          # acpp-compiler-rt. Two outputs claiming one path is a clobber, and
          # the partition audit fails the build on it — so the split is stated
          # here rather than discovered in CI.
          - if: linux
            then:
              - lib/clang/${{ llvm_major }}/lib/**
              - lib/clang/${{ llvm_major }}/share/**
            else:
              - Library/lib/clang/${{ llvm_major }}/lib/**
              - Library/lib/clang/${{ llvm_major }}/share/**
    requirements:
      host:
        # Lane mutex — see the note on acpp-runtime's host block.
        - acpp-llvm ==${{ llvm_major }}
      run:
        - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
        - ${{ pin_compatible('acpp-llvm') }}
        - python >=3.9
        - if: linux
          then:
            - libgcc-devel_linux-64 >=13
            - libstdcxx-devel_linux-64 >=13
      run_exports:
        # THE headline export (phase-3 ruling [A]). Anything compiled with this
        # toolchain gets, with zero manifest text on the consumer's side:
        #   acpp-runtime >=25.10.0,<25.11.0a0   (the runtime it links against)
        #   acpp-llvm    >=20,<21.0a0           (the lane it was built for)
        # The second line is what stops a consumer binary built against the
        # llvm20 toolchain from being installed next to the llvm21 runtime.
        strong:
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
          - ${{ pin_compatible('acpp-llvm') }}
      run_constraints:
        # SAME-MAJOR WINDOWS, not blanket exclusions (phase-3 ruling [B]).
        # These names are unversioned on conda-forge, so a bare "<0.0a0" said
        # "this package may never be installed alongside us at ANY version" —
        # which needlessly forbids, say, clang 19 or clang 21 tooling that
        # cannot collide with our LLVM 20 files. The window forbids only the
        # major we actually ship. compiler-rt below was already the model.
        - clang <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - clangxx <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - llvm <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - llvm-tools <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - lld <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - llvmdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - clangdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        # Already major-scoped by name; blanket forbid IS the same-major window.
        - clang-${{ llvm_major }} <0.0a0
        - compiler-rt <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        # Cross-lane exclusion. NOT made redundant by the mutex: the mutex only
        # bites while the two lanes sit on different LLVM majors, and release
        # catches up to nightly's major on every LLVM bump. Stays verbatim.
        - acpp-nightly <0.0a0
      ignore_run_exports:
        # By SOURCE PACKAGE, not by exported name (phase-3 ruling [B]).
        #
        # A name list must be extended every time an upstream feedstock adds an
        # export, and it fails SILENTLY when it is not — which is how the
        # Windows OpenCL loader leaked into packages that never link it.
        # Naming the source package ignores whatever that package exports,
        # this release and the next.
        #
        # Written unconditionally, covering both platforms' package names:
        # ignoring exports from a package that is not in this platform's host
        # env is a verified no-op, so a per-platform conditional would add
        # fragility for nothing.
        #
        # All of these are build-time-only for us. The backends are dlopened at
        # runtime, and their real dependencies are declared by the
        # acpp-runtime-{cuda,intel} metapackages — which is what lets someone
        # install the CPU runtime without dragging in CUDA.
        from_package:
          - cuda-version
          - cuda-cudart-dev
          - cuda-nvvm
          - cuda-nvcc-tools
          - cuda-driver-dev
          - cuda-crt-dev_linux-64
          - cuda-nvcc-impl
          - level-zero-devel
          - opencl-headers
          - ocl-icd
          - khronos-opencl-icd-loader
          - python
    tests:
      - package_contents:
          bin:
            # bin: expansion includes the bare name on win, so the
            # extensionless acpp python driver matches on both platforms
            - clang
            - acpp
            - acpp-info
            - llvm-ar
          files:
            exists:
              - if: linux
                then:
                  - include/AdaptiveCpp/sycl/sycl.hpp
                  - lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
                  - lib/clang/${{ llvm_major }}/include/omp.h
                else:
                  # win nests the SYCL headers one level deeper than linux
                  # (AdaptiveCpp/{AdaptiveCpp,hipSYCL}/sycl/sycl.hpp)
                  - Library/include/AdaptiveCpp/AdaptiveCpp/sycl/sycl.hpp
                  - Library/include/AdaptiveCpp/hipSYCL/sycl/sycl.hpp
                  - Library/lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
                  - Library/lib/clang/${{ llvm_major }}/include/omp.h
            not_exists:
              - if: linux
                then:
                  - bin/clang-tidy
                  - bin/lldb
                  - bin/llvm-config
                else:
                  - Library/bin/clang-tidy.exe
                  - Library/bin/lldb.exe
                  - Library/bin/llvm-config.exe

  # ── compiler-rt: the sanitizer/profile runtimes ─────────────────────────
  # NEW in phase 3. These components were built OFF, which quietly made the
  # toolchain a NON-drop-in replacement: `clang -fsanitize=address` would fail
  # to link against a runtime that was never built. Since standing in for a
  # conda-forge clang is the toolchain's whole promise, they now ship.
  #
  # SEPARATE OUTPUT rather than folded into acpp, matching conda-forge, which
  # ships compiler-rt as its own package: the runtimes are large and only
  # wanted by people who actually instrument builds.
  #
  # Run-dep target settled from conda-forge's own artifact rather than argued
  # (the ruling said to look it up): conda-forge's compiler-rt 20.1.8 depends
  # on `clang 20.1.8.*` — the COMPILER, not the runtime — so this hangs off
  # acpp. Deltas from their layout, for the record: they split into
  # compiler-rt + compiler-rt_linux-64 (a front package plus the platform
  # payload) because of their cross-compilation matrix, which we do not have,
  # so we ship one output; and they pin the exact clang version where we use
  # the lane range plus the mutex.
  - package:
      name: acpp-compiler-rt
      version: ${{ version }}
    # No source here: staging-inheriting outputs get the ENTIRE staging work
    # dir restored (shared/ and its licenses included); fetching ../shared
    # ourselves collides with that restore ("File already exists").
    inherit: llvm-acpp-stage
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      files:
        include:
          # The clang resource directory splits cleanly: include/ holds the
          # compiler's own headers and belongs to acpp; lib/ and share/ hold
          # the compiler-rt archives, shared objects and sanitizer ignorelists
          # and belong here. acpp excludes exactly these two, so the partition
          # stays a partition (the zero-clobber audit enforces it).
          - if: linux
            then:
              - lib/clang/${{ llvm_major }}/lib/**
              - lib/clang/${{ llvm_major }}/share/**
            else:
              - Library/lib/clang/${{ llvm_major }}/lib/**
              - Library/lib/clang/${{ llvm_major }}/share/**
    requirements:
      host:
        # Lane mutex — see the note on acpp-runtime's host block.
        - acpp-llvm ==${{ llvm_major }}
      run:
        - ${{ pin_subpackage('acpp', upper_bound='x.x') }}
        - ${{ pin_compatible('acpp-llvm') }}
      run_constraints:
        # conda-forge's compiler-rt of OUR major installs into the same
        # lib/clang/<major>/lib path, so it is a genuine file collision, not
        # just a version disagreement. A different major is fine.
        - compiler-rt <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        # BOTH platform payload packages. conda-forge splits compiler-rt into a
        # front package plus a per-platform one, and it publishes the Windows
        # half too (compiler-rt_win-64 20.1.8 exists — checked, not assumed),
        # so constraining only the linux name would have left the Windows
        # collision wide open on the one platform this output is newest on.
        - compiler-rt_linux-64 <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - compiler-rt_win-64 <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
        - acpp-compiler-rt-nightly <0.0a0
      ignore_run_exports:
        # By source package; see the note on acpp-runtime.
        from_package:
          - cuda-version
          - cuda-cudart-dev
          - cuda-nvvm
          - cuda-nvcc-tools
          - cuda-driver-dev
          - cuda-crt-dev_linux-64
          - cuda-nvcc-impl
          - level-zero-devel
          - opencl-headers
          - ocl-icd
          - khronos-opencl-icd-loader
          - python
    tests:
      - package_contents:
          files:
            exists:
              - if: linux
                then:
                  # The archive every -fsanitize=address link needs. Named
                  # explicitly rather than globbed: a glob that matches
                  # nothing packages an empty directory and passes silently,
                  # which is how blind partitions ship hollow packages.
                  - lib/clang/${{ llvm_major }}/lib/*/libclang_rt.asan*
                  - lib/clang/${{ llvm_major }}/lib/*/libclang_rt.profile*
                else:
                  - Library/lib/clang/${{ llvm_major }}/lib/*/clang_rt.asan*
            not_exists:
              # The resource HEADERS belong to acpp, not here.
              - if: linux
                then:
                  - lib/clang/${{ llvm_major }}/include/omp.h
                  - bin/clang
                else:
                  - Library/lib/clang/${{ llvm_major }}/include/omp.h
                  - Library/bin/clang.exe

