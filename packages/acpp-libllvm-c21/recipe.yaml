# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-libllvm-c21 — the LLVM-C shared library. Lifted from the reference
# monolith's `libllvm-c${{ major_ver }}` output (llvmdev-feedstock).
#
# WINDOWS ONLY, and upstream says why: the C dylib is "not supported on linux"
# (llvm/tools/llvm-shlib/CMakeLists.txt) and "osx currently fails as well"
# (llvm-project issue 64657). The stage sets LLVM_BUILD_LLVM_C_DYLIB=ON on the
# win leg alone for exactly this output.
#
# SLICING FORM: upstream's $PKG_NAME-branching install script, arm 1.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-libllvm-c${{ llvm_major }}
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  skip: not win
  script:
    interpreter: nu
    file: ../_shared/install_llvm.nu
    env:
      ACPP_LLVM_MAJOR: ${{ llvm_major }}
      ACPP_LLVM_MAJ_MIN: ${{ llvm_maj_min }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    - acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - zlib
    - zstd
  run_constraints:
    - acpp-llvmdev ==${{ llvm_version }}
  run_exports:
    # UPSTREAM: pin_subpackage("libllvm-c" ~ major_ver, upper_bound="x.x")
    - acpp-libllvm-c${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]

tests:
  - package_contents:
      files:
        exists:
          - ${{ library_prefix }}bin/LLVM-C.dll
          - ${{ library_prefix }}lib/LLVM-C.lib

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: LLVM-C shared library
