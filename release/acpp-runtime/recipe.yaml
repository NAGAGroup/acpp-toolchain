# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-runtime (release lane) — runtime slice of the LLVM+AdaptiveCpp build.
#
# The build itself lives in shared/build.nu, which maintains a persistent
# per-lane source+CMake cache: the first package build of a lane pays for
# LLVM, every other one is carve-only. This recipe [a] pins the lane
# (context + script env), [b] declares precise build/host deps, [c] carves
# the runtime file slice, [d] owns the runtime's run-deps/exports/
# constraints (design doc §4/§5).

context:
  llvm_version: "20.1.8"
  llvm_major: "20"
  llvm_maj_min: "20.1"
  acpp_version: "25.10.0"
  version: ${{ acpp_version ~ "_llvm" ~ llvm_version }}
  acpp_ref: "v25.10.0"
  acpp_commit: "9f842c701a599107cc6d117d3539f971036363a1"
  spirv_commit: "f0ae76f12c62ede090e57ece8c986f4c3c971a71" # llvm_release_200
  oclh_commit: "265df85aec478d14a5c5880d7bb92d7dd52714ef"
  oclhpp_commit: "67d100e70612341707725b6648ccca4c10b0dc31"

package:
  name: acpp-runtime
  version: ${{ version }}

source:
  - path: ../../shared
    target_directory: shared

build:
  number: 0
  script:
    interpreter: nu
    content: nu shared/build.nu toolchain
    env:
      ACPP_LANE: release
      ACPP_LLVM_VERSION: ${{ llvm_version }}
      ACPP_ACPP_REF: ${{ acpp_ref }}
      ACPP_ACPP_COMMIT: ${{ acpp_commit }}
      ACPP_SPIRV_COMMIT: ${{ spirv_commit }}
      ACPP_OCLH_COMMIT: ${{ oclh_commit }}
      ACPP_OCLHPP_COMMIT: ${{ oclhpp_commit }}
      ACPP_BUILD_CACHE: ${{ env.get("ACPP_BUILD_CACHE", default="") }}
  files:
    include:
      # SSCP JIT external tools: ptx JIT execs opt+llc; CPU JIT execs
      # opt+llc+lld (verified in llvm-to-backend/{ptx,host}/*.cpp)
      - bin/opt
      - bin/llc
      - bin/lld
      - bin/ld.lld
      # LLVM/Clang/acpp shared libraries (versioned sonames only)
      - lib/*.so*
      # JIT backend plugins, SSCP bitcode, pinned llvm-spirv
      - lib/hipSYCL/**
      # runtime JSON configs
      - etc/AdaptiveCpp/**
      # OMP debugger extension
      - share/gdb/**
      # backend bitcode wiring on activation (opt-in, fail-soft)
      - etc/conda/activate.d/acpp-runtime-activate.sh
    exclude:
      # libomp comes from conda-forge llvm-openmp (design §5)
      - lib/libomp*
      - lib/libarcher*
      - lib/libompd*
      # lldb's library belongs to acpp-lldb
      - lib/liblldb*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nushell
    - git
    - cmake >=3.24
    - ninja
    - ccache
    - python >=3.9
    - swig # lldb python bindings
  host:
    # LLVM optional deps (FORCE_ON)
    - zlib
    - zstd
    - libxml2-devel
    # lldb python scripting
    - python
    # CUDA backend: precise pieces only (no nvcc, no `cuda` metapackage)
    - cuda-cudart-dev >=12,<13
    - cuda-driver-dev >=12,<13
    - cuda-nvvm >=12,<13
    - cuda-nvcc-tools >=12,<13 # nvcc anchors FindCUDAToolkit (never invoked)
    - cuda-crt-dev_linux-64 >=12,<13 # crt/host_defines.h etc. for cudart headers
    # Level Zero backend: link -lze_loader
    - level-zero-devel
    # OpenCL backend: ICD loader + FindOpenCL headers
    - ocl-icd
    - opencl-headers
    # CPU backend: libnuma
    - numactl
  run:
    # rt-backend-omp and -fopenmp link libomp.so (unversioned, ABI-stable)
    - llvm-openmp >=${{ llvm_major }}
    - numactl
    - libstdcxx >=13
  ignore_run_exports:
    by_name:
      # CUDA build-env pieces are NOT runtime deps (GPU opt-in via metapackages)
      - cuda-cudart
      - cuda-nvvm
      - cuda-cccl
      # build-env python (driver scripts) must not pin consumer envs' python
      - python_abi
      # Intel pieces stay OPT-IN via acpp-runtime-intel (plugins fail-soft)
      - level-zero
      - ocl-icd
      # lldb's libpython dep belongs to acpp-lldb, not the runtime
      - python
  run_exports:
    - acpp-runtime ==${{ version }}
  run_constraints:
    # Same-major conda-forge LLVM ABI carriers: identical sonames/paths
    # (file clobber + duplicate ABI). Different majors co-install fine.
    - libllvm${{ llvm_major }} <0.0a0
    - libclang-cpp${{ llvm_maj_min }} <0.0a0
    # CUDA major guard: SSCP emits PTX for the CUDA 12 driver; users add
    # acpp-runtime-cuda for the actual runtime pieces.
    - cuda-cudart >=12,<13
    - cuda-nvvm >=12,<13
    - __cuda >=12,<13
    # Lane exclusion: release and nightly suites ship the same paths.
    - acpp-runtime-nightly <0.0a0

tests:
  - package_contents:
      lib:
        - LLVM
        - clang
        - clang-cpp
        - acpp-rt
        - acpp-common
      bin:
        - opt
        - llc
        - lld
      files:
        exists:
          - lib/hipSYCL/librt-backend-omp.so
          - lib/hipSYCL/librt-backend-cuda.so
          - lib/hipSYCL/librt-backend-ze.so
          - lib/hipSYCL/librt-backend-ocl.so
          - lib/hipSYCL/llvm-to-backend/libllvm-to-backend.so
          - lib/hipSYCL/llvm-to-backend/libllvm-to-ptx.so
          - lib/hipSYCL/llvm-to-backend/libllvm-to-spirv.so
          - lib/hipSYCL/llvm-to-backend/libllvm-to-host.so
          - lib/hipSYCL/ext/llvm-spirv/bin/llvm-spirv
          - etc/AdaptiveCpp/acpp-core.json
          - etc/conda/activate.d/acpp-runtime-activate.sh
        not_exists:
          - lib/hipSYCL/librt-backend-hip.so # AMD off (design §4)
          - lib/libomp.so
          - lib/liblldb.so

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/LLVM-LICENSE.txt
    - licenses/AdaptiveCpp-LICENSE.txt
  summary: AdaptiveCpp SYCL runtime (LLVM ${{ llvm_major }} linked-in, generic SSCP JIT)
  repository: https://github.com/NAGAGroup/acpp-toolchain
