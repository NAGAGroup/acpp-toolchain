  # ── Compiler activation packages (canonical family split, design §D2) ──
  - package:
      name: acpp-clang_linux-64
      version: ${{ version }}
    source:
      # Thin source: license texts + activation/render scripts only. The big
      # trees live on the staging output (see note above outputs:).
      - path: ../shared
        target_directory: shared
    build:
      # Trial dispatches bump this via the build_number workflow input so
      # re-published artifacts get fresh filenames instead of 409ing.
      number: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
      # Lane tag + variant hash + build number. See llvm_build_tag in context.
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_number }}
      skip:
        - target_platform != "linux-64"
      script:
        content: bash shared/activation/render-install.sh clang
    requirements:
      build:
        - sed
        - shellcheck
      run:
        - ${{ pin_subpackage('acpp', upper_bound='x.x') }}
        - sysroot_linux-64 >=2.28
        # POINT REPAIR: the activation script sets AR, RANLIB, NM, STRIP, LD
        # and friends to ${CHOST}-<tool>, which are binutils programs, not
        # clang ones — conda-forge's own ctng compiler activation packages
        # depend on binutils for exactly this reason. Without it the exported
        # environment names tools that need not exist in the prefix, and the
        # failure surfaces as a confusing link error inside someone else's
        # build rather than as a missing dependency here.
        - binutils_linux-64
      run_exports:
        strong:
          - __glibc >=2.28
          - ${{ pin_subpackage('acpp-runtime', upper_bound='x.x') }}
      run_constraints:
        # DELIBERATELY BLANKET, not a same-major window — do not "fix" this to
        # match the pattern used elsewhere in this recipe.
        #
        # The same-major windows exist for FILE collisions: two packages
        # shipping lib/clang/20/**, which only conflict at a shared major. This
        # is a different kind of conflict. An activation package's job is to
        # own CC/CXX/AR/… in the environment's activate.d, and two packages
        # both claiming that role fight regardless of which LLVM they point at.
        # A different-major conda-forge clang_linux-64 is just as broken a
        # roommate as a same-major one.
        - clang_linux-64 <0.0a0
        - acpp-clang-nightly_linux-64 <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/activate-acpp-clang_linux-64.sh
              - etc/conda/deactivate.d/deactivate-acpp-clang_linux-64.sh
              - bin/x86_64-conda-linux-gnu-clang
              - bin/x86_64-conda-linux-gnu-clang-cpp
      - script:
          - |
            # The test env already sources our activate.d script, so assert a
            # true ROUND TRIP (value returns to whatever it was) rather than
            # assuming a pristine env where deactivate leaves it unset.
            export CONDA_PREFIX="${PREFIX}"
            before="${CC:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate-acpp-clang_linux-64.sh"
            test -n "${CC}" || (echo "CC not set" && exit 1)
            echo "${CC}" | grep -q "x86_64-conda-linux-gnu" || (echo "CC not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate-acpp-clang_linux-64.sh"
            after="${CC:-__UNSET__}"
            test "${before}" = "${after}" || (echo "CC not restored: ${before} != ${after}" && exit 1)
            echo "activation round-trip OK"

  - package:
      name: acpp-clangxx_linux-64
