# acpp-activation-win — the Windows compiler-activation packages
# (acpp-clang_win-64, acpp-clangxx_win-64, acpp-clang-cl_win-64), lifted
# in-tree from our fork of conda-forge's clang-win-activation-feedstock.
# The fork point, our own head and what the lift kept are recorded in
# vendor/PROVENANCE.md.
#
# PACKAGE-ONLY manifest; the sole [workspace] is the repo root.
#
# THE RECIPE AND ITS ASSETS LIVE HERE, not behind a `recipe =` redirect into a
# submodule. This methodology has no submodules: the recipe is a lift, edited
# in tree, and its provenance is a recorded ref rather than a gitlink.
#
# WHY THREE OUTPUTS AND NOT FOUR: there is no clangxx-cl. Upstream says why in
# the recipe — "no distinction between C/C++ because clangxx-cl exists
# nowhere". clang-cl.bat sets BOTH CC and CXX to clang-cl.exe.
#
# The clang-cl output and the clang/clangxx pair must not activate together:
# both install a vs<YEAR>_y-* script and both claim CC, so each side carries a
# run_constraint excluding the other.
#
# Windows activation is a genuinely DIFFERENT contract from unix, not a
# parameterisation of it: direct `set VAR=value`, no backup/restore helper,
# no CMAKE_ARGS and no MESON_ARGS, CC=clang.exe rather than a triplet-prefixed
# name. Ordering is engineered through FILENAMES (`vs<YEAR>_y-clang_<plat>.bat`
# sorts after the VS activation; `_z-clangxx` after clang, because clangxx's
# script consumes %CPPFLAGS_USED% that clang's sets). Our scripts are NAMED
# for their ordering, not merely written in an order.
[package]
name = "acpp-activation-win"
version = "21.1"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# THE PASSTHROUGH. The manifest tables add no dependencies — the backend
# regards only what the recipe declares — but they supply the workspace path
# mapping the recipe cannot know, which lets it name `acpp ==<version>` under
# requirements.host as if it came from a channel. acpp is the compiler these
# packages activate, and its weak run_export is what turns that host dependency
# into an exact-build run dependency.
[package.build-dependencies]
acpp = { workspace = true }
