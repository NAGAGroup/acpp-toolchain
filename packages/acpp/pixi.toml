# acpp — the compiler, carved from _acpp-stage. PACKAGE-ONLY manifest; the sole
# [workspace] is the repo root.
[package]
name = "acpp"
version = "0.dev0"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# ⚠ acpp-runtime IS MAPPED HERE, and its absence used to be deliberate — under
# a rule that has since dissolved. The old note said: pixi classifies a
# workspace sibling named in `run_exports` as a source RUN dependency, and
# `pixi publish --path` refuses a package that has one, so acpp had to resolve
# acpp-runtime from the TARGET CHANNEL, which made publish ORDER load-bearing.
#
# That was a batch-of-ONE rule. A whole-workspace publish TOLERATES a sibling
# named in run_exports (measured, exit 0), and the whole-workspace form is how
# this tree is built and published now — so nothing needs to be on a channel
# mid-build and the ordering constraint is gone with it.
#
# THE OMISSION SURVIVED THE REDESIGN AND COST A CI RUN. The recipe's
# `acpp-runtime ==<version>` HOST dependency does resolve, and with no mapping
# it resolves against CHANNELS ONLY — where acpp-runtime has never been
# published. Run 34096769046 died on the first host solve with "No candidates
# were found for acpp-runtime ==2026.9.7", after a green local dry run, because
# `--dry-run` renders and enumerates but does NOT solve host environments.
# `tools/check-sibling-mapping.nu` now asserts the property this comment used
# to be trusted for.
[package.build-dependencies]
_acpp-stage = { workspace = true }
acpp-runtime = { workspace = true }
# The compiler this package used to CARVE and now depends on. Mapped here
# because every source-package dependency is mapped in this table and only
# here; the recipe stays the sole authority for what each one IS.
acpp-clang = { workspace = true }
acpp-clangxx = { workspace = true }
acpp-llvm-tools = { workspace = true }
acpp-lld = { workspace = true }

[package.build.config]
extra-input-globs = ["../_shared/carve.nu"]
