# Windows (win-64) nightly lane — dispatch-only during bring-up, like
# windows.yml was: the nightly staging is a fresh LLVM 21 + acpp develop
# build that has never run on win, so it earns its schedule by proving
# itself first. Flip on the cron once it has a green cycle or two.
#
# Structure mirrors nightly.yml (resolve develop HEAD -> skip if unmoved ->
# build -> publish) with the windows.yml build mechanics (PATH strip, win
# cache paths). Skip-check bookkeeping uses its OWN variable
# (NIGHTLY_LAST_SHA_WIN) so the linux and win nightlies never gate each
# other. Gate set mirrors nightly.yml (no solver-audit job there either);
# win GPU validation is manual on real hardware.
name: windows-nightly

on:
  workflow_dispatch:

concurrency:
  group: windows-nightly
  cancel-in-progress: true

jobs:
  upstream:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      changed: ${{ steps.check.outputs.changed }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: nightly recipe is in sync with release
        run: pixi run -e dev check-nightly
      - name: Resolve AdaptiveCpp develop HEAD
        id: check
        run: |
          # Exact ref: a bare `develop` glob also matches refs/remotes/*/develop
          # upstream, which yields two lines and corrupts $GITHUB_OUTPUT.
          SHA=$(git ls-remote https://github.com/AdaptiveCpp/AdaptiveCpp refs/heads/develop | head -1 | cut -f1)
          LAST=$(gh variable get NIGHTLY_LAST_SHA_WIN -R "$GITHUB_REPOSITORY" 2>/dev/null || echo none)
          {
            echo "sha=$SHA"
            echo "date=$(date -u +%Y.%m.%d)"
            echo "changed=$([ "$SHA" != "$LAST" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build-win:
    needs: upstream
    if: needs.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: Win-x64-64
    timeout-minutes: 300
    env:
      ACPP_NIGHTLY_SHA: ${{ needs.upstream.outputs.sha }}
      ACPP_NIGHTLY_DATE: ${{ needs.upstream.outputs.date }}
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-nightly-${{ github.sha }}
          restore-keys: |
            ccache-win-nightly-
            ccache-win-

      - name: Restore rattler cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\rattler\cache
          key: rattler-win-nightly-${{ github.sha }}
          restore-keys: rattler-win-nightly-

      # Same PATH strip as windows.yml: conda's vs activation + vcvars64.bat
      # overflow cmd.exe's 8191-char limit on the runner's stock PATH.
      - name: Build nightly lane (win-64) -> indexed local channel
        run: |
          $env:PATH = @(
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:USERPROFILE\.pixi\bin",
            "$env:ProgramFiles\Git\cmd"
          ) -join ";"
          Write-Host "PATH length: $($env:PATH.Length)"
          pixi run -e dev build-nightly

      - name: Inventory the produced packages
        shell: bash
        run: |
          find local-channel -name '*.conda' -printf '%f  %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-win-nightly
          path: local-channel/
          retention-days: 14

  publish:
    needs: [upstream, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored API key
      actions: write # the skip-check bookkeeping variable (gh variable set)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-win-nightly
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: Upload to prefix.dev
        run: pixi run -e dev publish-channel
      - name: Record built develop SHA
        run: gh variable set NIGHTLY_LAST_SHA_WIN -R "$GITHUB_REPOSITORY" -b "${{ needs.upstream.outputs.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
