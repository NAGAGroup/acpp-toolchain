# acpp-stage — the expensive LLVM+clang+AdaptiveCpp build, consumed as a HOST
# dependency by every carving subpackage. PACKAGE-ONLY manifest; the sole
# [workspace] is the repo root.
#
# NEVER PUBLISHED. It is a build input, not a product: it installs into
# <prefix>/_stage and each subpackage copies its own portion to the top level.
#
# Because of `publish = false`, a whole-workspace `pixi publish` FAILS with
# "Every source dependency of a published package must itself be published in
# the same batch". The sanctioned route is `pixi publish --path <subpackage>`,
# which is a batch of one: only a published package's RUN dependencies may not
# be source deps, and the stage is a HOST dep. Measured green, dry and real.
#
# ⚠ ONE JOB PER PLATFORM. The expensive build runs exactly ONCE across all
# subpackages of a platform — including across separate cold
# `pixi publish --path` invocations — because of pixi's .pixi/bld cache.
# Splitting a platform's subpackages across CI jobs re-runs LLVM in each job.
# Parallelise the CI matrix by PLATFORM, never by output.
[package]
name = "acpp-stage"
version = "0.dev0"
publish = false

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build.config]
# The build script and patches live in ../_shared so ten subpackages cannot
# drift from one another. pixi reads them straight from the source tree
# (verified: the build invoked .../packages/acpp-stage/../_shared/build-stage.nu),
# but the default input globs are derived from the recipe and the package
# directory — a shared file living OUTSIDE this directory would not otherwise
# invalidate the build cache when edited.
#
# This replaces the old `staging_inputs` hash, which existed because
# rattler-build's staging cache key hashed resolved requirements but not the
# sources, patches or build script, so editing a patch silently reused a stale
# toolchain. That workaround needed a generator script plus a CI check to stay
# honest. Declaring the real inputs is the structural version of the same fix.
extra-input-globs = [
  "../_shared/build-stage.nu",
  "../_shared/patches/**",
]
