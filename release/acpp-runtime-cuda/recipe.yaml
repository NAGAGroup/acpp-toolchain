# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-runtime-cuda — PRECISE CUDA runtime deps for acpp's generic JIT:
# libcudart (linked by rt-backend-cuda) + libdevice bitcode (JIT-linked).
# Deliberately NOT cuda-nvrtc (never used: acpp emits PTX, the driver JITs
# it) and NOT the full `cuda` metapackage. The NVIDIA driver comes from
# the host system (__cuda).

package:
  name: acpp-runtime-cuda
  version: "1.0.0"

build:
  number: 0

requirements:
  run:
    - cuda-cudart >=12,<13
    - cuda-nvvm >=12,<13
  run_constraints:
    - __cuda >=12,<13

about:
  homepage: https://github.com/NAGAGroup/acpp-toolchain
  license: BSD-3-Clause
  summary: Opt-in CUDA runtime dependencies for the acpp SYCL runtime (generic SSCP JIT)
  repository: https://github.com/NAGAGroup/acpp-toolchain
