# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-clang-format — the unversioned clang-format. Lifted from the reference
# monolith's `clang-format` output (clangdev-feedstock). On unix it is a symlink
# onto acpp-clang-format-21; on win, where there are no symlinks and the
# suffixed package does not exist, it carries the real executable.
#
# SLICING FORM: GLOB LIST, upstream's own — one named binary. Cross-checked
# against conda-forge's clang-format-21.1.8 artifact: `bin/clang-format` on
# linux-64 and osx-arm64, `Library/bin/clang-format.exe` on win-64.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-clang-format
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_h${{ hash }}_${{ build_num }}
  variant:
    down_prioritize_variant: ${{ 0 if variant == "default" else 1 }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: ${{ "bin/clang-format" if unix else "Library/bin/clang-format.exe" }}

requirements:
  build:
    # "for run-export on win. This is just a symlink on unix"
    - if: win
      then:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
  run:
    - if: unix
      then:
        # UPSTREAM: pin_subpackage("libclang-cpp" ~ maj_min, upper_bound="x.x")
        - acpp-libclang-cpp${{ llvm_maj_min }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
        # UPSTREAM: pin_subpackage("clang-format-" ~ major_version, exact=True)
        - acpp-clang-format-${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # "we need to do this manually because clang_bootstrap has no run-export"
    - if: osx
      then: acpp-libcxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]

tests:
  - package_contents:
      files:
        exists:
          - ${{ library_prefix }}bin/clang-format${{ ".exe" if win else "" }}
        not_exists:
          # c-index-test belongs to acpp-clang-tools
          - ${{ library_prefix }}bin/c-index-test${{ ".exe" if win else "" }}

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: clang-format
