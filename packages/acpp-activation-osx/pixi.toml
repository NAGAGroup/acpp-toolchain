# acpp-activation-osx — the osx-arm64 compiler-activation packages
# (acpp-clang_osx-arm64 / acpp-clangxx_osx-arm64), built from our fork of
# conda-forge's clang-compiler-activation-feedstock.
#
# PACKAGE-ONLY manifest; the sole [workspace] is the repo root. The manifest
# sits outside the submodule and points into it — `pixi publish` skips any
# subdirectory carrying its own workspace, and feedstocks ship pixi.toml files.
#
# WHY THIS FEEDSTOCK FOR macOS: the clang_osx-* / clangxx_osx-* family is
# produced by clang-compiler-activation, NOT by ctng-compiler-activation
# (which owns linux) and not by clangdev (which owns the NATIVE clang_impl_*).
#
# TWO OUTPUTS FROM ONE RECIPE, which is why this manifest's name matches
# neither of them. The C++ activation script only sets the CXX half and relies
# on the C one having run first, so the pair is pinned to each other with
# pin_subpackage(exact=True) — a function that names another output of the SAME
# recipe and therefore exists only while they share one.
[package]
name = "acpp-activation-osx"
version = "0.dev0"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# THE PASSTHROUGH. The manifest tables add no dependencies — the backend
# regards only what the recipe declares — but they supply the workspace path
# mapping the recipe cannot know, which lets it name `acpp ==<version>` under
# requirements.host as if it came from a channel. acpp is the compiler these
# packages activate, and its weak run_export is what turns that host dependency
# into an exact-build run dependency.
[package.build-dependencies]
acpp = { workspace = true }

[package.build.config]
recipe = "../../vendor/clang-compiler-activation-feedstock/recipe/recipe.yaml"
