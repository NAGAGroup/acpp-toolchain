# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-clangxx — the UNVERSIONED clang++ driver and its conda configuration
# file. Lifted from the reference monolith's `clangxx` output
# (clangdev-feedstock).
#
# TWO BUILDS OF ONE NAME off the `with_cfg` axis, exactly as acpp-clang has —
# see that recipe for what the axis means.
#
# SLICING FORM: GLOB LIST, upstream's own — named files, all name-scoped.
#
# THE `bin/c++` SPLIT IS DELIBERATE AND FOLLOWS UPSTREAM'S RECIPE, NOT ITS
# ARTIFACT. HEAD's glob claims `bin/c++` on osx only, "to avoid conflicts with
# gcc"; conda-forge's published linux-64 clangxx-21.1.8 artifact nonetheless
# ships it, so the two disagree and the artifact is from an older revision. We
# follow HEAD. The consequence is that the stage's linux `bin/c++`, `bin/cc` and
# `bin/cpp` symlinks go unclaimed by any package — under-shipping, which is the
# safe side of this trade: over-shipping would be an install-time clobber
# against conda-forge's gcc activation.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}
  target_no_ver: ${{ "x86_64-conda-linux-gnu" if linux else "arm64-apple-darwin" if osx else "x86_64-pc-windows-msvc" }}

package:
  name: acpp-clangxx
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_${{ "cfg" if with_cfg else "nocfg" }}_h${{ hash }}_${{ build_num }}
  variant:
    # increasing numbers correspond to decreasing priority
    # 0:     with_cfg, variant == "default"
    # 1: not with_cfg, variant == "default"
    # 2:     with_cfg, variant != "default"
    # 3: not with_cfg, variant != "default"
    down_prioritize_variant: ${{ ((not with_cfg) | int) + 2 * ((variant != "default") | int) }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: >-
        ${{ library_prefix }}bin/clang++${{ ".exe" if win else "" }}
        ${{ ";bin/" ~ target_no_ver ~ "-clang++.cfg" if unix and with_cfg else "" }}
        ${{ ";bin/c++" if osx and with_cfg else "" }}

requirements:
  build:
    # "for run-export on win. This is just a symlink on unix"
    - if: win
      then:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    - if: win
      then:
        - zlib
        - zstd
  run:
    # UPSTREAM: pin_subpackage("clang", exact=True). TIGHTENED past the
    # workspace default `build="<tag>_*"`: acpp-clang ships two builds of one
    # name off the with_cfg axis, and a tag-only glob would let the cfg clangxx
    # pull the nocfg clang. The cfg component is repeated so "exact" keeps
    # meaning "the matching build".
    - acpp-clang[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_${{ variant }}_${{ "cfg" if with_cfg else "nocfg" }}_*"]
    - if: unix
      # "we'd like to do the equivalent of pin_subpackage here (modulo
      # cfg/nocfg); however, clang-compiler-activation-feedstock now depends on
      # being able to co-install clangxx_impl_<cross_target_platform> with a
      # clangxx from here (to have the symlinks available also for the bootstrap
      # compilers), so we can't pin the build number either"
      # UPSTREAM: `clangxx_impl_${{ target_platform }} ==${{ version }} ${{ variant }}_*`
      then: acpp-clangxx_impl_${{ target_platform }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_${{ variant }}_*"]
    - if: linux
      then: libstdcxx-devel_${{ target_platform }}
    - if: osx
      # UPSTREAM: `libcxx-devel ${{ maj_min }}.*`, a minor pin, "to avoid issues
      # when building new libcxx versions". Ours, in the exact same-build form —
      # see the note in ../acpp-clangxx-impl/recipe.yaml.
      then: acpp-libcxx-devel[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]

tests:
  - package_contents:
      files:
        exists:
          - ${{ library_prefix }}bin/clang++${{ ".exe" if win else "" }}
          - if: unix and with_cfg
            then: bin/${{ target_no_ver }}-clang++.cfg
        not_exists:
          # the C drivers are acpp-clang's, the versioned one acpp-clang-21's
          - ${{ library_prefix }}bin/clang${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/clang++-${{ llvm_major }}${{ ".exe" if win else "" }}
          # bin/c++ is osx-only here, per upstream's recipe
          - if: linux
            then: bin/c++

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: Development headers and libraries for the clang++ compiler
