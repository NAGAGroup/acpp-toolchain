# Cirun runner definitions — ephemeral Azure VMs for CI (design v3 §D3).
# Workflows opt in via `runs-on: cirun-<label>--${{ github.run_id }}`.
#
# Sizing: Standard_D8ads_v7 fits the subscription's default DADSv7 quota (10
# vCPU). Bump to D32ads_v7 / enable preemptible when the quota requests land —
# one-line changes here, nothing else moves.
runners:
  - name: linux-builder
    cloud: azure
    region: eastus
    instance_type: Standard_D8ads_v7
    machine_image: "Canonical:ubuntu-24_04-lts:server:latest"
    preemptible: false # spot quota not granted yet; flip when it is
    extra_config:
      storageProfile:
        osDisk:
          diskSizeGB: 150 # LLVM work dir + build envs + ccache
    labels:
      - cirun-linux-builder

  # GPU smoke runner — uncomment when NCASv3_T4 quota is granted.
  # CPU gates run everywhere; CUDA JIT smoke remains a local 4090 gate until
  # then (design v3 §D3).
