# linux-aarch64 TRIAL: build the release lane natively on the arm runner,
# publish OFF. Proves the OMP-only lane end-to-end (staging build, carve,
# package tests) before an aarch64 leg joins release.yml and publishes.
name: arm-trial
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override"
        default: "0"

concurrency:
  group: arm-trial
  cancel-in-progress: true

jobs:
  build-linux-aarch64:
    runs-on: linux-arm64-v32
    timeout-minutes: 300
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-arm-release-${{ github.run_id }}
          restore-keys: ccache-arm-release-
      - name: staging cache
        uses: actions/cache@v4
        with:
          path: output-staging
          key: staging-arm-release-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-${{ github.run_id }}
          restore-keys: staging-arm-release-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-
      - name: Build release lane (no publish)
        run: pixi run -e dev build-release
