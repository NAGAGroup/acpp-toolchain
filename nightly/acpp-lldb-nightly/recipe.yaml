# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-lldb (nightly lane — tracks AdaptiveCpp develop) — debugger slice.
# Build mechanics: see release/acpp-runtime/recipe.yaml + shared/build.nu.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  # nightly version: date injected by the build driver/CI
  acpp_version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  version: ${{ acpp_version ~ "_llvm" ~ llvm_version }}
  acpp_ref: "develop"
  acpp_commit: "" # empty => head of ref, resolved+recorded by build.nu
  spirv_commit: "3d3f0dece590232aab1851f1bea860c2a381ec34" # llvm_release_210
  oclh_commit: "265df85aec478d14a5c5880d7bb92d7dd52714ef"
  oclhpp_commit: "67d100e70612341707725b6648ccca4c10b0dc31"

package:
  name: acpp-lldb-nightly
  version: ${{ version }}

source:
  - path: ../../shared
    target_directory: shared

build:
  number: 0
  script:
    interpreter: nu
    content: nu shared/build.nu toolchain
    env:
      ACPP_LANE: nightly
      ACPP_LLVM_VERSION: ${{ llvm_version }}
      ACPP_ACPP_REF: ${{ acpp_ref }}
      ACPP_ACPP_COMMIT: ${{ acpp_commit }}
      ACPP_SPIRV_COMMIT: ${{ spirv_commit }}
      ACPP_OCLH_COMMIT: ${{ oclh_commit }}
      ACPP_OCLHPP_COMMIT: ${{ oclhpp_commit }}
      ACPP_BUILD_CACHE: ${{ env.get("ACPP_BUILD_CACHE", default="") }}
  files:
    include:
      - bin/lldb*
      - lib/liblldb*
      # python bindings (lldb module)
      - lib/python*/**

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nushell
    - git
    - cmake >=3.24
    - ninja
    - ccache
    - python >=3.9
    - swig # lldb python bindings
  host:
    - zlib
    - zstd
    - libxml2-devel
    - python
    - cuda-cudart-dev >=12,<13
    - cuda-driver-dev >=12,<13
    - cuda-nvvm >=12,<13
    - cuda-nvcc-tools >=12,<13 # nvcc anchors FindCUDAToolkit (never invoked)
    - level-zero-devel
    - ocl-icd
    - opencl-headers
    - numactl
  run:
    - acpp-runtime-nightly ==${{ version }}
  ignore_run_exports:
    by_name:
      - level-zero
      - ocl-icd
  run_constraints:
    - lldb <0.0a0
    - acpp-lldb <0.0a0

tests:
  - package_contents:
      bin:
        - lldb
        - lldb-server

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/LLVM-LICENSE.txt
    - licenses/AdaptiveCpp-LICENSE.txt
  summary: LLDB debugger matching the acpp toolchain LLVM
  repository: https://github.com/NAGAGroup/acpp-toolchain
