# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-clang-21 — the VERSION-SUFFIXED clang drivers plus clang's half of the
# resource directory. Lifted from the reference monolith's
# `clang-${{ major_version }}` output (clangdev-feedstock).
#
# SLICING FORM: GLOB LIST, upstream's own. The four `bin/clang*-21` names are
# already version-scoped and cannot reach another project's output. The
# resource directory is the one part that needs care, and it is the partition
# acpp-compiler-rt21 states from the other side:
#
#   ⚠ SCOPE OF `lib/${{ llvm_major }}/include` DERIVED FROM CONDA-FORGE'S
#   clang-21-21.1.8 ARTIFACT, not from upstream's `lib/clang/<major>/*` glob,
#   because our union stage removes the per-project scoping that glob relied
#   on. Read with tools/upstream-paths.nu: the artifact ships 274 include paths
#   (235 flat headers plus cuda_wrappers/, llvm_libc_wrappers/,
#   llvm_offload_wrappers/, openmp_wrappers/, ppc_wrappers/, zos_wrappers/) and
#   NOTHING under `lib/clang/21/lib` except, on osx only, libLTO.dylib. The
#   five subdirectories excluded below — fuzzer, orc, profile, sanitizer, xray
#   — are compiler-rt's, and `lib/clang/21/lib/**` is compiler-rt's entirely.
#   Expressing our half as include-minus-those-five also makes the partition
#   SELF-ASSERTING: carve.nu fails on an exclude glob that matches nothing, so
#   the day compiler-rt stops installing one of them this recipe goes red
#   rather than silently swallowing a sibling's files.
#
# The osx `lib/clang/21/lib/libLTO.dylib` entry is a symlink the stage creates
# onto the versioned libLTO in acpp-libllvm21, so that clang can find an LTO
# plugin without acpp-llvmdev installed. Upstream's build.sh says why at length.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-clang-${{ llvm_major }}
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_h${{ hash }}_${{ build_num }}
  variant:
    down_prioritize_variant: ${{ 0 if variant == "default" else 1 }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      # win ships only the two drivers the stage's win fixup copies
      # (clang-21.exe, clang++-21.exe); clang-cl and clang-cpp are symlinks on
      # unix and Windows has none.
      ACPP_CARVE: >-
        ${{ library_prefix }}bin/clang-${{ llvm_major }}${{ ".exe" if win else "" }};
        ${{ library_prefix }}bin/clang++-${{ llvm_major }}${{ ".exe" if win else "" }};
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/**
        ${{ ";bin/clang-cl-" ~ llvm_major ~ ";bin/clang-cpp-" ~ llvm_major if unix else "" }}
        ${{ ";lib/clang/" ~ llvm_major ~ "/lib/libLTO.dylib" if osx else "" }}
      ACPP_CARVE_EXCLUDE: >-
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/fuzzer/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/orc/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/profile/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/sanitizer/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/xray/**

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    # UPSTREAM: pin_subpackage("libclang-cpp" ~ maj_min, exact=True)
    - if: unix
      then: acpp-libclang-cpp${{ llvm_maj_min }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # "Use the same requirements as the top-level requirements, but only the
    # ones required for run_exports"
    - acpp-llvm ==${{ llvm_version }}
    - if: win
      then:
        - zlib
        - zstd
  run:
    # UPSTREAM: `compiler-rt${{ major_version }} ==${{ version }}` — a plain
    # version match, not a pin_subpackage, so only the name is rewritten.
    - acpp-compiler-rt${{ llvm_major }} ==${{ llvm_version }}
    # UPSTREAM: pin_subpackage("libclang-cpp" ~ maj_min, exact=True)
    - if: unix
      then: acpp-libclang-cpp${{ llvm_maj_min }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # "we need to do this manually because clang_bootstrap has no run-export"
    - if: osx
      then: libcxx >=${{ llvm_version }}

tests:
  - package_contents:
      files:
        exists:
          # headers in clang-specific locations
          - ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/stdatomic.h
          - ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/omp.h
          - if: osx
            then: lib/clang/${{ llvm_major }}/lib/libLTO.dylib
        not_exists:
          # the sanitizer headers are acpp-compiler-rt21's half of the resource
          # directory; the unversioned drivers are acpp-clang's and
          # acpp-clangxx's; the unversioned libclang-cpp is acpp-libclang-cpp's
          - ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/sanitizer/asan_interface.h
          - if: linux
            then: lib/libclang-cpp.so
          - if: osx
            then: lib/libclang-cpp.dylib
          - ${{ library_prefix }}bin/clang${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/clang-cl${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/clang-cpp${{ ".exe" if win else "" }}

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: The clang compiler drivers and resource directory, version-suffixed
