schema_version: 1

# acpp-activation-linux — the linux-64 compiler activation pair,
# acpp-clang_linux-64 and acpp-clangxx_linux-64.
#
# LIFTED IN-TREE from our fork of conda-forge/ctng-compiler-activation-feedstock
# (fork point and our own head are recorded in vendor/PROVENANCE.md; the
# submodule is retired, because this methodology has no submodules). Upstream
# builds a cross matrix over eight targets and ships gcc, g++, gfortran, a
# bootstrap compiler and the clang pair; we ship the clang pair for one
# natively-built platform, pointed at the clang WE ship. The activation scripts
# themselves are upstream's, generated by upstream's build_scripts.sh.
#
# WHAT CHANGED, and why:
#   * Outputs: only clang and clangxx remain. gcc/g++/gfortran/gcc_bootstrap
#     activate a GNU toolchain we do not ship. clang_impl_/clangxx_impl_ are
#     skipped natively upstream because clangdev creates the triplet-prefixed
#     driver symlinks — and we now SHIP a clangdev family, so those two
#     packages exist and own bin/${CHOST}-clang{,-cpp,++}. This recipe declares
#     them as run dependencies and creates nothing: the activation exports
#     CC=x86_64-conda-linux-gnu-clang, so the name must exist, but two packages
#     shipping it would clobber at install time.
#   * The cross axis is gone. cross_target_platform is a HARD LITERAL below,
#     not ${{ target_platform }}: a literal makes the win and osx jobs skip
#     this recipe, whereas target_platform would make them render it under
#     their own names. triplet/CHOST/CBUILD follow from it.
#   * cross_stdlib/cross_stdlib_version collapse onto c_stdlib/c_stdlib_version
#     — for a native build they are the same axis, so the glibc floor is one
#     number in variants.yaml rather than two kept equal by hand.
#   * clang_version is llvm_version: the clang being activated is the clang
#     this toolchain ships.
#   * The run dependency on `clang` is a dependency on `acpp`, taken as a HOST
#     dependency so its exact-build run_export computes the run spec.

context:
  # ── the platform, as constants ────────────────────────────────────────────
  # A LITERAL, never ${{ target_platform }}. See the note above.
  cross_target_platform: linux-64
  triplet: x86_64-conda-linux-gnu

  # ── the toolchain being activated ─────────────────────────────────────────
  # Self-referencing, so variants.yaml stays the single source of truth and the
  # key enters this build's variant hash: a build against a different LLVM must
  # not collide with this one. A literal here would shadow the variant key and
  # keep its own value after variants.yaml moved.
  llvm_version: ${{ llvm_version }}
  # THE ACTIVATION VERSION IS MAJOR.MINOR, not the full patch and not a date —
  # measured in conda-forge's own tree, where clang_<plat> carries 21.1 while
  # the content packages carry 21.1.8. An activation package is a contract about
  # which compiler SERIES it configures; a patch bump does not change it.
  version: ${{ (llvm_version | split(".") | first) ~ "." ~ (llvm_version | split("."))[1] }}
  # AdaptiveCpp's own version, which is a DATE — a different axis from the LLVM
  # one above. `acpp` is ours and date-versioned, so the host dependency below
  # cannot be written in terms of `version`.
  # ⚠ CI MUST SET ACPP_NIGHTLY_DATE. The default is a LOCAL-RENDER placeholder,
  # not a shippable version: 0.dev0 sorts below every real date, so a set built
  # without it would publish as a prerelease nobody resolves. E2E-4 fails the
  # workflow if an unset date reaches a publish; this default exists so a dry
  # run on a laptop does not need the variable.
  acpp_version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  # The minor above c_stdlib_version, so the sysroot dependency below can be
  # bounded to exactly the glibc we chose. Derived, so the floor stays one
  # number in variants.yaml.
  # GUARDED, because a recipe's `context:` is evaluated BEFORE its `skip:`.
  # Every output here is skipped off this platform, but the expression below
  # still runs on a Windows job walking the workspace — and variants.yaml
  # deliberately defines NO win `c_stdlib_version` (there is no C standard
  # library package to version on Windows). A conditional evaluates only the
  # branch it takes, so the dummy keeps the render alive while the real value
  # is still required where it matters. Same idiom as the win recipe's
  # `${{ VCVER if win else "0.0" }}`.
  c_stdlib_version_here: ${{ c_stdlib_version if not win else "0.0" }}
  c_stdlib_version_next: ${{ (c_stdlib_version_here | split(".") | first) ~ "." ~ ((c_stdlib_version_here | split(".") | last | int) + 1) }}
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  # Read from the env ONCE, into context: `build_number` is undefined inside
  # requirements, and the outputs below need the same value build.number uses.
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}

  # Output names, spelled once so the recipe, the installed script filenames
  # and the tests cannot disagree.
  pkg_clang: acpp-clang_${{ cross_target_platform }}
  pkg_clangxx: acpp-clangxx_${{ cross_target_platform }}

recipe:
  name: acpp-activation-linux
  version: ${{ version }}

source:
  # The activation templates, build_scripts.sh and the tests — this directory.
  - path: .

build:
  number: ${{ build_num }}

outputs:
  - package:
      name: ${{ pkg_clang }}
      version: ${{ version }}
    build:
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
      skip:
        - target_platform != "linux-64"
      script:
        file: install-clang.sh
        env:
          # cross_target_platform is a recipe constant rather than a variant
          # key, so it does not reach the build environment on its own;
          # get_cpu_arch.sh reads it to derive CHOST/CBUILD.
          cross_target_platform: ${{ cross_target_platform }}
          PKG_NAME: ${{ pkg_clang }}
    requirements:
      build:
        - sed
        # The generation gate: build_scripts.sh fails the build on any
        # shellcheck finding in a script we are about to ship.
        - shellcheck
      host:
        # The compiler being activated. HOST, not run: acpp's weak run_export
        # states its own exact build (version, LLVM tag, build number), so the
        # run dependency on it is COMPUTED rather than transcribed, and acpp's
        # strong export adds the matching acpp-runtime.
        - acpp ==${{ acpp_version }}
      run:
        # UPSTREAM: `clang_impl_${{ cross_target_platform }} ${{ clang_version }}.*`
        #
        # THE DRIVER THE ACTIVATION NAMES. activate-clang.sh exports
        # CC=${CHOST}-clang, CPP=${CHOST}-clang-cpp and OBJC=${CHOST}-clang;
        # bin/${{ triplet }}-clang{,-cpp} is acpp-clang_impl_linux-64's entire
        # content. Without this dependency the package ships an activation
        # whose CC names a binary nothing provides, and the failure surfaces
        # inside someone else's build rather than here.
        - acpp-clang_impl_${{ cross_target_platform }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
        # The activation exports CONDA_BUILD_SYSROOT and a CMAKE_PREFIX_PATH
        # entry under ${CONDA_PREFIX}/${{ triplet }}/sysroot; this package owns
        # that path.
        #
        # PINNED TO THE FLOOR, not floored. sysroot_linux-64 is versioned BY the
        # glibc it provides (2.17, 2.28, 2.34, 2.39) and each one exports
        # __glibc >=<its own version>. A `>=` spec resolves to the newest, so
        # consumers would compile against 2.39 headers while the run_export
        # below still claimed 2.28 — the package would understate its own floor.
        - ${{ c_stdlib }}_${{ cross_target_platform }} >=${{ c_stdlib_version_here }},<${{ c_stdlib_version_next }}.0a0
        # The activation sets AR, RANLIB, NM, STRIP and LD to ${CHOST}-<tool>,
        # which are binutils programs, not clang ones. Without this the
        # exported environment names tools that need not exist in the prefix,
        # and the failure surfaces as a link error inside someone else's build.
        - binutils_${{ cross_target_platform }}
      run_exports:
        strong:
          # THE RUNTIME EXPORT, RESTATED HERE ON PURPOSE. Anything compiled with
          # this toolchain links AdaptiveCpp's runtime, and upstream's own
          # comment on the equivalent libgcc line says why it cannot be
          # inherited: "Because transitive run_exports do not work" — an export
          # reaches DIRECT dependents only, so the toolchain package must carry
          # it itself even though `acpp` (a host dependency above) exports it
          # too. A FLOOR, not a pin, exactly as upstream writes libgcc: this
          # spec lands in third-party packages, and pinning their runtime to one
          # build of ours would make them unsolvable against every later build.
          - acpp-runtime >=${{ acpp_version }}
          # The floor anything built with this toolchain must claim, driven by
          # the same variant key as the sysroot dependency above.
          - __glibc >=${{ c_stdlib_version_here }}
        # NO WEAK EXPORTS, deliberately. A weak run_export fires for HOST
        # dependents, and nothing host-depends on an activation package — it is
        # build-time tooling. Upstream's activation outputs declare strong
        # exports only, for the same reason.
      run_constraints:
        # DELIBERATELY BLANKET, not a same-major window. The same-major windows
        # elsewhere in this toolchain exist for FILE collisions, which only
        # occur at a shared major. This is a different conflict: an activation
        # package owns CC/CXX/AR/... in the environment's activate.d, and two
        # packages claiming that role fight regardless of which LLVM they point
        # at.
        - clang_${{ cross_target_platform }} <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/activate-${{ pkg_clang }}.sh
              - etc/conda/deactivate.d/deactivate-${{ pkg_clang }}.sh
            not_exists:
              # acpp-clang_impl_linux-64 owns these. Asserted ABSENT rather than
              # left unmentioned: two packages shipping one path is an
              # install-time clobber that no render can see, and this is the
              # cheap check that the fold stays reverted.
              - bin/${{ triplet }}-clang
              - bin/${{ triplet }}-clang-cpp
      - files:
          recipe:
            - tests
        script:
          - ${CC} ${CFLAGS} -Wall tests/aligned_alloc.c -c -o c_aligned.o -v
          - ${CC} ${LDFLAGS} c_aligned.o -o c_aligned
          - ./c_aligned
          # clang does not support -fno-merge-constants, and the generated
          # script is the gcc one with that flag sed'd out — this asserts the
          # sed actually happened. Upstream issue 63.
          - '! echo "${CFLAGS}" | grep -q -- "-fno-merge-constants"'
          # CONDA_BUILD_SYSROOT is what lets clang++ find the C++ headers, and
          # its value is a path inside the sysroot package depended on above.
          - test -z "${CONDA_BUILD_SYSROOT+x}" && echo "CONDA_BUILD_SYSROOT is not set" && exit 1
          - test -d ${CONDA_BUILD_SYSROOT} || exit 1
      - script:
          - |
            # The test environment has already sourced our activate.d script,
            # so assert a true ROUND TRIP — the value returns to whatever it
            # was — rather than assuming a pristine environment in which
            # deactivation leaves it unset.
            export CONDA_PREFIX="${PREFIX}"
            before="${CC:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate-${{ pkg_clang }}.sh"
            test -n "${CC}" || (echo "CC not set" && exit 1)
            echo "${CC}" | grep -q "${{ triplet }}" || (echo "CC not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate-${{ pkg_clang }}.sh"
            after="${CC:-__UNSET__}"
            test "${before}" = "${after}" || (echo "CC not restored: ${before} != ${after}" && exit 1)
            echo "activation round-trip OK"
    about:
      summary: Clang compiler activation for the acpp toolchain (C)
      license: BSD-3-Clause
      license_file: LICENSE
      homepage: https://github.com/NAGAGroup/ctng-compiler-activation-feedstock

  - package:
      name: ${{ pkg_clangxx }}
      version: ${{ version }}
    build:
      string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
      skip:
        - target_platform != "linux-64"
      script:
        file: install-clang++.sh
        env:
          cross_target_platform: ${{ cross_target_platform }}
          PKG_NAME: ${{ pkg_clangxx }}
    requirements:
      build:
        - sed
        - shellcheck
      host:
        - acpp ==${{ acpp_version }}
      run:
        # The C++ activation script sets only the CXX half; it relies on the C
        # script having run first for CPPFLAGS, CMAKE_ARGS and the sysroot.
        # Both live in the same recipe, so this is a real exact pin.
        - ${{ pin_subpackage(pkg_clang, exact=True) }}
        # UPSTREAM: `clangxx_impl_${{ cross_target_platform }} ${{ clang_version }}.*`
        #
        # activate-clang++.sh exports CXX=${CHOST}-clang++ and points
        # ACPP_CLANG and ACPP_CPU_CXX at the same path;
        # bin/${{ triplet }}-clang++ is acpp-clangxx_impl_linux-64's entire
        # content. See the C output for why this package no longer creates it.
        - acpp-clangxx_impl_${{ cross_target_platform }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
      run_exports:
        strong:
          # Repeated here, not inherited from the C package above — see its
          # comment; transitive run_exports do not work.
          - acpp-runtime >=${{ acpp_version }}
          - __glibc >=${{ c_stdlib_version_here }}
      run_constraints:
        - clangxx_${{ cross_target_platform }} <0.0a0
    tests:
      - package_contents:
          files:
            exists:
              - etc/conda/activate.d/activate-${{ pkg_clangxx }}.sh
              - etc/conda/deactivate.d/deactivate-${{ pkg_clangxx }}.sh
            not_exists:
              # acpp-clangxx_impl_linux-64 owns this one — see the C output.
              - bin/${{ triplet }}-clang++
      - files:
          recipe:
            - tests
        script:
          - ${CXX} ${CXXFLAGS} -Wall tests/aligned_alloc.cpp -c -o cpp_aligned.o
          - ${CXX} ${LDFLAGS} cpp_aligned.o -o cpp_aligned
          - ./cpp_aligned
          - '! echo "${CXXFLAGS}" | grep -q -- "-fno-merge-constants"'
          - test -z "${CONDA_BUILD_SYSROOT+x}" && echo "CONDA_BUILD_SYSROOT is not set" && exit 1
          - test -d ${CONDA_BUILD_SYSROOT} || exit 1
          # The ACPP delta: the SYCL environment this activation adds on top of
          # the upstream contract. ACPP_TARGETS respects a pre-set value.
          - 'test -n "${ACPP_TARGETS}" || (echo "ACPP_TARGETS not set" && exit 1)'
          - 'test -x "${ACPP_CPU_CXX}" || (echo "ACPP_CPU_CXX not executable" && exit 1)'
      - script:
          - |
            export CONDA_PREFIX="${PREFIX}"
            before="${CXX:-__UNSET__}"
            source "${PREFIX}/etc/conda/activate.d/activate-${{ pkg_clangxx }}.sh"
            test -n "${CXX}" || (echo "CXX not set" && exit 1)
            echo "${CXX}" | grep -q "${{ triplet }}" || (echo "CXX not triple-prefixed" && exit 1)
            source "${PREFIX}/etc/conda/deactivate.d/deactivate-${{ pkg_clangxx }}.sh"
            after="${CXX:-__UNSET__}"
            test "${before}" = "${after}" || (echo "CXX not restored: ${before} != ${after}" && exit 1)
            echo "activation round-trip OK"
    about:
      summary: Clang compiler activation for the acpp toolchain (C++ and SYCL)
      license: BSD-3-Clause
      license_file: LICENSE
      homepage: https://github.com/NAGAGroup/ctng-compiler-activation-feedstock

about:
  summary: Compiler activation scripts for the acpp clang toolchain
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/NAGAGroup/ctng-compiler-activation-feedstock

extra:
  feedstock-name: ctng-compiler-activation
  recipe-maintainers:
    - isuruf
    - beckermr
