# Nightly lane (v3): daily rebuild from AdaptiveCpp develop HEAD, skipped when
# develop hasn't moved. Same staging-recipe build path as release, with the
# date-injected version (ACPP_NIGHTLY_DATE).
name: nightly
on:
  schedule:
    - cron: "17 9 * * *" # daily; 24h cadence per design
  workflow_dispatch:

env:
  CCACHE_DIR: /home/runner-ccache

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - name: Check AdaptiveCpp develop HEAD
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/AdaptiveCpp/AdaptiveCpp develop | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          LAST=$(gh variable get NIGHTLY_LAST_SHA -R "$GITHUB_REPOSITORY" 2>/dev/null || echo none)
          echo "changed=$([ "$SHA" != "$LAST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    needs: upstream-check
    if: needs.upstream-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: "cirun-linux-builder--${{ github.run_id }}"
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-nightly-${{ github.sha }}
          restore-keys: |
            ccache-nightly-
            ccache-release-
      - name: Build nightly suite
        run: |
          sudo mkdir -p "$CCACHE_DIR" && sudo chown "$(id -u)" "$CCACHE_DIR"
          export ACPP_NIGHTLY_DATE=$(date -u +%Y.%m.%d)
          pixi run build-nightly
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nightly-linux-64
          path: output/**/*.conda
          retention-days: 14
      - name: Record built develop SHA
        run: gh variable set NIGHTLY_LAST_SHA -R "$GITHUB_REPOSITORY" -b "${{ needs.upstream-check.outputs.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
      # - name: Publish (OIDC trusted publishing)  # enable after channel setup
