# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-compiler-rt21 — the compiler-rt public headers and ignorelist data, plus
# the arch-specific static libraries again on win. Lifted from the reference
# monolith's `compiler-rt${{ major_ver }}` output (compiler-rt-feedstock).
#
# ⚠ SCOPE DERIVED FROM CONDA-FORGE'S compiler-rt21-21.1.8 ARTIFACT, NOT FROM
# UPSTREAM'S GLOB, because our union stage removes the per-project scoping the
# glob relied on. Upstream writes `lib/clang/<major>/include` — the WHOLE
# directory — which is right in compiler-rt's own build prefix, where that
# directory holds nothing else. In our stage clangdev installs 235 builtin
# headers and seven wrapper subdirectories into the same place, so the upstream
# glob would swallow all of acpp-clang-21's headers. The artifact says what the
# package actually ships, and it is these five subdirectories:
#
#   include/fuzzer (1) · include/orc (1) · include/profile (2) ·
#   include/sanitizer (16) · include/xray (3) · share (5 on linux, 2 on osx/win)
#
# The complement — everything else under `lib/clang/21/include` — is
# acpp-clang-21's, and that recipe states the same partition from the other
# side. Read with tools/upstream-paths.nu; the counts above are that tool's
# output, not an estimate.
#
# WIN SHIPS THE ARCH LIBRARIES TOO, and that is not a duplicate by accident:
# upstream's win glob carries `Library\lib\clang\<major>\lib` while the noarch
# acpp-compiler-rt21_<platform> beside it ships the same files at %PREFIX%\lib.
# clang's resource-dir lookup finds the first, the activation packages name the
# second. Both artifacts on the channel today carry the same 14 windows/ paths.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-compiler-rt${{ llvm_major }}
  version: ${{ llvm_version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: >-
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/share/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/fuzzer/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/orc/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/profile/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/sanitizer/**;
        ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/xray/**
        ${{ ";Library/lib/clang/" ~ llvm_major ~ "/lib/windows/**" if win else "" }}

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nushell
  host:
    # Upstream declares `host: []`; the stage is the one entry with no upstream
    # counterpart, because our slice comes out of it rather than a build tree.
    - _acpp-stage ==0.0.0
  run:
    # UPSTREAM: `compiler-rt${{ major_ver }}_${{ target_platform }} ==${{ version }}`
    # — a plain version match, not a pin_subpackage, so only the name is
    # rewritten and it does not become the bracket form.
    - acpp-compiler-rt${{ llvm_major }}_${{ target_platform }} ==${{ llvm_version }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/sanitizer/asan_interface.h
          - if: win
            then: ${{ library_prefix }}lib/clang/${{ llvm_major }}/lib/windows/clang_rt.builtins-x86_64.lib
        not_exists:
          # the builtin headers are acpp-clang-21's half of this directory
          - ${{ library_prefix }}lib/clang/${{ llvm_major }}/include/stdatomic.h

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: licenses/llvm-LICENSE.TXT
  summary: compiler-rt headers and sanitizer ignorelists
