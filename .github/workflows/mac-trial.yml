# osx-arm64 lane: build on the mac runner and publish the set. First cut is
# OMP-only, compiler + runtime outputs only (no lldb/bolt/compiler-rt, no
# Metal yet — each is its own pass). Publishing rides THIS workflow (a
# trusted publisher on the channel) until the platform joins the atomic
# release pipeline — that integration is a reviewed change, not a side
# effect of a trial.
#
# No run gate: nothing to run against beyond the build machine itself; the
# closure and collision gates still block publishing. The runner has 5
# cores — cold builds are hours; the explicit ccache save keeps iteration
# warm even across failed runs.
name: mac-trial
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override"
        default: "0"
      publish:
        description: "Publish to the channel on green"
        type: boolean
        default: true

concurrency:
  group: mac-trial
  cancel-in-progress: true

jobs:
  build-osx-arm64:
    runs-on: macOS-26-xlarge
    timeout-minutes: 600
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      # Explicit restore/save: the actions/cache post-step only saves on job
      # SUCCESS, which starves iteration on exactly the runs that need warmth.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-mac-release-${{ github.run_id }}
          restore-keys: ccache-mac-release-
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: output-staging
          key: staging-mac-release-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-${{ github.run_id }}
          restore-keys: staging-mac-release-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-
      - name: Build release lane
        run: pixi run -e dev build-release
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-mac-release-${{ github.run_id }}
      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output-staging
          key: staging-mac-release-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-mac
          path: local-channel/
          retention-days: 14

  publish-osx-arm64:
    needs: build-osx-arm64
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-mac
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "C-11 gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Closure gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to prefix.dev
        run: pixi run -e dev publish-channel
