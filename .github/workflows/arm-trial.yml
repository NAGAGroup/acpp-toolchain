# linux-aarch64 lane: build natively on the arm runner and publish the set.
# OMP-only by design (see shared/variants/linux-aarch64.yaml). Publishing
# rides THIS workflow (a trusted publisher on the channel) until the platform
# joins the atomic release pipeline — that integration is a reviewed change,
# not a side effect of a trial.
#
# No GPU/run gate: there is nothing to run against on this platform yet, the
# same compile-only stance the ROCm outputs ship under. The closure and
# collision gates still block publishing.
name: arm-trial
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override"
        default: "0"
      publish:
        description: "Publish to the channel on green"
        type: boolean
        default: true

concurrency:
  group: arm-trial
  cancel-in-progress: true

jobs:
  build-linux-aarch64:
    runs-on: linux-arm64-v32
    timeout-minutes: 300
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      # Explicit restore/save: the actions/cache post-step only saves on job
      # SUCCESS, which starves iteration on exactly the runs that need warmth.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-arm-release-${{ github.run_id }}
          restore-keys: ccache-arm-release-
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: output-staging
          key: staging-arm-release-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-${{ github.run_id }}
          restore-keys: staging-arm-release-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-
      - name: Build release lane
        run: pixi run -e dev build-release
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-arm-release-${{ github.run_id }}
      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output-staging
          key: staging-arm-release-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-arm
          path: local-channel/
          retention-days: 14

  publish-linux-aarch64:
    needs: build-linux-aarch64
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-arm
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "C-11 gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Closure gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to prefix.dev
        run: pixi run -e dev publish-channel
