# Windows build variants — this repo's pinning feedstock (phase-3 ruling [B]).
# See shared/variants/linux-64.yaml for how variant-key pinning works and for
# the pin-vs-floor rule that decides what belongs in this file.

# ---- compilers + stdlib ----------------------------------------------------
#
# BUILD COMPILER = MSVC (vs2026), matching conda-forge's own llvmdev feedstock,
# which overrides the compiler only for osx and builds Windows with MSVC.
#
# Setting it HERE rather than leaving it to the root default is the point: the
# workspace default is vs2022, and a stale default that happens to work is
# indistinguishable from a deliberate choice until the day it stops working.
#
# The VS year must match a VS installed as a PRODUCT on the build machine: the
# vs20XX_win-64 packages are activation shims that locate a system VS and call
# vcvars with that year's toolset, so a year that is not installed fails even
# when a newer VS is present. Our Win-x64-64 runner has ONLY VS 18 Enterprise
# (2026) — the activation probes every VS2019 path, finds none, and falls back
# to `vswhere -latest`; its default toolset is 14.51 and vc resolves to 14.5.
#
# An earlier revision used clang_win-64 on the reasoning that AdaptiveCpp's CI
# builds with clang-cl. AdaptiveCpp really does need a clang-family driver for
# its own sources — MSVC does not implement the GCC/Clang builtin atomics it
# uses — but the conclusion was reached from a CI file rather than evidence,
# and the fix was wrong: conda-forge builds clang_win-64 ONLY against
# vs2022_win-64 or vs2019_win-64, so depending on it drags the VS year
# backwards and makes vs2026 unsolvable. The two constraints are compatible
# once decomposed — the VS-year coupling lives in the clang_win-64 ACTIVATION
# package, not in the plain `clang` compiler — so `clang` is taken as a plain
# build dep in the recipe and the VS year stays 2026.
c_compiler:
  - vs2026
cxx_compiler:
  - vs2026
c_stdlib:
  - vs
# NB: conda-forge scopes c_stdlib_version to unix in its global pinning. We set
# it on win deliberately so the year is pinned in ONE place; vs2026_win-64
# already constrains vs_win-64 ==2026.1, this just makes it explicit.
c_stdlib_version:
  - "2026.*"

# ---- CUDA ------------------------------------------------------------------
# See the linux file: build pinned exactly, run range from _min/_max, quoted
# strings on purpose.
cuda_compiler_version: ["12.9"]
cuda_compiler_version_min: ["12.9"]
cuda_compiler_version_max: ["13"]

# ---- ABI-sensitive libraries ----------------------------------------------
zlib: ["1.3"]
zstd: ["1.5"]
# AdaptiveCpp's Windows build links Boost. Upstream builds it from source with
# the clang-win toolset; conda-forge ships it prebuilt, so we pin the release.
libboost-devel: ["1.91"]

# ---- backends --------------------------------------------------------------
# level-zero and opencl-headers both ship for win-64, so the Intel backends are
# NOT linux-only. Upstream's Windows CI disables OpenCL, but the docs never say
# it cannot work, and absence from someone else's CI is not evidence of
# impossibility — we build it and let CI adjudicate.
level-zero-devel: ["1.29"]
khronos-opencl-icd-loader: ["2024.10"]

# ---- python ----------------------------------------------------------------
# One python, same reasoning as linux (win ships no acpp-lldb, but the build
# still runs python tooling and a split solve is a latent inconsistency).
python: ["3.14"]

# ---- staging cache key -----------------------------------------------------
# See the linux file. Regenerated by shared/gen-staging-hash.nu.
staging_inputs: ["0cbf3effaa4b94b4"]
