# build — the one workflow: builds NAGAGroup/AdaptiveCpp (our fork) as the
# naga-acpp-* conda toolchain and, when asked, publishes to naga-labs-staging.
#
# Manual only, with an explicit fork commit: we publish when we have landed
# something, and the published set names the commit it shipped. Each platform
# is its own build -> publish -> test chain, so one platform failing never
# blocks another; `platforms` selects which chains run (a green platform is
# not rebuilt). All five chains run: linux-64, linux-aarch64, osx-arm64,
# win-64, win-arm64. Tests install the PUBLISHED packages from the channel,
# pinned to the exact version + build number, and never gate publishing: a
# red test job is information only. (win-64 compiles its suite in
# suite-build-win-64, after publish, and test-win-64 runs the binaries.)
name: build

on:
  workflow_dispatch:
    inputs:
      fork_sha:
        description: "Fork commit or branch to build (NAGAGroup/AdaptiveCpp)"
        default: "naga/develop"
        required: true
      platforms:
        description: "Space-separated platforms to build (linux-64 linux-aarch64 osx-arm64 win-64 win-arm64)"
        default: "linux-64"
        required: true
      publish:
        description: "Publish to naga-labs-staging after the build"
        type: boolean
        default: false
      build_number:
        description: "Build number (bump to re-publish the same date+SHA with fresh filenames)"
        default: "0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      date: ${{ steps.resolve.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      # rattler-build's staging key ignores sources, patches and the build
      # script; staging_inputs folds them in. Stale means a silently reused build.
      - name: staging_inputs hash is current
        run: pixi run -e dev check-staging-hash
      # Invisible to --render-only; would fail at build time on the big runner.
      - name: pins are resolvable
        run: pixi run -e dev check-pins
      - name: Resolve the requested fork commit
        id: resolve
        run: |
          # Accept a branch name or a short SHA and record the full one, so the
          # published set always names an immutable commit.
          SHA=$(git ls-remote https://github.com/NAGAGroup/AdaptiveCpp "${{ inputs.fork_sha }}" | head -1 | cut -f1)
          if [ -z "$SHA" ]; then SHA="${{ inputs.fork_sha }}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "::notice title=naga-acpp build::NAGAGroup/AdaptiveCpp@$SHA for: ${{ inputs.platforms }}"

  # ── linux-64 ──────────────────────────────────────────────────────────────
  build-linux-64:
    needs: prepare
    if: contains(format(' {0} ', inputs.platforms), ' linux-64 ')
    runs-on: Linux-x64-64
    timeout-minutes: 300
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      ACPP_NAGA_SHA: ${{ needs.prepare.outputs.sha }}
      ACPP_NAGA_DATE: ${{ needs.prepare.outputs.date }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Disk
        run: df -h / "$GITHUB_WORKSPACE"
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      # Falls back to the archived naga lane's ccache: same LLVM 21.1.8, so a
      # cold build still hits on LLVM objects.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-64-${{ github.run_id }}
          restore-keys: |
            ccache-linux-64-
            ccache-naga-
      - name: Restore rattler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rattler/cache
          key: rattler-linux-64-${{ github.run_id }}
          restore-keys: rattler-linux-64-
      # The staging cache (the full LLVM+acpp build) lives under the rattler
      # OUTPUT dir. Keyed on the fork commit too: the staging key does not
      # include the source.
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: output/build_cache
          key: staging-linux-64-${{ hashFiles('shared/variants/linux-64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
          restore-keys: staging-linux-64-${{ hashFiles('shared/variants/linux-64.yaml') }}-${{ needs.prepare.outputs.sha }}-
      - name: Build -> indexed local channel
        run: pixi run -e dev build
      - name: Prune stale staging caches
        if: always()
        run: |
          cd output/build_cache 2>/dev/null || exit 0
          ls -1dt staging_* 2>/dev/null | tail -n +2 | xargs -r rm -rf
          du -sh . || true
      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/build_cache
          key: staging-linux-64-${{ hashFiles('shared/variants/linux-64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-64-${{ github.run_id }}
      - name: Save rattler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rattler/cache
          key: rattler-linux-64-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-linux-64
          path: local-channel/
          retention-days: 14
      - name: Package version
        id: pkgver
        run: pixi run -e dev nu shared/pkg-version.nu

  # Tests run AFTER publish, from the PUBLISHED channel, and never block
  # publishing: this builds and runs AdaptiveCpp's OWN test suite
  # (shared/tests/suite) against the naga-acpp-* packages pinned to the exact
  # version + build number just published, through the
  # naga-acpp-clangxx_linux-64 activation package — a real solve exercising
  # run_exports/run_constraints, not just a smoke binary. A failure here makes
  # this job red for information only.
  test-linux-64:
    needs: [prepare, build-linux-64, publish-linux-64]
    runs-on: Linux-x64-GPU
    timeout-minutes: 90
    env:
      ACPP_SRC: ${{ github.workspace }}/acpp-src
    steps:
      - uses: actions/checkout@v4
      - name: Runner core count
        run: nproc
      - uses: actions/checkout@v4
        with:
          repository: NAGAGroup/AdaptiveCpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: acpp-src
          sparse-checkout: tests
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - run: nvidia-smi
      # pixi solves every platform in the manifest; this rewrites it to
      # linux-64, drops the local-channel entry and pins every naga-acpp*
      # dependency to the published version + build number.
      - name: Pin the suite to the published linux-64 packages
        run: pixi exec --spec nushell nu shared/tests/suite/pin-published.nu linux-64 ${{ needs.build-linux-64.outputs.version }} ${{ inputs.build_number }}
      # Install separately from building/running, with a generous bound: a
      # hung step and a slow cold download are otherwise indistinguishable.
      # Retries: the channel index can lag the upload.
      - name: Install suite environment
        working-directory: shared/tests/suite
        timeout-minutes: 60
        run: |
          for i in 1 2 3 4 5; do pixi install && exit 0; echo "retry $i"; sleep 60; done; exit 1
      - name: Visible backends
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        run: pixi run acpp-info
      - name: "build: omp"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build omp "omp"
      - name: "sycl_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp sycl_tests
      - name: "rt_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp rt_tests
      - name: "build: generic (+pstl, +pcuda = CUDA-style API on any backend)"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build generic "generic" --pstl --pcuda
      - name: "sycl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp sycl_tests
      - name: "sycl_tests: generic on OMP+CUDA (T4)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic "omp;cuda" sycl_tests
      - name: "pstl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp pstl_tests
      - name: "pcuda_tests (CUDA-style API, not the CUDA backend): generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp pcuda_tests
      # Intel's CPU OpenCL runtime (conda-forge intel-opencl-rt) is the OpenCL
      # device here, on x86-64 only.
      - name: "sycl_tests: generic on OpenCL (Intel CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic ocl sycl_tests
      - name: Sanitizer smoke (naga-acpp-compiler-rt)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: shared/tests/suite
        run: pixi run sanitizer-smoke

  publish-linux-64:
    needs: [prepare, build-linux-64]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-linux-64
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "Gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to naga-labs-staging
        run: pixi run -e dev publish-channel

  # ── linux-aarch64 ─────────────────────────────────────────────────────────
  # Backends as the build script has them today (OMP); no GPU on this runner.
  build-linux-aarch64:
    needs: prepare
    if: contains(format(' {0} ', inputs.platforms), ' linux-aarch64 ')
    runs-on: linux-arm64-v32
    timeout-minutes: 300
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      ACPP_NAGA_SHA: ${{ needs.prepare.outputs.sha }}
      ACPP_NAGA_DATE: ${{ needs.prepare.outputs.date }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Disk
        run: df -h / "$GITHUB_WORKSPACE"
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-aarch64-${{ github.run_id }}
          restore-keys: |
            ccache-linux-aarch64-
            ccache-arm-release-
      - name: Restore rattler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rattler/cache
          key: rattler-linux-aarch64-${{ github.run_id }}
          restore-keys: rattler-linux-aarch64-
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: output/build_cache
          key: staging-linux-aarch64-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
          restore-keys: staging-linux-aarch64-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-${{ needs.prepare.outputs.sha }}-
      - name: Build -> indexed local channel
        run: pixi run -e dev build
      - name: Prune stale staging caches
        if: always()
        run: |
          cd output/build_cache 2>/dev/null || exit 0
          ls -1dt staging_* 2>/dev/null | tail -n +2 | xargs -r rm -rf
          du -sh . || true
      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/build_cache
          key: staging-linux-aarch64-${{ hashFiles('shared/variants/linux-aarch64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-aarch64-${{ github.run_id }}
      - name: Save rattler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rattler/cache
          key: rattler-linux-aarch64-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-linux-aarch64
          path: local-channel/
          retention-days: 14
      - name: Package version
        id: pkgver
        run: pixi run -e dev nu shared/pkg-version.nu

  # Tests run after publish, from the published channel; they never block
  # publishing (see test-linux-64).
  test-linux-aarch64:
    needs: [prepare, build-linux-aarch64, publish-linux-aarch64]
    runs-on: linux-arm64-v32
    timeout-minutes: 90
    env:
      ACPP_SRC: ${{ github.workspace }}/acpp-src
    steps:
      - uses: actions/checkout@v4
      - name: Runner core count
        run: nproc
      - uses: actions/checkout@v4
        with:
          repository: NAGAGroup/AdaptiveCpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: acpp-src
          sparse-checkout: tests
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: Pin the suite to the published linux-aarch64 packages
        run: pixi exec --spec nushell nu shared/tests/suite/pin-published.nu linux-aarch64 ${{ needs.build-linux-aarch64.outputs.version }} ${{ inputs.build_number }}
      # Retries: the channel index can lag the upload.
      - name: Install suite environment
        working-directory: shared/tests/suite
        timeout-minutes: 60
        run: |
          for i in 1 2 3 4 5; do pixi install && exit 0; echo "retry $i"; sleep 60; done; exit 1
      - name: Visible backends
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        run: pixi run acpp-info
      - name: "build: omp"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build omp "omp"
      - name: "sycl_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp sycl_tests
      - name: "rt_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp rt_tests
      - name: "build: generic (+pstl, +pcuda = CUDA-style API on any backend)"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build generic "generic" --pstl --pcuda
      - name: "sycl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp sycl_tests
      - name: "pstl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp pstl_tests
      - name: "pcuda_tests (CUDA-style API, not the CUDA backend): generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp pcuda_tests
      - name: Sanitizer smoke (naga-acpp-compiler-rt)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: shared/tests/suite
        run: pixi run sanitizer-smoke

  publish-linux-aarch64:
    needs: [prepare, build-linux-aarch64]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-linux-aarch64
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "Gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to naga-labs-staging
        run: pixi run -e dev publish-channel

  # ── osx-arm64 ─────────────────────────────────────────────────────────────
  # Backends as the build script has them today (OMP); Metal comes next.
  build-osx-arm64:
    needs: prepare
    if: contains(format(' {0} ', inputs.platforms), ' osx-arm64 ')
    runs-on: macOS-26-xlarge
    timeout-minutes: 600
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      ACPP_NAGA_SHA: ${{ needs.prepare.outputs.sha }}
      ACPP_NAGA_DATE: ${{ needs.prepare.outputs.date }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      # The image fills most of the disk with Xcodes and simulator runtimes.
      # Keep the selected Xcode (the macOS SDK and the Metal toolchain), drop
      # the rest. Best effort: never fails the job.
      - name: Free disk space
        shell: bash
        continue-on-error: true
        run: |
          df -h /
          KEEP=$(xcode-select -p | sed 's#/Contents/Developer##')
          KEEP=$(cd "$KEEP" && pwd -P)
          echo "keeping $KEEP"
          sudo xcode-select -s "$KEEP" || true
          echo "DEVELOPER_DIR=$KEEP/Contents/Developer" >> "$GITHUB_ENV"
          for app in /Applications/Xcode_*.app; do
            r=$(cd "$app" && pwd -P) || continue
            [ "$r" = "$KEEP" ] || sudo rm -rf "$app" || true
          done
          sudo xcrun simctl runtime delete all || true
          sudo rm -rf /Library/Developer/CoreSimulator ~/Library/Developer/CoreSimulator || true
          for p in iPhoneOS iPhoneSimulator AppleTVOS AppleTVSimulator WatchOS WatchSimulator XROS XRSimulator; do
            sudo rm -rf "$KEEP/Contents/Developer/Platforms/$p.platform" || true
          done
          sudo rm -rf ~/Library/Android /Users/runner/.dotnet ~/.rustup /usr/local/share/dotnet || true
          rm -rf "$(brew --cache)" || true
          sudo mdutil -a -i off || true
          df -h /
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-osx-arm64-${{ github.run_id }}
          restore-keys: |
            ccache-osx-arm64-
            ccache-mac-release-
      - name: Restore rattler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/rattler/cache
          key: rattler-osx-arm64-${{ github.run_id }}
          restore-keys: rattler-osx-arm64-
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: output/build_cache
          key: staging-osx-arm64-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
          restore-keys: staging-osx-arm64-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-${{ needs.prepare.outputs.sha }}-
      - name: Build -> indexed local channel
        run: pixi run -e dev build
      - name: Prune stale staging caches
        if: always()
        run: |
          cd output/build_cache 2>/dev/null || exit 0
          ls -1dt staging_* 2>/dev/null | tail -n +2 | xargs rm -rf
          du -sh . || true
      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/build_cache
          key: staging-osx-arm64-${{ hashFiles('shared/variants/osx-arm64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-osx-arm64-${{ github.run_id }}
      - name: Save rattler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/rattler/cache
          key: rattler-osx-arm64-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-osx-arm64
          path: local-channel/
          retention-days: 14
      - name: Package version
        id: pkgver
        run: pixi run -e dev nu shared/pkg-version.nu

  # Tests run after publish, from the published channel; they never block
  # publishing (see test-linux-64).
  test-osx-arm64:
    needs: [prepare, build-osx-arm64, publish-osx-arm64]
    runs-on: macOS-26-xlarge
    timeout-minutes: 90
    env:
      ACPP_SRC: ${{ github.workspace }}/acpp-src
    steps:
      - uses: actions/checkout@v4
      # macOS has no nproc; sysctl reports the same logical core count.
      - name: Runner core count
        run: sysctl -n hw.logicalcpu
      - uses: actions/checkout@v4
        with:
          repository: NAGAGroup/AdaptiveCpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: acpp-src
          sparse-checkout: tests
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      # No CUDA/OpenCL/ROCm outputs on osx yet; the activation package
      # (naga-acpp-clangxx_osx-arm64) points clang at the macOS SDK itself
      # via sdkroot_env, so the old "Point clang at the macOS SDK" step is
      # gone.
      - name: Pin the suite to the published osx-arm64 packages
        run: pixi exec --spec nushell nu shared/tests/suite/pin-published.nu osx-arm64 ${{ needs.build-osx-arm64.outputs.version }} ${{ inputs.build_number }}
      # pin-published.nu writes the plain platform; osx needs the macOS 26
      # virtual-package floor, as before.
      - name: Pin the macOS floor
        working-directory: shared/tests/suite
        run: sed -i '' 's/^platforms = .*/platforms = [{ platform = "osx-arm64", macos = "26.0" }]/' pixi.toml
      # Retries: the channel index can lag the upload.
      - name: Install suite environment
        working-directory: shared/tests/suite
        timeout-minutes: 60
        run: |
          for i in 1 2 3 4 5; do pixi install && exit 0; echo "retry $i"; sleep 60; done; exit 1
      - name: Visible backends
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        run: pixi run acpp-info
      - name: "build: omp"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build omp "omp"
      - name: "sycl_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp sycl_tests
      - name: "rt_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp rt_tests
      # No PSTL on macOS: stdpar needs libstdc++ >= 11 and libc++ is unsupported (doc/stdpar.md); upstream's macos CI skips it too.
      - name: "build: generic (+pcuda = CUDA-style API on any backend)"
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build generic "generic" --pcuda
      - name: "sycl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp sycl_tests
      # The Metal check (informational: tests never block publishing).
      - name: "sycl_tests: generic on Metal (M2)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic metal sycl_tests
      - name: "pcuda_tests (CUDA-style API, not the CUDA backend): generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp pcuda_tests

  publish-osx-arm64:
    needs: [prepare, build-osx-arm64]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-osx-arm64
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "Gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to naga-labs-staging
        run: pixi run -e dev publish-channel

  # ── win-64 ────────────────────────────────────────────────────────────────
  # Backends as the build script has them today (OMP, CUDA, L0, OpenCL); HIP
  # is PARKED for build 2 (see HIP-PARKED markers). Plumbing carried over from the archived nightly: fast storage,
  # pwsh, PATH stripped under cmd.exe's 8191-char limit.
  build-win-64:
    needs: prepare
    if: contains(format(' {0} ', inputs.platforms), ' win-64 ')
    runs-on: Win-x64-64
    timeout-minutes: 480
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      ACPP_NAGA_SHA: ${{ needs.prepare.outputs.sha }}
      ACPP_NAGA_DATE: ${{ needs.prepare.outputs.date }}
      ACPP_SRC: ${{ github.workspace }}/acpp-src
      CCACHE_MAXSIZE: 20G
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NAGAGroup/AdaptiveCpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: acpp-src
          sparse-checkout: tests
      - name: Select build storage
        shell: pwsh
        run: |
          # Staging-cache restores are small-file I/O bound. Prefer a Dev Drive
          # VHDX (ReFS: rattler-build's reflink_or_copy block-clones there, and
          # Defender runs in performance mode), then plain ReFS, then D:, then
          # the workspace. diskpart, not New-VHD: no Hyper-V module needed.
          $root = $null
          $kind = $null
          $hostDrive = if (Test-Path "D:\") { "D:" } else { "C:" }
          try {
            $free = (Get-PSDrive -Name $hostDrive.TrimEnd(':')).Free
            $size = [math]::Min(300GB, [math]::Floor($free * 0.85 / 1GB) * 1GB)
            if ($size -lt 100GB) { throw "only $([math]::Round($free / 1GB)) GB free on $hostDrive" }
            $vhd = "$hostDrive\acpp-dev-drive.vhdx"
            if (Test-Path $vhd) {
              Dismount-DiskImage -ImagePath $vhd -ErrorAction SilentlyContinue | Out-Null
              Remove-Item $vhd -Force
            }
            $dp = "create vdisk file=`"$vhd`" maximum=$([int64]($size / 1MB)) type=expandable`r`nselect vdisk file=`"$vhd`"`r`nattach vdisk`r`n"
            $dpFile = Join-Path $env:RUNNER_TEMP "mkvhd.txt"
            Set-Content -Path $dpFile -Value $dp -Encoding ascii
            diskpart /s $dpFile | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "diskpart exited $LASTEXITCODE" }
            $disk = Get-DiskImage -ImagePath $vhd | Get-Disk
            if ($disk.PartitionStyle -eq 'RAW') { Initialize-Disk -Number $disk.Number -PartitionStyle GPT | Out-Null }
            $part = New-Partition -DiskNumber $disk.Number -UseMaximumSize -AssignDriveLetter
            try {
              Format-Volume -DriveLetter $part.DriveLetter -DevDrive -Confirm:$false -Force -ErrorAction Stop | Out-Null
              $kind = "Dev Drive"
              fsutil devdrv trust "$($part.DriveLetter):" | Out-Host
            } catch {
              Write-Host "Dev Drive format unavailable ($_); formatting plain ReFS"
              Format-Volume -DriveLetter $part.DriveLetter -FileSystem ReFS -Confirm:$false -Force -ErrorAction Stop | Out-Null
              $kind = "ReFS"
            }
            $root = "$($part.DriveLetter):"
          } catch {
            Write-Host "VHDX setup failed ($_)"
          }
          if (-not $root) {
            if (Test-Path "D:\") { $root = "D:"; $kind = "D: (NTFS)" } else { $root = $env:GITHUB_WORKSPACE; $kind = "workspace" }
          }
          Write-Host "Fast storage root: $root [$kind]"
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystem, SizeRemaining, Size | Out-Host
          New-Item -ItemType Directory -Force -Path "$root\rattler-cache", "$root\rb-output", "$root\ccache" | Out-Null
          @(
            "CCACHE_DIR=$root\ccache"
            "CCACHE_BASEDIR=$root\rb-output"
            "RATTLER_CACHE_DIR=$root\rattler-cache"
            "ACPP_OUTPUT_DIR=$root\rb-output"
          ) | Add-Content -Path $env:GITHUB_ENV
      - name: Exclude the build tree and toolchain processes from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          # rattler-build failed to delete a finished test directory
          # ("Access is denied", run 36506177295): Defender scans the
          # freshly built test exe and holds the directory. Exclude the
          # build/cache tree AND the build-tool processes on this
          # self-hosted runner. Each call is independent: print the error
          # and carry on (needs admin rights; non-fatal if we lack them).
          $paths = @(
            'D:\rb-output',
            $env:ACPP_OUTPUT_DIR,
            $env:RATTLER_CACHE_DIR,
            $env:CCACHE_DIR,
            $env:RUNNER_TEMP,
            $env:GITHUB_WORKSPACE
          ) | Where-Object { $_ } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "excluded path: $p"
            } catch { Write-Warning "ExclusionPath $p failed: $_" }
          }
          $procs = @('rattler-build.exe', 'nu.exe', 'clang.exe', 'clang++.exe', 'clang-cl.exe', 'lld-link.exe', 'cmake.exe', 'ninja.exe', 'link.exe', 'cl.exe')
          foreach ($n in $procs) {
            try {
              Add-MpPreference -ExclusionProcess $n -ErrorAction Stop
              Write-Host "excluded process: $n"
            } catch { Write-Warning "ExclusionProcess $n failed: $_" }
          }
          Get-MpPreference | Select-Object ExclusionPath, ExclusionProcess
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-64-${{ github.run_id }}
          restore-keys: |
            ccache-win-64-
            ccache-win-nightly-
            ccache-win-
      - name: Restore rattler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RATTLER_CACHE_DIR }}
          key: rattler-win-64-${{ github.run_id }}
          restore-keys: rattler-win-64-
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ACPP_OUTPUT_DIR }}\build_cache
          key: staging-win-64-${{ hashFiles('shared/variants/win-64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
          restore-keys: staging-win-64-${{ hashFiles('shared/variants/win-64.yaml') }}-${{ needs.prepare.outputs.sha }}-
      - name: Build -> indexed local channel
        id: channel
        shell: pwsh
        run: |
          $env:PATH = @(
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:USERPROFILE\.pixi\bin",
            "$env:ProgramFiles\Git\cmd"
          ) -join ";"
          Write-Host "PATH length: $($env:PATH.Length)"
          pixi run -e dev build
      - name: Prune stale staging caches
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:ACPP_OUTPUT_DIR "build_cache"
          if ($dir -and (Test-Path $dir)) {
            Get-ChildItem $dir -Filter "staging_*" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 1 | Remove-Item -Recurse -Force
          }
      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ACPP_OUTPUT_DIR }}\build_cache
          key: staging-win-64-${{ hashFiles('shared/variants/win-64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-64-${{ github.run_id }}
      - name: Save rattler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RATTLER_CACHE_DIR }}
          key: rattler-win-64-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-win-64
          path: local-channel/
          retention-days: 14
      - name: Package version
        id: pkgver
        shell: pwsh
        run: pixi run -e dev nu shared/pkg-version.nu

  # Build-once/run-on-GPU: compile AdaptiveCpp's own test suite on this
  # builder, after publish, against the PUBLISHED packages (this box's vs2026
  # activation finds VS2026 via vswhere); the GPU box (test-win-64) has no VS
  # at all and only RUNS the binaries this job produces.
  suite-build-win-64:
    needs: [prepare, build-win-64, publish-win-64]
    runs-on: Win-x64-64
    timeout-minutes: 90
    env:
      ACPP_SRC: ${{ github.workspace }}/acpp-src
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Runner core count
        run: (Get-CimInstance Win32_Processor | Measure-Object NumberOfLogicalProcessors -Sum).Sum
      - uses: actions/checkout@v4
        with:
          repository: NAGAGroup/AdaptiveCpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: acpp-src
          sparse-checkout: tests
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: Pin the suite to the published win-64 packages
        run: pixi exec --spec nushell nu shared/tests/suite/pin-published.nu win-64 ${{ needs.build-win-64.outputs.version }} ${{ inputs.build_number }}
      # Retries: the channel index can lag the upload.
      - name: Install suite environment
        working-directory: shared/tests/suite
        timeout-minutes: 60
        run: |
          foreach ($i in 1..5) { pixi install; if ($LASTEXITCODE -eq 0) { exit 0 }; Write-Host "retry $i"; Start-Sleep 60 }; exit 1
      - name: "build: omp"
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        timeout-minutes: 30
        run: |
          $env:PATH = @(
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:USERPROFILE\.pixi\bin",
            "$env:ProgramFiles\Git\cmd"
          ) -join ";"
          pixi run nu suite.nu build omp "omp"
      - name: "build: generic (+pcuda = CUDA-style API on any backend)"
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        timeout-minutes: 30
        run: |
          $env:PATH = @(
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:USERPROFILE\.pixi\bin",
            "$env:ProgramFiles\Git\cmd"
          ) -join ";"
          pixi run nu suite.nu build generic "generic" --pcuda
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: suite-win-64
          retention-days: 14
          if-no-files-found: error
          path: |
            shared/tests/suite/build/**/*.exe
            shared/tests/suite/build/**/*.dll

  # Tests run after publish, from the published channel; they never block
  # publishing (see test-linux-64). The binaries come from suite-build-win-64;
  # this GPU box installs the published runtime and runs them.
  test-win-64:
    needs: [prepare, build-win-64, suite-build-win-64]
    if: ${{ !cancelled() && needs.build-win-64.result == 'success' }}
    runs-on: Win-x64-GPU
    timeout-minutes: 90
    env:
      ACPP_SRC: ${{ github.workspace }}/acpp-src
    defaults:
      run:
        shell: powershell # Windows PowerShell: this image has no pwsh, and bash is the WSL stub
    steps:
      - uses: actions/checkout@v4
      - name: Runner core count
        run: (Get-CimInstance Win32_Processor | Measure-Object NumberOfLogicalProcessors -Sum).Sum
      - uses: actions/checkout@v4
        with:
          repository: NAGAGroup/AdaptiveCpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: acpp-src
          sparse-checkout: tests
      - name: Update NVIDIA datacenter driver
        run: |
          nvidia-smi
          $ver = "553.62"
          $url = "https://us.download.nvidia.com/tesla/$ver/$ver-data-center-tesla-desktop-winserver-2022-dch-international.exe"
          Write-Host "Fetching $url"
          curl.exe -sL -o driver.exe $url
          Start-Process -FilePath .\driver.exe -ArgumentList "-s","-noreboot" -Wait
          nvidia-smi
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      # Build-once/run-on-GPU: this box has no VS at all, so the binaries
      # come from build-win-64's VS2026 builder as an artifact.
      - uses: actions/download-artifact@v4
        with:
          name: suite-win-64
          path: shared/tests/suite/build
      - name: Pin the suite to the published win-64 packages
        run: pixi exec --spec nushell nu shared/tests/suite/pin-published.nu win-64 ${{ needs.build-win-64.outputs.version }} ${{ inputs.build_number }}
      # Retries: the channel index can lag the upload.
      - name: Install suite environment
        working-directory: shared/tests/suite
        timeout-minutes: 60
        run: |
          foreach ($i in 1..5) { pixi install -e run; if ($LASTEXITCODE -eq 0) { exit 0 }; Write-Host "retry $i"; Start-Sleep 60 }; exit 1
      - name: Visible backends
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        run: pixi run -e run acpp-info
      - name: "sycl_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run -e run nu suite.nu run omp omp sycl_tests
      - name: "rt_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run -e run nu suite.nu run omp omp rt_tests
      - name: "sycl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run -e run nu suite.nu run generic omp sycl_tests
      - name: "sycl_tests: generic on OMP+CUDA (T4)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run -e run nu suite.nu run generic "omp;cuda" sycl_tests
      - name: "pcuda_tests (CUDA-style API, not the CUDA backend): generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run -e run nu suite.nu run generic omp pcuda_tests
      # Intel's CPU OpenCL runtime (conda-forge intel-opencl-rt) is the OpenCL
      # device here, on x86-64 only.
      - name: "sycl_tests: generic on OpenCL (Intel CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run -e run nu suite.nu run generic ocl sycl_tests

  publish-win-64:
    needs: [prepare, build-win-64]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-win-64
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "Gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to naga-labs-staging
        run: pixi run -e dev publish-channel

  # ── win-arm64 ─────────────────────────────────────────────────────────────
  # First cut: OMP-only compiler + runtime (see shared/variants/win-arm64.yaml).
  # conda-forge has no ccache here, so no ccache cache. No GPU: the gate runs on
  # the build runner, which also has VS2026 for compiling and running the suite.
  build-win-arm64:
    needs: prepare
    if: contains(format(' {0} ', inputs.platforms), ' win-arm64 ')
    runs-on: win-arm64-v32
    timeout-minutes: 480
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      ACPP_NAGA_SHA: ${{ needs.prepare.outputs.sha }}
      ACPP_NAGA_DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Select build storage
        run: |
          $root = $null
          if (Test-Path "D:\") {
            $root = "D:"
          } else {
            try {
              $vhd = "C:\build-drive.vhdx"
              New-VHD -Path $vhd -SizeBytes 120GB -Dynamic | Out-Null
              $disk = Mount-VHD -Path $vhd -PassThru | Initialize-Disk -PassThru
              $part = New-Partition -DiskNumber $disk.Number -UseMaximumSize -AssignDriveLetter
              Format-Volume -DriveLetter $part.DriveLetter -FileSystem ReFS -Confirm:$false | Out-Null
              $root = "$($part.DriveLetter):"
              Write-Host "No D:; mounted ReFS VHDX at $root"
            } catch {
              Write-Host "VHDX fallback failed ($_); using workspace drive"
              $root = $env:GITHUB_WORKSPACE
            }
          }
          Write-Host "Fast storage root: $root"
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize | Out-String | Write-Host
          New-Item -ItemType Directory -Force -Path "$root\rattler-cache", "$root\rb-output" | Out-Null
          @(
            "RATTLER_CACHE_DIR=$root\rattler-cache"
            "ACPP_OUTPUT_DIR=$root\rb-output"
          ) | Add-Content -Path $env:GITHUB_ENV
      - name: Exclude the build tree from Defender
        shell: pwsh
        run: |
          # rattler-build failed to delete a finished test directory
          # ("Access is denied", run 36506177295): Defender scans the
          # freshly built test exe and holds the directory. Exclude the
          # build/cache tree on this self-hosted runner. Non-fatal if we
          # lack the rights.
          try {
            Add-MpPreference -ExclusionPath $env:ACPP_OUTPUT_DIR, $env:RATTLER_CACHE_DIR -ErrorAction Stop
            Write-Host "Defender exclusions added"
          } catch { Write-Warning "could not add Defender exclusions: $_" }
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: Restore rattler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RATTLER_CACHE_DIR }}
          key: rattler-win-arm64-${{ github.run_id }}
          restore-keys: rattler-win-arm64-
      - name: Restore staging cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ACPP_OUTPUT_DIR }}\build_cache
          key: staging-win-arm64-${{ hashFiles('shared/variants/win-arm64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
          restore-keys: staging-win-arm64-${{ hashFiles('shared/variants/win-arm64.yaml') }}-${{ needs.prepare.outputs.sha }}-
      - name: Build -> indexed local channel
        run: |
          $env:PATH = @(
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:USERPROFILE\.pixi\bin",
            "$env:ProgramFiles\Git\cmd"
          ) -join ";"
          Write-Host "PATH length: $($env:PATH.Length)"
          pixi run -e dev build
      - name: Prune stale staging caches
        if: always()
        run: |
          $dir = Join-Path $env:ACPP_OUTPUT_DIR "build_cache"
          if ($dir -and (Test-Path $dir)) {
            Get-ChildItem $dir -Filter "staging_*" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 1 | Remove-Item -Recurse -Force
          }
      - name: Save staging cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ACPP_OUTPUT_DIR }}\build_cache
          key: staging-win-arm64-${{ hashFiles('shared/variants/win-arm64.yaml') }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}
      - name: Save rattler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RATTLER_CACHE_DIR }}
          key: rattler-win-arm64-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-channel-win-arm64
          path: local-channel/
          retention-days: 14
      - name: Package version
        id: pkgver
        run: pixi run -e dev nu shared/pkg-version.nu

  # Tests run after publish, from the published channel; they never block
  # publishing (see test-linux-64).
  test-win-arm64:
    needs: [prepare, build-win-arm64, publish-win-arm64]
    runs-on: win-arm64-v32
    timeout-minutes: 90
    env:
      ACPP_SRC: ${{ github.workspace }}/acpp-src
      SUITE_BOOST_PREFIX: ${{ github.workspace }}/shared/tests/suite/build/boost-prefix
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Runner core count
        run: (Get-CimInstance Win32_Processor | Measure-Object NumberOfLogicalProcessors -Sum).Sum
      - uses: actions/checkout@v4
        with:
          repository: NAGAGroup/AdaptiveCpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: acpp-src
          sparse-checkout: tests
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      # Only naga-acpp-runtime-ocl exists here besides naga-acpp itself; the
      # per-platform [feature.run.target.win-arm64...] section in pixi.toml
      # already scopes deps correctly, so pin-published.nu only rewrites the
      # platform line, the channels and the pins — no package deletions.
      - name: Pin the suite to the published win-arm64 packages
        run: pixi exec --spec nushell nu shared/tests/suite/pin-published.nu win-arm64 ${{ needs.build-win-arm64.outputs.version }} ${{ inputs.build_number }}
      # This box both compiles AND runs (no separate GPU box exists for
      # win-arm64), so the default env (run+build, vs2026 activation) is used.
      # Retries: the channel index can lag the upload.
      - name: Install suite environment
        working-directory: shared/tests/suite
        timeout-minutes: 60
        run: |
          foreach ($i in 1..5) { pixi install; if ($LASTEXITCODE -eq 0) { exit 0 }; Write-Host "retry $i"; Start-Sleep 60 }; exit 1
      # No ICD exists on this runner; whether the OpenCL plugin loads at all
      # is informational only, read from this listing.
      - name: Visible backends
        if: ${{ !cancelled() }}
        working-directory: shared/tests/suite
        run: pixi run acpp-info
      # conda-forge ships no Boost for win-arm64 at all: build Boost.Test
      # from source once, into SUITE_BOOST_PREFIX.
      - name: Build Boost.Test from source
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu boost
      - name: "build: omp"
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build omp "omp"
      - name: "sycl_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp sycl_tests
      - name: "rt_tests: omp on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run omp omp rt_tests
      - name: "build: generic (+pcuda = CUDA-style API on any backend)"
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu build generic "generic" --pcuda
      - name: "sycl_tests: generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp sycl_tests
      - name: "pcuda_tests (CUDA-style API, not the CUDA backend): generic on OMP (CPU)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: shared/tests/suite
        run: pixi run nu suite.nu run generic omp pcuda_tests

  publish-win-arm64:
    needs: [prepare, build-win-arm64]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-channel-win-arm64
          path: local-channel
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - name: "Gate: no conda-forge name collisions"
        run: pixi run -e dev check-no-collision
      - name: "Gate: complete output set + every spec solvable"
        run: pixi run -e dev check-closure
      - name: Upload to naga-labs-staging
        run: pixi run -e dev publish-channel
