# Release lane (v3): render-gate on a free runner, build+test the full
# multi-output staging recipe on the Cirun/Azure builder, upload artifacts.
# Publish to prefix.dev goes through OIDC trusted publishing once the channel
# trusted publisher is registered (design v3 §D4) — gated stub below.
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CCACHE_DIR: /home/runner-ccache # forwarded into the rattler-build script env

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - run: pixi run render-release > /dev/null

  build-linux:
    needs: render-check
    runs-on: "cirun-linux-builder--${{ github.run_id }}"
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ github.sha }}
          restore-keys: |
            ccache-release-
      - name: Build release suite (staging + 9 outputs, tests included)
        run: |
          sudo mkdir -p "$CCACHE_DIR" && sudo chown "$(id -u)" "$CCACHE_DIR"
          pixi run build-release
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-64
          path: output/**/*.conda
          retention-days: 14
      # - name: Publish (OIDC trusted publishing)  # enable after channel
      #   run: pixi run -e dev rattler-build upload prefix -c code-accelerate output/**/*.conda
