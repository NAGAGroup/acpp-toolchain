# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-llvm-spirv — the SPIR-V translator under its PLAIN name. Lifted from the
# reference monolith's `llvm-spirv` output (llvm-spirv-feedstock).
#
# THIS IS THE NAME ADAPTIVECPP EXECS. acpp does not link the translator: its
# SPIRV backend resolves `<libdir>/hipSYCL/ext/llvm-spirv/bin/<name>` and falls
# back to `join_path(get_install_directory(), HIPSYCL_RELATIVE_LLVMSPIRV_PATH)`,
# which our stage sets to `./bin/llvm-spirv` — so the plain name, on PATH, is
# the contract. That is also why the backend metapackages acpp-runtime-ocl and
# acpp-runtime-level-zero depend on this package and acpp-runtime does not: only
# the SPIR-V-consuming backends exec it, and a CUDA-only install JITs to PTX.
#
# SLICING FORM: SCRIPT + one named path, upstream's own. See
# ../_shared/install_llvm_spirv.nu.
#
# ⚠ SCOPE from conda-forge's llvm-spirv-21.1.4 artifacts: exactly
# `bin/llvm-spirv` on unix and `Library/bin/llvm-spirv.exe` on win.
#
# ON UNIX THIS IS A SYMLINK onto acpp-llvm-spirv-21's binary; on WINDOWS
# upstream makes it with `mklink /h`, a hard link, so two real files are
# shipped. Reproduced as upstream has it — see build-spirv-stage.nu.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-llvm-spirv
  version: ${{ llvm_version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: ../_shared/install_llvm_spirv.nu
    env:
      ACPP_LLVM_MAJOR: ${{ llvm_major }}
      ACPP_LLVM_MAJ_MIN: ${{ llvm_maj_min }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-llvm-spirv-stage ==0.0.0
    # UPSTREAM: pin_subpackage("llvm-spirv-" ~ spirv_major, exact=True), in host
    # as well as run.
    - acpp-llvm-spirv-${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # On WIN this package is a hard link — a second REAL executable — so it
    # links libLLVM itself and takes the host dep that computes that run
    # dependency. On unix it is a symlink and its target carries it.
    - if: win
      then: acpp-libllvm${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run:
    # UPSTREAM: pin_subpackage("llvm-spirv-" ~ spirv_major, exact=True)
    - acpp-llvm-spirv-${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run_constraints:
    # NOT UPSTREAM — ours, and carried over from the package this replaces.
    # conda-forge's `llvm-spirv` is a different NAME, so strict channel priority
    # does not shadow it and both could land in one prefix, putting a second
    # `bin/llvm-spirv` on PATH. A same-major window rather than a blanket
    # forbid: only a translator built for the same LLVM major can produce output
    # that disagrees with what acpp expects.
    - llvm-spirv <${{ llvm_major }}.0a0|>=${{ (llvm_major | int) + 1 }}.0a0
  ignore_run_exports:
    from_package:
      - zlib

tests:
  - package_contents:
      strict: true
      files:
        - ${{ library_prefix }}bin/llvm-spirv${{ ".exe" if win else "" }}
  - script:
      - llvm-spirv -help

about:
  homepage: https://github.com/AdaptiveCpp/SPIRV-LLVM-Translator
  license: NCSA
  license_file: licenses/SPIRV-LLVM-Translator-LICENSE.TXT
  summary: |
    A tool for bi-directional translation between SPIR-V and LLVM IR, built from
    AdaptiveCpp's fork at the revision AdaptiveCpp's own build fetches for LLVM
    21; the version is the LLVM this translator belongs to, not a translator
    release. acpp invokes this binary as a subprocess when compiling SYCL
    kernels to SPIR-V.
