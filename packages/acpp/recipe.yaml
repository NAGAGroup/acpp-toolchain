# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp — AdaptiveCpp itself: the acpp drivers, the SYCL headers and the
# AdaptiveCpp cmake package.
#
# THIS IS THE LOAD-BEARING CONSUMER NAME. A project writes `host: acpp` and
# selects the compilers by variant stem; everything it needs at run time
# arrives through this package's run_export, and everything it needs at BUILD
# time arrives through this package's run dependencies.
#
# ⚠ IT NO LONGER SHIPS AN LLVM. Before the lift this package carved
# bin/clang{,++,-cl,-cpp}, bin/clang-<major>, three lld drivers, twenty-odd
# llvm-* binutils and the whole clang resource directory. Every one of those is
# now a lifted package's content — acpp-clang, acpp-clang-21, acpp-lld,
# acpp-llvm-tools, acpp-compiler-rt21 — and shipping them here as well would be
# an install-time clobber between two of our own packages. They are RUN
# DEPENDENCIES instead, which is what makes `host: acpp` still hand a consumer
# a complete working compiler.
#
# Follows the acpp-runtime pattern exactly: single output, stage as a host
# dependency, ../_shared/carve.nu doing the copy, no `files:` block.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_major_next: "22"
  # ⚠ CI MUST SET ACPP_NIGHTLY_DATE. The default is a LOCAL-RENDER placeholder,
  # not a shippable version: 0.dev0 sorts below every real date, so a set built
  # without it would publish as a prerelease nobody resolves. E2E-4 fails the
  # workflow if an unset date reaches a publish; this default exists so a dry
  # run on a laptop does not need the variable.
  version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  # Read from the env ONCE, into context: `build_number` and `hash` are both
  # undefined inside requirements, and the run_export below needs the same
  # value build.number uses.
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
  library_prefix: ${{ "Library/" if win else "" }}

  # ── THE CARVE ────────────────────────────────────────────────────────────
  # Final package paths, semicolon-separated. Every platform names its own set;
  # the final branch is deliberately EMPTY so an unknown platform fails loudly
  # in carve.nu instead of inheriting another platform's list.
  #
  # AdaptiveCpp's OWN install, and nothing else — see the header note. The
  # boundary is legible: nothing conda-forge's LLVM packages contain is in this
  # list, and everything here is a path an LLVM install without AdaptiveCpp
  # would not have.
  #
  # `bin/acpp*` is the driver family (acpp, acpp-info, acpp-...). It cannot
  # swallow the runtime libraries because those are lib/libacpp-*, and on win
  # the extensionless python driver and the *.exe form are spelled separately
  # so a bare `acpp*` under Library/bin does not take acpp-rt.dll and
  # acpp-common.dll, which are acpp-runtime's.
  carve_linux: >-
    bin/acpp*;include/AdaptiveCpp/**;lib/cmake/AdaptiveCpp/**
  carve_osx: >-
    bin/acpp*;include/AdaptiveCpp/**;lib/cmake/AdaptiveCpp/**
  # win additionally has AdaptiveCpp's static link libraries. There is no unix
  # equivalent in this list: on linux and osx those objects are linked into the
  # clang binary by component mode and no separate archive is installed.
  carve_win: >-
    Library/bin/acpp;Library/bin/acpp*.exe;Library/include/AdaptiveCpp/**;Library/lib/cmake/AdaptiveCpp/**;Library/lib/AdaptiveCpp.lib;Library/lib/acpp-frontend.lib;Library/lib/acpp-clang-cbs.lib
  carve: ${{ carve_linux if linux else (carve_win if win else (carve_osx if osx else "")) }}

package:
  name: acpp
  version: ${{ version }}

source:
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: ${{ carve }}
      PKG_NAME: acpp

requirements:
  build:
    - nushell
  host:
    - _acpp-stage ==0.0.0
    # Supplies the exact acpp-runtime spec to `run` via its weak run_export.
    - acpp-runtime ==${{ version }}
  run:
    # The acpp driver is a python program.
    #
    # DELIBERATELY NOT BARE, which is the one thing that makes a variant pin
    # inert: `python: "3.14"` in variants.yaml governs the interpreter lldb's
    # bindings are COMPILED against, and applying it here would pin every
    # consumer's runtime environment to that exact minor for a script that
    # needs a floor. A run dependency on an interpreter is a floor by nature.
    # If a later pass "fixes" this to a bare name, it changes the contract.
    - python >=3.9
    # THE COMPILER THIS PACKAGE USED TO SHIP. `host: acpp` must still hand a
    # consumer a working toolchain, so the drivers, the binutils-equivalent
    # tools and the clang resource directory arrive as dependencies now that
    # each is a lifted package's content.
    #
    # THE cfg BUILD, explicitly. acpp-clang{,xx} ship two builds of one name off
    # the with_cfg axis: the cfg build carries the conda configuration files
    # that make clang prefix-aware (--sysroot, -I$PREFIX/include,
    # -L$PREFIX/lib), the nocfg build is a vanilla clang for tooling. A compiler
    # reached through `host: acpp` inside a conda prefix is exactly the case cfg
    # exists for, so it is named rather than left to the solver.
    - acpp-clang[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*_cfg_*"]
    - acpp-clangxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*_cfg_*"]
    # The binutils-equivalent LLVM programs (llvm-ar, llvm-nm, llvm-ranlib,
    # llvm-strip, llvm-objcopy, ... ) that the activation packages export as
    # AR/NM/RANLIB/STRIP and that any build driven by this toolchain runs.
    - acpp-llvm-tools[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # The cross-flavour lld drivers this package used to carve, plus the one
    # clang invokes as its linker.
    - acpp-lld[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - if: linux
      then:
        # The C and C++ headers and startup files clang needs to compile
        # anything on linux. macOS gets the equivalent from the SDK through its
        # activation package; Windows from the MSVC toolset.
        - libgcc-devel_linux-64 >=13
        - libstdcxx-devel_linux-64 >=13
  run_exports:
    # TWO exports, and they do different jobs.
    strong:
      # THE consumer-facing line. Anything compiled with this toolchain gets
      # the runtime it links against, with no manifest text on the consumer's
      # side. Strong, so it reaches the consumer's `run` from the consumer's
      # `host: acpp`.
      #
      # ⚠ NARROWER THAN THE PUBLISHED CONTRACT, deliberately, for round 1.
      # On `main` this was pin_subpackage('acpp-runtime', upper_bound='x.x'),
      # a RANGE (>=25.10.0,<25.11.0a0). pin_subpackage names another OUTPUT of
      # the same recipe and does not exist across recipes, and a hand-written
      # month-wide range over a DATE version is arithmetic jinja cannot do
      # cleanly. `==<version>` means "the runtime of the same dated build set",
      # which is what a nightly lane means anyway. The range form has to come
      # back with the release lane, alongside the acpp-llvm mutex.
      - acpp-runtime ==${{ version }}
    weak:
      # Self-identity, for acpp-compiler-rt, which takes this package as a HOST
      # dependency and must receive the exact build it was carved beside. Same
      # three-field match spec as acpp-runtime's: name, version, and a build
      # string pinning the LLVM tag and the build number with only the variant
      # hash left free (a consumer cannot compute the producer's hash).
      - acpp ==${{ version }} ${{ llvm_build_tag }}_*_${{ build_num }}
  run_constraints:
    # SAME-MAJOR WINDOWS, not blanket exclusions. These names are unversioned
    # on conda-forge, so a bare `<0.0a0` would forbid them at every version —
    # needlessly barring clang 19 or clang 22 tooling that cannot collide with
    # our files. The window forbids only the major we actually ship.
    #
    # STATED HERE EVEN THOUGH THIS PACKAGE NO LONGER SHIPS THOSE FILES. The
    # collision moved to acpp-clang, acpp-llvm-tools and their siblings, but
    # the constraint's subject did not change: a prefix holds ONE LLVM 21, and
    # `acpp` is the name a consumer actually writes, so this is where the
    # requirement meets a user's spec. (Whether the family should carry an
    # acpp-llvm-style mutex instead is one of the interface items batched for
    # Jack before anything reaches a real channel.)
    - clang <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - clangxx <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - llvm <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - llvm-tools <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - lld <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - llvmdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - clangdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - compiler-rt <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    # Already major-scoped by name, so a blanket forbid IS the same-major
    # window.
    - clang-${{ llvm_major }} <0.0a0

tests:
  - package_contents:
      bin:
        # `bin:` expands to the platform's executable spelling, so the
        # extensionless acpp python driver matches on both layouts.
        - acpp
        - acpp-info
      files:
        exists:
          - if: linux
            then:
              - include/AdaptiveCpp/sycl/sycl.hpp
              - lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
          - if: osx
            then:
              # AdaptiveCpp's component mode is (APPLE OR WIN32), which nests
              # the SYCL headers one level deeper than on linux.
              - include/AdaptiveCpp/AdaptiveCpp/sycl/sycl.hpp
              - include/AdaptiveCpp/hipSYCL/sycl/sycl.hpp
              - lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
          - if: win
            then:
              - Library/include/AdaptiveCpp/AdaptiveCpp/sycl/sycl.hpp
              - Library/include/AdaptiveCpp/hipSYCL/sycl/sycl.hpp
              - Library/lib/cmake/AdaptiveCpp/adaptivecpp-config-version.cmake
        not_exists:
          # The partition, asserted from this side: siblings' files must not be
          # here. clang and the resource directory are acpp-clang's and
          # acpp-clang-21's, llvm-ar is acpp-llvm-tools', llvm-config is
          # acpp-llvmdev's, clang-tidy acpp-clang-tools', lldb acpp-lldb's.
          # Every one of the first three was content of THIS package before the
          # lift, which is what makes them worth asserting rather than assuming.
          - if: not win
            then:
              - bin/clang
              - bin/llvm-ar
              - bin/clang-tidy
              - bin/lldb
              - bin/llvm-config
              - lib/clang/${{ llvm_major }}/include/omp.h
          - if: win
            then:
              - Library/bin/clang.exe
              - Library/bin/llvm-ar.exe
              - Library/bin/clang-tidy.exe
              - Library/bin/lldb.exe
              - Library/bin/llvm-config.exe
              - Library/lib/clang/${{ llvm_major }}/include/omp.h

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: BSD-2-Clause AND Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/AdaptiveCpp-LICENSE
    - licenses/llvm-LICENSE.TXT
  summary: AdaptiveCpp SYCL compiler (clang with AdaptiveCpp linked in)
