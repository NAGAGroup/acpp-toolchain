# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-toolkit — the root meta package: everything this workspace ships, as one
# name. Jack's ruling, and it has two jobs.
#
#   * FOR A USER: `pixi add acpp-toolkit` installs the whole toolchain — the
#     compiler, the runtime and its backends, the clang/LLVM family, the
#     activation for the platform — instead of a list of forty names nobody can
#     be expected to know.
#   * FOR US: it makes ONE `pixi publish` with no `--path` build and publish the
#     entire set, because every package it names is mapped as a workspace
#     sibling in pixi.toml.
#
# IT SHIPS NOTHING AND EXPORTS NOTHING. `build: files: []` is the always-empty
# form (not carve.nu's ACPP_CARVE_NONE, which is for a package that is empty on
# ONE platform and real on another), and a metapackage that exported anything
# would be exporting another package's identity — a package exports itself.
#
# ⚠ TWO PACKAGES WE SHIP ARE DELIBERATELY NOT NAMED HERE, and both would make
# this package UNSOLVABLE rather than merely fat:
#
#   * `acpp-clang-no-conda-cfg` pins the NOCFG build of acpp-clang
#     (`build="..._nocfg_*"`), while `acpp` below pins the CFG build. Requiring
#     both is a contradiction. It is a 24 kB selector metapackage that exists
#     precisely so someone can opt OUT of the conda configuration files, and
#     upstream ships it for the same opt-in reason — it appears in neither of
#     Jack's own trees.
#   * `acpp-clang-cl_win-64` carries `run_constraints` excluding
#     `acpp-clang_win-64` and `acpp-clangxx_win-64`, because all three install a
#     vs<YEAR>_y-* activation script and all three claim CC. It is an
#     ALTERNATIVE to the clang/clangxx pair, not an addition to it, and the pair
#     is what the acpp flow uses.
#
# Both are still built and published by the same workspace publish; they are
# simply not pulled in by this name. That is the difference between "everything
# we ship" and "everything that can be installed at once".

context:
  llvm_version: "21.1.8"
  # The activation packages carry MAJOR.MINOR — conda-forge's own split, and
  # ours since group 6.
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  # AdaptiveCpp's date version, read from the environment ONCE, into context:
  # `build_number` and `hash` are both undefined inside `requirements:`, and
  # every spec below plus build.number must read the same value.
  # ⚠ CI MUST SET ACPP_NIGHTLY_DATE. The default is a LOCAL-RENDER placeholder,
  # not a shippable version: 0.dev0 sorts below every real date, so a set built
  # without it would publish as a prerelease nobody resolves. E2E-4 fails the
  # workflow if an unset date reaches a publish; this default exists so a dry
  # run on a laptop does not need the variable.
  version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}

  # THE THREE SPEC TAILS, spelled once. Every dependency below is pinned to one
  # build of the family through the build string, which LEADS with the LLVM tag
  # — that is the whole coupling mechanism: a toolkit cannot be assembled from
  # two different LLVMs. Only the h<hash> segment is free, because a consumer
  # cannot compute another recipe's variant hash.
  llvm_pin: '[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]'
  activation_pin: '[version="==${{ llvm_maj_min }}",build="${{ llvm_build_tag }}_*"]'
  ours_pin: '[version="==${{ version }}",build="${{ llvm_build_tag }}_*"]'

package:
  name: acpp-toolkit
  version: ${{ version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  # A metapackage: no script, and an explicitly empty file list.
  files: []

requirements:
  run:
    # ── ours (date-versioned) ────────────────────────────────────────────────
    - acpp${{ ours_pin }}
    - acpp-runtime${{ ours_pin }}
    # The backend metapackages. Jack's ruling is that the toolkit pulls the
    # runtime packages too, so an install is usable on whatever hardware is
    # present rather than needing a second decision. They ship no files; each
    # brings its backend's userspace libraries, and on a machine without that
    # device the backend simply reports none available.
    - if: not osx
      then:
        - acpp-runtime-cuda${{ ours_pin }}
        - acpp-runtime-level-zero${{ ours_pin }}
        - acpp-runtime-ocl${{ ours_pin }}
    - if: linux
      then: acpp-runtime-rocm${{ ours_pin }}

    # ── activation (MAJOR.MINOR), one pair per platform ─────────────────────
    # The names are templated on target_platform exactly as the packages'
    # own recipes template them.
    - acpp-clang_${{ target_platform }}${{ activation_pin }}
    - acpp-clangxx_${{ target_platform }}${{ activation_pin }}

    # ── the LLVM family (21.1.8) ────────────────────────────────────────────
    - acpp-llvm${{ llvm_pin }}
    - acpp-llvmdev${{ llvm_pin }}
    - acpp-libllvm21${{ llvm_pin }}
    - acpp-llvm-tools${{ llvm_pin }}
    - acpp-clang${{ llvm_pin }}
    - acpp-clangxx${{ llvm_pin }}
    - acpp-clang-21${{ llvm_pin }}
    - acpp-clangdev${{ llvm_pin }}
    - acpp-clang-format${{ llvm_pin }}
    - acpp-clang-tools${{ llvm_pin }}
    - acpp-libclang${{ llvm_pin }}
    - acpp-libclang13${{ llvm_pin }}
    - acpp-libclang-cpp${{ llvm_pin }}
    - acpp-lld${{ llvm_pin }}
    - acpp-lldb${{ llvm_pin }}
    - acpp-llvm-openmp${{ llvm_pin }}
    - acpp-compiler-rt${{ llvm_pin }}
    - acpp-compiler-rt21${{ llvm_pin }}
    - acpp-libcompiler-rt${{ llvm_pin }}
    - acpp-compiler-rt_${{ target_platform }}${{ llvm_pin }}
    - acpp-compiler-rt21_${{ target_platform }}${{ llvm_pin }}
    - acpp-llvm-spirv${{ llvm_pin }}
    - acpp-llvm-spirv-21${{ llvm_pin }}
    - acpp-libllvmspirv${{ llvm_pin }}

    # ── names upstream skips on Windows, so we do too ───────────────────────
    # Each `if` mirrors the skip in the named package's own recipe; a spec for a
    # package that is not built on this platform is an unsolvable environment,
    # not a no-op.
    - if: not win
      then:
        # No versioned SPIRV shared library on win: BUILD_SHARED_LIBS is unset
        # there (upstream's bld.bat), so there is nothing to version.
        - acpp-libllvmspirv21${{ llvm_pin }}
        - acpp-llvm-tools-21${{ llvm_pin }}
        - acpp-libclang-cpp21.1${{ llvm_pin }}
        - acpp-clang-format-21${{ llvm_pin }}
        - acpp-clang-scan-deps${{ llvm_pin }}
        # The triplet-prefixed drivers the activation exports as CC/CXX.
        # clangdev builds these natively and skips win, where the activation
        # uses the bare clang.exe name instead.
        - acpp-clang_impl_${{ target_platform }}${{ llvm_pin }}
        - acpp-clangxx_impl_${{ target_platform }}${{ llvm_pin }}
    - if: win
      then:
        # win's llvmdev splits the C API into its own package.
        - acpp-libllvm-c21${{ llvm_pin }}

    # ── platform-only members ───────────────────────────────────────────────
    - if: osx
      then:
        # On macOS libc++ IS the platform C++ library and we build it; linux
        # uses libstdcxx and win the MSVC runtime.
        - acpp-libcxx${{ llvm_pin }}
        - acpp-libcxx-headers${{ llvm_pin }}
        - acpp-libcxx-devel${{ llvm_pin }}
    - if: linux
      then:
        # BOLT is ELF-only and has no darwin or PE/COFF port.
        - acpp-bolt${{ llvm_pin }}

tests:
  - package_contents:
      # A metapackage ships nothing, and strict makes that an assertion rather
      # than a hope: strict mode fails on any file not matched by the list, and
      # the list is empty.
      strict: true
      files: []

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: BSD-2-Clause AND Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/AdaptiveCpp-LICENSE
    - licenses/llvm-LICENSE.TXT
  summary: The complete AdaptiveCpp + LLVM toolchain — compiler, runtime, backends and tools

source:
  # Only the vendored licence texts: a metapackage has no source tree, and
  # license_file resolves against SRC_DIR/RECIPE_DIR, never the prefix.
  - path: ../_shared/licenses
    target_directory: licenses
