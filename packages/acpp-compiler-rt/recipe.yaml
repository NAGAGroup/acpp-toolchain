# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-compiler-rt — the unversioned selector. Lifted from the reference
# monolith's `compiler-rt` output (compiler-rt-feedstock).
#
# SHIPS NOTHING, and says so with `files: []` exactly as upstream does. It runs
# no slice script, so it does NOT take the stage as a host dependency — the same
# exception the acpp-llvm and acpp-compiler-rt_<platform> metapackages take, for
# the same reason: it is not a slicer.
#
# THIS FILE REPLACES A PRE-METHODOLOGY acpp-compiler-rt of the same name that
# carved static archives directly out of the stage. That package was the wrong
# shape twice over — it had no upstream counterpart, and its `lib/clang/**`
# claim is what collided with acpp-llvm-dev on the currently published channel.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-compiler-rt
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  files: []

requirements:
  build: []
  run:
    # UPSTREAM: pin_subpackage("compiler-rt" ~ major_ver, exact=True)
    - acpp-compiler-rt${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # UPSTREAM: pin_subpackage("libcompiler-rt", exact=True), under the same
    # win-arm64 guard the libcompiler-rt output carries. Inert for us and kept
    # because it states a fact about the upstream build.
    - if: not (win and arm64)
      then: acpp-libcompiler-rt[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run_constraints:
    - acpp-clang ==${{ llvm_version }}

tests:
  - package_contents:
      strict: true
      files: []

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: compiler-rt runtime libraries (metapackage)
  description: |
    builtins - low-level target-specific hooks required by code generation and other
      runtime components
    sanitizer runtimes - AddressSanitizer, ThreadSanitizer, UndefinedBehaviorSanitizer,
      MemorySanitizer, LeakSanitizer, DataFlowSanitizer
    profile - library which is used to collect coverage information
    BlocksRuntime - target-independent implementation of Apple "Blocks" runtime
      interfaces
