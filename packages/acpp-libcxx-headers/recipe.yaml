# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-libcxx-headers — the libc++ headers, the C++20 module sources and the
# module manifest. Lifted from the reference monolith's `libcxx-headers` output
# (libcxx-feedstock).
#
# OSX ONLY — see ../acpp-libcxx/recipe.yaml for why this family exists on macOS
# alone.
#
# NOT `noarch: generic`, and that IS a divergence. Upstream's comment says why
# it made it generic: "This output is generic so that we can use the headers for
# cross compiling". We build three platforms NATIVELY and ship this family on
# one of them, so there is no cross-compile to serve — and a noarch output whose
# content only exists in the osx stage would have to be produced by the osx job
# while claiming to belong to none, which is a shape worth avoiding for a
# benefit we do not collect.
#
# SLICING FORM: GLOB LIST, upstream's own. `include/c++`, `share/libc++` and
# `lib/libc++.modules.json` are all libc++-owned names, so they cannot reach
# another project's output in our union stage.
#
# Cross-checked against conda-forge's libcxx-headers-21.1.8 artifact: 1814
# paths — 1680 under include/c++, 133 under share/libc++, and the one
# lib/libc++.modules.json.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

package:
  name: acpp-libcxx-headers
  version: ${{ llvm_version }}

source:
  # THE LICENCES MUST BE A SOURCE, NOT A `../` PATH. rattler-build resolves
  # `license_file` against the rendered SOURCE directory, and a parent-relative
  # path never resolves — measured both ways on a throwaway recipe: with no
  # source and with one present, `../_shared/licenses/…` fails identically with
  # "No license files were copied", which is what stopped every slicer in run
  # 34107933036 AFTER its carve had succeeded. Bringing the directory in as a
  # source is the shape `_acpp-stage` has always used.
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  skip: not osx
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: >-
        include/c++/**;
        share/libc++/**;
        lib/libc++.modules.json

requirements:
  build:
    - nushell
  host:
    - _acpp-stage ==0.0.0
  run:
    # Upstream's `__unix` / `__win` virtual-package split; only the unix half
    # can be reached from an osx-only package.
    - __unix
  run_constraints:
    # UPSTREAM: `libcxx-devel ${{ version }}.*`, naming ours.
    - acpp-libcxx-devel ==${{ llvm_version }}
    # "core headers like algorithm rely on `__builtin_ctzg`, which needs newer
    # compilers" — naming OUR clangxx, since nothing ships under a conda-forge
    # name.
    - acpp-clangxx >=19
    # Upstream additionally constrains gxx_linux-64, gxx_osx-64 and
    # gxx_osx-arm64, "for gxx we don't have a suitable non-target-specific
    # output that all platforms depend on". Only the osx-arm64 one is kept: it
    # names a conda-forge package a user could really install alongside us on
    # the one platform this package exists for, while the other two name
    # platforms we do not build this family on at all.
    - gxx_osx-arm64 >=14

tests:
  - package_contents:
      files:
        exists:
          - include/c++/v1/iterator
          - include/c++/v1/__configuration/availability.h
          - share/libc++/v1/std.cppm
          - lib/libc++.modules.json
        not_exists:
          # the libraries are acpp-libcxx's
          - lib/libc++.dylib
          - lib/libc++.a
          # clang's and llvm's own headers belong to their packages
          - include/clang/Lex/Lexer.h
          - include/llvm/Config/llvm-config.h

about:
  homepage: https://libcxx.llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: licenses/llvm-LICENSE.TXT
  summary: LLVM C++ standard library headers
