# nightly — the ONE workflow for the rebuilt package set.
#
# One file by design: the channel needs a single trusted-publisher
# registration rather than one per platform. Platform selection happens
# through dispatch inputs, not through separate workflows.
#
# JOB SHAPE IS LOAD-BEARING. Every package of a platform builds in ONE job,
# because the expensive acpp-stage build is reused across all of them through
# pixi's .pixi/bld cache, and that cache does not cross runners. Parallelise
# by PLATFORM, never by package — a job per package would rebuild LLVM per
# package.
#
# THERE IS NO "BUILD WITHOUT PUBLISHING" MODE, and that is structural rather
# than an omission. `acpp`'s recipe carries `acpp-runtime ==<version>` as a
# HOST dependency, and host dependencies resolve. acpp-runtime cannot be a
# workspace sibling of acpp (pixi classifies a sibling named in run_exports as
# a source RUN dependency and refuses to publish acpp on its own), so it has
# to reach acpp through a channel — which means it must already be PUBLISHED
# when acpp builds. Everything from `acpp` onward therefore requires a real
# channel. The gates run immediately after, and `--force` means a bad set is
# corrected by re-running rather than by cleanup.
name: nightly

on:
  workflow_dispatch:
    inputs:
      linux:
        description: "Build linux-64"
        type: boolean
        default: true
      win:
        description: "Build win-64"
        type: boolean
        default: true
      osx:
        description: "Build osx-arm64"
        type: boolean
        default: true
      build_number:
        description: "Build number"
        default: "0"

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Emits the platform matrix from the boolean inputs, and pins the version
  # ONCE for the whole run. A date computed per-job could straddle midnight UTC
  # and split one run across two versions.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      nightly_date: ${{ steps.v.outputs.date }}
    steps:
      - id: v
        run: echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          # `expect` is the number of ARTIFACTS that platform produces, which
          # is not the package count: the activation packages are multi-output
          # (linux 2, win 3, osx 2). MEASURED by rendering every package on
          # every platform, not inferred from the skip blocks.
          entries=()
          [ "${{ inputs.linux }}" = "true" ] && entries+=('{"platform":"linux-64","runner":"Linux-x64-64","expect":13}')
          [ "${{ inputs.win }}"   = "true" ] && entries+=('{"platform":"win-64","runner":"Win-x64-64","expect":13}')
          [ "${{ inputs.osx }}"   = "true" ] && entries+=('{"platform":"osx-arm64","runner":"macOS-26-xlarge","expect":8}')
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No platform selected — nothing to do." >&2
            exit 1
          fi
          printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      # A red platform must never cancel its siblings: each platform that
      # succeeds publishes while the others are still being fixed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600
    permissions:
      id-token: write # OIDC trusted publishing — no stored key anywhere
    env:
      # Set ONCE, here. Every recipe reads these; a package falling back to its
      # default would publish version 0.dev0 silently.
      ACPP_NIGHTLY_DATE: ${{ needs.setup.outputs.nightly_date }}
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the vendored feedstocks are submodules

      # A run that forgets the version publishes `0.dev0` with nothing failing
      # anywhere. Fail here, before anything is built.
      - name: Guard — version must be set
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACPP_NIGHTLY_DATE:-}" ] || [ "$ACPP_NIGHTLY_DATE" = "0.dev0" ]; then
            echo "ACPP_NIGHTLY_DATE is unset or default — refusing to build." >&2
            exit 1
          fi
          echo "Building $ACPP_NIGHTLY_DATE build $ACPP_BUILD_NUMBER for ${{ matrix.platform }}"

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      # Explicit restore/save on both caches: actions/cache's post-step only
      # saves on job SUCCESS, which starves iteration on exactly the runs that
      # need warmth.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-

      # THE stage cache. This is what makes the expensive build run once for
      # all eleven-plus packages instead of once each.
      - name: Restore pixi build cache
        uses: actions/cache/restore@v4
        with:
          path: .pixi/bld
          key: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/acpp-stage/**') }}-${{ github.run_id }}
          restore-keys: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/acpp-stage/**') }}-

      # Publishes in dependency order and collects the artifacts for gating.
      # Asserts that every package on disk is accounted for as built or
      # skipped, and that the skips are this platform's expected ones.
      - name: Build and publish, in dependency order
        run: >
          pixi exec --spec nushell -- nu tools/build-platform.nu
          --channel https://prefix.dev/jackm97/naga-labs-staging
          --artifacts-dir dist

      # Replaces the zero-clobber partition audit the exclude-based carve
      # removed. Asserts the PROPERTY — no two of our packages ship the same
      # path — rather than that the glob lists looked right. It found a real
      # clobber on the CURRENT channel the first time it was run. `--expect`
      # is mandatory and refuses a count below two, so it cannot pass
      # vacuously over an empty or single-artifact set.
      - name: "Gate: acpp-* artifacts are pairwise disjoint"
        run: >
          pixi exec --spec nushell --spec libarchive -- nu tools/check-package-disjointness.nu
          --artifacts dist
          --expect ${{ matrix.expect }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
      - name: Save pixi build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pixi/bld
          key: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/acpp-stage/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          retention-days: 14
