# acpp-toolkit — the root meta package. PACKAGE-ONLY manifest; the sole
# [workspace] is the repo root.
#
# WHY THIS TABLE IS SO LONG. Every name the recipe puts under `run:` is a
# workspace sibling, and a sibling that is not mapped here is looked for in a
# CHANNEL instead of being built — which for a set that exists nowhere yet
# means a publish that quietly does not include it. Jack's rule, stated for
# exactly this package: the metapackage maps its runtime-only siblings in
# build-dependencies too.
#
# The mapping is a source-path MAPPING and nothing more. It adds no dependency
# and no version; the recipe is the sole authority for what each one IS, and
# `[package.run-dependencies]` here would be accepted and SILENTLY DROPPED.
#
# The four `-impl` keys and the three `acpp-activation-*` keys are DIRECTORY
# names: those recipes emit `${{ target_platform }}`-templated package names,
# and a pixi package manifest needs a fixed [package] name.
[package]
name = "acpp-toolkit"
version = "0.dev0"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build-dependencies]
# ours
acpp = { workspace = true }
acpp-runtime = { workspace = true }
acpp-runtime-cuda = { workspace = true }
acpp-runtime-level-zero = { workspace = true }
acpp-runtime-ocl = { workspace = true }
acpp-runtime-rocm = { workspace = true }
# activation (the three feedstock ports; each emits its platform's outputs)
acpp-activation-linux = { workspace = true }
acpp-activation-win = { workspace = true }
acpp-activation-osx = { workspace = true }
# llvm + clang + friends
acpp-llvm = { workspace = true }
acpp-llvmdev = { workspace = true }
acpp-libllvm21 = { workspace = true }
acpp-libllvm-c21 = { workspace = true }
acpp-llvm-tools = { workspace = true }
acpp-llvm-tools-21 = { workspace = true }
acpp-clang = { workspace = true }
acpp-clangxx = { workspace = true }
acpp-clang-21 = { workspace = true }
"acpp-clang_impl_linux-64" = { workspace = true }
"acpp-clang_impl_osx-arm64" = { workspace = true }
"acpp-clangxx_impl_linux-64" = { workspace = true }
"acpp-clangxx_impl_osx-arm64" = { workspace = true }
acpp-clangdev = { workspace = true }
acpp-clang-format = { workspace = true }
acpp-clang-format-21 = { workspace = true }
acpp-clang-scan-deps = { workspace = true }
acpp-clang-tools = { workspace = true }
acpp-libclang = { workspace = true }
acpp-libclang13 = { workspace = true }
acpp-libclang-cpp = { workspace = true }
"acpp-libclang-cpp21.1" = { workspace = true }
acpp-lld = { workspace = true }
acpp-lldb = { workspace = true }
acpp-llvm-openmp = { workspace = true }
acpp-bolt = { workspace = true }
# compiler-rt
acpp-compiler-rt = { workspace = true }
acpp-compiler-rt21 = { workspace = true }
acpp-libcompiler-rt = { workspace = true }
"acpp-compiler-rt_linux-64" = { workspace = true }
"acpp-compiler-rt_win-64" = { workspace = true }
"acpp-compiler-rt_osx-arm64" = { workspace = true }
"acpp-compiler-rt21_linux-64" = { workspace = true }
"acpp-compiler-rt21_win-64" = { workspace = true }
"acpp-compiler-rt21_osx-arm64" = { workspace = true }
# the SPIR-V translator
acpp-llvm-spirv = { workspace = true }
acpp-llvm-spirv-21 = { workspace = true }
acpp-libllvmspirv = { workspace = true }
acpp-libllvmspirv21 = { workspace = true }
# libc++, osx only
acpp-libcxx = { workspace = true }
acpp-libcxx-headers = { workspace = true }
acpp-libcxx-devel = { workspace = true }
