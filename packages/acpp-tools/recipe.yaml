# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-tools — the developer tooling built beside the compiler:
# clang-tools-extra (clang-tidy, clangd, clang-format, clang-query, ...), the
# static analyzer drivers, the offload/arch helpers, and on linux BOLT.
#
# Kept out of `acpp` so a project can install the compiler without the tooling,
# and so the same-major run_constraints below bite only a matching-major
# clang-format/clangd — a project keeps its own different-major dev tools.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_major_next: "22"
  version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
  library_prefix: ${{ "Library/" if win else "" }}

  # ── THE CARVE ────────────────────────────────────────────────────────────
  # Final package paths, semicolon-separated, one explicit set per platform and
  # an empty final branch so an unknown platform fails loudly in carve.nu.
  #
  # BOLT is linux only: it is ELF-only and has no darwin port, and the stage
  # puts it in LLVM_ENABLE_PROJECTS on the linux leg alone.
  carve_linux: >-
    bin/amdgpu-arch;bin/clang-apply-replacements;bin/clang-change-namespace;bin/clang-check;bin/clang-doc;bin/clang-extdef-mapping;bin/clang-format;bin/clang-include-cleaner;bin/clang-include-fixer;bin/clang-installapi;bin/clang-linker-wrapper;bin/clang-move;bin/clang-nvlink-wrapper;bin/clang-offload-bundler;bin/clang-offload-packager;bin/clang-query;bin/clang-refactor;bin/clang-reorder-fields;bin/clang-repl;bin/clang-scan-deps;bin/clang-sycl-linker;bin/clang-tidy;bin/clangd;bin/diagtool;bin/find-all-symbols;bin/git-clang-format;bin/hmaptool;bin/modularize;bin/nvptx-arch;bin/offload-arch;bin/pp-trace;bin/run-clang-tidy;bin/scan-build;bin/scan-build-py;bin/scan-view;bin/llvm-bolt;bin/llvm-bolt-heatmap;bin/perf2bolt;bin/merge-fdata;share/clang/**;share/scan-build/**;share/scan-view/**;share/opt-viewer/**;lib/libear/**;lib/libscanbuild/**;libexec/**
  # win: no bolt, scan-build ships extra .bat drivers, and the python analyzer
  # entry points (analyze-build, intercept-build) land in bin.
  carve_win: >-
    Library/bin/amdgpu-arch.exe;Library/bin/analyze-build;Library/bin/clang-apply-replacements.exe;Library/bin/clang-change-namespace.exe;Library/bin/clang-check.exe;Library/bin/clang-doc.exe;Library/bin/clang-extdef-mapping.exe;Library/bin/clang-format.exe;Library/bin/clang-include-cleaner.exe;Library/bin/clang-include-fixer.exe;Library/bin/clang-installapi.exe;Library/bin/clang-linker-wrapper.exe;Library/bin/clang-move.exe;Library/bin/clang-nvlink-wrapper.exe;Library/bin/clang-offload-bundler.exe;Library/bin/clang-offload-packager.exe;Library/bin/clang-query.exe;Library/bin/clang-refactor.exe;Library/bin/clang-reorder-fields.exe;Library/bin/clang-repl.exe;Library/bin/clang-scan-deps.exe;Library/bin/clang-sycl-linker.exe;Library/bin/clang-tidy.exe;Library/bin/clangd.exe;Library/bin/diagtool.exe;Library/bin/find-all-symbols.exe;Library/bin/git-clang-format;Library/bin/git-clang-format.bat;Library/bin/hmaptool;Library/bin/intercept-build;Library/bin/modularize.exe;Library/bin/nvptx-arch.exe;Library/bin/pp-trace.exe;Library/bin/run-clang-tidy;Library/bin/scan-build;Library/bin/scan-build.bat;Library/bin/scan-build-py;Library/bin/scan-view;Library/share/clang/**;Library/share/scan-build/**;Library/share/scan-view/**;Library/share/opt-viewer/**;Library/lib/libear/**;Library/lib/libscanbuild/**;Library/libexec/**
  # ⚠ osx IS NEW THIS ROUND and unproven: `main` skipped this package on macOS
  # entirely. clang-tools-extra is in the stage's darwin project list, so the
  # tooling exists there; the list is deliberately NARROWER than linux because
  # a carve glob that matches nothing FAILS the build, and the GPU-arch probes
  # (amdgpu-arch, nvptx-arch, offload-arch) are the entries whose presence on a
  # macOS build is unverified. Anything left unclaimed here is picked up by
  # acpp-llvm-dev's bin/** remainder, so nothing goes unpackaged.
  carve_osx: >-
    bin/clang-apply-replacements;bin/clang-change-namespace;bin/clang-check;bin/clang-doc;bin/clang-extdef-mapping;bin/clang-format;bin/clang-include-cleaner;bin/clang-include-fixer;bin/clang-installapi;bin/clang-linker-wrapper;bin/clang-move;bin/clang-nvlink-wrapper;bin/clang-offload-bundler;bin/clang-offload-packager;bin/clang-query;bin/clang-refactor;bin/clang-reorder-fields;bin/clang-repl;bin/clang-scan-deps;bin/clang-sycl-linker;bin/clang-tidy;bin/clangd;bin/diagtool;bin/find-all-symbols;bin/git-clang-format;bin/hmaptool;bin/modularize;bin/pp-trace;bin/run-clang-tidy;bin/scan-build;bin/scan-build-py;bin/scan-view;share/clang/**;share/scan-build/**;share/scan-view/**;share/opt-viewer/**;lib/libear/**;lib/libscanbuild/**;libexec/**
  carve: ${{ carve_linux if linux else (carve_win if win else (carve_osx if osx else "")) }}

package:
  name: acpp-tools
  version: ${{ version }}

source:
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: ${{ carve }}
      PKG_NAME: acpp-tools

requirements:
  build:
    - nushell
  host:
    - acpp-stage ==${{ version }}
    # HOST, so acpp-runtime's weak run_export supplies the exact-build run
    # dependency. These binaries link the same libLLVM/libclang-cpp the
    # runtime ships.
    - acpp-runtime ==${{ version }}
  run:
    # scan-build-py, run-clang-tidy, git-clang-format and the opt-viewer are
    # python programs.
    - python >=3.9
  run_constraints:
    # Same-major windows: a different-major clang-format or clangd cannot
    # collide with ours, so a project can keep its own dev tooling in the same
    # environment.
    - clang-tools <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - clang-format <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - clang-scan-deps <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    # Already major-scoped by name, so a blanket forbid IS the same-major
    # window.
    - clang-format-${{ llvm_major }} <0.0a0

tests:
  - package_contents:
      bin:
        - clang-format
        - clang-tidy
        - clangd
        - run-clang-tidy
        - scan-build
        - if: linux
          then:
            - llvm-bolt

about:
  homepage: https://clang.llvm.org/extra/
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/llvm-LICENSE.TXT
  summary: clang-tools-extra, the static analyzers and BOLT for the acpp toolchain
