# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-lld — the LLVM linker. Lifted from the reference monolith's `lld` output
# (lld-feedstock).
#
# SLICING FORM: SCRIPT, upstream's own. lld-feedstock is a single-package recipe
# with no `outputs:` and no `files:` — its package is "whatever the build
# installed" — so translating it into globs would be exactly the unverifiable
# judgement this rework exists to remove. See ../_shared/install_lld.nu, which
# carries the scope and the reason for each entry.
#
# ⚠ SCOPE DERIVED FROM CONDA-FORGE'S lld-21.1.8 ARTIFACT, not from the build,
# because our union stage removes the per-project scoping upstream's own prefix
# provided. 31 paths, and the SAME 31 on all three platforms modulo naming.
#
# ONE THING THE STAGE ALREADY DOES FOR US: upstream applies a patch pointing
# lld/MachO's header inclusion at the right directory. `_acpp-stage` applies
# lld-feedstock's patches from its own v21.1.8 revision, so the tree this slices
# is already patched; nothing is re-applied here.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  library_prefix: ${{ "Library/" if win else "" }}

package:
  name: acpp-lld
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  script:
    interpreter: nu
    file: ../_shared/install_lld.nu

requirements:
  build:
    # Upstream's cmake and ninja are dropped — build machinery a copy cannot
    # use. The compilers stay: this package ships six static libraries, and it
    # is their STRONG run_exports that put libgcc / libstdcxx into the run deps.
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - nushell
  host:
    - _acpp-stage ==0.0.0
    # UPSTREAM: `libcxx ==${{ cxx_compiler_version }}`, which is the conda-build
    # BARE form meaning the range 21.*; see the note in ../acpp-libclang.
    - if: osx
      then: acpp-libcxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - acpp-llvmdev ==${{ llvm_version }}
    - acpp-llvm ==${{ llvm_version }}
    # "these they are present in the host env anyway as run-deps of llvm
    #  and will be picked up for the build by the default settings"
    - libxml2-devel
    - zlib
    - zstd
  run:
    # UPSTREAM: pin_compatible("libcxx", upper_bound=None) — a floor at whatever
    # libcxx the host resolved, which for us is the same number the host spec
    # above floors at.
    - if: osx
      then: acpp-libcxx[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
  run_constraints:
    # Upstream names `llvm`; ours names ours, because nothing ships under a
    # conda-forge name and a constraint on a name our channel provides would be
    # a hard solve failure under strict channel priority rather than a
    # fall-through.
    - acpp-llvm ==${{ llvm_version }}
  ignore_run_exports:
    from_package:
      # "not actually needed on unix"
      - if: unix
        then: libxml2-devel

tests:
  - package_contents:
      files:
        exists:
          - ${{ library_prefix }}bin/ld.lld${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/lld-link${{ ".exe" if win else "" }}
          - ${{ library_prefix }}bin/wasm-ld${{ ".exe" if win else "" }}
          - ${{ library_prefix }}include/lld/Common/Driver.h
          - ${{ library_prefix }}lib/cmake/lld/LLDConfig.cmake
          - ${{ "lib/liblldELF.a" if unix else "Library/lib/lldELF.lib" }}
        not_exists:
          # llvm's own tools, headers, cmake package and archives are
          # acpp-llvm-tools' and acpp-llvmdev's
          - ${{ library_prefix }}bin/llvm-config${{ ".exe" if win else "" }}
          - ${{ library_prefix }}include/llvm/Config/llvm-config.h
          - ${{ library_prefix }}lib/cmake/llvm/LLVMConfig.cmake
          # lldb is acpp-lldb's
          - ${{ library_prefix }}bin/lldb${{ ".exe" if win else "" }}

about:
  homepage: https://lld.llvm.org/
  repository: https://github.com/llvm/llvm-project/
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: The LLVM Linker
