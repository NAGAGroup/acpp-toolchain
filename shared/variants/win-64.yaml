# Windows build variants.
#
# conda-forge's default on win is vs2022 (MSVC) and llvmdev builds that way,
# but AdaptiveCpp is only ever built with clang-cl upstream and its sources
# have never been exercised under MSVC — so we deviate on the BUILD compiler
# only, using conda-forge's own clang_win-64/clangxx_win-64 toolchain. The
# stdlib stays conda-forge canonical (vs), and the compiler we SHIP still
# targets the MSVC ABI either way.
c_compiler:
  - clang
cxx_compiler:
  - clangxx
# NOTE: c_stdlib_version is unix-only in conda-forge's pinning; do not set it.
c_stdlib:
  - vs
# Pin the Visual Studio year EXACTLY to what the build machine has installed.
# The conda vs20XX_win-64 packages are activation shims: they locate a system
# VS install and call vcvars with that year's toolset. If the pinned year is
# not installed as a PRODUCT, compilation fails even when a newer VS is
# present (side-by-side toolsets are not a reliable substitute).
#
# 2022 is currently the ONLY viable pin, and that is forced by the ecosystem,
# not by preference: conda-forge builds clang_win-64 only against
# vs2022_win-64 (==19.44.35207) or vs2019_win-64 (==19.29.30139) — its
# clang-win-activation feedstock zips VSYEAR over [2022, 2019] and there is no
# vs2026 variant yet. Pinning 2026 makes clang_win-64 unsolvable outright.
#
# Our Win-x64-64 runner has ONLY VS 18 Enterprise (2026) as a PRODUCT, but it
# does carry the 14.44 toolset side-by-side (VC\Redist\MSVC\14.44.35112), and
# a prior run confirmed `vcvars64.bat -vcvars_ver=14.44` succeeds there with no
# "Toolset directory ... was not found" error. That is what makes 2022 safe
# HERE; revisit if the runner image drops the 14.44 toolset, and switch to
# 2026 as soon as conda-forge ships a clang_win-64 built against it.
#
# Pinning the year also keeps vs2019 out, which is the real goal.
#
# NB: conda-forge scopes c_stdlib_version to unix in its global pinning; we set
# it on win deliberately, because choosing clang as the build compiler means we
# never get the year pinned via `c_compiler: vs2022`.
c_stdlib_version:
  - "2022.*"
