# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-compiler-rt21_<platform> — the arch-specific compiler-rt static
# libraries and object files. Lifted from the reference monolith's
# `compiler-rt${{ major_ver }}_${{ target_platform }}` output
# (compiler-rt-feedstock).
#
# THE DIRECTORY AND MANIFEST ARE NAMED `acpp-compiler-rt21-impl`, THE PACKAGE IS
# NOT. The recipe emits a name templated on `target_platform`, and a pixi
# package manifest needs a fixed `[package] name`; the `acpp-activation-*`
# wrappers already work that way. Whether pixi connects a manifest name to a
# recipe dep that differs from it is UNPROVEN and waits on the first real build.
#
# SLICING FORM: GLOB LIST, upstream's own, and it needs no artifact derivation:
# `lib/clang/21/lib` is compiler-rt's alone. Its two siblings under the same
# resource directory take disjoint subtrees — `include/` and `share/` go to
# acpp-compiler-rt21, the rest of `include/` to acpp-clang-21 — and that
# partition WAS derived from the published artifacts, in those two recipes.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0

  # ⚠ THIS OUTPUT IS `noarch: generic`, SO `linux` / `osx` / `win` / `unix` ARE
  # ALL FALSE IN IT. Every one of them is derived from `target_platform`, and
  # for a noarch output that IS `noarch` — measured in the build's own variant
  # record: `(noarch) (build_platform: linux-64, …, target_platform: noarch)`.
  #
  # An `if linux … else if osx … else <windows>` chain therefore falls through
  # to its LAST branch on every platform. That is not hypothetical: it put the
  # Windows carve glob into the LINUX package and failed run 34105145758 with
  # "include glob 'lib/clang/21/lib/windows/**' matched nothing".
  #
  # `build_platform` is the axis that still means something here — the job that
  # produced this package — so the whole recipe reads these three names and
  # never a bare selector. Same reasoning as the `skip:` axis; this is the rest
  # of that class.
  is_linux: ${{ build_platform == "linux-64" }}
  is_osx: ${{ build_platform == "osx-arm64" }}
  is_win: ${{ build_platform == "win-64" }}

package:
  name: acpp-compiler-rt${{ llvm_major }}_${{ target_platform }}
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  noarch: generic
  # UPSTREAM: `detect_binary_files_with_prefix: false  # [win]`
  prefix_detection:
    ignore_binary_files: ${{ true if is_win else false }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      # NO `Library/` PREFIX, AND `prefix` AS THE DESTINATION. A noarch: generic
      # package has no Windows layout — its paths are identical on every
      # platform — so its content lands at %PREFIX% and not %PREFIX%\Library.
      # Upstream states the same thing by writing this one win glob as
      # `lib\clang\<major>\lib` while the arch-specific compiler-rt21 beside it
      # writes `Library\lib\clang\<major>\lib`.
      #
      # THE PER-PLATFORM SUBTREE, NOT `lib/**`. Upstream's glob is the whole
      # `lib/clang/<major>/lib` directory, which is correct in compiler-rt's own
      # build prefix because nothing else installs there. In our union stage
      # clangdev also puts a file in that directory on osx — the versioned
      # libLTO.dylib symlink, which belongs to acpp-clang-21 — so the whole
      # directory over-selects by exactly one path. The subtrees below are read
      # off conda-forge's compiler-rt21_<platform>-21.1.8 artifacts: 73 paths
      # under linux/, 14 under windows/, and on osx 23 under darwin/ plus ten
      # `libclang_rt.*` archives sitting directly in lib/.
      ACPP_CARVE: >-
        ${{ "lib/clang/" ~ llvm_major ~ "/lib/linux/**" if is_linux
        else "lib/clang/" ~ llvm_major ~ "/lib/libclang_rt.*;lib/clang/" ~ llvm_major ~ "/lib/darwin/**" if is_osx
        else "lib/clang/" ~ llvm_major ~ "/lib/windows/**" }}
      ACPP_CARVE_DEST: prefix

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nushell
  host:
    # Upstream declares `host: []`; the stage is the one entry with no upstream
    # counterpart, because our slice comes out of it rather than a build tree.
    - _acpp-stage ==0.0.0
  run: []
  run_constraints:
    # Upstream: "This is when compiler-rt and compiler-rt_<target_platform>
    # split". Rewritten to our name.
    - acpp-compiler-rt >=9.0.1
  ignore_run_exports:
    from_package:
      # Upstream's, preserved. The compilers are in `build:` only so their
      # STRONG run_exports do not follow a package that ships static archives
      # nothing links at install time.
      - ${{ compiler('cxx') }}
      - ${{ stdlib('c') }}

tests:
  - package_contents:
      files:
        exists:
          # Same noarch rule as above: these must key on build_platform, or the
          # test asserts the wrong platform''s file — or none at all.
          - if: is_osx
            then: lib/clang/${{ llvm_major }}/lib/darwin/libclang_rt.osx.a
          - if: is_win
            then: lib/clang/${{ llvm_major }}/lib/windows/clang_rt.builtins-x86_64.lib

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: compiler-rt static runtime libraries for one target platform
