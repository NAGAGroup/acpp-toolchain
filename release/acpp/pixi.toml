# acpp: the AdaptiveCpp SYCL compiler — drivers, clang, lld, llvm binutils,
# SYCL headers, clang resource dir, AdaptiveCpp CMake config. Everything a
# build environment needs to compile SYCL code (activation packages supply
# CC/CXX/sysroot wiring).
[package]
name = "acpp"
version = "25.10.0_llvm20.1.8"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
