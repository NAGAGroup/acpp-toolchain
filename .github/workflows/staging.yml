# staging — the ONE workflow for the rebuilt package set.
#
# ⚠ THE FILE NAME IS PART OF THE CREDENTIAL. `naga-labs-staging` is registered
# on prefix.dev as a trusted publisher for THIS repository and THIS workflow
# file name. Renaming or splitting this file revokes publishing until the
# registration is redone. That is also why platform selection happens through
# dispatch INPUTS rather than through separate workflow files.
#
# JOB SHAPE IS LOAD-BEARING. Every package of a platform builds in ONE job: the
# expensive `_acpp-stage` build is reused across all forty-odd of them through
# pixi's `.pixi/bld` cache, and that cache does not cross runners. Parallelise
# by PLATFORM, never by package — a job per package would rebuild LLVM per
# package.
#
# EACH PLATFORM IS INDEPENDENT, and that is Jack's shape: a platform that goes
# green publishes immediately while its siblings are still red, so a Windows
# problem never holds Linux artifacts hostage. `fail-fast: false` is what makes
# that true, and `verify` runs `if: always()` so the cross-platform gates report
# on whatever did land.
#
# NO `--force`, ANYWHERE. Staging is scratch, but a silent overwrite would hide
# the one signal that says two runs disagreed about content: a same-day rebuild
# collides on HTTP 409 unless the build number moves, which is what the
# `build_number` input is for.
name: staging

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Space-separated platforms to build (linux-64 win-64 osx-arm64)"
        default: "linux-64 win-64 osx-arm64"
      build_number:
        description: "ACPP_BUILD_NUMBER — bump for a same-day rebuild, or the upload 409s"
        default: "0"

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # setup — the version, and the matrix, computed ONCE for the whole run.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      nightly_date: ${{ steps.v.outputs.date }}
    steps:
      # ONE date for the run. A date computed per job straddles midnight UTC
      # and splits a single build set across two versions — a set that then
      # never solves as a unit.
      - id: v
        shell: bash
        run: echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - id: m
        shell: bash
        run: |
          set -euo pipefail
          # `expect_dirs` is the number of PACKAGE DIRECTORIES in the workspace
          # — what the publish accounting reconciles built + skipped against.
          # `expect_artifacts` is the number of .conda files that platform
          # produces, which is larger: acpp-clang and acpp-clangxx are each
          # built twice, once per with_cfg row. Both numbers are MEASURED from
          # `pixi publish --dry-run`, never inferred from the skip blocks.
          entries=()
          for p in ${{ inputs.platforms }}; do
            case "$p" in
              linux-64)   entries+=('{"platform":"linux-64","runner":"Linux-x64-64","expect_dirs":49,"expect_artifacts":46}') ;;
              win-64)     entries+=('{"platform":"win-64","runner":"Win-x64-64","expect_dirs":49,"expect_artifacts":39}') ;;
              osx-arm64)  entries+=('{"platform":"osx-arm64","runner":"macOS-26-xlarge","expect_dirs":49,"expect_artifacts":44}') ;;
              *)
                echo "Unknown platform '$p' — this workspace builds linux-64, win-64 and osx-arm64." >&2
                exit 1
                ;;
            esac
          done
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No platform selected — nothing to do." >&2
            exit 1
          fi
          printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # build — one job per platform; every package of that platform inside it.
  # ---------------------------------------------------------------------------
  build:
    needs: setup
    strategy:
      # A red platform must never cancel its siblings.
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600
    permissions:
      id-token: write # OIDC trusted publishing — no stored key anywhere
    env:
      ACPP_NIGHTLY_DATE: ${{ needs.setup.outputs.nightly_date }}
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      # No `submodules:` — this tree has none since the activation lift.
      - uses: actions/checkout@v4

      # ── GATE 1 ────────────────────────────────────────────────────────────
      # A run that forgets the version publishes `0.dev0` and NOTHING fails:
      # every date-versioned recipe has that default so a laptop dry run works.
      # Fail here, before a single package is built.
      - name: "Gate 1: the version must be set"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACPP_NIGHTLY_DATE:-}" ] || [ "$ACPP_NIGHTLY_DATE" = "0.dev0" ]; then
            echo "ACPP_NIGHTLY_DATE is unset or is the local-render placeholder — refusing to build." >&2
            exit 1
          fi
          echo "Building $ACPP_NIGHTLY_DATE build $ACPP_BUILD_NUMBER for ${{ matrix.platform }}"

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      # Explicit restore/save on both caches: actions/cache's post-step only
      # saves on job SUCCESS, which starves iteration on exactly the runs that
      # need warmth.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-

      # THE stage cache. This is what makes the expensive build run once for
      # every package instead of once each.
      - name: Restore pixi build cache
        uses: actions/cache/restore@v4
        with:
          path: .pixi/bld
          key: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/_acpp-stage/**') }}-${{ github.run_id }}
          restore-keys: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/_acpp-stage/**') }}-

      # FIRST-BUILD OBSERVATION, not a gate. Each execution of the stage's
      # build script appends one unique line to a file OUTSIDE the build tree;
      # the count of DISTINCT lines is the number of times the expensive build
      # actually ran. The design says exactly once per platform. Printed, not
      # asserted, until we have seen a real number.
      - name: Arm the stage-execution counter
        shell: bash
        run: |
          set -euo pipefail
          echo "ACPP_STAGE_RUN_LOG=${{ runner.temp }}/stage-runs.txt" >> "$GITHUB_ENV"
          : > "${{ runner.temp }}/stage-runs.txt"

      # ── GATE 2 ────────────────────────────────────────────────────────────
      # ONE whole-workspace publish, no --path. The exit code is the build
      # gate; the accounting below is the SET gate, because exit 0 means
      # "nothing errored", not "the expected packages were produced" — a recipe
      # whose skip expression broke would publish nothing and pass.
      #
      # The two-segment channel URL is correct at pixi 0.78 (measured).
      - name: Build and publish the whole workspace
        shell: bash
        run: |
          set -o pipefail
          pixi publish --to https://prefix.dev/jackm97/naga-labs-staging 2>&1 | tee publish.log

      - name: "Gate 2: every package directory is accounted for"
        shell: bash
        run: |
          pixi run -e packaging nu tools/publish-accounting.nu \
            --log publish.log --expect ${{ matrix.expect_dirs }}

      # Collected BY PUBLISHED NAME out of the log, never by globbing the build
      # directory: that directory also holds `_acpp-stage`, whose payload is the
      # entire toolchain, plus whatever earlier runs left behind.
      - name: Collect the published artifacts
        shell: bash
        run: |
          pixi run -e packaging nu tools/collect-artifacts.nu \
            --log publish.log --into dist/${{ matrix.platform }}

      # ── GATE 3 ────────────────────────────────────────────────────────────
      # No two of OUR packages ship the same file. `--expect` is mandatory and
      # refuses a count below two, so it cannot pass vacuously; two builds of
      # ONE name (the with_cfg rows) are deliberately not compared against each
      # other, and the log says how many such pairs it skipped.
      - name: "Gate 3: artifacts are pairwise disjoint"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-package-disjointness.nu \
            --artifacts dist --expect ${{ matrix.expect_artifacts }}

      # ── GATE 4 ────────────────────────────────────────────────────────────
      # Both read the publish log rather than re-rendering: that log is what was
      # actually uploaded, which is stronger evidence than a fresh render as
      # well as minutes cheaper on a metered runner.
      - name: "Gate 4a: one name, one version"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-name-collisions.nu \
            --platform ${{ matrix.platform }} --log publish.log

      - name: "Gate 4b: the superset rule"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-superset.nu \
            --platform ${{ matrix.platform }} --log publish.log

      # ── FIRST-BUILD OBSERVATIONS ──────────────────────────────────────────
      # Printed, never gated. Every one of these is a question the design left
      # open that only a real build can answer, and the answer belongs in the
      # log of the run that produced it rather than in someone's memory.
      # `|| true` on each: an observation that fails must not redden a green
      # build, which is the whole distinction between an observation and a gate.
      - name: "Observe: the answers only a real build has"
        if: always()
        shell: bash
        run: |
          echo "=== how many times did the stage build run? (design says once) ==="
          sort -u "${ACPP_STAGE_RUN_LOG:-/dev/null}" 2>/dev/null | wc -l || true
          echo "=== openmp + BOLT optional paths that were ABSENT (tighten the lists against these) ==="
          grep -E "optional paths ABSENT" publish.log || echo "(no optional-path lines in the log)"
          echo "=== share/gdb: does the stage produce it, and does anyone ship it? ==="
          find .pixi/bld -type d -name gdb -path '*_stage*' 2>/dev/null | head -5 || true
          pixi run -e packaging nu -c 'let hits = (glob "dist/**/*.conda" | where {|f| (^bsdtar -xOf $f "info-*.tar.zst" | ^bsdtar -xOf - "info/paths.json" | from json | get paths._path | any {|p| $p =~ "share/gdb"})}); print $"share/gdb is shipped by: ($hits | length) package(s)"' || true
          echo "=== win: where does AdaptiveCpp put its runtime JSON? ==="
          find .pixi/bld -type d -name AdaptiveCpp -path '*_stage*' 2>/dev/null | head -10 || true
          echo "=== llvm-spirv rpath after rattler-build post-processing ==="
          pixi run -e packaging nu -c 'let f = (glob "dist/**/acpp-llvm-spirv-*.conda" | first); print $f; ^bsdtar -xOf $f "pkg-*.tar.zst" | ^bsdtar -xOf - --include "*/llvm-spirv" | rg -a -o "\$ORIGIN[^\u{0}]*" | print' || true
          echo "=== the osx deployment floor, from a built artifact ==="
          pixi run -e packaging nu -c 'for f in (glob "dist/osx-arm64/acpp-runtime-*.conda") { print ($f | path basename); ^bsdtar -xOf $f "info-*.tar.zst" | ^bsdtar -xOf - "info/index.json" | from json | get depends | where {|d| $d =~ "__osx"} | print }' || true
          echo "=== templated names: did acpp-compiler-rt_<plat> build from the sibling or resolve from a channel? ==="
          grep -E "acpp-(compiler-rt|clang(xx)?)_(linux-64|win-64|osx-arm64)" publish.log | head -20 || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
      - name: Save pixi build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pixi/bld
          key: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/_acpp-stage/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/
            publish.log
          retention-days: 14

  # ---------------------------------------------------------------------------
  # verify — the cross-platform gates, over whatever actually landed.
  # ---------------------------------------------------------------------------
  verify:
    needs: [setup, build]
    # ALWAYS. A platform that built and published must be verified even while a
    # sibling is red — that independence is the point of the whole shape.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: downloaded

      # The downloaded tree is `downloaded/dist-<platform>/dist/<platform>/`;
      # flatten it to `dist/<platform>/` so the gates read one shape. The
      # closure check takes each artifact's subdir from its own metadata
      # anyway, so a flattened layout cannot mislead it.
      - name: Flatten the downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find downloaded -name '*.conda' -print0 | while IFS= read -r -d '' f; do
            sub=$(basename "$(dirname "$f")")
            mkdir -p "dist/$sub"
            cp "$f" "dist/$sub/"
          done
          echo "collected:"
          find dist -name '*.conda' | sed 's|.*/||' | sort | head -100
          test -n "$(find dist -name '*.conda' -print -quit)" || {
            echo "no artifacts downloaded — every build job failed before publishing" >&2
            exit 1
          }

      # ── GATE 3 (cross-platform) ───────────────────────────────────────────
      # The per-platform run happened in each build job; this one is over every
      # platform that landed, which also catches a noarch package colliding
      # with an arch one. --expect 2 here is deliberate: the set is whatever
      # survived, and the per-platform counts were already asserted upstream.
      - name: "Gate: artifacts remain pairwise disjoint across platforms"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-package-disjointness.nu \
            --artifacts dist --expect 2

      # ── GATE 5 ────────────────────────────────────────────────────────────
      # Publishing a name means owning it: completeness (everything the
      # workspace declares for a platform is present) plus a fresh solve of
      # every artifact, pinned to its exact build, against the real channel
      # under strict priority.
      - name: "Gate 5: closure — every published package is installable"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-closure.nu \
            --artifacts dist \
            --remote https://prefix.dev/jackm97/naga-labs-staging
