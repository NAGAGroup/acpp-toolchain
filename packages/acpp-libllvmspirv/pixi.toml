# acpp-libllvmspirv — the unversioned SPIRV-LLVM-Translator library, its
# headers and its pkg-config file.
#
# A SLICER over _acpp-llvm-spirv-stage. PACKAGE-ONLY manifest; the sole
# [workspace] is the repo root.
#
# Lifted from the reference monolith (llvm-feedstocks-monolith@cb9f3be): the
# run / run_exports / run_constraints / ignore_run_exports in the recipe are
# upstream's, transcribed, and the slice uses upstream's own form.
#
# EVERY source-package dependency is mapped here and ONLY here, whatever it
# really is: this table is a source-path MAPPING and the recipe is the sole
# authority for what a dependency IS. [package.run-dependencies] is accepted by
# this backend and SILENTLY IGNORED.
[package]
name = "acpp-libllvmspirv"
version = "21.1.8"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# acpp-llvmdev appears in run_constraints only, and a constraint is a MatchSpec
# rather than a dependency, so it takes no source mapping.
[package.build-dependencies]
_acpp-llvm-spirv-stage = { workspace = true }
acpp-libllvmspirv21 = { workspace = true }

[package.build.config]
# The slice scripts live in ../_shared so the family cannot drift apart; the
# default input globs cover only this directory and the recipe.
extra-input-globs = ["../_shared/*.nu", "../_shared/licenses/**"]
