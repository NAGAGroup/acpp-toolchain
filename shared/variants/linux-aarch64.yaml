# linux-aarch64 build variants — see linux-64.yaml for the doctrine. This
# lane is OMP-ONLY by design (no CUDA/L0/OCL/ROCm keys): the CPU backend and
# the accelerated-CPU compiler are the deliverable; GPU backends arrive per
# platform as their dependency stories are established.

# ---- compilers + stdlib ----------------------------------------------------
c_compiler: [gcc]
cxx_compiler: [gxx]
c_compiler_version: ["14"]
cxx_compiler_version: ["14"]
c_stdlib: [sysroot]
c_stdlib_version: ["2.28"]

# ---- ABI-sensitive libraries ----------------------------------------------
zlib: ["1.3"]
zstd: ["1.5"]
libxml2-devel: ["2.15"]
numactl: ["2.0"]

# ---- python ----------------------------------------------------------------
python: ["3.14"]

# ---- CUDA ------------------------------------------------------------------
# The conda-forge pinning-feedstock keys (their file carries cuda_compiler_version
# and _min; _max is ours). The recipe hard-pins the BUILD with
# `cuda-version ==${{ cuda_compiler_version }}` and states acpp-runtime-cuda's
# run range as `cuda-version >=${{ _min }},<${{ _max }}` — one declaration to
# move the CUDA line, no per-component pins anywhere.
#
# The ceiling is required: libcudart's SONAME is major-versioned
# (libcudart.so.12 vs .so.13, measured from the packages), the backend records
# it in DT_NEEDED, and dlopen resolves filenames, not versions — a CUDA-13
# runtime silently removes the GPU. The DRIVER needs no ceiling: cuda-version
# constrains `__cuda >=12`, a floor, and newer drivers run older CUDA.
#
# QUOTED on purpose: unquoted 12.10 is the YAML float 12.1.
cuda_compiler_version: ["12.9"]
cuda_compiler_version_min: ["12.9"]
cuda_compiler_version_max: ["13"]

