# acpp-activation-linux — the linux compiler-activation packages
# (acpp-clang_linux-64 / acpp-clangxx_linux-64), lifted in-tree from our fork
# of conda-forge's ctng-compiler-activation-feedstock. The fork point, our own
# head and what the lift kept are recorded in vendor/PROVENANCE.md.
#
# PACKAGE-ONLY manifest. The single workspace at the repo root owns the
# environments, the tasks and the variant matrix.
#
# THE RECIPE AND ITS ASSETS LIVE HERE, not behind a `recipe =` redirect into a
# submodule. This methodology has no submodules: the recipe is a lift, edited
# in tree, and its provenance is a recorded ref rather than a gitlink.
#
# WHY THIS FEEDSTOCK FOR LINUX: the clang_linux-* / clangxx_linux-* family is
# produced by ctng-compiler-activation, NOT by clang-compiler-activation
# (which owns osx) and not by clangdev (which owns the NATIVE clang_impl_*,
# which we now ship as acpp-clang_impl_linux-64).
#
# TWO OUTPUTS FROM ONE RECIPE, which is why this manifest's name matches
# neither of them. The C++ activation script only sets the CXX half and relies
# on the C one having run first, so the pair is pinned to each other with
# pin_subpackage(exact=True) — a function that names another output of the SAME
# recipe and therefore exists only while they share one.
#
# THE VERSION IS 21.1, MAJOR.MINOR. Activation packages carry the compiler
# SERIES they configure (conda-forge's own split: clang_<plat> is 21.1 where
# clangdev is 21.1.8), while `acpp` is date-versioned. Both numbers appear in
# the recipe, which is the sole authority for what any dependency IS.
[package]
name = "acpp-activation-linux"
version = "21.1"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# THE PASSTHROUGH. The manifest tables add no dependencies — the backend
# regards only what the recipe declares — but they supply the workspace path
# mapping the recipe cannot know, which lets it name these siblings under
# requirements as if they came from a channel.
#
# acpp is the compiler these packages activate, taken as a HOST dependency so
# its weak run_export computes the exact-build run dependency. The two impl
# packages own bin/<triplet>-clang{,-cpp,++}, the names the activation exports
# as CC/CPP/CXX; they are RUN dependencies, restored when the symlink fold came
# back out of install-clang{,++}.sh.
[package.build-dependencies]
acpp = { workspace = true }
acpp-clang-impl = { workspace = true }
acpp-clangxx-impl = { workspace = true }
