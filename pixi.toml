# THE workspace manifest — the ONLY [workspace] in this repository.
#
# acpp-toolchain: conda packages of the NAGA AdaptiveCpp fork (naga-acpp-*),
# built as a complete LLVM toolchain and published to the naga-labs-staging
# channel on prefix.dev.
#
# ONE multi-output recipe (recipe.yaml) with a rattler-build STAGING output
# that runs the expensive LLVM+AdaptiveCpp build once; every package output
# carves that build via `files:` globs. shared/build-lane.nu drives
# rattler-build directly (pixi publish cannot resolve staging outputs) and
# writes an INDEXED local channel, which CI ships between jobs so the runtime
# gates install through a real solve.
[workspace]
name = "acpp-toolchain"
# An overlay channel layering conda-forge server-side: the dev tooling resolves
# the way a consumer environment would.
channels = ["https://prefix.dev/jackm97/naga-labs"]
platforms = ["linux-64", "win-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76.1"

[environments]
git = { features = ["git"], no-default-feature = true }

# ---- Build variants: deliberately NOT here ---------------------------------
# Every build goes through `rattler-build ... -m shared/variants/<platform>.yaml`
# (shared/build-lane.nu); those files are the single source of truth. A pin
# written here would be read by no build we run.

# ---- Dev environment (recipe/script iteration, and CI) ---------------------
[environments.dev]
no-default-feature = true
dependencies = { nushell = ">=0.106", rattler-build = ">=0.72", rattler-index = "*", git = "*" }

[environments.dev.tasks.build]
cmd = "nu shared/build-lane.nu"
description = "Build the toolchain for this platform into the indexed local channel"

[environments.dev.tasks.render]
cmd = "rattler-build build --recipe recipe.yaml --experimental --render-only -m shared/variants/linux-64.yaml"
description = "Render-check the recipe (fast; no build)"

[environments.dev.tasks.gen-staging-hash]
cmd = "nu shared/gen-staging-hash.nu"
description = "Refresh the staging_inputs hash (patches/build script/sources) in the variant configs"

[environments.dev.tasks.check-staging-hash]
cmd = "nu shared/gen-staging-hash.nu --check"
description = "Fail if a variant config's staging_inputs hash is stale"

[environments.dev.tasks.check-pins]
cmd = "nu shared/check-pins.nu"
description = "Fail if a staging-inheriting output uses pin_compatible, or the mutex host spec is not an exact major"

[environments.dev.tasks.check-no-collision]
cmd = "nu shared/check-no-collision.nu"
description = "Fail if any staged artifact name exists on conda-forge (an overlay channel would shadow it)"

[environments.dev.tasks.check-closure]
cmd = "nu shared/check-closure.nu"
description = "Publish gate: every declared output is present, and every staged artifact freshly solves against the channel"

[environments.dev.tasks.audit]
cmd = "nu shared/tests/audit.nu"
description = "Solver-level constraint audits against ./local-channel"

[environments.dev.tasks.acceptance]
cmd = "nu shared/tests/acceptance.nu"
description = "Acceptance: fresh workspace, clean cache, single channel — locks, builds, runs"

[environments.dev.tasks.index-channel]
cmd = "rattler-index fs ./local-channel"
description = "Index local-channel so it is a real channel (subdir repodata)"

[environments.dev.tasks.publish-channel]
cmd = "nu shared/publish-channel.nu"
description = "Upload the built local channel to naga-labs-staging (OIDC in CI), behind the publish gates"
depends-on = ["check-no-collision", "check-closure"]

[environments.dev.tasks.publish-dry-run]
cmd = "nu shared/publish-channel.nu --dry-run"
description = "Run the publish gates and print what would be uploaded, without uploading"

[feature.git.dependencies]
git = "*"
nushell = "*"

[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"
