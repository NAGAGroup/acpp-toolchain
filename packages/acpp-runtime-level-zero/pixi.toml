# acpp-runtime-level-zero — backend METAPACKAGE. It ships no toolchain files, so it does not
# depend on acpp-stage at all: nothing to carve, and no multi-GB stage
# install in its build. PACKAGE-ONLY manifest; the sole [workspace] is the
# repo root.
#
# Published with `pixi publish --path packages/acpp-runtime-level-zero`.
[package]
name = "acpp-runtime-level-zero"
version = "0.dev0"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# acpp-runtime is a workspace sibling; the recipe names it under
# requirements.host so its exact-build run_export reaches this package.
[package.build-dependencies]
acpp-runtime = { workspace = true }
