# GPU smoke workspace — installs the built toolchain THROUGH A REAL SOLVE
# against the indexed local channel that the build job produced, so this gate
# also exercises run_exports / run_constraints and the channel's repodata,
# not just the files inside the packages.
#
# The local channel is a relative path: CI downloads the build artifact to
# <repo>/local-channel, which is three levels up from this manifest. Works
# identically locally after `pixi run build-release`.
[workspace]
name = "acpp-gpu-smoke"
channels = [
  "../../../local-channel",
  "https://prefix.dev/jackm97/naga-labs",
]
platforms = ["linux-64", "win-64"]

# One-package install path: acpp-runtime-cuda pulls the lane runtime with it.
#
# NB nothing here names acpp-runtime or a lane: acpp's run_exports supply the
# runtime range AND the acpp-llvm mutex, so this manifest is itself a live test
# that a consumer needs no lane text of its own.
[dependencies]
acpp = "*"
acpp-runtime-cuda = "*"
# The sanitizer runtimes, so the smoke can prove they link and fire.
acpp-compiler-rt = "*"
nushell = "*"

[tasks.build-smoke]
cmd = "acpp -O2 --acpp-targets=generic ../hello.cpp -o ./smoke"
description = "Compile the SYCL smoke binary (generic SSCP: one binary, JIT per device)"

[tasks.smoke-cpu]
cmd = "ACPP_VISIBILITY_MASK=omp ./smoke"
depends-on = ["build-smoke"]
description = "Run the smoke binary on the CPU/OpenMP backend"

[tasks.smoke-cuda]
cmd = "ACPP_VISIBILITY_MASK=cuda ./smoke"
depends-on = ["build-smoke"]
description = "Run the smoke binary on the CUDA backend (PTX JIT on real hardware)"

[tasks.acpp-info]
cmd = "acpp-info -l"
description = "List backends/devices the runtime can see"

[tasks.sanitizer-smoke]
cmd = "nu ../sanitizer-smoke.nu"
description = "Prove the shipped compiler-rt runtimes link, run clean, and actually fire"

# ── Windows variants ──────────────────────────────────────────────────────
# build-once / run-on-GPU split (same design as the linux nightly test
# suite): build-win compiles the smoke with its VS2026 toolchain (vcvars
# path via ACPP_SMOKE_VCVARS) against the just-built channel; the GPU box
# (Win-x64-GPUv2, base Windows 11 image) has no VS at all and only RUNS
# the device-agnostic SSCP binary. The acpp driver ships as an
# extensionless python script on win, hence the explicit python call.
[target.win-64.tasks.build-smoke]
cmd = "cmd /d /c build-smoke-win.bat"
description = "Compile the SYCL smoke binary on win (MSVC env from ACPP_SMOKE_VCVARS + python acpp driver)"

[target.win-64.tasks.smoke-cpu]
cmd = "ACPP_VISIBILITY_MASK=omp ./smoke.exe"

[target.win-64.tasks.smoke-cuda]
cmd = "ACPP_VISIBILITY_MASK=cuda ./smoke.exe"

[target.win-64.tasks.acpp-info]
cmd = "acpp-info -l"
