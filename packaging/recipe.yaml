# recipe.yaml — every published package, sliced from the staging tarball.
#
# Versions and choices live in variants.yaml (and, beneath it,
# ../staging/variants.yaml); this file is the mechanism and should not need
# editing to move a version or a lane.
#
# NOTHING HERE COMPILES. The cache block downloads one fixed release asset and
# unpacks it; every output selects files out of that tree with globs. A mistake
# in this file costs a packaging run and can never cost an LLVM rebuild.
#
# The split, and why it is not conda-forge's forty-package one: that is an
# unbearable maintenance burden for a one-person team. The point here is
# splitting, not trimming - a large HPC toolchain is normal, and installing
# more beats missing a shared library and failing at run time.

context:
  version: ${{ acpp_version }}
  # The lane, in its two spellings: a build string, and a package name.
  lane: ${{ acpp_lane }}
  lane_package: acpp-${{ acpp_lane | replace("_", "-") }}-lane
  # Our own packages are slices of ONE build, so they pin each other exactly.
  # Nothing looser is ever correct: two slices from different builds share a
  # version whenever both lanes are dated, and only the build string separates
  # them.
  exact: ${{ acpp_version }} ${{ acpp_lane }}_*
# NB: the build string is NOT defined here. It needs `hash` and `build_number`,
# which are per-output build-time values; context is evaluated once, globally,
# before any of them exist.
  stage_url: https://github.com/NAGAGroup/acpp-toolchain/releases/download/${{ stage_tag }}/${{ stage_file }}
  stage_hash: ${{ stage_sha256 }}
  acpp_lane_version: ${{ acpp_lane_version }}
  # Anything that sets a VERSION or a build string is read through context;
  # package specs and exports can reference variants directly.
  llvm_major: ${{ llvm_major }}

recipe:
  name: acpp-packaging
  version: ${{ version }}

build:
  variant:
    use_keys:
      - cuda_compiler_version
      - cuda_max_version
      - c_stdlib
      - c_compiler
      - cxx_compiler







outputs:
  - staging:
      name: acpp-stage-unpacked
    source:
      # The fixed artifact. The tag never moves now that packaging pins it; a
      # new staging build means a new sha256 and filename in variants.yaml,
      # together.
      - url: ${{ stage_url }}
        sha256: ${{ stage_hash }}
    requirements:
      # This output compiles NOTHING - it unpacks a tarball. Everything here is
      # present for its RUN EXPORTS: those propagate from a staging output's
      # build and host dependencies to every inheriting package output, so each
      # package gets libgcc, libstdcxx, libzlib, zstd, libxml2, ncurses,
      # libedit, numactl and python_abi at conda-forge's own bounds without a
      # single output restating them.
      #
      # Lifted from staging/recipe.yaml so the two cannot disagree about what
      # the tree was built against - MINUS the CUDA and Level Zero entries,
      # which belong to their own backend packages rather than to everything.
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        # Bounded below 4. conda-forge pins cmake nowhere in its global config,
        # so an unbounded requirement takes whatever is newest - which was 4.4.
        - cmake >=3.28,<4
        - ninja
        - nushell
        - python
        - ccache
        # lldb's python bindings are generated with swig
        - swig
        # acpp's cmake clones the SPIR-V translator and the Khronos headers
        - git

      host:
        - python
        - zlib
        - zstd
        - libxml2-devel
        - ncurses
        - libedit
        - numactl

    build:
      script:
        interpreter: nu
        content: |
          # The asset is a conda package, so rattler has already unpacked it
          # and the tree is the work directory. Everything except conda's own
          # metadata becomes the prefix the outputs carve from.
          #
          # info/ is DROPPED on purpose: it describes acpp-stage, a package
          # nobody installs, and shipping it inside another package would put
          # a second and contradictory set of metadata in the prefix.
          #
          # rattler-build's own scripts are dropped too. They are written into
          # the work directory around this script, so an unfiltered copy puts
          # the builder's scaffolding inside the package - and once unclaimed
          # staging files are an error, they fail the build.
          let drop = ["info" "build_env.sh" "conda_build.log" "conda_build.sh" "conda_build_script.nu"]
          let staged = (ls . | where {|e| ($e.name | path basename) not-in $drop})
          print $"unpacking ($staged | length) top-level entries into the prefix"
          for e in $staged {
            cp -rP $e.name $env.PREFIX
          }
          # The activation scripts are ours, not the tarball's: our fork omits
          # from the generated configuration every setting naming a path outside
          # the installation, and these supply them at run time. They are laid
          # into the prefix here so each package can carve the ones it owns,
          # exactly as it carves binaries.
          let act = ($env.RECIPE_DIR | path join "activation")
          for d in ["activate.d" "deactivate.d"] {
            let dest = ($env.PREFIX | path join "etc" "conda" $d)
            mkdir $dest
            for f in (ls ($act | path join $d) | get name) {
              cp $f $dest
            }
          }

          # The LLVM major is a variant, so the scripts carry a placeholder
          # rather than a number that could drift from the tree they describe.
          let base = ($env.PREFIX | path join "etc" "conda" "activate.d" "10-acpp.sh")
          open --raw $base | str replace --all "LLVM_MAJOR" "${{ llvm_major }}" | save -f $base

          # Clang's own configuration files, named for the DEFAULT TARGET
          # TRIPLE our build sets via LLVM_HOST_TRIPLE. That name is what makes
          # a plain `clang++` invocation find them with no symlink and no
          # environment variable - <CFGDIR> inside them expands to this
          # directory, so every path follows the prefix on its own.
          let cfg = ($env.RECIPE_DIR | path join "cfg")
          for f in (ls $cfg | get name) {
            cp $f ($env.PREFIX | path join "bin")
          }

          # librt-backend-omp.so records a bare DT_NEEDED of libomp.so, but
          # LLVM's per-target runtime layout installs it under lib/<triple>/,
          # which the dynamic loader does not search. A relative symlink puts it
          # where the loader looks without moving the real file.
          #
          # This collides with conda-forge's llvm-openmp, which owns lib/libomp.so
          # - harmless only because we run-constrain that package out. The
          # durable fix is an rpath of $ORIGIN/../<triple> on the backend itself,
          # which belongs in the fork rather than here.
          ^ln -sf "x86_64-conda-linux-gnu/libomp.so" ($env.PREFIX | path join "lib" "libomp.so")

          # The triplet drivers. Relative symlinks to the unversioned ones, the
          # form conda-forge's LINUX activation uses. Their only job is to make
          # clang pick up bin/<triple>-<driver>.cfg by the name it was invoked
          # under - the cfg files themselves ship in the base package.
          let bin = ($env.PREFIX | path join "bin")
          for d in ["clang" "clang++" "clang-cpp"] {
            ^ln -sf $d ($bin | path join $"x86_64-conda-linux-gnu-($d)")
          }

          # The PTX JIT resolves libdevice by checking its own redistributable
          # directory FIRST and only then the path baked in at build time, which
          # names the machine that built the staging tarball. Putting the file
          # where the first branch looks means the baked path is never consulted.
          #
          # This uses the mechanism upstream built for exactly this case rather
          # than working around it - getDeviceLibPath() in LLVMToPtx.cpp checks
          # the redist path by design. The baked string is still in the artifact
          # and is deleted by the relocatable overhaul, not by this.
          #
          # The link dangles until cuda-nvvm-tools is installed beside us, which
          # acpp-runtime-cuda requires.
          let ptx = ($env.PREFIX | path join "lib" "hipSYCL" "ext" "bitcode" "ptx")
          mkdir $ptx
          ^ln -sf "../../../../../nvvm/libdevice/libdevice.10.bc" ($ptx | path join "libdevice.10.bc")

          print "-- activation --"
          ls ($env.PREFIX | path join "etc" "conda" "activate.d") | each {|e| print $"  ($e.name | path basename)" }
          ls ($env.PREFIX | path join "etc" "conda" "deactivate.d") | each {|e| print $"  ($e.name | path basename)" }

          print "-- what the outputs will carve from --"
          ls $env.PREFIX | each {|e| print $"  ($e.name | path basename)" }

  # An EMPTY staging output for the noarch packages. They cannot inherit the
  # real one - it carries ${{ compiler('c') }}, which resolves to a nonexistent
  # gcc_noarch on a noarch target - but they still need to inherit something.
  # Plain shell, NOT nu: this output declares no requirements, so nothing would
  # provide a nushell interpreter. The real staging output can use nu because it
  # depends on nushell.
  - staging:
      name: acpp-noarch-base
    build:
      script:
        content: |
          echo "noarch base: nothing to unpack"

  # ── the mutexes ───────────────────────────────────────────────────────────
  #
  # Two axes need expressing that no version pin can carry.
  #
  # acpp-llvm-version: our packages have the SAME acpp version whichever LLVM
  # they were built against, so a version pin cannot tell them apart. Two cases
  # make it necessary: a build matrix of one acpp release against several LLVMs,
  # and a patch bump that adds a newer LLVM while keeping the old one. In both,
  # a user asking for `acpp 26.10.*` would otherwise be free to mix.
  #
  # The lane selectors: three packages, statically named, each constraining the
  # other two so no environment can hold more than one lane. They ship no files
  # - they exist to turn a build-string match into a name a user can type, which
  # is exactly what conda-forge's clang-no-conda-cfg does for its cfg variant.

  - package:
      name: acpp-llvm-version
      version: ${{ llvm_major }}
    inherit: acpp-noarch-base
    build:
      noarch: generic
      number: 0
      files: []
    requirements:
      run_exports:
        # STRONG, of ITSELF. Only acpp-compiler-rt names this package; every
        # other output reaches it through compiler-rt, and a strong export is
        # what carries it that far.
        #
        # BARE name, not pin_subpackage: a self-pin cannot render, because the
        # subpackage does not exist yet while another output is being built.
        # The exact pin lives in run_constraints instead.
        strong:
          - acpp-llvm-version
      run_constraints:
        - ${{ pin_subpackage('acpp-llvm-version', exact=True) }}
    tests:
      - package_contents:
          strict: true
          files: []
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: BSD-2-Clause
      summary: Selects the LLVM major the AdaptiveCpp toolchain was built against

  - package:
      name: acpp-release-lane
      version: ${{ acpp_lane_version }}
    inherit: acpp-noarch-base
    build:
      noarch: generic
      number: 0
      files: []
    requirements:
      run_exports:
        strong:
          - acpp-release-lane
      run_constraints:
        - ${{ pin_subpackage('acpp-release-lane', exact=True) }}
        - acpp-nightly-lane <0a0
        - acpp-naga-fork-lane <0a0
    tests:
      - package_contents:
          strict: true
          files: []
    about:
      summary: Selects the release lane - AdaptiveCpp at a published release tag

  - package:
      name: acpp-nightly-lane
      version: ${{ acpp_lane_version }}
    inherit: acpp-noarch-base
    build:
      noarch: generic
      number: 0
      files: []
    requirements:
      run_exports:
        strong:
          - acpp-nightly-lane
      run_constraints:
        - ${{ pin_subpackage('acpp-nightly-lane', exact=True) }}
        - acpp-release-lane <0a0
        - acpp-naga-fork-lane <0a0
    tests:
      - package_contents:
          strict: true
          files: []
    about:
      summary: Selects the nightly lane - AdaptiveCpp develop, built at most daily

  - package:
      name: acpp-naga-fork-lane
      version: ${{ acpp_lane_version }}
    inherit: acpp-noarch-base
    build:
      noarch: generic
      number: 0
      files: []
    requirements:
      run_exports:
        strong:
          - acpp-naga-fork-lane
      run_constraints:
        - ${{ pin_subpackage('acpp-naga-fork-lane', exact=True) }}
        - acpp-release-lane <0a0
        - acpp-nightly-lane <0a0
    tests:
      - package_contents:
          strict: true
          files: []
    about:
      summary: Selects the NAGA fork lane - NAGAGroup/AdaptiveCpp

  # ── the runtime ───────────────────────────────────────────────────────────
  #
  # THE package any environment carries. OpenMP is baked in unconditionally so
  # every install has one working backend regardless of hardware; the other
  # backends are their own packages so their dependencies are not forced on
  # everyone, and acpp loads backends fail-soft.
  #
  # It holds three EXECUTABLES - llc, opt, ld.lld - because acpp JITs at run
  # time and shells out to them. "acpp holds the executables" describes what
  # that package contains, not a prohibition elsewhere.

  - package:
      name: acpp-compiler-rt
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - lib/libacpp-rt.so*
        - lib/libacpp-common.so*
        - lib/hipSYCL/librt-backend-omp.so
        - lib/hipSYCL/llvm-to-backend/libllvm-to-host.so
        - lib/hipSYCL/llvm-to-backend/libllvm-to-backend.so
        # The SSCP JIT tool for this backend, beside the library it drives.
        - bin/hipSYCL/llvm-to-backend/llvm-to-host-tool
        - lib/hipSYCL/bitcode/libkernel-sscp-host-*.bc
        # llvm-to-backend and llvm-to-host both link it directly, so the JIT
        # cannot run without it. 120 MiB, and not reducible.
        - lib/libLLVM.so*
        - lib/libLLVM-*.so
        # The clang driver links this, so it cannot live with the clang TOOLS -
        # `acpp` ships bin/clang++ and depends on acpp-dev -> acpp-compiler-rt,
        # never on acpp-clang-tools. It belongs beside libLLVM: both are shared
        # libraries that the driver and the tools link alike.
        - lib/libclang-cpp.so*
        # The OpenMP runtimes, which we build ourselves. conda-forge's
        # llvm-openmp is run-constrained out rather than depended on: it ships
        # the same libomp.so path.
        - lib/x86_64-conda-linux-gnu/lib*.so*
        # The loader-visible name for the OpenMP runtime above; see the staging
        # script for why the real file cannot simply live here.
        - lib/libomp.so
        # Sanitizer runtimes an instrumented binary LOADS. Their static
        # counterparts are link-time and live in acpp-dev.
        - lib/clang/*/lib/*/*.so*
        - lib/clang/*/share/*
        - lib/clang/*/bin/*
        - bin/llc
        - bin/opt
        - bin/lld
        - bin/ld.lld
    requirements:
      run:
        # libzlib, zstd, libxml2, ncurses, libedit, numactl, libgcc, libstdcxx
        # and python are NOT listed: they arrive as run exports from the staging
        # output's host dependencies, at conda-forge's own bounds.
        #
        # The mutex and the lane selector are named ONLY here. Hard equality,
        # not pin_subpackage: an exact pin creates no build-ordering edge, so
        # the subpackage is not built yet when this output renders.
        - acpp-llvm-version ==${{ llvm_major }}
        - ${{ lane_package }} ==${{ acpp_lane_version }}
      run_exports:
        # WEAK, of itself. This is a host dependency in every path that reaches
        # it, and weak is what turns "in host" into "in run". Strong would fire
        # only from a build environment, and nothing puts a runtime there.
        weak:
          - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
      run_constraints:
        - llvm-openmp <0a0
        - compiler-rt <0a0
        - llvm <0a0
        - libllvm${{ llvm_major }} <0a0
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp runtime - everything a binary built with this toolchain needs

  # ── development files ─────────────────────────────────────────────────────
  #
  # Static archives, every header, every cmake config. ~900 MiB, and that is
  # intended: this is the package that makes the toolchain complete.

  - package:
      name: acpp-dev
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - include/**
        - lib/cmake/**
        # The per-target and header-package cmake files, which sit outside
        # lib/cmake and would otherwise be dropped.
        - lib/x86_64-conda-linux-gnu/cmake/**
        - share/cmake/**
        # pkgconfig for the same headers whose cmake config sits above.
        - share/pkgconfig/**
        - lib/*.a
        # Link-time halves of the sanitizer runtimes, plus the CRT objects and
        # symbol lists that belong beside them.
        - lib/clang/*/lib/*/*.a
        - lib/clang/*/lib/*/*.o
        - lib/clang/*/lib/*/*.syms
        # The clang resource headers - intrinsics, stddef.h, the OpenMP and
        # sanitizer headers - which every compile with this toolchain needs.
        - lib/clang/*/include/**
    requirements:
      host:
      run:
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
        # Our headers include libstdc++'s and our archives were compiled against
        # them, so consuming either needs those headers present. The two are
        # independent packages - libstdcxx-devel declares no dependencies at
        # all, so it does not pull libgcc-devel - and both are named.
        - libstdcxx-devel_${{ target_platform }}
        - libgcc-devel_${{ target_platform }}
      run_exports:
        weak:
          - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
      run_constraints:
        - llvmdev <0a0
        - clangdev <0a0
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp development files - headers, static libraries, cmake configuration

  # ── the compiler ──────────────────────────────────────────────────────────
  #
  # Executables and acpp's own configuration, and NO cfg files. This is the
  # "I do not care about sysroots or packaging" case: `pixi global install acpp`
  # gives a working SYCL compiler that builds against whatever system it is on,
  # with prefix libraries taking priority and the system a real fallback. The
  # sysroot-isolating case is the activation package, which ships the cfg files.

  - package:
      name: acpp
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - etc/conda/activate.d/10-acpp.sh
        - etc/conda/deactivate.d/10-acpp.sh
        # Clang's config files, found by name from the default target triple, so
        # our clang++ is correctly configured with no activation at all.
        - bin/x86_64-conda-linux-gnu-clang.cfg
        - bin/x86_64-conda-linux-gnu-clang++.cfg
        - bin/x86_64-conda-linux-gnu-clang-cpp.cfg
        - bin/acpp
        - bin/acpp-*
        - bin/syclcc
        - bin/syclcc-clang
        - bin/clang
        - bin/clang++
        - bin/clang-[0-9]*
        - bin/clang-cl
        - bin/clang-cpp
        # acpp's core configuration and its deployment manifests, read by the
        # driver at run time.
        - etc/AdaptiveCpp/**
        # Linker-side rather than JIT-side, so they sit with the driver.
        - lib/libLTO.so*
        - lib/libRemarks.so*
    requirements:
      host:
      run:
        # bin/acpp is a Python script, so python is a real dependency the
        # staging artifact's own metadata does not list - rattler only sees ELF
        # linkage. It arrives here as a run export from the staging output's
        # host python rather than being restated.
        - ${{ pin_subpackage('acpp-dev', exact=True) }}
        # This package ships the clang cfg files, and they carry --sysroot. The
        # base clang and clangxx feedstocks depend on the sysroot for the same
        # reason. Nothing supplies it transitively - libgcc-devel_linux-64
        # depends only on __unix - so without this, compiling anything fails on
        # a missing features.h.
        - sysroot_${{ target_platform }}
      run_constraints:
        - clang <0a0
        - clangxx <0a0
        - clang-${{ llvm_major }} <0a0
        - clang-no-conda-cfg <0a0
    tests:
      - script:
          - acpp --version
          - clang++ --version
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp SYCL compiler

  # ── tools ─────────────────────────────────────────────────────────────────

  - package:
      name: acpp-clang-tools
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - bin/clang-apply-replacements
        - bin/clang-change-namespace
        - bin/clang-check
        - bin/clang-doc
        - bin/clang-extdef-mapping
        - bin/clang-format
        - bin/clang-include-cleaner
        - bin/clang-include-fixer
        - bin/clang-installapi
        - bin/clang-linker-wrapper
        - bin/clang-move
        - bin/clang-nvlink-wrapper
        - bin/clang-offload-bundler
        - bin/clang-offload-packager
        - bin/clang-query
        - bin/clang-refactor
        - bin/clang-reorder-fields
        - bin/clang-repl
        - bin/clang-scan-deps
        - bin/clang-sycl-linker
        - bin/clang-tblgen
        - bin/clang-tidy
        - bin/clangd
        - bin/c-index-test
        - bin/diagtool
        - bin/find-all-symbols
        - bin/git-clang-format
        - bin/hmaptool
        - bin/modularize
        - bin/pp-trace
        - bin/run-clang-tidy
        - bin/analyze-build
        - bin/intercept-build
        - bin/scan-build
        - bin/scan-build-py
        - bin/scan-view
        - bin/reduce-chunk-list
        # libclang.so is the C API, used by tooling that links against it.
        # libclang-cpp.so is NOT here: the clang driver itself links it, so it
        # belongs with libLLVM in acpp-compiler-rt rather than with the tools.
        - lib/libclang.so*
        - lib/libscanbuild/**
        - lib/libear/**
        - libexec/**
        - share/clang/**
        - share/scan-build/**
        - share/scan-view/**
        - share/clang-doc/**
    requirements:
      host:
      run:
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
      run_constraints:
        - clang-tools <0a0
        - clang-format <0a0
        - clang-scan-deps <0a0
        - libclang <0a0
        - libclang-cpp <0a0
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: clang tooling built alongside the AdaptiveCpp toolchain

  - package:
      name: acpp-llvm-tools
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - bin/llvm-*
        - bin/lli
        - bin/lli-child-target
        - bin/bugpoint
        - bin/dsymutil
        - bin/sancov
        - bin/sanstats
        - bin/verify-uselistorder
        - bin/amdgpu-arch
        - bin/nvptx-arch
        - bin/offload-arch
        - bin/lld-link
        - bin/ld64.lld
        - bin/wasm-ld
        - bin/lldb
        - bin/lldb-*
        # Test utilities, installed because LLVM_INSTALL_UTILS is on - which is
        # itself on because the install-tree LLVMConfig.cmake only recomputes
        # its lit path inside `if(LLVM_INSTALL_UTILS AND LLVM_BUILD_UTILS)`,
        # and with that false a build path shipped inside an installed cmake
        # package.
        - bin/FileCheck
        - bin/not
        - bin/count
        - bin/split-file
        - bin/yaml-bench
        - bin/obj2yaml
        - bin/yaml2obj
        - bin/UnicodeNameMappingGenerator
        - lib/liblldb.so*
        - lib/liblldbIntelFeatures.so*
        - lib/python*/**
        - share/gdb/**
        - share/opt-viewer/**
        - share/man/**
    requirements:
      host:
      run:
        # python and python_abi arrive as run exports from the staging output's
        # host python, which is also the interpreter lldb's bindings were
        # compiled against - so they cannot disagree.
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
      run_constraints:
        - llvm-tools <0a0
        - lld <0a0
        - lldb <0a0
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: LLVM tools and lldb built alongside the AdaptiveCpp toolchain

  # ── backends ──────────────────────────────────────────────────────────────
  #
  # Each carries its own backend library, its JIT target and that target's
  # bitcode - the same carve acpp's own deployment manifests use. ROCm is the
  # only one that repackages files; the rest are metapackages over conda-forge.

  - package:
      name: acpp-runtime-rocm
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - etc/conda/activate.d/20-acpp-rocm.sh
        - etc/conda/deactivate.d/20-acpp-rocm.sh
        - lib/hipSYCL/librt-backend-hip.so
        - lib/hipSYCL/llvm-to-backend/libllvm-to-amdgpu.so
        - bin/hipSYCL/llvm-to-backend/llvm-to-amdgpu-tool
        - lib/hipSYCL/bitcode/libkernel-sscp-amdgpu-*.bc
        # The ROCm subset, selected by destination in the staging build from
        # acpp's own HIP deployment manifest: 146 MB out of 8.9 GB unpacked.
        - targets/**
    requirements:
      host:
      run:
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp ROCm backend and the ROCm runtime it needs

  - package:
      name: acpp-runtime-cuda
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        # Sources after the base by filename, and sets a disjoint pair of
        # variables, so it layers rather than overriding.
        - etc/conda/activate.d/20-acpp-cuda.sh
        - etc/conda/deactivate.d/20-acpp-cuda.sh
        - lib/hipSYCL/librt-backend-cuda.so
        - lib/hipSYCL/llvm-to-backend/libllvm-to-ptx.so
        - bin/hipSYCL/llvm-to-backend/llvm-to-ptx-tool
        # The relative link that makes the JIT's redist branch win; see staging.
        - lib/hipSYCL/ext/bitcode/ptx/libdevice.10.bc
        - lib/hipSYCL/bitcode/libkernel-sscp-ptx-*.bc
    requirements:
      # We recreate the build/host environment this backend was compiled
      # against, even though nothing is compiled here, so that the runtime
      # bounds come from run exports instead of hand-written specs.
      #
      # acpp links a specifically versioned .so, so both the runtime and the
      # packaging mutex need an upper bound - cuda-cudart can be installed
      # without cuda-version, so bounding cuda-version alone would not hold.
      host:
        - cuda-version=${{ cuda_compiler_version }}
        - cuda-cudart-dev
      run:
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
        - cuda-cudart <${{ cuda_max_version }}
        - cuda-version <${{ cuda_max_version }}
        # Provides nvvm/libdevice/libdevice.10.bc, the target of the relative
        # link we ship. Without it that link dangles and the PTX JIT falls back
        # to the build machine's path, which is today's CUDA smoke failure.
        - cuda-nvvm-tools
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp CUDA backend

  - package:
      name: acpp-runtime-level-zero
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - lib/hipSYCL/librt-backend-ze.so
    requirements:
      # level-zero-devel carries `weak: level-zero >=…,<2.0a0`, so an
      # unconstrained host dependency produces the run bound for us.
      host:
        - level-zero-devel
      run:
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp Level Zero backend

  - package:
      name: acpp-runtime-ocl
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        - lib/hipSYCL/librt-backend-ocl.so
        - lib/hipSYCL/llvm-to-backend/libllvm-to-spirv.so
        - bin/hipSYCL/llvm-to-backend/llvm-to-spirv-tool
        - lib/hipSYCL/bitcode/libkernel-sscp-spirv-*.bc
        - lib/hipSYCL/ext/llvm-spirv/**
    requirements:
      # ocl-icd carries `weak: ocl-icd >=2.3.4,<3.0a0` - exactly the bound we
      # were writing by hand - so host placement produces it for free.
      host:
        - ocl-icd
      run:
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp OpenCL backend

  - package:
      name: acpp-runtime-ocl-system
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files: []
    requirements:
      run:
        - ${{ pin_subpackage('acpp-runtime-ocl', exact=True) }}
        # Works through a post-link script, which pixi runs only when the
        # project opts in. That is a user-facing note, not something a
        # constraint can express.
        - ocl-icd-system
    tests:
      - package_contents:
          strict: true
          files: []
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp OpenCL backend using the system ICD loader

  # ── the meta package ──────────────────────────────────────────────────────

  - package:
      name: acpp-toolkit
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files: []
    requirements:
      run:
        - ${{ pin_subpackage('acpp', exact=True) }}
        - ${{ pin_subpackage('acpp-dev', exact=True) }}
        - ${{ pin_subpackage('acpp-compiler-rt', exact=True) }}
        - ${{ pin_subpackage('acpp-clang-tools', exact=True) }}
        - ${{ pin_subpackage('acpp-llvm-tools', exact=True) }}
    tests:
      - package_contents:
          strict: true
          files: []
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: The complete AdaptiveCpp toolchain, without the optional backends

  # ── the compiler activation package ───────────────────────────────────────
  #
  # This IS a conda-forge compiler activation package, consumed as
  # `[cxx_compiler] - "acpp"`. It follows ctng-compiler-activation, which is the
  # LINUX activation for both GCC and Clang; clang-compiler-activation is macOS
  # and its flags do not apply here.
  #
  # Upstream splits this four ways - clang_impl/clangxx_impl own the symlinks,
  # clang/clangxx own the scripts - to serve cross-compilation and a boundary
  # between the clang feedstock and the activation feedstock. We have neither:
  # linux-64 only, and we ship the compiler ourselves. So it is one output.
  - package:
      name: acpp_linux-64
      version: ${{ version }}
    inherit: acpp-stage-unpacked
    build:
      number: 0
      string: ${{ lane }}_h${{ hash }}_${{ build_number }}
      files:
        # The triplet drivers, so clang finds bin/<triple>-<driver>.cfg by the
        # name it was invoked under. The cfg files ship in the base package.
        - bin/x86_64-conda-linux-gnu-clang
        - bin/x86_64-conda-linux-gnu-clang++
        - bin/x86_64-conda-linux-gnu-clang-cpp
        # 50-, so it sources after the base 10- and can override ACPP_CPU_CXX
        # with the base's value already saved for deactivation to restore.
        - etc/conda/activate.d/50-acpp-compiler.sh
        - etc/conda/deactivate.d/50-acpp-compiler.sh
    requirements:
      run:
        - ${{ pin_subpackage('acpp', exact=True) }}
        # Named by upstream for "activation of binutils env vars"; it also
        # supplies the triplet ar, ranlib, ld and strip that CMAKE_ARGS points
        # at, through binutils_impl_linux-64.
        - binutils_${{ target_platform }}
    tests:
      - script:
          # The activation must actually produce a working compiler, so this
          # compiles, links and RUNS rather than asking for a version string.
          - ${CXX} --version
          - test "$(basename "$ACPP_CPU_CXX")" = "x86_64-conda-linux-gnu-clang++"
          - echo 'int main(){return 0;}' > t.cpp
          - ${CXX} ${CXXFLAGS} -c t.cpp -o t.o
          - ${CXX} ${LDFLAGS} t.o -o t
          - ./t
    about:
      homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
      license: Apache-2.0 WITH LLVM-exception
      summary: AdaptiveCpp as a conda compiler, for [cxx_compiler] - "acpp"

about:
  homepage: https://github.com/AdaptiveCpp/AdaptiveCpp
  license: Apache-2.0 WITH LLVM-exception
  summary: AdaptiveCpp SYCL toolchain, sliced from one monolithic build