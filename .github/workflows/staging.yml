# staging — the ONE workflow for the rebuilt package set.
#
# ⚠ THE FILE NAME IS PART OF THE CREDENTIAL. `naga-labs-staging` is registered
# on prefix.dev as a trusted publisher for THIS repository and THIS workflow
# file name. Renaming or splitting this file revokes publishing until the
# registration is redone. That is also why platform selection happens through
# dispatch INPUTS rather than through separate workflow files.
#
# JOB SHAPE IS LOAD-BEARING. Every package of a platform builds in ONE job: the
# expensive `_acpp-stage` build is reused across all forty-odd of them through
# pixi's `.pixi/bld` cache, and that cache does not cross runners. Parallelise
# by PLATFORM, never by package — a job per package would rebuild LLVM per
# package.
#
# EACH PLATFORM IS INDEPENDENT, and that is Jack's shape: a platform that goes
# green publishes immediately while its siblings are still red, so a Windows
# problem never holds Linux artifacts hostage. `fail-fast: false` is what makes
# that true, and `verify` runs `if: always()` so the cross-platform gates report
# on whatever did land.
#
# NO `--force`, ANYWHERE. Staging is scratch, but a silent overwrite would hide
# the one signal that says two runs disagreed about content: a same-day rebuild
# collides on HTTP 409 unless the build number moves, which is what the
# `build_number` input is for.
name: staging

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Space-separated platforms to build (linux-64 win-64 osx-arm64)"
        default: "linux-64 win-64 osx-arm64"
      build_number:
        description: "ACPP_BUILD_NUMBER — bump for a same-day rebuild, or the upload 409s"
        default: "0"

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # setup — the version, and the matrix, computed ONCE for the whole run.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      nightly_date: ${{ steps.v.outputs.date }}
    steps:
      # ONE date for the run. A date computed per job straddles midnight UTC
      # and splits a single build set across two versions — a set that then
      # never solves as a unit.
      - id: v
        shell: bash
        run: echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - id: m
        shell: bash
        run: |
          set -euo pipefail
          # THREE numbers, all MEASURED from `pixi publish --dry-run` and never
          # inferred from the skip blocks. `expect_names` is the distinct
          # package names the platform builds and `expect_skips` the package
          # directories it skips — asserted SEPARATELY, because a multi-output
          # package is one directory producing several names, so the two do not
          # sum to the 55 package directories. `expect_artifacts` is the .conda
          # count, larger again: acpp-clang and acpp-clangxx are each built
          # twice, once per with_cfg row.
          entries=()
          for p in ${{ inputs.platforms }}; do
            case "$p" in
              linux-64)   entries+=('{"platform":"linux-64","runner":"Linux-x64-64","expect_names":44,"expect_skips":12,"expect_artifacts":46}') ;;
              win-64)     entries+=('{"platform":"win-64","runner":"Win-x64-64","expect_names":37,"expect_skips":20,"expect_artifacts":39}') ;;
              osx-arm64)  entries+=('{"platform":"osx-arm64","runner":"macOS-26-xlarge","expect_names":42,"expect_skips":14,"expect_artifacts":44}') ;;
              *)
                echo "Unknown platform '$p' — this workspace builds linux-64, win-64 and osx-arm64." >&2
                exit 1
                ;;
            esac
          done
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No platform selected — nothing to do." >&2
            exit 1
          fi
          printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # build — one job per platform; every package of that platform inside it.
  # ---------------------------------------------------------------------------
  build:
    needs: setup
    strategy:
      # A red platform must never cancel its siblings.
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600
    permissions:
      id-token: write # OIDC trusted publishing — no stored key anywhere
    env:
      ACPP_NIGHTLY_DATE: ${{ needs.setup.outputs.nightly_date }}
      ACPP_BUILD_NUMBER: ${{ inputs.build_number || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    steps:
      # No `submodules:` — this tree has none since the activation lift.
      - uses: actions/checkout@v4

      # ── GATE 1 ────────────────────────────────────────────────────────────
      # A run that forgets the version publishes `0.dev0` and NOTHING fails:
      # every date-versioned recipe has that default so a laptop dry run works.
      # Fail here, before a single package is built.
      - name: "Gate 1: the version must be set"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACPP_NIGHTLY_DATE:-}" ] || [ "$ACPP_NIGHTLY_DATE" = "0.dev0" ]; then
            echo "ACPP_NIGHTLY_DATE is unset or is the local-render placeholder — refusing to build." >&2
            exit 1
          fi
          echo "Building $ACPP_NIGHTLY_DATE build $ACPP_BUILD_NUMBER for ${{ matrix.platform }}"

      # ⚠ `environments:` IS REQUIRED, and its absence is what killed run
      # 34096393708 before a single one of our own steps ran. setup-pixi
      # installs and then LISTS only the DEFAULT environment unless told
      # otherwise (its action.yml at v0.10.0: "A space-separated list of
      # environments to install. If not specified, only the default environment
      # is installed"), and this workspace's default environment has ZERO
      # dependencies BY DESIGN — every environment here is
      # `no-default-feature`, because the default one would install the
      # toolchain we are building. Its post-install `pixi list --locked` then
      # exits 1 with "No packages found in 'default' environment".
      #
      # `packaging` AND `dev`, and the second one is new: every gate step runs
      # through `pixi run -e packaging` and the bare `pixi publish` is not
      # environment-scoped at all, so `packaging` alone was right until the
      # upload moved to `rattler-build upload prefix` — which lives in `dev`.
      # Installing an environment nothing uses is waste; running a step whose
      # tool is not installed is a red run an hour in, and this file now has a
      # step that needs it.
      #
      # NO `activate-environment`. Every step names its environment explicitly,
      # and activation would put one environment's tools on PATH for steps that
      # must not see them.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: packaging dev

      # ── GATE 1b ───────────────────────────────────────────────────────────
      # Cheap, and it runs before the expensive build for that reason. All
      # three assert properties that no render can see and that a runner would
      # otherwise discover an hour in — each one is here because it already
      # cost a run:
      #   * the generated per-platform recipes still match their authored
      #     source (a hand edit to a generated file is a red build here);
      #   * every `path:` source exists relative to the recipe that names it.
      #     A path SOURCE resolves against the RECIPE dir and `license_file`
      #     against the rendered SOURCE dir — two rules that look alike, and
      #     applying one to the other failed run 34109157780 at FETCH time;
      #   * every workspace sibling a recipe names is mapped in its manifest
      #     AND named the way pixi matches source packages — by MANIFEST name.
      #     That is the defect that killed run 34097701602 three levels down a
      #     host solve, after a green local dry run.
      - name: "Gate 1b: the generated recipes, the sources, and the sibling wiring"
        shell: bash
        run: |
          pixi run -e packaging nu tools/gen-platform-packages.nu --check
          pixi run -e packaging nu tools/check-source-paths.nu
          pixi run -e packaging nu tools/tests/exercise-stage-fixups.nu
          pixi run -e packaging nu tools/check-sibling-mapping.nu --platform ${{ matrix.platform }}

      # Explicit restore/save on both caches: actions/cache's post-step only
      # saves on job SUCCESS, which starves iteration on exactly the runs that
      # need warmth.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-

      # THE stage cache. This is what makes the expensive build run once for
      # every package instead of once each.
      #
      # ⚠ `.pixi/bld` ONLY — NEVER `.pixi`, and never `.pixi/meta-v0`. That
      # directory is pixi's source-METADATA cache, keyed on manifest and recipe
      # CONTENT, and a value a recipe reads through `env.get()` is invisible to
      # that key. Restoring it across runs makes an unchanged package re-render
      # at its CACHED version: measured 2026-09-07 locally, where four of the
      # seven date-versioned packages rendered at 0.dev0 while the three whose
      # files had changed rendered at the real date. Gate 2's `--date`
      # assertion catches the result, but this comment is what keeps the cause
      # out of the tree.
      - name: Restore pixi build cache
        uses: actions/cache/restore@v4
        with:
          path: .pixi/bld
          key: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/_acpp-stage/**') }}-${{ github.run_id }}
          restore-keys: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/_acpp-stage/**') }}-

      # FIRST-BUILD OBSERVATION, not a gate. Each execution of the stage's
      # build script appends one unique line to a file OUTSIDE the build tree;
      # the count of DISTINCT lines is the number of times the expensive build
      # actually ran. The design says exactly once per platform. Printed, not
      # asserted, until we have seen a real number.
      - name: Arm the stage-execution counter
        shell: bash
        run: |
          set -euo pipefail
          echo "ACPP_STAGE_RUN_LOG=${{ runner.temp }}/stage-runs.txt" >> "$GITHUB_ENV"
          echo "ACPP_STAGE_PATHS=${{ runner.temp }}/stage-paths.txt" >> "$GITHUB_ENV"
          : > "${{ runner.temp }}/stage-runs.txt"

      # ── GATE 2 ────────────────────────────────────────────────────────────
      # ONE whole-workspace publish, no --path. The exit code is the build
      # gate; the accounting below is the SET gate, because exit 0 means
      # "nothing errored", not "the expected packages were produced" — a recipe
      # whose skip expression broke would publish nothing and pass.
      #
      # ⚠ BUILD AND UPLOAD ARE TWO STEPS, AND THE SPLIT IS ABOUT AUTH, NOT THE
      # BUILD GRAPH. It is still ONE whole-workspace build in dependency order —
      # `--target-dir` is the same publish set as `--to`, minus the upload — so
      # the ruling that this repo builds as one graph is untouched.
      #
      # Run 34122419900 BUILT ALL 46 PACKAGES and then died on the first upload
      # with `× the server rejected the upload (HTTP 403): Not authorized`.
      # pixi's docs say `pixi publish --target-channel` does perform the OIDC
      # trusted-publisher exchange, with exactly the workflow shape this file
      # has (`id-token: write`, setup-pixi, no stored secrets) — so "pixi cannot
      # do OIDC" is ruled out at the source, not guessed at.
      #
      # What is NOT established is whether pixi's exchange and rattler-build's
      # present the same thing to prefix.dev. `rattler-build upload prefix` is
      # the mechanism main uses and it has published this repo to a prefix.dev
      # channel under OIDC — so using it here makes this run a DISCRIMINATOR
      # rather than another attempt: if the upload succeeds, the registration is
      # fine and the difference is in pixi's exchange; if it 403s identically,
      # the trusted-publisher registration does not cover this workflow file and
      # that is Jack's to change, with nothing further for us to try.
      #
      # No credential is created, rewritten or logged in either case.
      - name: Build the whole workspace
        shell: bash
        run: |
          set -o pipefail
          pixi publish --target-dir dist-channel 2>&1 | tee publish.log

      # The upload reads the built artifacts, so the accounting gate below still
      # runs against the BUILD log — which is what it always parsed.
      - name: Upload to the staging channel
        shell: bash
        run: |
          set -euo pipefail
          # globstar AND nullglob: without globstar, bash's `**` is just `*` and
          # would silently miss a per-platform subdirectory; without nullglob an
          # unmatched pattern is passed through literally and rattler-build is
          # handed a filename that does not exist. Both were measured traps in
          # this workflow's earlier one-liners.
          shopt -s globstar nullglob
          pkgs=(dist-channel/**/*.conda)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no .conda artifacts under dist-channel/ — the build produced nothing to upload"
            exit 1
          fi
          echo "uploading ${#pkgs[@]} artifact(s) to jackm97/naga-labs-staging"
          # --skip-existing: a re-dispatch at the same build number must not 409
          # on a package an earlier attempt already uploaded. This is a STAGING
          # channel; the loud-409 rule that main applies to lane packages is
          # about published lanes, not about this one.
          pixi run -e dev rattler-build upload prefix \
            -c jackm97/naga-labs-staging --skip-existing "${pkgs[@]}" 2>&1 | tee upload.log

      - name: "Gate 2: every package directory is accounted for"
        shell: bash
        run: |
          pixi run -e packaging nu tools/publish-accounting.nu \
            --log publish.log \
            --expect-names ${{ matrix.expect_names }} \
            --expect-skips ${{ matrix.expect_skips }} \
            --date "$ACPP_NIGHTLY_DATE"

      # Collected BY PUBLISHED NAME out of the log, never by globbing the build
      # directory: that directory also holds `_acpp-stage`, whose payload is the
      # entire toolchain, plus whatever earlier runs left behind.
      - name: Collect the published artifacts
        shell: bash
        run: |
          pixi run -e packaging nu tools/collect-artifacts.nu \
            --log publish.log --into dist/${{ matrix.platform }}

      # ── GATE 3 ────────────────────────────────────────────────────────────
      # No two of OUR packages ship the same file. `--expect` is mandatory and
      # refuses a count below two, so it cannot pass vacuously; two builds of
      # ONE name (the with_cfg rows) are deliberately not compared against each
      # other, and the log says how many such pairs it skipped.
      - name: "Gate 3: artifacts are pairwise disjoint"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-package-disjointness.nu \
            --artifacts dist --expect ${{ matrix.expect_artifacts }}

      # ── GATE 4 ────────────────────────────────────────────────────────────
      # Both read the publish log rather than re-rendering: that log is what was
      # actually uploaded, which is stronger evidence than a fresh render as
      # well as minutes cheaper on a metered runner.
      - name: "Gate 4a: one name, one version"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-name-collisions.nu \
            --platform ${{ matrix.platform }} --log publish.log

      - name: "Gate 4b: the superset rule"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-superset.nu \
            --platform ${{ matrix.platform }} --log publish.log

      # ── FIRST-BUILD OBSERVATIONS ──────────────────────────────────────────
      # Printed, never gated. Every one of these is a question the design left
      # open that only a real build can answer, and the answer belongs in the
      # log of the run that produced it rather than in someone's memory.
      # `|| true` on each: an observation that fails must not redden a green
      # build, which is the whole distinction between an observation and a gate.
      - name: "Observe: the answers only a real build has"
        if: always()
        shell: bash
        run: |
          pixi run -e packaging nu tools/observe-first-build.nu \
            --dist dist \
            --publish-log publish.log \
            --stage-run-log "${ACPP_STAGE_RUN_LOG:-}" || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
      - name: Save pixi build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pixi/bld
          key: bld-${{ matrix.platform }}-${{ hashFiles('variants.yaml', 'packages/_acpp-stage/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/
            publish.log
            ${{ runner.temp }}/stage-paths.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # verify — the cross-platform gates, over whatever actually landed.
  # ---------------------------------------------------------------------------
  verify:
    needs: [setup, build]
    # ALWAYS. A platform that built and published must be verified even while a
    # sibling is red — that independence is the point of the whole shape.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠ `environments:` IS REQUIRED, and its absence is what killed run
      # 34096393708 before a single one of our own steps ran. setup-pixi
      # installs and then LISTS only the DEFAULT environment unless told
      # otherwise (its action.yml at v0.10.0: "A space-separated list of
      # environments to install. If not specified, only the default environment
      # is installed"), and this workspace's default environment has ZERO
      # dependencies BY DESIGN — every environment here is
      # `no-default-feature`, because the default one would install the
      # toolchain we are building. Its post-install `pixi list --locked` then
      # exits 1 with "No packages found in 'default' environment".
      #
      # `packaging`, NOT `dev`: every step in this file goes through
      # `pixi run -e packaging`, and the bare `pixi publish` is not
      # environment-scoped at all. Verified by grepping this workflow rather
      # than assumed — installing `dev` here would install rattler-build and
      # git for nobody.
      #
      # NO `activate-environment`. Every step names its environment explicitly,
      # and activation would put one environment's tools on PATH for steps that
      # must not see them.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: packaging

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: downloaded

      # The downloaded tree is `downloaded/dist-<platform>/dist/<platform>/`;
      # flatten it to `dist/<platform>/` so the gates read one shape. The
      # closure check takes each artifact's subdir from its own metadata
      # anyway, so a flattened layout cannot mislead it.
      - name: Flatten the downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find downloaded -name '*.conda' -print0 | while IFS= read -r -d '' f; do
            sub=$(basename "$(dirname "$f")")
            mkdir -p "dist/$sub"
            cp "$f" "dist/$sub/"
          done
          echo "collected:"
          find dist -name '*.conda' | sed 's|.*/||' | sort | head -100
          test -n "$(find dist -name '*.conda' -print -quit)" || {
            echo "no artifacts downloaded — every build job failed before publishing" >&2
            exit 1
          }

      # ── GATE 3 (cross-platform) ───────────────────────────────────────────
      # The per-platform run happened in each build job; this one is over every
      # platform that landed, which also catches a noarch package colliding
      # with an arch one. --expect 2 here is deliberate: the set is whatever
      # survived, and the per-platform counts were already asserted upstream.
      - name: "Gate: artifacts remain pairwise disjoint across platforms"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-package-disjointness.nu \
            --artifacts dist --expect 2

      # ── GATE 5 ────────────────────────────────────────────────────────────
      # Publishing a name means owning it: completeness (everything the
      # workspace declares for a platform is present) plus a fresh solve of
      # every artifact, pinned to its exact build, against the real channel
      # under strict priority.
      # The completeness half of gate 5 counts a platform''s noarch packages,
      # which land in `noarch/`. Run 34124086049 reported two of them missing
      # from a channel the SAME run solved them from, so the rule is exercised
      # here — against two real fixture packages — before the gate that relies
      # on it runs.
      - name: "Gate 5 pre-check: completeness counts noarch/"
        shell: bash
        run: pixi run -e packaging test-closure-completeness

      - name: "Gate 5: closure — every published package is installable"
        shell: bash
        run: |
          pixi run -e packaging nu tools/check-closure.nu \
            --artifacts dist \
            --remote https://prefix.dev/jackm97/naga-labs-staging