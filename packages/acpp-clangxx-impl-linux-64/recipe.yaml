# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# ⚠ GENERATED FILE — DO NOT EDIT. Written by tools/gen-platform-packages.nu
# from ../<family>/recipe.yaml, which is the authored source of truth. CI runs
# the generator with --check, so an edit here is a red build.
#
# WHY IT HAS TO EXIST: pixi matches a source package by its MANIFEST name, so a
# templated recipe needs one manifest per platform — and several manifests
# sharing one TEMPLATED recipe would all emit the same name on a given
# platform, which pixi refuses. Hence a literal name and a platform skip.

#
# acpp-clangxx_impl_<platform> — the TRIPLET-PREFIXED clang++ driver. Lifted
# from the reference monolith's `clangxx_impl_linux-64` output
# (clangdev-feedstock).
#
# THIS IS A CLANGDEV OUTPUT, NOT AN ACTIVATION ONE — see the note in
# ../acpp-clang-impl/recipe.yaml; the same three-way name split applies, and the
# same consequence for the symlink fold in our forked ctng activation.
#
# SLICING FORM: GLOB LIST, upstream's own — one named symlink. Cross-checked
# against conda-forge's clangxx_impl_linux-64 / clangxx_impl_osx-arm64 21.1.8
# artifacts, which ship exactly `bin/<TARGET>-clang++`. No win-64 artifact
# exists, which is the same fact as the `skip: win` below.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_maj_min: "21.1"
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: 0
  target: ${{ "x86_64-conda-linux-gnu" if linux else "arm64-apple-darwin20.0.0" if osx else "x86_64-pc-windows-msvc" }}

package:
  name: acpp-clangxx_impl_linux-64
  version: ${{ llvm_version }}

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_${{ variant }}_h${{ hash }}_${{ build_num }}
  # GENERATED: the authored skip (win), AND this copy's platform.
  # Keyed on target_platform: this output is architecture-specific.
  skip: target_platform != "linux-64" or (win)
  variant:
    down_prioritize_variant: ${{ 0 if variant == "default" else 1 }}
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: bin/${{ target }}-clang++

requirements:
  build:
    # Upstream declares no build requirements here — the package is one symlink.
    - nushell
  host:
    - _acpp-stage ==0.0.0
  run:
    # "cannot use exact pins on osx due to separation of compiler activation;
    # see #437"
    - if: osx
      then: acpp-clang-${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_${{ variant }}_*"]
      else: acpp-clang-${{ llvm_major }}[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # UPSTREAM: pin_subpackage("clang_impl_" ~ target_platform, exact=True)
    - acpp-clang_impl_linux-64[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    # UPSTREAM: pin_subpackage("clang-scan-deps", exact=True)
    - acpp-clang-scan-deps[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]
    - if: linux
      then: libstdcxx-devel_linux-64
      # UPSTREAM: `libcxx-devel ${{ maj_min }}.*`, a minor pin, "to avoid issues
      # when building new libcxx versions".
      #
      # OURS, NOT CONDA-FORGE'S: we build libc++ on osx, so naming the
      # conda-forge package would put a SECOND C++ runtime in the prefix beside
      # the one this toolchain links. Upstream's minor pin becomes the exact
      # same-build form because our libc++ and this package come out of ONE
      # stage build. `_acpp-stage` is the sole exemption workspace-wide — it is
      # BUILT BY conda-forge's clang and is what produces ours, so it cannot
      # depend on its own output.
      else: acpp-libcxx-devel[version="==${{ llvm_version }}",build="${{ llvm_build_tag }}_*"]

tests:
  - package_contents:
      strict: true
      files:
        - bin/${{ target }}-clang++

about:
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: ../_shared/licenses/llvm-LICENSE.TXT
  summary: Triplet-prefixed clang++ driver for one target platform
