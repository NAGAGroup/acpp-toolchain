      ignore_run_exports:
        # By SOURCE PACKAGE, not by exported name (phase-3 ruling [B]).
        #
        # A name list must be extended every time an upstream feedstock adds an
        # export, and it fails SILENTLY when it is not — which is how the
        # Windows OpenCL loader leaked into packages that never link it.
        # Naming the source package ignores whatever that package exports,
        # this release and the next.
