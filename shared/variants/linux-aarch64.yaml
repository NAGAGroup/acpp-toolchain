# linux-aarch64 build variants — see linux-64.yaml for the doctrine. This
# lane is OMP-ONLY by design (no CUDA/L0/OCL/ROCm keys): the CPU backend and
# the accelerated-CPU compiler are the deliverable; GPU backends arrive per
# platform as their dependency stories are established.

# ---- compilers + stdlib ----------------------------------------------------
c_compiler: [gcc]
cxx_compiler: [gxx]
c_compiler_version: ["14"]
cxx_compiler_version: ["14"]
c_stdlib: [sysroot]
c_stdlib_version: ["2.28"]

# ---- ABI-sensitive libraries ----------------------------------------------
zlib: ["1.3"]
zstd: ["1.5"]
libxml2-devel: ["2.15"]
numactl: ["2.0"]

# ---- python ----------------------------------------------------------------
python: ["3.14"]

# ---- staging cache key -----------------------------------------------------
# See the linux-64 file. Regenerated by shared/gen-staging-hash.nu.
staging_inputs: ["060636b364bbba22"]
