# THIS MANIFEST EXISTS ONLY TO CARRY A NAME, and the name is the point.
#
# ⚠ PIXI MATCHES A SOURCE PACKAGE BY ITS MANIFEST `[package] name`, NEVER by
# rendering the recipe. Proved on a two-package throwaway workspace
# (2026-09-07): a consumer whose recipe names `prov_impl_linux-64` while the
# provider's manifest says `prov-impl` dies with "No candidates were found",
# and the SAME recipe resolves the moment the manifest name matches. That is
# what killed run 34097701602 three levels down a solve —
# `acpp-clang_impl_linux-64` was in the build list and still unresolvable.
#
# So a recipe emitting a `${{ target_platform }}`-templated name needs ONE
# MANIFEST PER PLATFORM, each naming that platform's literal package name. The
# RECIPE stays templated and stays in one place: these manifests point at it
# with `package.build.config.recipe`, which is also proved to work with the
# solve. One recipe, N names, no duplicated slice lists.
#
# `[package.target.<plat>] name` does NOT do this: pixi accepts the key without
# complaint and ignores it — measured on the same probe.

[package]
name = "acpp-clang_impl_osx-arm64"
version = "21.1.8"
publish = true

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# recipe.yaml in THIS directory is GENERATED from ../acpp-clang-impl/recipe.yaml by
# tools/gen-platform-packages.nu — one authored source, N platform copies, with
# a --check that makes a hand edit a red build. It is a real file here rather
# than a redirect because N manifests sharing ONE templated recipe all emit the
# same name on a given platform, which pixi refuses.
[package.build.config]
# The authored recipe is an input as well: it lives outside this directory, so
# an edit to the slice list would otherwise not invalidate this build.
extra-input-globs = ["../acpp-clang-impl/**", "../_shared/*.nu", "../_shared/licenses/**"]

# EVERY source-package dependency is mapped here and ONLY here, by the MANIFEST
# name of the package that provides it.
[package.build-dependencies]
_acpp-stage = { workspace = true }
acpp-clang-21 = { workspace = true }
acpp-compiler-rt = { workspace = true }
acpp-compiler-rt_osx-arm64 = { workspace = true }
