# osx-arm64 build variants — see linux-64.yaml for the doctrine. FIRST CUT,
# deliberately minimal: OMP-only (no GPU backend keys — Metal comes as its
# own pass), no lldb, no compiler-rt. The compiler is conda-forge's apple
# clang activation; its version need not match the LLVM being built (the
# linux lanes build LLVM 20/21 with gcc 14 for the same reason).

# ---- compilers + deployment target -----------------------------------------
c_compiler: [clang]
cxx_compiler: [clangxx]
c_compiler_version: ["23"]
cxx_compiler_version: ["23"]
c_stdlib: [macosx_deployment_target]
c_stdlib_version: ["11.0"]

# ---- ABI-sensitive libraries ----------------------------------------------
zlib: ["1.3"]
zstd: ["1.5"]

# ---- python ----------------------------------------------------------------
python: ["3.14"]

# ---- staging cache key -----------------------------------------------------
# See the linux-64 file. Regenerated by shared/gen-staging-hash.nu.
staging_inputs: ["0cbf3effaa4b94b4"]
