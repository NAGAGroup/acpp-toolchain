# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# acpp-llvm-dev — the LLVM/clang development surface: the API headers, the
# static libraries, the cmake packages (LLVMConfig, ClangConfig) and every
# LLVM/clang tool no sibling package claims. What conda-forge splits across
# llvmdev + clangdev, published under OUR name so channel priority cannot mix
# their files with ours.
#
# THE ONLY PACKAGE DEFINED BY SUBTRACTION, and the only user of
# ACPP_CARVE_EXCLUDE. It is the REMAINDER of an LLVM install, so its content is
# an LLVM version detail rather than a contract of ours: enumerating ~150 tool
# binaries and every header directory positively would be a list that rots at
# every LLVM bump, and whose failure mode is invisible — carve.nu can only
# detect a glob that matches NOTHING, and a header nobody thought to name
# matches nothing at all. Subtracting the siblings' claims keeps the list short
# and every failure loud.
#
# The trade is under-shipping for over-shipping: a sibling's file leaking in
# here is an install-time clobber between two of our own packages. That is what
# tools/check-package-disjointness.nu asserts on the built artifacts.

context:
  llvm_version: "21.1.8"
  llvm_major: "21"
  llvm_major_next: "22"
  version: ${{ env.get("ACPP_NIGHTLY_DATE", default="0.dev0") }}
  llvm_build_tag: ${{ "llvm" ~ (llvm_version | replace(".", "_")) }}
  build_num: ${{ env.get("ACPP_BUILD_NUMBER", default="0") | int }}
  library_prefix: ${{ "Library/" if win else "" }}

  # ── THE CARVE: THE REMAINDER ─────────────────────────────────────────────
  # Everything development-shaped, minus every sibling claim below.
  #
  # `share/man/**` IS DELIBERATELY ABSENT although `main` listed it. The man
  # pages are only installed when the docs are built (LLVM_BUILD_DOCS is off
  # here), and the two mechanisms treat that differently: under `files:
  # include:` a glob matching nothing was harmless, while carve.nu FAILS on
  # one. A glob that can only ever match when a build option we do not set is
  # turned on is a build failure waiting for a platform to notice.
  #
  # win's analogue of lib/**/*.a is lib/**/*.lib: LLVM and clang ship their
  # static libraries, plus the tablegen and testing import libraries, under
  # that name there.
  carve_unix: >-
    bin/**;include/**;lib/**/*.a;lib/cmake/**
  carve_win: >-
    Library/bin/**;Library/include/**;Library/lib/**/*.lib;Library/lib/cmake/**
  carve: ${{ carve_unix if (linux or osx) else (carve_win if win else "") }}

  # ── THE SUBTRACTION, ONE EXPLICIT BRANCH PER PLATFORM ────────────────────
  # Every entry is a file another package in this family ships, and every one
  # must MATCH something in the stage: carve.nu fails an exclude glob that
  # matches nothing, which is what catches this list rotting after a sibling
  # renames or drops a file — the moment the remainder would start swallowing
  # another package's files.
  #
  # Each list is the concatenation of the sibling carve lists for the SAME
  # platform, so the two can be diffed directly against each other.
  #
  # `lib/clang/**` is excluded on every platform. On `main` only the Windows
  # branch did that, which left the linux `lib/**/*.a` include swallowing
  # acpp-compiler-rt's libclang_rt.*.a archives — the same file in two
  # packages.
  exclude_linux: >-
    bin/acpp*;bin/clang;bin/clang++;bin/clang-cl;bin/clang-cpp;bin/clang-${{ llvm_major }};bin/ld64.lld;bin/lld-link;bin/wasm-ld;bin/llvm-ar;bin/llvm-nm;bin/llvm-ranlib;bin/llvm-strip;bin/llvm-objcopy;bin/llvm-objdump;bin/llvm-readelf;bin/llvm-readobj;bin/llvm-size;bin/llvm-strings;bin/llvm-symbolizer;bin/llvm-cxxfilt;bin/llvm-addr2line;bin/llvm-dwarfdump;bin/llvm-dlltool;bin/llvm-lib;bin/llvm-rc;bin/llvm-mt;bin/llvm-windres;bin/llvm-cov;bin/llvm-profdata;bin/llvm-profgen;include/AdaptiveCpp/**;lib/cmake/AdaptiveCpp/**;lib/clang/**;bin/opt;bin/llc;bin/lld;bin/ld.lld;bin/lldb*;bin/amdgpu-arch;bin/clang-apply-replacements;bin/clang-change-namespace;bin/clang-check;bin/clang-doc;bin/clang-extdef-mapping;bin/clang-format;bin/clang-include-cleaner;bin/clang-include-fixer;bin/clang-installapi;bin/clang-linker-wrapper;bin/clang-move;bin/clang-nvlink-wrapper;bin/clang-offload-bundler;bin/clang-offload-packager;bin/clang-query;bin/clang-refactor;bin/clang-reorder-fields;bin/clang-repl;bin/clang-scan-deps;bin/clang-sycl-linker;bin/clang-tidy;bin/clangd;bin/diagtool;bin/find-all-symbols;bin/git-clang-format;bin/hmaptool;bin/modularize;bin/nvptx-arch;bin/offload-arch;bin/pp-trace;bin/run-clang-tidy;bin/scan-build;bin/scan-build-py;bin/scan-view;bin/llvm-bolt;bin/llvm-bolt-heatmap;bin/perf2bolt;bin/merge-fdata;lib/libear/**;lib/libscanbuild/**
  # osx mirrors linux minus what macOS does not build (no bolt, no GPU-arch
  # probes) and plus the Mach-O binutils acpp claims there. The linker
  # ownership differs too: acpp-runtime owns ld64.lld on macOS and ld.lld on
  # linux, so the two names swap sides.
  exclude_osx: >-
    bin/acpp*;bin/clang;bin/clang++;bin/clang-cl;bin/clang-cpp;bin/clang-${{ llvm_major }};bin/ld.lld;bin/lld-link;bin/wasm-ld;bin/llvm-ar;bin/llvm-nm;bin/llvm-ranlib;bin/llvm-strip;bin/llvm-objcopy;bin/llvm-objdump;bin/llvm-readelf;bin/llvm-readobj;bin/llvm-size;bin/llvm-strings;bin/llvm-symbolizer;bin/llvm-cxxfilt;bin/llvm-install-name-tool;bin/llvm-bitcode-strip;include/AdaptiveCpp/**;lib/cmake/AdaptiveCpp/**;lib/clang/**;bin/opt;bin/llc;bin/lld;bin/ld64.lld;bin/lldb*;bin/clang-apply-replacements;bin/clang-change-namespace;bin/clang-check;bin/clang-doc;bin/clang-extdef-mapping;bin/clang-format;bin/clang-include-cleaner;bin/clang-include-fixer;bin/clang-installapi;bin/clang-linker-wrapper;bin/clang-move;bin/clang-nvlink-wrapper;bin/clang-offload-bundler;bin/clang-offload-packager;bin/clang-query;bin/clang-refactor;bin/clang-reorder-fields;bin/clang-repl;bin/clang-scan-deps;bin/clang-sycl-linker;bin/clang-tidy;bin/clangd;bin/diagtool;bin/find-all-symbols;bin/git-clang-format;bin/hmaptool;bin/modularize;bin/pp-trace;bin/run-clang-tidy;bin/scan-build;bin/scan-build-py;bin/scan-view;lib/libear/**;lib/libscanbuild/**
  # win additionally drops libomp: it ships from conda-forge's llvm-openmp, so
  # ours is packaged by nobody. acpp-lldb's DLL and import library have to be
  # named here too — they are new this round, since `main` shipped no lldb on
  # Windows at all, and liblldb.lib would otherwise be caught by the
  # lib/**/*.lib include.
  exclude_win: >-
    Library/bin/acpp;Library/bin/acpp*.exe;Library/bin/clang.exe;Library/bin/clang++.exe;Library/bin/clang-cl.exe;Library/bin/clang-cpp.exe;Library/bin/ld.lld.exe;Library/bin/ld64.lld.exe;Library/bin/wasm-ld.exe;Library/bin/llvm-ar.exe;Library/bin/llvm-nm.exe;Library/bin/llvm-ranlib.exe;Library/bin/llvm-strip.exe;Library/bin/llvm-objcopy.exe;Library/bin/llvm-objdump.exe;Library/bin/llvm-readelf.exe;Library/bin/llvm-readobj.exe;Library/bin/llvm-size.exe;Library/bin/llvm-strings.exe;Library/bin/llvm-symbolizer.exe;Library/bin/llvm-cxxfilt.exe;Library/bin/llvm-addr2line.exe;Library/bin/llvm-dwarfdump.exe;Library/bin/llvm-dlltool.exe;Library/bin/llvm-lib.exe;Library/bin/llvm-rc.exe;Library/bin/llvm-mt.exe;Library/bin/llvm-windres.exe;Library/bin/llvm-cov.exe;Library/bin/llvm-profdata.exe;Library/bin/llvm-profgen.exe;Library/include/AdaptiveCpp/**;Library/lib/cmake/AdaptiveCpp/**;Library/lib/clang/**;Library/lib/AdaptiveCpp.lib;Library/lib/acpp-frontend.lib;Library/lib/acpp-clang-cbs.lib;Library/bin/opt.exe;Library/bin/llc.exe;Library/bin/lld.exe;Library/bin/lld-link.exe;Library/bin/LLVM-C.dll;Library/bin/LTO.dll;Library/bin/Remarks.dll;Library/bin/libclang.dll;Library/bin/acpp-rt.dll;Library/bin/acpp-common.dll;Library/lib/LLVM-C.lib;Library/lib/LTO.lib;Library/lib/Remarks.lib;Library/lib/libclang.lib;Library/lib/acpp-rt.lib;Library/lib/acpp-common.lib;Library/bin/hipSYCL/**;Library/lib/hipSYCL/**;Library/bin/lldb*.exe;Library/bin/liblldb.dll;Library/lib/liblldb.lib;Library/lib/python*/**;Library/bin/amdgpu-arch.exe;Library/bin/analyze-build;Library/bin/clang-apply-replacements.exe;Library/bin/clang-change-namespace.exe;Library/bin/clang-check.exe;Library/bin/clang-doc.exe;Library/bin/clang-extdef-mapping.exe;Library/bin/clang-format.exe;Library/bin/clang-include-cleaner.exe;Library/bin/clang-include-fixer.exe;Library/bin/clang-installapi.exe;Library/bin/clang-linker-wrapper.exe;Library/bin/clang-move.exe;Library/bin/clang-nvlink-wrapper.exe;Library/bin/clang-offload-bundler.exe;Library/bin/clang-offload-packager.exe;Library/bin/clang-query.exe;Library/bin/clang-refactor.exe;Library/bin/clang-reorder-fields.exe;Library/bin/clang-repl.exe;Library/bin/clang-scan-deps.exe;Library/bin/clang-sycl-linker.exe;Library/bin/clang-tidy.exe;Library/bin/clangd.exe;Library/bin/diagtool.exe;Library/bin/find-all-symbols.exe;Library/bin/git-clang-format;Library/bin/git-clang-format.bat;Library/bin/hmaptool;Library/bin/intercept-build;Library/bin/modularize.exe;Library/bin/nvptx-arch.exe;Library/bin/pp-trace.exe;Library/bin/run-clang-tidy;Library/bin/scan-build;Library/bin/scan-build.bat;Library/bin/scan-build-py;Library/bin/scan-view;Library/share/clang/**;Library/share/scan-build/**;Library/share/scan-view/**;Library/share/opt-viewer/**;Library/lib/libear/**;Library/lib/libscanbuild/**;Library/libexec/**;Library/bin/libomp.dll;Library/lib/libomp.lib
  carve_exclude: ${{ exclude_linux if linux else (exclude_win if win else (exclude_osx if osx else "")) }}

package:
  name: acpp-llvm-dev
  version: ${{ version }}

source:
  - path: ../_shared/licenses
    target_directory: licenses

build:
  number: ${{ build_num }}
  string: ${{ llvm_build_tag }}_h${{ hash }}_${{ build_num }}
  # NO osx SKIP, unlike `main`. The development surface exists on macOS — the
  # headers, the static libraries and the cmake packages are all installed
  # there — and macOS is a full platform this round. The osx branches above are
  # narrower than linux only where the macOS build genuinely produces less.
  script:
    interpreter: nu
    file: ../_shared/carve.nu
    env:
      ACPP_CARVE: ${{ carve }}
      ACPP_CARVE_EXCLUDE: ${{ carve_exclude }}
      PKG_NAME: acpp-llvm-dev

requirements:
  build:
    - nushell
  host:
    - acpp-stage ==${{ version }}
    # HOST, so acpp-runtime's weak run_export supplies the exact-build run
    # dependency: these tools link the libLLVM/libclang-cpp the runtime ships.
    - acpp-runtime ==${{ version }}
  run_constraints:
    # Same-major windows: these names are unversioned upstream, so a blanket
    # forbid would bar every major instead of the one that can collide.
    - llvmdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - clangdev <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0
    - llvm-tools <${{ llvm_major }}.0a0|>=${{ llvm_major_next }}.0a0

tests:
  - package_contents:
      bin:
        - llvm-config
        - llvm-as
      files:
        exists:
          - if: not win
            then:
              - lib/cmake/llvm/LLVMConfig.cmake
              - lib/cmake/clang/ClangConfig.cmake
          - if: win
            then:
              - Library/lib/cmake/llvm/LLVMConfig.cmake
              - Library/lib/cmake/clang/ClangConfig.cmake
        not_exists:
          # THE SUBTRACTION, ASSERTED. One name per sibling package: if the
          # exclude list above ever stops covering a sibling, the remainder
          # swallows its files and these fail.
          - if: not win
            then:
              - bin/clang
              - bin/acpp
              - bin/clangd
              - bin/lldb
          - if: win
            then:
              - Library/bin/clang.exe
              - Library/bin/acpp
              - Library/bin/clangd.exe
              - Library/bin/lldb.exe

about:
  homepage: https://llvm.org/
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - licenses/llvm-LICENSE.TXT
  summary: LLVM and clang development headers, static libraries and cmake packages
